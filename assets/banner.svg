<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#0e1a14"/>
      <stop offset="55%" stop-color="#070d09"/>
      <stop offset="100%" stop-color="#020403"/>
    </radialGradient>
    <radialGradient id="headFur" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#5a3a22"/>
      <stop offset="60%" stop-color="#3c2614"/>
      <stop offset="100%" stop-color="#20140a"/>
    </radialGradient>
    <radialGradient id="facePatch" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e8c496"/>
      <stop offset="50%" stop-color="#c99a68"/>
      <stop offset="100%" stop-color="#9c7048"/>
    </radialGradient>
    <radialGradient id="earInner" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6a4428"/>
      <stop offset="100%" stop-color="#3a2410"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="38%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#c8ffe6"/>
      <stop offset="45%" stop-color="#33ff99"/>
      <stop offset="100%" stop-color="#00b368"/>
    </radialGradient>
    <linearGradient id="titleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8dffca"/>
      <stop offset="100%" stop-color="#33ff99"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.08"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="560" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="560" fill="url(#bgGrad)"/>
    <rect width="1200" height="560" fill="url(#scanlines)"/>

    <!-- terminal window chrome -->
    <rect x="0" y="0" width="1200" height="44" fill="#0a120d"/>
    <circle cx="28" cy="22" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="22" r="7" fill="#febc2e"/>
    <circle cx="76" cy="22" r="7" fill="#28c840"/>
    <text x="600" y="27" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#4a6b58">monoterminal — zsh</text>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#173324" stroke-width="1"/>

    <!-- ambient glow behind mascot -->
    <ellipse cx="260" cy="330" rx="230" ry="230" fill="#0e2b1c" opacity="0.55" filter="url(#strongGlow)"/>

    <!-- MASCOT (monkey face, left) -->
    <g transform="translate(80,150) scale(0.62)">
      <circle cx="240" cy="210" r="238" fill="none" stroke="#33ff99" stroke-width="1.5" opacity="0.3"/>
      <circle cx="82" cy="210" r="52" fill="url(#headFur)"/>
      <circle cx="82" cy="210" r="36" fill="url(#earInner)"/>
      <circle cx="82" cy="210" r="20" fill="#241408"/>
      <circle cx="398" cy="210" r="52" fill="url(#headFur)"/>
      <circle cx="398" cy="210" r="36" fill="url(#earInner)"/>
      <circle cx="398" cy="210" r="20" fill="#241408"/>
      <ellipse cx="240" cy="222" rx="138" ry="145" fill="url(#headFur)"/>
      <ellipse cx="240" cy="168" rx="80" ry="18" fill="#140a04" opacity="0.5"/>
      <ellipse cx="240" cy="268" rx="90" ry="100" fill="url(#facePatch)"/>
      <ellipse cx="228" cy="240" rx="30" ry="20" fill="#f5e0c0" opacity="0.12"/>
      <circle cx="196" cy="202" r="30" fill="#0a0e0a"/>
      <circle cx="284" cy="202" r="30" fill="#0a0e0a"/>
      <rect x="181" y="187" width="30" height="24" rx="4" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
      <rect x="269" y="187" width="30" height="24" rx="4" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
      <rect x="188" y="193" width="8" height="6" fill="#eafff5" opacity="0.9"/>
      <rect x="276" y="193" width="8" height="6" fill="#eafff5" opacity="0.9"/>
      <ellipse cx="222" cy="270" rx="8" ry="6" fill="#5a3018"/>
      <ellipse cx="258" cy="270" rx="8" ry="6" fill="#5a3018"/>
      <path d="M 205 305 Q 240 328 275 305" stroke="#5a3018" stroke-width="5" fill="none" stroke-linecap="round"/>
      <rect x="222" y="336" width="36" height="10" rx="1" fill="#33ff99" opacity="0.85" filter="url(#softGlow)"/>
    </g>

    <!-- wordmark + tagline (right) — textLength pins exact width so this
         renders identically regardless of which monospace font a given
         SVG renderer substitutes. -->
    <text x="500" y="240" font-family="Menlo, Consolas, monospace" font-weight="700" font-size="48" fill="url(#titleGlow)" filter="url(#softGlow)" textLength="440" lengthAdjust="spacingAndGlyphs">MONOTERMINAL</text>
    <text x="500" y="280" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7fd9ab" textLength="600" lengthAdjust="spacingAndGlyphs">Your terminal. Every device. No port-forwarding.</text>

    <!-- prompt line -->
    <text x="500" y="350" font-family="Menlo, Consolas, monospace" font-size="15" fill="#c9ffe4" textLength="600" lengthAdjust="spacingAndGlyphs">$ monoterminal --relay-url wss://relay.example</text>
    <text x="500" y="380" font-family="Menlo, Consolas, monospace" font-size="15" fill="#33ff99" textLength="330" lengthAdjust="spacingAndGlyphs">✓ WebRTC P2P session ready</text>
    <rect x="500" y="393" width="10" height="18" fill="#33ff99" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
