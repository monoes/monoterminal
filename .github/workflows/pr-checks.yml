name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: PR Metadata Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
          requireScope: false

  coverage-gate:
    name: Coverage Gate (70% minimum)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage for HEAD
        run: cargo tarpaulin --workspace --all-features --out Json --timeout 300 --engine llvm
        continue-on-error: false

      - name: Check minimum coverage threshold
        shell: pwsh
        run: |
          $coverage = (Get-Content tarpaulin-report.json | ConvertFrom-Json).coverage
          Write-Host "Current coverage: $coverage%"

          $MIN_COVERAGE = 70.0
          if ($coverage -lt $MIN_COVERAGE) {
            Write-Error "Coverage $coverage% is below minimum threshold ${MIN_COVERAGE}%"
            Write-Error "Please add tests to bring coverage above ${MIN_COVERAGE}%"
            exit 1
          }

          Write-Host "✓ Coverage check passed: $coverage% >= ${MIN_COVERAGE}%"

      - name: Comment coverage on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('tarpaulin-report.json', 'utf8'));
            const coveragePct = coverage.coverage.toFixed(2);
            const passed = coveragePct >= 70.0;
            const emoji = passed ? '✅' : '❌';

            const body = `## ${emoji} Coverage Report

            **Total Coverage:** ${coveragePct}%
            **Minimum Required:** 70.0%
            **Status:** ${passed ? 'PASSED' : 'FAILED'}

            ${passed ? '' : '⚠️ **Action Required:** Coverage is below the minimum threshold. Please add tests.'}

            <details>
            <summary>Coverage by Crate</summary>

            | Crate | Coverage |
            |-------|----------|
            ${Object.entries(coverage.files || {}).map(([file, data]) => {
              const crateName = file.split('/')[1] || 'unknown';
              return `| ${crateName} | ${data.coverage?.toFixed(2) || 'N/A'}% |`;
            }).join('\n')}

            </details>

            ---
            📊 [Full Coverage Report](https://codecov.io/gh/${{ github.repository }}/pull/${{ github.event.pull_request.number }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  changed-files:
    name: Test Coverage for Changed Files
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: |
            crates/**/*.rs
            !crates/**/tests/**
            !crates/**/benches/**

      - name: Install Rust stable
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Verify changed files have tests
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: pwsh
        run: |
          $changedFiles = "${{ steps.changed-files.outputs.all_changed_files }}" -split ' '
          $missingTests = @()

          foreach ($file in $changedFiles) {
            if ($file -match 'crates/([^/]+)/src/(.+)\.rs$') {
              $crate = $Matches[1]
              $module = $Matches[2] -replace '/', '::'

              # Check if corresponding test exists
              $testFile = "crates/$crate/tests/$($Matches[2] -replace '::', '_')_test.rs"
              $integrationTest = "crates/$crate/tests/integration/" + ($Matches[2] -replace '::', '_') + ".rs"

              if (-not (Test-Path $testFile) -and -not (Test-Path $integrationTest)) {
                # Check if file contains tests inline
                $content = Get-Content $file -Raw
                if ($content -notmatch '#\[test\]' -and $content -notmatch '#\[cfg\(test\)\]') {
                  $missingTests += $file
                }
              }
            }
          }

          if ($missingTests.Count -gt 0) {
            Write-Warning "The following files may be missing tests:"
            $missingTests | ForEach-Object { Write-Warning "  - $_" }
            Write-Host "Note: This is a warning, not a failure. Ensure changed code is tested."
          } else {
            Write-Host "✓ All changed files appear to have associated tests"
          }

  required-checks:
    name: All Required Checks
    runs-on: ubuntu-latest
    needs: [coverage-gate, changed-files]
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [[ "${{ needs.coverage-gate.result }}" != "success" ]]; then
            echo "Coverage gate failed"
            exit 1
          fi
          echo "✓ All required PR checks passed"
