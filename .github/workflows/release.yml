name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Phase 1: Windows only
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: monoterminal.exe

          # Phase 3: Linux & macOS (commented out for now)
          # - os: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   binary: monoterminal
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   binary: monoterminal
          # - os: macos-13
          #   target: aarch64-apple-darwin
          #   binary: monoterminal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../monoterminal-${{ matrix.target }}.zip ${{ matrix.binary }}

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../monoterminal-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            monoterminal-${{ matrix.target }}.zip
            monoterminal-${{ matrix.target }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          release-type: rust
          package-name: monoterminal
