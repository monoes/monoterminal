[pytest]
# MONOTERMINAL E2E Test Configuration

# Test discovery
testpaths = tests/e2e tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers (test categories)
markers =
    e2e: End-to-end tests (full workflow)
    integration: Integration tests (multi-component)
    smoke: Smoke tests (quick validation)
    slow: Slow tests (>10 seconds)
    soak: Soak tests (24+ hours)
    windows: Windows-only tests
    requires_daemon: Tests that need master daemon running

# Timeouts
timeout = 60
timeout_method = thread

# Async support
asyncio_mode = auto

# Coverage (optional - mainly for Python test utilities)
[coverage:run]
source = tests/common
omit =
    */tests/*
    */__pycache__/*
