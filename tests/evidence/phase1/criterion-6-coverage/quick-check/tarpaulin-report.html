 let pubkey2 = [0x43u8; 32];\n\n        let user_id1 = derive_user_id_from_pubkey(\u0026pubkey1);\n        let user_id2 = derive_user_id_from_pubkey(\u0026pubkey2);\n\n        assert_ne!(user_id1, user_id2);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","auth","jwt.rs"],"content":"﻿// JWT management with Ed25519 signing\n// SRS §3.2.2: Access (15min) + Refresh (30d) with rotation\n// ADR-007: EdDSA Algorithm for Phase 1 Authentication\n\nuse super::{Ed25519KeyPair, UserId};\nuse anyhow::{anyhow, Result};\nuse jsonwebtoken::{decode, encode, Algorithm, DecodingKey, EncodingKey, Header, Validation};\nuse serde::{Deserialize, Serialize};\nuse std::collections::HashSet;\nuse std::sync::{Arc, Mutex};\nuse std::time::{SystemTime, UNIX_EPOCH};\n\n#[derive(Debug, Clone)]\npub struct TokenPair {\n    pub access: String,  \n    pub refresh: String, \n}\n\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]\npub struct Claims {\n    pub sub: String,\n    pub iss: String,\n    pub exp: i64,\n    pub iat: i64,\n    pub scope: String,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    pub jti: Option\u003cString\u003e,\n}\n\npub struct JwtService {\n    enc: EncodingKey,\n    dec: DecodingKey,\n    issuer: String,\n    used: Arc\u003cMutex\u003cHashSet\u003cString\u003e\u003e\u003e,\n}\n\nimpl JwtService {\n    /// Create JWT service with Ed25519 keypair\n    /// Per ADR-007: EdDSA algorithm for Phase 1 authentication\n    pub fn new(keypair: \u0026Ed25519KeyPair) -\u003e Result\u003cSelf\u003e {\n        // Use PEM format (proven working in jsonwebtoken tests)\n        let (private_pem, public_pem) = keypair.to_pem();\n\n        Ok(Self {\n            enc: EncodingKey::from_ed_pem(private_pem.as_bytes())\n                .map_err(|e| anyhow!(\"Failed to create encoding key: {}\", e))?,\n            dec: DecodingKey::from_ed_pem(public_pem.as_bytes())\n                .map_err(|e| anyhow!(\"Failed to create decoding key: {}\", e))?,\n            issuer: \"monoterminal-master\".to_string(),\n            used: Arc::new(Mutex::new(HashSet::new())),\n        })\n    }\n\n    pub fn issue_tokens(\u0026self, user_id: \u0026UserId) -\u003e Result\u003cTokenPair\u003e {\n        let now = timestamp();\n        let access = Claims {\n            sub: user_id.0.clone(),\n            iss: self.issuer.clone(),\n            exp: now + 900,\n            iat: now,\n            scope: \"session:attach session:create input:write\".into(),\n            jti: Some(gen_jti()),  // Each access token unique for revocation\n        };\n        let refresh = Claims {\n            sub: user_id.0.clone(),\n            iss: self.issuer.clone(),\n            exp: now + 2592000,\n            iat: now,\n            scope: \"token:refresh\".into(),\n            jti: Some(gen_jti()),\n        };\n        Ok(TokenPair {\n            access: self.build(\u0026access)?,\n            refresh: self.build(\u0026refresh)?,\n        })\n    }\n\n    pub fn verify_access_token(\u0026self, tok: \u0026str) -\u003e Result\u003cClaims\u003e {\n        let c = self.parse(tok)?;\n        // Access tokens now have JTI for revocation support\n        if !c.scope.contains(\"session:\") {\n            return Err(anyhow!(\"Invalid: missing session scope\"));\n        }\n        Ok(c)\n    }\n\n    pub fn refresh_access_token(\u0026self, tok: \u0026str) -\u003e Result\u003cTokenPair\u003e {\n        let c = self.parse(tok)?;\n        if c.scope != \"token:refresh\" {\n            return Err(anyhow!(\"Not a refresh token\"));\n        }\n        let jti = c.jti.as_ref().ok_or(anyhow!(\"Missing JTI\"))?;\n        {\n            let mut u = self.used.lock().unwrap();\n            if u.contains(jti) {\n                return Err(anyhow!(\"Reuse detected: {}\", c.sub));\n            }\n            u.insert(jti.clone());\n        }\n        self.issue_tokens(\u0026UserId(c.sub))\n    }\n\n    fn build(\u0026self, c: \u0026Claims) -\u003e Result\u003cString\u003e {\n        // ADR-007: EdDSA (Ed25519) asymmetric signing\n        encode(\u0026Header::new(Algorithm::EdDSA), c, \u0026self.enc)\n            .map_err(|e| anyhow!(\"Encode failed: {}\", e))\n    }\n\n    fn parse(\u0026self, tok: \u0026str) -\u003e Result\u003cClaims\u003e {\n        // ADR-007: EdDSA (Ed25519) asymmetric verification\n        let mut v = Validation::new(Algorithm::EdDSA);\n        v.set_issuer(\u0026[\u0026self.issuer]);\n        decode::\u003cClaims\u003e(tok, \u0026self.dec, \u0026v)\n            .map(|d| d.claims)\n            .map_err(|e| anyhow!(\"Decode failed: {}\", e))\n    }\n\n    #[cfg(test)]\n    pub fn clear(\u0026self) {\n        self.used.lock().unwrap().clear();\n    }\n}\n\nfn timestamp() -\u003e i64 {\n    SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .unwrap()\n        .as_secs() as i64\n}\n\nfn gen_jti() -\u003e String {\n    use rand::Rng;\n    hex::encode(rand::thread_rng().gen::\u003c[u8; 16]\u003e())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    fn svc() -\u003e JwtService {\n        let keypair = Ed25519KeyPair::from_bytes(\u0026[0x42; 32]);\n        JwtService::new(\u0026keypair).unwrap()\n    }\n\n    #[test]\n    fn test_new() {\n        let keypair = Ed25519KeyPair::from_bytes(\u0026[0x42; 32]);\n        assert!(JwtService::new(\u0026keypair).is_ok());\n    }\n\n    #[test]\n    fn test_issue() {\n        let s = svc();\n        let p = s.issue_tokens(\u0026UserId(\"a@b.com\".into())).unwrap();\n        assert!(!p.access.is_empty());\n        assert!(!p.refresh.is_empty());\n    }\n\n    #[test]\n    fn test_verify() {\n        let s = svc();\n        let p = s.issue_tokens(\u0026UserId(\"user\".into())).unwrap();\n        let c = s.verify_access_token(\u0026p.access).unwrap();\n        assert_eq!(c.sub, \"user\");\n    }\n\n    #[test]\n    fn test_refresh() {\n        let s = svc();\n        let p1 = s.issue_tokens(\u0026UserId(\"u\".into())).unwrap();\n        let p2 = s.refresh_access_token(\u0026p1.refresh).unwrap();\n        assert_ne!(p1.access, p2.access);\n    }\n\n    #[test]\n    fn test_reuse() {\n        let s = svc();\n        let p = s.issue_tokens(\u0026UserId(\"u\".into())).unwrap();\n        assert!(s.refresh_access_token(\u0026p.refresh).is_ok());\n        assert!(s.refresh_access_token(\u0026p.refresh).is_err());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","auth","keys.rs"],"content":"// Ed25519 Key Management\n// SRS §3.2.2: Ed25519 SSH Keys + JWT Authentication\n// ADR-007: EdDSA Algorithm for Phase 1 Authentication\n\nuse anyhow::{anyhow, Context, Result};\nuse ed25519_dalek::{SigningKey, VerifyingKey};\nuse std::fs::{self, OpenOptions};\nuse std::io::{Read, Write};\nuse std::path::{Path, PathBuf};\n\n/// Ed25519 keypair for JWT signing\n#[derive(Clone, Debug)]\npub struct Ed25519KeyPair {\n    signing_key: SigningKey,\n    verifying_key: VerifyingKey,\n}\n\nimpl Ed25519KeyPair {\n    /// Create keypair from raw bytes (32-byte signing key)\n    pub fn from_bytes(bytes: \u0026[u8; 32]) -\u003e Self {\n        let signing_key = SigningKey::from_bytes(bytes);\n        let verifying_key = signing_key.verifying_key();\n        Self {\n            signing_key,\n            verifying_key,\n        }\n    }\n\n    /// Generate new random keypair\n    pub fn generate() -\u003e Self {\n        use rand::{rngs::OsRng, RngCore};\n\n        // Generate random 32-byte secret\n        let mut secret_bytes = [0u8; 32];\n        OsRng.fill_bytes(\u0026mut secret_bytes);\n\n        let signing_key = SigningKey::from_bytes(\u0026secret_bytes);\n        let verifying_key = signing_key.verifying_key();\n\n        Self {\n            signing_key,\n            verifying_key,\n        }\n    }\n\n    /// Get signing key bytes (private - 32 bytes)\n    pub fn signing_bytes(\u0026self) -\u003e \u0026[u8; 32] {\n        self.signing_key.as_bytes()\n    }\n\n    /// Get verifying key bytes (public - 32 bytes)\n    pub fn verifying_bytes(\u0026self) -\u003e \u0026[u8; 32] {\n        self.verifying_key.as_bytes()\n    }\n\n    /// Convert to PKCS#8 DER format for jsonwebtoken\n    /// Returns (private_pkcs8_der, public_spki_der)\n    pub fn to_der(\u0026self) -\u003e (Vec\u003cu8\u003e, Vec\u003cu8\u003e) {\n        // PKCS#8 private key: manually construct DER\n        let private_der = encode_pkcs8_private_key(self.signing_bytes());\n\n        // SubjectPublicKeyInfo: manually construct DER\n        let public_der = encode_spki_public_key(self.verifying_bytes());\n\n        (private_der, public_der)\n    }\n\n    /// Convert to PEM format for jsonwebtoken (PROVEN WORKING)\n    /// Returns (private_pem, public_pem)\n    pub fn to_pem(\u0026self) -\u003e (String, String) {\n        // Get DER encoding first\n        let (private_der, public_der) = self.to_der();\n\n        // Wrap in PEM format (base64 + headers)\n        let private_pem = encode_pem(\u0026private_der, \"PRIVATE KEY\");\n        let public_pem = encode_pem(\u0026public_der, \"PUBLIC KEY\");\n\n        (private_pem, public_pem)\n    }\n}\n\n/// Load or generate Ed25519 keypair\n///\n/// Storage pattern (SRS §3.2.2):\n/// - Private key: ~/.monoterminal/identity.key (0600 permissions)\n/// - Public key: Derived from private (no separate storage)\n///\n/// Security:\n/// - Creates directory with 0700 permissions\n/// - Creates key file with 0600 permissions (owner read/write only)\n/// - Generates new keypair if file doesn't exist\n/// - Loads existing keypair if file exists\npub fn load_or_generate_keypair() -\u003e Result\u003cEd25519KeyPair\u003e {\n    let key_path = get_identity_key_path()?;\n\n    if key_path.exists() {\n        load_keypair(\u0026key_path)\n    } else {\n        let keypair = Ed25519KeyPair::generate();\n        save_keypair(\u0026key_path, \u0026keypair)?;\n        Ok(keypair)\n    }\n}\n\n/// Get path to identity key file\nfn get_identity_key_path() -\u003e Result\u003cPathBuf\u003e {\n    let home = dirs::home_dir()\n        .ok_or_else(|| anyhow!(\"Failed to determine home directory\"))?;\n\n    let monoterminal_dir = home.join(\".monoterminal\");\n\n    // Create directory if it doesn't exist\n    if !monoterminal_dir.exists() {\n        fs::create_dir_all(\u0026monoterminal_dir)\n            .context(\"Failed to create .monoterminal directory\")?;\n\n        // Set directory permissions to 0700 (owner rwx only)\n        #[cfg(unix)]\n        {\n            use std::os::unix::fs::PermissionsExt;\n            let perms = std::fs::Permissions::from_mode(0o700);\n            fs::set_permissions(\u0026monoterminal_dir, perms)\n                .context(\"Failed to set directory permissions\")?;\n        }\n    }\n\n    Ok(monoterminal_dir.join(\"identity.key\"))\n}\n\n/// Load keypair from file\nfn load_keypair(path: \u0026Path) -\u003e Result\u003cEd25519KeyPair\u003e {\n    let mut file = OpenOptions::new()\n        .read(true)\n        .open(path)\n        .context(\"Failed to open identity key file\")?;\n\n    let mut bytes = Vec::new();\n    file.read_to_end(\u0026mut bytes)\n        .context(\"Failed to read identity key file\")?;\n\n    if bytes.len() != 32 {\n        return Err(anyhow!(\n            \"Invalid identity key file: expected 32 bytes, got {}\",\n            bytes.len()\n        ));\n    }\n\n    let mut key_bytes = [0u8; 32];\n    key_bytes.copy_from_slice(\u0026bytes);\n\n    Ok(Ed25519KeyPair::from_bytes(\u0026key_bytes))\n}\n\n/// Save keypair to file with secure permissions\nfn save_keypair(path: \u0026Path, keypair: \u0026Ed25519KeyPair) -\u003e Result\u003c()\u003e {\n    // Create file with restricted permissions\n    let mut file = OpenOptions::new()\n        .write(true)\n        .create(true)\n        .truncate(true)\n        .open(path)\n        .context(\"Failed to create identity key file\")?;\n\n    // Set file permissions to 0600 (owner rw only)\n    #[cfg(unix)]\n    {\n        use std::os::unix::fs::PermissionsExt;\n        let perms = std::fs::Permissions::from_mode(0o600);\n        fs::set_permissions(path, perms)\n            .context(\"Failed to set key file permissions\")?;\n    }\n\n    // Write signing key bytes\n    file.write_all(keypair.signing_bytes())\n        .context(\"Failed to write identity key file\")?;\n\n    file.sync_all()\n        .context(\"Failed to sync identity key file\")?;\n\n    Ok(())\n}\n\n/// Encode Ed25519 private key to PKCS#8 DER format\n/// Manually constructs minimal PKCS#8 structure for Ed25519\nfn encode_pkcs8_private_key(private_bytes: \u0026[u8; 32]) -\u003e Vec\u003cu8\u003e {\n    // PKCS#8 structure for Ed25519:\n    // SEQUENCE {\n    //   INTEGER 0 (version)\n    //   SEQUENCE { OID 1.3.101.112 } (algorithm)\n    //   OCTET STRING { OCTET STRING \u003c32-byte-key\u003e } (privateKey)\n    // }\n\n    let mut der = Vec::with_capacity(48);\n\n    // SEQUENCE tag + length\n    der.push(0x30); // SEQUENCE\n    der.push(0x2e); // Length: 46 bytes\n\n    // INTEGER 0 (version)\n    der.extend_from_slice(\u0026[0x02, 0x01, 0x00]);\n\n    // SEQUENCE { OID }\n    der.push(0x30); // SEQUENCE\n    der.push(0x05); // Length: 5 bytes\n    der.extend_from_slice(\u0026[0x06, 0x03, 0x2b, 0x65, 0x70]); // OID 1.3.101.112\n\n    // OCTET STRING { OCTET STRING \u003ckey\u003e }\n    der.push(0x04); // OCTET STRING\n    der.push(0x22); // Length: 34 bytes\n    der.push(0x04); // Inner OCTET STRING\n    der.push(0x20); // Length: 32 bytes\n    der.extend_from_slice(private_bytes);\n\n    der\n}\n\n/// Encode Ed25519 public key to SubjectPublicKeyInfo DER format\nfn encode_spki_public_key(public_bytes: \u0026[u8; 32]) -\u003e Vec\u003cu8\u003e {\n    // SubjectPublicKeyInfo structure for Ed25519:\n    // SEQUENCE {\n    //   SEQUENCE { OID 1.3.101.112 } (algorithm)\n    //   BIT STRING \u003c32-byte-key\u003e (subjectPublicKey)\n    // }\n\n    let mut der = Vec::with_capacity(44);\n\n    // SEQUENCE tag + length\n    der.push(0x30); // SEQUENCE\n    der.push(0x2a); // Length: 42 bytes\n\n    // SEQUENCE { OID }\n    der.push(0x30); // SEQUENCE\n    der.push(0x05); // Length: 5 bytes\n    der.extend_from_slice(\u0026[0x06, 0x03, 0x2b, 0x65, 0x70]); // OID 1.3.101.112\n\n    // BIT STRING\n    der.push(0x03); // BIT STRING\n    der.push(0x21); // Length: 33 bytes\n    der.push(0x00); // No unused bits\n    der.extend_from_slice(public_bytes);\n\n    der\n}\n\n/// Encode DER to PEM format\n/// PEM format: -----BEGIN {label}-----\\nbase64(der)\\n-----END {label}-----\nfn encode_pem(der: \u0026[u8], label: \u0026str) -\u003e String {\n    use base64::{engine::general_purpose::STANDARD, Engine};\n\n    let base64_data = STANDARD.encode(der);\n\n    // Split base64 into 64-character lines (PEM standard)\n    let mut pem = format!(\"-----BEGIN {}-----\\n\", label);\n    for chunk in base64_data.as_bytes().chunks(64) {\n        pem.push_str(std::str::from_utf8(chunk).unwrap());\n        pem.push('\\n');\n    }\n    pem.push_str(\u0026format!(\"-----END {}-----\\n\", label));\n\n    pem\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_keypair_generation() {\n        let keypair = Ed25519KeyPair::generate();\n        assert_eq!(keypair.signing_bytes().len(), 32);\n        assert_eq!(keypair.verifying_bytes().len(), 32);\n    }\n\n    #[test]\n    fn test_keypair_from_bytes() {\n        let bytes = [0x42u8; 32];\n        let keypair = Ed25519KeyPair::from_bytes(\u0026bytes);\n        assert_eq!(keypair.signing_bytes(), \u0026bytes);\n    }\n\n    #[test]\n    fn test_keypair_to_der() {\n        let keypair = Ed25519KeyPair::generate();\n        let (private_der, public_der) = keypair.to_der();\n        // PKCS#8 private key: 48 bytes\n        assert_eq!(private_der.len(), 48, \"PKCS#8 private key should be 48 bytes\");\n        // SubjectPublicKeyInfo: 44 bytes\n        assert_eq!(public_der.len(), 44, \"SPKI public key should be 44 bytes\");\n\n        // Verify DER structure (SEQUENCE tag)\n        assert_eq!(private_der[0], 0x30, \"Private DER should start with SEQUENCE\");\n        assert_eq!(public_der[0], 0x30, \"Public DER should start with SEQUENCE\");\n    }\n\n    #[test]\n    fn test_save_and_load_keypair() {\n        let temp_dir = TempDir::new().unwrap();\n        let key_path = temp_dir.path().join(\"test.key\");\n\n        let original = Ed25519KeyPair::generate();\n        save_keypair(\u0026key_path, \u0026original).unwrap();\n\n        let loaded = load_keypair(\u0026key_path).unwrap();\n        assert_eq!(loaded.signing_bytes(), original.signing_bytes());\n        assert_eq!(loaded.verifying_bytes(), original.verifying_bytes());\n    }\n\n    #[test]\n    fn test_load_invalid_key_size() {\n        let temp_dir = TempDir::new().unwrap();\n        let key_path = temp_dir.path().join(\"invalid.key\");\n\n        // Write invalid size (not 32 bytes)\n        fs::write(\u0026key_path, \u0026[0u8; 16]).unwrap();\n\n        let result = load_keypair(\u0026key_path);\n        assert!(result.is_err());\n        assert!(result.unwrap_err().to_string().contains(\"expected 32 bytes\"));\n    }\n\n    #[cfg(unix)]\n    #[test]\n    fn test_key_file_permissions() {\n        use std::os::unix::fs::PermissionsExt;\n\n        let temp_dir = TempDir::new().unwrap();\n        let key_path = temp_dir.path().join(\"perms.key\");\n\n        let keypair = Ed25519KeyPair::generate();\n        save_keypair(\u0026key_path, \u0026keypair).unwrap();\n\n        let metadata = fs::metadata(\u0026key_path).unwrap();\n        let mode = metadata.permissions().mode();\n        assert_eq!(mode \u0026 0o777, 0o600, \"Key file should have 0600 permissions\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","auth","mod.rs"],"content":"// Authentication and authorization module\n// Implements SRS §3.2: Ed25519 + JWT + RBAC + Rate Limiting\n\npub mod challenge;\npub mod jwt;\npub mod keys;\npub mod rate_limit;\n\nuse anyhow::Result;\nuse async_trait::async_trait;\nuse std::time::Instant;\n\n// Re-exports for convenience\npub use challenge::{Challenge, Ed25519ChallengeHandler};\npub use jwt::{Claims, JwtService, TokenPair};\npub use keys::{load_or_generate_keypair, Ed25519KeyPair};\npub use rate_limit::RateLimiter;\n\n// ===== Core Types =====\n\n/// User identifier\n#[derive(Debug, Clone, PartialEq, Eq, Hash)]\npub struct UserId(pub String);\n\nimpl From\u003cString\u003e for UserId {\n    fn from(s: String) -\u003e Self {\n        UserId(s)\n    }\n}\n\nimpl From\u003c\u0026str\u003e for UserId {\n    fn from(s: \u0026str) -\u003e Self {\n        UserId(s.to_string())\n    }\n}\n\nimpl AsRef\u003cstr\u003e for UserId {\n    fn as_ref(\u0026self) -\u003e \u0026str {\n        \u0026self.0\n    }\n}\n\n/// Ed25519 public key (32 bytes)\npub type PublicKey = [u8; 32];\n\n/// Ed25519 signature (64 bytes)\npub type Signature = [u8; 64];\n\n// ===== AuthService Trait =====\n\n/// Authentication service interface (per architecture docs)\n#[async_trait]\npub trait AuthService: Send + Sync {\n    /// Generate challenge for client\n    fn create_challenge(\u0026self) -\u003e Challenge;\n\n    /// Verify signed challenge\n    fn verify_challenge_response(\n        \u0026self,\n        challenge: \u0026Challenge,\n        signature: \u0026Signature,\n        public_key: \u0026PublicKey,\n    ) -\u003e Result\u003cUserId\u003e;\n\n    /// Issue JWT tokens\n    fn issue_tokens(\u0026self, user_id: \u0026UserId) -\u003e Result\u003cTokenPair\u003e;\n\n    /// Verify JWT access token\n    fn verify_access(\u0026self, access: \u0026str) -\u003e Result\u003cClaims\u003e;\n\n    /// Refresh access token using refresh token\n    fn refresh_access(\u0026self, refresh: \u0026str) -\u003e Result\u003cTokenPair\u003e;\n}\n\n// ===== Ed25519AuthService Implementation =====\n\n/// Default authentication service using Ed25519 + JWT\npub struct Ed25519AuthService {\n    challenge_handler: Ed25519ChallengeHandler,\n    jwt_service: JwtService,\n}\n\nimpl Ed25519AuthService {\n    /// Create new auth service with Ed25519 keypair\n    /// Per ADR-007: EdDSA algorithm for Phase 1 authentication\n    pub fn new(keypair: \u0026Ed25519KeyPair) -\u003e Result\u003cSelf\u003e {\n        Ok(Self {\n            challenge_handler: Ed25519ChallengeHandler::new(),\n            jwt_service: JwtService::new(keypair)?,\n        })\n    }\n\n    /// Create auth service with auto-generated/loaded keypair\n    /// Loads from ~/.monoterminal/identity.key or generates new\n    pub fn new_with_auto_keypair() -\u003e Result\u003cSelf\u003e {\n        let keypair = load_or_generate_keypair()?;\n        Self::new(\u0026keypair)\n    }\n}\n\n#[async_trait]\nimpl AuthService for Ed25519AuthService {\n    fn create_challenge(\u0026self) -\u003e Challenge {\n        self.challenge_handler.create_challenge()\n    }\n\n    fn verify_challenge_response(\n        \u0026self,\n        challenge: \u0026Challenge,\n        signature: \u0026Signature,\n        public_key: \u0026PublicKey,\n    ) -\u003e Result\u003cUserId\u003e {\n        self.challenge_handler\n            .verify_challenge_response(challenge, signature, public_key)\n    }\n\n    fn issue_tokens(\u0026self, user_id: \u0026UserId) -\u003e Result\u003cTokenPair\u003e {\n        self.jwt_service.issue_tokens(user_id)\n    }\n\n    fn verify_access(\u0026self, access: \u0026str) -\u003e Result\u003cClaims\u003e {\n        self.jwt_service.verify_access_token(access)\n    }\n\n    fn refresh_access(\u0026self, refresh: \u0026str) -\u003e Result\u003cTokenPair\u003e {\n        self.jwt_service.refresh_access_token(refresh)\n    }\n}\n\n// ===== Tests =====\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_user_id_conversions() {\n        let user_id = UserId::from(\"alice@example.com\");\n        assert_eq!(user_id.as_ref(), \"alice@example.com\");\n\n        let user_id2: UserId = \"bob@example.com\".into();\n        assert_eq!(user_id2.0, \"bob@example.com\");\n    }\n\n    #[test]\n    fn test_auth_service_creation() {\n        let keypair = Ed25519KeyPair::from_bytes(\u0026[0x42; 32]);\n        let auth_service = Ed25519AuthService::new(\u0026keypair);\n        assert!(auth_service.is_ok());\n    }\n\n    #[test]\n    fn test_auth_service_auto_keypair() {\n        // This test creates real keys in ~/.monoterminal/\n        // Only run in integration test environment\n        // For unit tests, use test_auth_service_creation()\n        let result = Ed25519AuthService::new_with_auto_keypair();\n        assert!(result.is_ok());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","auth","rate_limit.rs"],"content":"// Rate limiting implementation using token bucket algorithm\n// SRS §3.2.4: Connection, auth, and session rate limits\n\nuse anyhow::{anyhow, Result};\nuse std::collections::HashMap;\nuse std::net::SocketAddr;\nuse std::sync::{Arc, Mutex};\nuse std::time::{Duration, Instant};\n\n/// Rate limit error\n#[derive(Debug, thiserror::Error)]\npub enum RateLimitError {\n    #[error(\"Rate limit exceeded: {0}\")]\n    Exceeded(String),\n\n    #[error(\"Temporary ban active until {0:?}\")]\n    Banned(Instant),\n}\n\n/// Token bucket for rate limiting\n#[derive(Debug, Clone)]\nstruct TokenBucket {\n    capacity: usize,\n    tokens: usize,\n    refill_rate: usize,     // Tokens per refill interval\n    refill_interval: Duration,\n    last_refill: Instant,\n}\n\nimpl TokenBucket {\n    fn new(capacity: usize, refill_rate: usize, refill_interval: Duration) -\u003e Self {\n        Self {\n            capacity,\n            tokens: capacity,\n            refill_rate,\n            refill_interval,\n            last_refill: Instant::now(),\n        }\n    }\n\n    /// Try to acquire N tokens\n    fn try_acquire(\u0026mut self, count: usize) -\u003e bool {\n        self.refill();\n\n        if self.tokens \u003e= count {\n            self.tokens -= count;\n            true\n        } else {\n            false\n        }\n    }\n\n    /// Refill tokens based on elapsed time\n    fn refill(\u0026mut self) {\n        let now = Instant::now();\n        let elapsed = now.duration_since(self.last_refill);\n\n        if elapsed \u003e= self.refill_interval {\n            // Use milliseconds for sub-second precision (avoids 0/0 for ms intervals)\n            let intervals = (elapsed.as_millis() / self.refill_interval.as_millis()) as usize;\n            let new_tokens = intervals * self.refill_rate;\n            self.tokens = (self.tokens + new_tokens).min(self.capacity);\n            self.last_refill = now;\n        }\n    }\n}\n\n/// Auth failure tracking for temporary bans\n#[derive(Debug)]\nstruct AuthFailureTracker {\n    failures: Vec\u003cInstant\u003e,\n    ban_until: Option\u003cInstant\u003e,\n}\n\nimpl AuthFailureTracker {\n    fn new() -\u003e Self {\n        Self {\n            failures: Vec::new(),\n            ban_until: None,\n        }\n    }\n\n    /// Record a failed auth attempt\n    fn record_failure(\u0026mut self) {\n        let now = Instant::now();\n        self.failures.push(now);\n\n        // Keep only failures from last hour\n        let one_hour_ago = now - Duration::from_secs(3600);\n        self.failures.retain(|\u0026t| t \u003e one_hour_ago);\n\n        // Check if should ban (5 failures in 1 hour)\n        if self.failures.len() \u003e= 5 {\n            // 15 minute ban\n            self.ban_until = Some(now + Duration::from_secs(900));\n        }\n    }\n\n    /// Check if currently banned\n    fn is_banned(\u0026self) -\u003e bool {\n        if let Some(ban_time) = self.ban_until {\n            Instant::now() \u003c ban_time\n        } else {\n            false\n        }\n    }\n\n    /// Get ban expiration time\n    fn ban_expires_at(\u0026self) -\u003e Option\u003cInstant\u003e {\n        if self.is_banned() {\n            self.ban_until\n        } else {\n            None\n        }\n    }\n}\n\n/// Rate limiter with multiple buckets\npub struct RateLimiter {\n    connection_buckets: Arc\u003cMutex\u003cHashMap\u003cSocketAddr, TokenBucket\u003e\u003e\u003e,\n    auth_trackers: Arc\u003cMutex\u003cHashMap\u003cSocketAddr, AuthFailureTracker\u003e\u003e\u003e,\n    session_buckets: Arc\u003cMutex\u003cHashMap\u003cString, TokenBucket\u003e\u003e\u003e,\n\n    // Global limits\n    max_connections_per_minute: usize,\n    max_sessions_per_minute: usize,\n}\n\nimpl RateLimiter {\n    /// Create new rate limiter with SRS defaults\n    pub fn new() -\u003e Self {\n        Self {\n            connection_buckets: Arc::new(Mutex::new(HashMap::new())),\n            auth_trackers: Arc::new(Mutex::new(HashMap::new())),\n            session_buckets: Arc::new(Mutex::new(HashMap::new())),\n            max_connections_per_minute: 100,  // SRS §3.2.4\n            max_sessions_per_minute: 20,      // SRS §3.2.4\n        }\n    }\n\n    /// Check if connection from peer is allowed (100/min limit)\n    pub fn check_connection(\u0026self, peer_addr: \u0026SocketAddr) -\u003e Result\u003c(), RateLimitError\u003e {\n        let mut buckets = self.connection_buckets.lock().unwrap();\n        let bucket = buckets.entry(*peer_addr).or_insert_with(|| {\n            TokenBucket::new(\n                self.max_connections_per_minute,\n                self.max_connections_per_minute,\n                Duration::from_secs(60),\n            )\n        });\n\n        if bucket.try_acquire(1) {\n            Ok(())\n        } else {\n            Err(RateLimitError::Exceeded(format!(\n                \"Connection rate limit exceeded for {}\",\n                peer_addr\n            )))\n        }\n    }\n\n    /// Check if auth attempt is allowed (respects temp bans)\n    pub fn check_auth_attempt(\u0026self, peer_addr: \u0026SocketAddr) -\u003e Result\u003c(), RateLimitError\u003e {\n        let trackers = self.auth_trackers.lock().unwrap();\n\n        if let Some(tracker) = trackers.get(peer_addr) {\n            if let Some(ban_time) = tracker.ban_expires_at() {\n                return Err(RateLimitError::Banned(ban_time));\n            }\n        }\n\n        Ok(())\n    }\n\n    /// Record an auth failure (triggers ban after 5 failures/hour)\n    pub fn record_auth_failure(\u0026self, peer_addr: \u0026SocketAddr) {\n        let mut trackers = self.auth_trackers.lock().unwrap();\n        let tracker = trackers.entry(*peer_addr).or_insert_with(AuthFailureTracker::new);\n        tracker.record_failure();\n    }\n\n    /// Check if session creation is allowed (20/min limit per user)\n    pub fn check_session_create(\u0026self, user_id: \u0026str) -\u003e Result\u003c(), RateLimitError\u003e {\n        let mut buckets = self.session_buckets.lock().unwrap();\n        let bucket = buckets.entry(user_id.to_string()).or_insert_with(|| {\n            TokenBucket::new(\n                self.max_sessions_per_minute,\n                self.max_sessions_per_minute,\n                Duration::from_secs(60),\n            )\n        });\n\n        if bucket.try_acquire(1) {\n            Ok(())\n        } else {\n            Err(RateLimitError::Exceeded(format!(\n                \"Session creation rate limit exceeded for user {}\",\n                user_id\n            )))\n        }\n    }\n\n    /// Cleanup expired entries (call periodically)\n    pub fn cleanup(\u0026self) {\n        let now = Instant::now();\n\n        // Cleanup auth trackers with expired bans\n        let mut trackers = self.auth_trackers.lock().unwrap();\n        trackers.retain(|_, tracker| {\n            !tracker.failures.is_empty() || tracker.is_banned()\n        });\n\n        // Note: buckets cleanup on access (lazy cleanup via refill)\n    }\n}\n\nimpl Default for RateLimiter {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n// ===== Tests =====\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::net::{IpAddr, Ipv4Addr};\n\n    fn test_addr(port: u16) -\u003e SocketAddr {\n        SocketAddr::new(IpAddr::V4(Ipv4Addr::new(127, 0, 0, 1)), port)\n    }\n\n    #[test]\n    fn test_bucket_creation() {\n        let mut bucket = TokenBucket::new(100, 100, Duration::from_secs(60));\n\n        // Should start at capacity\n        assert!(bucket.try_acquire(1));\n        assert!(bucket.try_acquire(99));\n\n        // Should be empty now\n        assert!(!bucket.try_acquire(1));\n    }\n\n    #[test]\n    fn test_bucket_refill() {\n        let mut bucket = TokenBucket::new(10, 10, Duration::from_millis(100));\n\n        // Exhaust bucket\n        assert!(bucket.try_acquire(10));\n        assert!(!bucket.try_acquire(1));\n\n        // Wait for refill\n        std::thread::sleep(Duration::from_millis(150));\n\n        // Should be refilled\n        assert!(bucket.try_acquire(10));\n    }\n\n    #[test]\n    fn test_connection_rate_limit() {\n        let limiter = RateLimiter::new();\n        let addr = test_addr(8080);\n\n        // Should allow up to 100 connections\n        for _ in 0..100 {\n            assert!(limiter.check_connection(\u0026addr).is_ok());\n        }\n\n        // 101st should fail\n        assert!(limiter.check_connection(\u0026addr).is_err());\n    }\n\n    #[test]\n    fn test_auth_failure_tracking() {\n        let limiter = RateLimiter::new();\n        let addr = test_addr(8081);\n\n        // First 4 failures should not ban\n        for _ in 0..4 {\n            limiter.record_auth_failure(\u0026addr);\n            assert!(limiter.check_auth_attempt(\u0026addr).is_ok());\n        }\n\n        // 5th failure triggers ban\n        limiter.record_auth_failure(\u0026addr);\n        assert!(limiter.check_auth_attempt(\u0026addr).is_err());\n    }\n\n    #[test]\n    fn test_auth_ban_expiry() {\n        let limiter = RateLimiter::new();\n        let addr = test_addr(8082);\n\n        // Trigger ban with custom short duration for testing\n        {\n            let mut trackers = limiter.auth_trackers.lock().unwrap();\n            let tracker = trackers.entry(addr).or_insert_with(AuthFailureTracker::new);\n            // Record 5 failures\n            for _ in 0..5 {\n                tracker.failures.push(Instant::now());\n            }\n            // Set short ban\n            tracker.ban_until = Some(Instant::now() + Duration::from_millis(50));\n        }\n\n        // Should be banned\n        assert!(limiter.check_auth_attempt(\u0026addr).is_err());\n\n        // Wait for ban expiry\n        std::thread::sleep(Duration::from_millis(60));\n\n        // Should no longer be banned\n        assert!(limiter.check_auth_attempt(\u0026addr).is_ok());\n    }\n\n    #[test]\n    fn test_session_creation_rate_limit() {\n        let limiter = RateLimiter::new();\n        let user_id = \"alice@example.com\";\n\n        // Should allow up to 20 sessions\n        for _ in 0..20 {\n            assert!(limiter.check_session_create(user_id).is_ok());\n        }\n\n        // 21st should fail\n        assert!(limiter.check_session_create(user_id).is_err());\n    }\n\n    #[test]\n    fn test_different_users_independent_limits() {\n        let limiter = RateLimiter::new();\n\n        // Exhaust limit for user1\n        for _ in 0..20 {\n            assert!(limiter.check_session_create(\"user1\").is_ok());\n        }\n        assert!(limiter.check_session_create(\"user1\").is_err());\n\n        // user2 should still have full quota\n        assert!(limiter.check_session_create(\"user2\").is_ok());\n    }\n\n    #[test]\n    fn test_different_ips_independent_limits() {\n        let limiter = RateLimiter::new();\n        let addr1 = test_addr(8083);\n        let addr2 = test_addr(8084);\n\n        // Exhaust limit for addr1\n        for _ in 0..100 {\n            assert!(limiter.check_connection(\u0026addr1).is_ok());\n        }\n        assert!(limiter.check_connection(\u0026addr1).is_err());\n\n        // addr2 should still work\n        assert!(limiter.check_connection(\u0026addr2).is_ok());\n    }\n\n    #[test]\n    fn test_cleanup_removes_expired() {\n        let limiter = RateLimiter::new();\n        let addr = test_addr(8085);\n\n        // Record failures\n        limiter.record_auth_failure(\u0026addr);\n\n        {\n            let trackers = limiter.auth_trackers.lock().unwrap();\n            assert_eq!(trackers.len(), 1);\n        }\n\n        // Cleanup doesn't remove recent failures\n        limiter.cleanup();\n\n        {\n            let trackers = limiter.auth_trackers.lock().unwrap();\n            assert_eq!(trackers.len(), 1);\n        }\n    }\n\n    #[test]\n    fn test_failure_tracker_expiry() {\n        let mut tracker = AuthFailureTracker::new();\n\n        // Add old failures (should be cleaned up)\n        let old_time = Instant::now() - Duration::from_secs(7200); // 2 hours ago\n        tracker.failures.push(old_time);\n\n        // Add recent failure\n        tracker.record_failure();\n\n        // Should only have recent failure\n        assert_eq!(tracker.failures.len(), 1);\n        assert!(tracker.failures[0] \u003e Instant::now() - Duration::from_secs(10));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","lib.rs"],"content":"//! MONOTERMINAL Master Daemon Library\n//!\n//! This library exposes the core components of the MONOTERMINAL master daemon\n//! for use in integration tests and benchmarks.\n//!\n//! The actual daemon binary is in src/main.rs.\n\npub mod session;\npub mod pty;\npub mod server;\npub mod auth;\npub mod ui;\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","main.rs"],"content":"// MONOTERMINAL Master Daemon\n// Phase 1: Windows + Web (ConPTY, wgpu rendering, WebSocket server)\n// See: docs/monoterminal-srs.md\n\nmod auth;\nmod pty;\nmod session;\nmod server;\nmod ui;\n\nuse anyhow::{Result, Context};\nuse std::sync::Arc;\nuse std::path::PathBuf;\nuse tokio::sync::broadcast;\nuse tracing_subscriber;\nuse tracing_appender;\nuse clap::Parser;\n\nuse auth::{Ed25519AuthService, RateLimiter, keys::load_or_generate_keypair};\nuse monoterminal_monomind_bridge::HealthStatus;\n\n/// MONOTERMINAL master daemon\n#[derive(Parser, Debug)]\n#[command(name = \"monoterminal-master\")]\n#[command(about = \"MONOTERMINAL master daemon - Phase 1 (Windows + Web)\", long_about = None)]\nstruct Args {\n    /// Enable development mode (bypasses Ed25519 challenge-response auth)\n    /// WARNING: Automatically issues JWT tokens without signature verification.\n    /// DO NOT use in production - for E2E testing only.\n    #[arg(long, default_value_t = false)]\n    dev_mode: bool,\n\n    /// Server bind address\n    #[arg(long, default_value = \"127.0.0.1:5000\")]\n    bind_addr: String,\n}\n\n#[tokio::main]\nasync fn main() -\u003e Result\u003c()\u003e {\n    // Parse CLI arguments\n    let args = Args::parse();\n\n    // Initialize logging based on environment\n    // SOAK_TEST_MODE=1 enables structured JSON logging to file for 24h soak tests\n    // Otherwise: compact console output for normal operation\n    if std::env::var(\"SOAK_TEST_MODE\").is_ok() {\n        // Soak test mode: JSON logs to hourly-rotated files\n        let file_appender = tracing_appender::rolling::hourly(\"./soak-logs\", \"monoterminal.log\");\n        let (non_blocking, _guard) = tracing_appender::non_blocking(file_appender);\n\n        tracing_subscriber::fmt()\n            .json()  // Structured JSON for post-test parsing\n            .with_current_span(false)\n            .with_span_list(false)\n            .with_writer(non_blocking)\n            .init();\n\n        // Guard must live for program lifetime - box it and leak (acceptable for daemon)\n        Box::leak(Box::new(_guard));\n\n        tracing::info!(\"MONOTERMINAL master daemon starting (SOAK TEST MODE - JSON logging enabled)\");\n    } else {\n        // Normal mode: compact console output\n        tracing_subscriber::fmt()\n            .with_target(false)\n            .compact()\n            .init();\n\n        tracing::info!(\"MONOTERMINAL master daemon starting...\");\n    }\n\n    tracing::info!(\"Phase 1: Windows + Web client\");\n\n    if args.dev_mode {\n        tracing::warn!(\"⚠️  DEV MODE ENABLED - Auth bypass active (auto-issuing JWT tokens)\");\n        tracing::warn!(\"⚠️  DO NOT use in production - for E2E testing only\");\n    }\n\n    // Phase 1 Implementation Status:\n    // ✅ WebSocket server with TLS 1.3 (§3.1.2, §3.2.1)\n    // ✅ Protocol Runtime Integration (§3.1.1)\n    // ✅ Ed25519/JWT authentication (§3.2.2)\n    // ✅ Monomind bridge integration (§2.4) - task-2 COMPLETE\n    // 🔄 ConPTY session manager (§2.1.2) - IN PROGRESS\n    // ⏳ wgpu + egui rendering (§2.1.1, §4.2.1) - BLOCKED (gpu-rendering-engineer)\n\n    println!(\"MONOTERMINAL v0.1.0 - Phase 1 (Windows)\");\n    if args.dev_mode {\n        println!(\"⚠️  RUNNING IN DEV MODE - Auth bypass enabled\");\n    }\n\n    // 1. Load or generate Ed25519 keypair for JWT signing\n    let keypair = load_or_generate_keypair()\n        .context(\"Failed to load Ed25519 keypair\")?;\n    tracing::info!(\"Ed25519 keypair loaded\");\n\n    // 2. Create authentication service (Ed25519 + JWT)\n    let auth_service = Arc::new(Ed25519AuthService::new(\u0026keypair)?);\n    tracing::info!(\"Ed25519 authentication service initialized\");\n\n    // 3. Create rate limiter (connection + auth + session limits)\n    let rate_limiter = Arc::new(RateLimiter::new());\n    tracing::info!(\"Rate limiter initialized\");\n\n    // 4. Create session manager\n    let session_manager = Arc::new(session::manager::SessionManager::new(None));\n    tracing::info!(\"Session manager initialized\");\n\n    // 5. Create broadcast channel for health status updates\n    let (health_tx, _health_rx) = broadcast::channel::\u003cHealthStatus\u003e(16);\n\n    // 6. Start daily health check scheduler (24h interval)\n    let project_dir = std::env::current_dir().unwrap_or_else(|_| PathBuf::from(\".\"));\n    start_health_scheduler(project_dir, health_tx.clone());\n    tracing::info!(\"Health check scheduler started (24h interval)\");\n\n    // 7. Create server configuration\n    let mut server_config = server::ServerConfig::default();\n    server_config.bind_addr = args.bind_addr.parse()\n        .context(\"Invalid bind address\")?;\n    server_config.dev_mode = args.dev_mode;\n\n    tracing::info!(\n        \"Server configuration: bind_addr={}, max_connections={}, dev_mode={}\",\n        server_config.bind_addr,\n        server_config.max_connections,\n        server_config.dev_mode\n    );\n\n    // 8. Create WebSocket server with auth + rate limiting\n    let server = server::Server::new(\n        server_config,\n        session_manager,\n        rate_limiter,\n        auth_service,\n        health_tx,\n    )?;\n    tracing::info!(\"WebSocket server created\");\n\n    // 9. Run server (blocking until shutdown signal)\n    server.run().await?;\n\n    Ok(())\n}\n\n/// Load or generate JWT signing key\n///\n/// Priority order:\n/// 1. Environment variable MONOTERMINAL_JWT_KEY (hex-encoded 32 bytes)\n/// 2. File: %ProgramData%\\MONOTERMINAL\\jwt_key.bin (service mode)\n/// 3. File: %LOCALAPPDATA%\\monoterminal\\jwt_key.bin (console mode)\n/// 4. Auto-generate and save new key\nfn load_or_generate_jwt_key() -\u003e Result\u003c[u8; 32]\u003e {\n    use std::env;\n    use std::fs;\n\n    // 1. Try environment variable first\n    if let Ok(key_hex) = env::var(\"MONOTERMINAL_JWT_KEY\") {\n        let key_bytes = hex::decode(\u0026key_hex)\n            .context(\"Invalid JWT key in MONOTERMINAL_JWT_KEY (not hex)\")?;\n        if key_bytes.len() != 32 {\n            anyhow::bail!(\"JWT key must be exactly 32 bytes (got {})\", key_bytes.len());\n        }\n        let mut key = [0u8; 32];\n        key.copy_from_slice(\u0026key_bytes);\n        tracing::info!(\"JWT key loaded from environment variable\");\n        return Ok(key);\n    }\n\n    // 2. Try file (service mode: %ProgramData%, console mode: %LOCALAPPDATA%)\n    let key_path = if let Ok(program_data) = env::var(\"ProgramData\") {\n        // Service mode\n        PathBuf::from(program_data)\n            .join(\"MONOTERMINAL\")\n            .join(\"jwt_key.bin\")\n    } else if let Ok(local_appdata) = env::var(\"LOCALAPPDATA\") {\n        // Console mode\n        PathBuf::from(local_appdata)\n            .join(\"monoterminal\")\n            .join(\"jwt_key.bin\")\n    } else {\n        // Fallback: current directory (development only)\n        PathBuf::from(\"jwt_key.bin\")\n    };\n\n    // Try to load existing key\n    if key_path.exists() {\n        let key_bytes = fs::read(\u0026key_path)\n            .context(\"Failed to read JWT key file\")?;\n        if key_bytes.len() != 32 {\n            anyhow::bail!(\"JWT key file corrupt (expected 32 bytes, got {})\", key_bytes.len());\n        }\n        let mut key = [0u8; 32];\n        key.copy_from_slice(\u0026key_bytes);\n        tracing::info!(\"JWT key loaded from {}\", key_path.display());\n        return Ok(key);\n    }\n\n    // 3. Generate new key and save\n    let key = generate_random_key();\n\n    // Create parent directory if it doesn't exist\n    if let Some(parent) = key_path.parent() {\n        fs::create_dir_all(parent)\n            .context(\"Failed to create JWT key directory\")?;\n    }\n\n    fs::write(\u0026key_path, \u0026key)\n        .context(\"Failed to save JWT key\")?;\n    tracing::info!(\"Generated new JWT key and saved to {}\", key_path.display());\n\n    Ok(key)\n}\n\n/// Generate cryptographically secure random 32-byte key\nfn generate_random_key() -\u003e [u8; 32] {\n    use rand::RngCore;\n    let mut key = [0u8; 32];\n    rand::thread_rng().fill_bytes(\u0026mut key);\n    key\n}\n\n/// Start daily health check scheduler as background task\nfn start_health_scheduler(\n    project_dir: PathBuf,\n    health_tx: broadcast::Sender\u003cHealthStatus\u003e,\n) {\n    tokio::spawn(async move {\n        use monoterminal_monomind_bridge::HealthScheduler;\n\n        let scheduler = HealthScheduler::new(); // Default 24-hour interval\n\n        tracing::info!(\n            path = %project_dir.display(),\n            \"Starting daily health check scheduler\"\n        );\n\n        let result = scheduler\n            .start(\u0026project_dir, move |health| {\n                let tx = health_tx.clone();\n                async move {\n                    tracing::info!(\n                        healthy = health.is_healthy(),\n                        issues = health.issues.len(),\n                        version = ?health.version,\n                        \"Scheduled health check complete\"\n                    );\n\n                    // Broadcast to all WebSocket clients\n                    if let Err(e) = tx.send(health.clone()) {\n                        tracing::debug!(\"No health status subscribers: {}\", e);\n                    }\n                }\n            })\n            .await;\n\n        if let Err(e) = result {\n            tracing::error!(error = %e, \"Health scheduler terminated with error\");\n        }\n    });\n}\n\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn test_basic_startup() {\n        // Placeholder test\n        assert!(true);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","pty","conpty.rs"],"content":"// Windows ConPTY Backend Implementation\r\n// SRS Reference: §2.1.2.3 Windows ConPTY [D1.2.3]\r\n//\r\n// Implements the PtyBackend trait for Windows using the Console Pseudo-console API.\r\n// Windows 10 1809+ (build 17763+) required.\r\n//\r\n// Architecture:\r\n// - BufReader/BufWriter around async pipe handles for I/O\r\n// - Direct read()/write() calls from Session Manager (no background tasks)\r\n// - Cleanup via terminate() or Drop\r\n//\r\n// Safety: All unsafe FFI calls have documented safety invariants.\r\n\r\nuse super::{\r\n    error::{PtyError, PtyResult},\r\n    PtyBackend, PtyConfig,\r\n};\r\nuse async_trait::async_trait;\r\nuse std::ffi::OsStr;\r\nuse std::os::windows::ffi::OsStrExt;\r\nuse std::ptr;\r\nuse tokio::io::{AsyncReadExt, AsyncWriteExt, BufReader, BufWriter};\r\nuse windows::core::PCWSTR;\r\nuse windows::Win32::Foundation::{CloseHandle, HANDLE};\r\nuse windows::Win32::System::Console::{\r\n    ClosePseudoConsole, CreatePseudoConsole, ResizePseudoConsole, COORD, HPCON,\r\n};\r\nuse windows::Win32::System::Pipes::CreatePipe;\r\nuse windows::Win32::System::Threading::{\r\n    CreateProcessW, InitializeProcThreadAttributeList, TerminateProcess, UpdateProcThreadAttribute,\r\n    CREATE_UNICODE_ENVIRONMENT, EXTENDED_STARTUPINFO_PRESENT, LPPROC_THREAD_ATTRIBUTE_LIST,\r\n    PROCESS_INFORMATION, PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE, STARTF_USESTDHANDLES,\r\n    STARTUPINFOEXW,\r\n};\r\n\r\n/// 4KB buffer size per SRS §3.1.4\r\nconst PTY_BUFFER_SIZE: usize = 4096;\r\n\r\n/// Windows ConPTY backend\r\n///\r\n/// Implements PtyBackend trait for Windows using CreatePseudoConsole API.\r\n/// Session Manager calls methods on this struct via `Box\u003cdyn PtyBackend\u003e`.\r\npub struct ConPtyBackend {\r\n    /// Pseudo-console handle (Option allows terminate() to consume and prevent Drop race)\r\n    hpc: Option\u003cHPCON\u003e,\r\n    /// Child process handle (Option allows terminate() to consume and prevent Drop race)\r\n    process_handle: Option\u003cHANDLE\u003e,\r\n    /// Buffered output reader (ConPTY → Session Manager)\r\n    output_reader: BufReader\u003cAsyncPipeReader\u003e,\r\n    /// Buffered input writer (Session Manager → ConPTY)\r\n    input_writer: BufWriter\u003cAsyncPipeWriter\u003e,\r\n    /// Shell process ID\r\n    shell_pid: u32,\r\n}\r\n\r\n// SAFETY: Windows HANDLEs are safe to send between threads - they're just kernel object references.\r\n// The HPCON and HANDLE types are opaque handles that can be used from any thread.\r\n// They are also safe to share (\u0026T) between threads as the Windows kernel handles synchronization.\r\nunsafe impl Send for ConPtyBackend {}\r\nunsafe impl Sync for ConPtyBackend {}\r\n\r\n/// Async wrapper around Windows pipe HANDLE\r\n///\r\n/// Implements tokio::io::AsyncRead and AsyncWrite.\r\n/// Uses blocking I/O with spawn_blocking for Phase 1 simplicity.\r\n/// TODO: Implement proper overlapped I/O with IOCP for production.\r\nstruct AsyncPipeReader {\r\n    handle: HANDLE,\r\n}\r\n\r\nstruct AsyncPipeWriter {\r\n    handle: HANDLE,\r\n}\r\n\r\n// SAFETY: HANDLEs are safe to send and share between threads\r\nunsafe impl Send for AsyncPipeReader {}\r\nunsafe impl Sync for AsyncPipeReader {}\r\nunsafe impl Send for AsyncPipeWriter {}\r\nunsafe impl Sync for AsyncPipeWriter {}\r\n\r\nimpl AsyncPipeReader {\r\n    unsafe fn from_handle(handle: HANDLE) -\u003e Self {\r\n        Self { handle }\r\n    }\r\n}\r\n\r\nimpl AsyncPipeWriter {\r\n    unsafe fn from_handle(handle: HANDLE) -\u003e Self {\r\n        Self { handle }\r\n    }\r\n}\r\n\r\nimpl Drop for AsyncPipeReader {\r\n    fn drop(\u0026mut self) {\r\n        // SAFETY: Close the pipe handle to prevent resource leaks\r\n        // CloseHandle is safe to call on valid HANDLEs and handles double-close gracefully\r\n        unsafe {\r\n            let _ = CloseHandle(self.handle);\r\n        }\r\n    }\r\n}\r\n\r\nimpl Drop for AsyncPipeWriter {\r\n    fn drop(\u0026mut self) {\r\n        // SAFETY: Close the pipe handle to prevent resource leaks\r\n        // CloseHandle is safe to call on valid HANDLEs and handles double-close gracefully\r\n        unsafe {\r\n            let _ = CloseHandle(self.handle);\r\n        }\r\n    }\r\n}\r\n\r\nimpl tokio::io::AsyncRead for AsyncPipeReader {\r\n    fn poll_read(\r\n        self: std::pin::Pin\u003c\u0026mut Self\u003e,\r\n        cx: \u0026mut std::task::Context\u003c'_\u003e,\r\n        buf: \u0026mut tokio::io::ReadBuf\u003c'_\u003e,\r\n    ) -\u003e std::task::Poll\u003cstd::io::Result\u003c()\u003e\u003e {\r\n        // For Phase 1: Use spawn_blocking to avoid blocking tokio executor\r\n        // This is a pragmatic solution that works correctly with async/await\r\n        // TODO: Implement proper overlapped I/O with IOCP for production (Phase 2+)\r\n\r\n        use windows::Win32::Storage::FileSystem::ReadFile;\r\n\r\n        let handle = self.handle;\r\n\r\n        // SAFETY: We need raw access to the buffer for Windows ReadFile API\r\n        let buf_slice = unsafe {\r\n            let ptr = buf.unfilled_mut().as_mut_ptr();\r\n            let len = buf.unfilled_mut().len();\r\n            // Cast MaybeUninit\u003cu8\u003e to u8 for Windows API - ReadFile will initialize it\r\n            std::slice::from_raw_parts_mut(ptr as *mut u8, len)\r\n        };\r\n\r\n        // Attempt immediate read first (non-blocking check)\r\n        let mut bytes_read: u32 = 0;\r\n\r\n        // SAFETY: ReadFile is safe to call with valid handle and buffer\r\n        let result = unsafe { ReadFile(handle, Some(buf_slice), Some(\u0026mut bytes_read), None) };\r\n\r\n        match result {\r\n            Ok(_) if bytes_read \u003e 0 =\u003e {\r\n                unsafe { buf.assume_init(bytes_read as usize) };\r\n                buf.advance(bytes_read as usize);\r\n                std::task::Poll::Ready(Ok(()))\r\n            }\r\n            Ok(_) =\u003e {\r\n                // No data available yet, would block\r\n                // Return Pending without immediate wake to avoid spin loop\r\n                // The tokio runtime will re-poll when appropriate\r\n                // TODO Phase 2: Implement proper overlapped I/O with IOCP for production\r\n                std::task::Poll::Pending\r\n            }\r\n            Err(e) =\u003e {\r\n                let err_code = e.code().0;\r\n                // ERROR_NO_DATA (232) or ERROR_PIPE_NOT_CONNECTED (233) = pipe closing\r\n                if err_code == 232 || err_code == 233 {\r\n                    std::task::Poll::Ready(Ok(())) // EOF\r\n                } else {\r\n                    std::task::Poll::Ready(Err(std::io::Error::from_raw_os_error(err_code)))\r\n                }\r\n            }\r\n        }\r\n    }\r\n}\r\n\r\nimpl tokio::io::AsyncWrite for AsyncPipeWriter {\r\n    fn poll_write(\r\n        self: std::pin::Pin\u003c\u0026mut Self\u003e,\r\n        _cx: \u0026mut std::task::Context\u003c'_\u003e,\r\n        buf: \u0026[u8],\r\n    ) -\u003e std::task::Poll\u003cResult\u003cusize, std::io::Error\u003e\u003e {\r\n        use windows::Win32::Storage::FileSystem::WriteFile;\r\n\r\n        let handle = self.handle;\r\n        let mut bytes_written: u32 = 0;\r\n\r\n        // SAFETY: WriteFile is safe to call with valid handle and buffer\r\n        let result = unsafe { WriteFile(handle, Some(buf), Some(\u0026mut bytes_written), None) };\r\n\r\n        match result {\r\n            Ok(_) =\u003e std::task::Poll::Ready(Ok(bytes_written as usize)),\r\n            Err(e) =\u003e {\r\n                let err_code = e.code().0;\r\n                // ERROR_NO_DATA (232) or ERROR_PIPE_NOT_CONNECTED (233) = pipe closing\r\n                if err_code == 232 || err_code == 233 {\r\n                    std::task::Poll::Ready(Err(std::io::Error::new(\r\n                        std::io::ErrorKind::BrokenPipe,\r\n                        \"PTY pipe closed\"\r\n                    )))\r\n                } else {\r\n                    std::task::Poll::Ready(Err(std::io::Error::from_raw_os_error(err_code)))\r\n                }\r\n            }\r\n        }\r\n    }\r\n\r\n    fn poll_flush(\r\n        self: std::pin::Pin\u003c\u0026mut Self\u003e,\r\n        _cx: \u0026mut std::task::Context\u003c'_\u003e,\r\n    ) -\u003e std::task::Poll\u003cResult\u003c(), std::io::Error\u003e\u003e {\r\n        use windows::Win32::Storage::FileSystem::FlushFileBuffers;\r\n\r\n        // Explicitly flush to ensure low-latency input delivery\r\n        let result = unsafe { FlushFileBuffers(self.handle) };\r\n\r\n        match result {\r\n            Ok(_) =\u003e std::task::Poll::Ready(Ok(())),\r\n            Err(_) =\u003e {\r\n                // Flush failure is non-fatal for pipes, data is still written\r\n                std::task::Poll::Ready(Ok(()))\r\n            }\r\n        }\r\n    }\r\n\r\n    fn poll_shutdown(\r\n        self: std::pin::Pin\u003c\u0026mut Self\u003e,\r\n        _cx: \u0026mut std::task::Context\u003c'_\u003e,\r\n    ) -\u003e std::task::Poll\u003cResult\u003c(), std::io::Error\u003e\u003e {\r\n        // Flush before shutdown\r\n        self.poll_flush(_cx)\r\n    }\r\n}\r\n\r\n#[async_trait]\r\nimpl PtyBackend for ConPtyBackend {\r\n    async fn create(config: PtyConfig) -\u003e PtyResult\u003cSelf\u003e {\r\n        tracing::info!(\r\n            \"Creating ConPTY: shell={}, cwd={:?}, size={}x{}\",\r\n            config.shell,\r\n            config.working_dir,\r\n            config.cols,\r\n            config.rows\r\n        );\r\n\r\n        // Create pipes for ConPTY I/O\r\n        let (input_read, input_write) = create_pipe()?;\r\n        let (output_read, output_write) = create_pipe()?;\r\n\r\n        // Create pseudo-console\r\n        let coord = COORD {\r\n            X: config.cols as i16,\r\n            Y: config.rows as i16,\r\n        };\r\n\r\n        // SAFETY: CreatePseudoConsole is safe to call with valid handles and size.\r\n        // The handles are owned by us and will be properly managed.\r\n        // Note: API changed in windows crate 0.58+ - now returns HPCON directly\r\n        let hpc = unsafe {\r\n            CreatePseudoConsole(coord, input_read, output_write, 0).map_err(|e| {\r\n                PtyError::CreateFailed(format!(\"CreatePseudoConsole failed: {}\", e))\r\n            })?\r\n        };\r\n\r\n        // Spawn child process attached to ConPTY\r\n        let (process_handle, shell_pid) = spawn_process(\u0026hpc, \u0026config)?;\r\n\r\n        // NOTE: Do NOT manually close input_read/output_write!\r\n        // CreatePseudoConsole takes ownership of these handles.\r\n        // They will be automatically closed when ClosePseudoConsole is called in Drop.\r\n        // Manually closing them here causes double-close → heap corruption.\r\n\r\n        // Wrap pipe handles in async readers/writers\r\n        // SAFETY: We're wrapping valid pipe handles for async I/O\r\n        let output_reader = BufReader::with_capacity(\r\n            PTY_BUFFER_SIZE,\r\n            unsafe { AsyncPipeReader::from_handle(output_read) },\r\n        );\r\n\r\n        let input_writer = BufWriter::with_capacity(\r\n            PTY_BUFFER_SIZE,\r\n            unsafe { AsyncPipeWriter::from_handle(input_write) },\r\n        );\r\n\r\n        tracing::info!(\"ConPTY session created: pid={}\", shell_pid);\r\n\r\n        Ok(Self {\r\n            hpc: Some(hpc),\r\n            process_handle: Some(process_handle),\r\n            output_reader,\r\n            input_writer,\r\n            shell_pid,\r\n        })\r\n    }\r\n\r\n    async fn read(\u0026mut self, buf: \u0026mut [u8]) -\u003e std::io::Result\u003cusize\u003e {\r\n        self.output_reader.read(buf).await\r\n    }\r\n\r\n    async fn write(\u0026mut self, data: \u0026[u8]) -\u003e std::io::Result\u003c()\u003e {\r\n        self.input_writer.write_all(data).await?;\r\n        self.input_writer.flush().await\r\n    }\r\n\r\n    fn resize(\u0026mut self, rows: u16, cols: u16) -\u003e PtyResult\u003c()\u003e {\r\n        let coord = COORD {\r\n            X: cols as i16,\r\n            Y: rows as i16,\r\n        };\r\n\r\n        // Get hpc handle, error if already consumed by terminate()\r\n        let hpc = self.hpc.ok_or_else(|| {\r\n            PtyError::ResizeFailed(\"PTY already terminated\".to_string())\r\n        })?;\r\n\r\n        // SAFETY: ResizePseudoConsole is safe to call on a valid HPCON\r\n        unsafe {\r\n            ResizePseudoConsole(hpc, coord)\r\n                .map_err(|e| PtyError::ResizeFailed(e.to_string()))?;\r\n        }\r\n\r\n        tracing::debug!(\"Resized ConPTY to {}x{}\", cols, rows);\r\n        Ok(())\r\n    }\r\n\r\n    fn shell_pid(\u0026self) -\u003e u32 {\r\n        self.shell_pid\r\n    }\r\n\r\n    async fn terminate(mut self: Box\u003cSelf\u003e) -\u003e PtyResult\u003c()\u003e {\r\n        tracing::info!(\"Terminating ConPTY session: pid={}\", self.shell_pid);\r\n\r\n        // Take ownership of handles to prevent Drop from double-closing\r\n        let hpc = self.hpc.take();\r\n        let process_handle = self.process_handle.take();\r\n\r\n        if let (Some(hpc), Some(process_handle)) = (hpc, process_handle) {\r\n            // SAFETY: TerminateProcess is safe to call on a valid process handle\r\n            unsafe {\r\n                TerminateProcess(process_handle, 1).map_err(|e| {\r\n                    PtyError::CreateFailed(format!(\"TerminateProcess failed: {}\", e))\r\n                })?;\r\n\r\n                // Cleanup handles (now consumed, Drop won't run on them)\r\n                ClosePseudoConsole(hpc);\r\n                let _ = CloseHandle(process_handle);\r\n            }\r\n\r\n            tracing::info!(\"ConPTY session terminated: pid={}\", self.shell_pid);\r\n        } else {\r\n            tracing::warn!(\"ConPTY session already terminated: pid={}\", self.shell_pid);\r\n        }\r\n\r\n        Ok(())\r\n    }\r\n}\r\n\r\nimpl Drop for ConPtyBackend {\r\n    fn drop(\u0026mut self) {\r\n        tracing::debug!(\"Dropping ConPTY backend: pid={}\", self.shell_pid);\r\n\r\n        // Only close handles if they weren't consumed by terminate()\r\n        // This prevents double-close and race conditions with active ReadFile calls\r\n        if let (Some(hpc), Some(process_handle)) = (self.hpc.take(), self.process_handle.take()) {\r\n            tracing::debug!(\"Drop cleaning up ConPTY handles: pid={}\", self.shell_pid);\r\n\r\n            // SAFETY: Handles are valid and haven't been closed yet\r\n            unsafe {\r\n                ClosePseudoConsole(hpc);\r\n                let _ = CloseHandle(process_handle);\r\n            }\r\n        } else {\r\n            tracing::debug!(\"Drop: ConPTY handles already cleaned up (terminate() called): pid={}\", self.shell_pid);\r\n        }\r\n    }\r\n}\r\n\r\n// Helper method for test compatibility - boxes self and calls trait method\r\nimpl ConPtyBackend {\r\n    /// Terminate the PTY session (helper that boxes internally)\r\n    ///\r\n    /// This method allows calling terminate() on a bare ConPtyBackend instance\r\n    /// in tests, which internally boxes it and calls the PtyBackend trait method.\r\n    ///\r\n    /// Production code uses Box\u003cdyn PtyBackend\u003e and calls the trait method directly.\r\n    /// This shadows the trait method when called on concrete type.\r\n    #[allow(dead_code)] // Used in tests\r\n    pub async fn terminate(self) -\u003e PtyResult\u003c()\u003e {\r\n        Box::new(self).terminate().await\r\n    }\r\n}\r\n\r\n// ========== Helper Functions ==========\r\n\r\n/// Create a pipe for ConPTY I/O\r\nfn create_pipe() -\u003e PtyResult\u003c(HANDLE, HANDLE)\u003e {\r\n    let mut read_handle = HANDLE::default();\r\n    let mut write_handle = HANDLE::default();\r\n\r\n    // SAFETY: CreatePipe is safe to call with valid out-pointers.\r\n    // We pass None for security attributes (default) and 0 for buffer size (default).\r\n    unsafe {\r\n        CreatePipe(\u0026mut read_handle, \u0026mut write_handle, None, 0).map_err(|e| {\r\n            PtyError::CreateFailed(format!(\"CreatePipe failed: {}\", e))\r\n        })?;\r\n    }\r\n\r\n    Ok((read_handle, write_handle))\r\n}\r\n\r\n/// Convert Rust string to null-terminated wide string for Windows APIs\r\nfn to_wide_string(s: \u0026str) -\u003e Vec\u003cu16\u003e {\r\n    OsStr::new(s)\r\n        .encode_wide()\r\n        .chain(std::iter::once(0))\r\n        .collect()\r\n}\r\n\r\n/// Spawn child process attached to ConPTY\r\n///\r\n/// # Safety\r\n/// Uses CreateProcessW with EXTENDED_STARTUPINFO_PRESENT and properly\r\n/// initialized STARTUPINFOEX containing the ConPTY handle.\r\nfn spawn_process(hpc: \u0026HPCON, config: \u0026PtyConfig) -\u003e PtyResult\u003c(HANDLE, u32)\u003e {\r\n    let mut command_line = to_wide_string(\u0026config.shell);\r\n\r\n    let cwd = config\r\n        .working_dir\r\n        .to_str()\r\n        .ok_or_else(|| PtyError::InvalidConfig(\"Invalid working directory\".to_string()))?;\r\n    let cwd_wide = to_wide_string(cwd);\r\n\r\n    // Initialize STARTUPINFOEX\r\n    let mut startup_info: STARTUPINFOEXW = unsafe { std::mem::zeroed() };\r\n    startup_info.StartupInfo.cb = std::mem::size_of::\u003cSTARTUPINFOEXW\u003e() as u32;\r\n    startup_info.StartupInfo.dwFlags = STARTF_USESTDHANDLES;\r\n\r\n    // Determine required size for attribute list\r\n    let mut attr_size: usize = 0;\r\n    unsafe {\r\n        let _ = InitializeProcThreadAttributeList(\r\n            LPPROC_THREAD_ATTRIBUTE_LIST(ptr::null_mut()),\r\n            1,\r\n            0,\r\n            \u0026mut attr_size,\r\n        );\r\n    }\r\n\r\n    // Allocate and initialize attribute list\r\n    let mut attr_list_buffer: Vec\u003cu8\u003e = vec![0u8; attr_size];\r\n    let attr_list_ptr = LPPROC_THREAD_ATTRIBUTE_LIST(attr_list_buffer.as_mut_ptr() as *mut _);\r\n\r\n    unsafe {\r\n        InitializeProcThreadAttributeList(attr_list_ptr, 1, 0, \u0026mut attr_size).map_err(|e| {\r\n            PtyError::SpawnFailed(format!(\"InitializeProcThreadAttributeList failed: {}\", e))\r\n        })?;\r\n    }\r\n\r\n    startup_info.lpAttributeList = attr_list_ptr;\r\n\r\n    // Attach ConPTY to the attribute list\r\n    unsafe {\r\n        UpdateProcThreadAttribute(\r\n            attr_list_ptr,\r\n            0,\r\n            PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE as usize,\r\n            Some(hpc as *const _ as *const _),\r\n            std::mem::size_of::\u003cHPCON\u003e(),\r\n            None,\r\n            None,\r\n        )\r\n        .map_err(|e| PtyError::SpawnFailed(format!(\"UpdateProcThreadAttribute failed: {}\", e)))?;\r\n    }\r\n\r\n    // Create the process\r\n    let mut process_info: PROCESS_INFORMATION = unsafe { std::mem::zeroed() };\r\n\r\n    unsafe {\r\n        CreateProcessW(\r\n            None,\r\n            windows::core::PWSTR(command_line.as_mut_ptr()),\r\n            None,\r\n            None,\r\n            false,\r\n            EXTENDED_STARTUPINFO_PRESENT | CREATE_UNICODE_ENVIRONMENT,\r\n            None,\r\n            PCWSTR(cwd_wide.as_ptr()),\r\n            \u0026startup_info.StartupInfo,\r\n            \u0026mut process_info,\r\n        )\r\n        .map_err(|e| PtyError::SpawnFailed(format!(\"CreateProcessW failed: {}\", e)))?;\r\n    }\r\n\r\n    // Close thread handle (we don't need it)\r\n    unsafe {\r\n        let _ = CloseHandle(process_info.hThread);\r\n    }\r\n\r\n    Ok((process_info.hProcess, process_info.dwProcessId))\r\n}\r\n\r\n#[cfg(test)]\r\nmod tests {\r\n    use super::*;\r\n    use std::path::PathBuf;\r\n    use std::time::Duration;\r\n\r\n    #[tokio::test]\r\n    async fn test_create_conpty() {\r\n        let config = PtyConfig {\r\n            shell: \"cmd.exe\".to_string(),\r\n            working_dir: PathBuf::from(\"C:\\\\\"),\r\n            rows: 24,\r\n            cols: 80,\r\n            environment: Default::default(),\r\n        };\r\n\r\n        let backend = ConPtyBackend::create(config)\r\n            .await\r\n            .expect(\"Failed to create ConPTY\");\r\n\r\n        assert!(backend.shell_pid() \u003e 0);\r\n    }\r\n\r\n    #[tokio::test]\r\n    async fn test_create_powershell() {\r\n        let config = PtyConfig {\r\n            shell: \"powershell.exe\".to_string(),\r\n            working_dir: PathBuf::from(\"C:\\\\\"),\r\n            rows: 24,\r\n            cols: 80,\r\n            environment: Default::default(),\r\n        };\r\n\r\n        let backend = ConPtyBackend::create(config)\r\n            .await\r\n            .expect(\"Failed to create PowerShell ConPTY\");\r\n\r\n        assert!(backend.shell_pid() \u003e 0);\r\n\r\n        // Clean up\r\n        backend.terminate().await.ok();\r\n    }\r\n\r\n    #[tokio::test]\r\n    #[ignore = \"Known issue: AsyncPipeReader uses blocking ReadFile in poll_read, violates tokio async contract. See windows.rs PtyHandle for proper async architecture. TODO: Phase 2 - migrate to windows.rs or implement proper overlapped I/O\"]\r\n    async fn test_write_read() {\r\n        let config = PtyConfig {\r\n            shell: \"cmd.exe\".to_string(),\r\n            working_dir: PathBuf::from(\"C:\\\\\"),\r\n            rows: 24,\r\n            cols: 80,\r\n            environment: Default::default(),\r\n        };\r\n\r\n        let mut backend = ConPtyBackend::create(config)\r\n            .await\r\n            .expect(\"Failed to create ConPTY\");\r\n\r\n        // Write echo command\r\n        backend\r\n            .write(b\"echo hello\\r\\n\")\r\n            .await\r\n            .expect(\"Failed to write\");\r\n\r\n        // Read output\r\n        let mut found = false;\r\n        let mut buf = vec![0u8; 4096];\r\n\r\n        for _ in 0..20 {\r\n            tokio::time::sleep(Duration::from_millis(100)).await;\r\n\r\n            match backend.read(\u0026mut buf).await {\r\n                Ok(0) =\u003e break, // EOF\r\n                Ok(n) if n \u003e 0 =\u003e {\r\n                    let text = String::from_utf8_lossy(\u0026buf[..n]);\r\n                    tracing::debug!(\"Received: {}\", text);\r\n\r\n                    if text.contains(\"hello\") {\r\n                        found = true;\r\n                        break;\r\n                    }\r\n                }\r\n                Ok(_) =\u003e unreachable!(\"read returned non-zero but pattern didn't match\"),\r\n                Err(e) =\u003e {\r\n                    tracing::error!(\"Read error: {}\", e);\r\n                    break;\r\n                }\r\n            }\r\n        }\r\n\r\n        assert!(found, \"Expected 'hello' in output\");\r\n\r\n        // Clean up\r\n        backend.terminate().await.ok();\r\n    }\r\n\r\n    #[tokio::test]\r\n    async fn test_resize() {\r\n        let config = PtyConfig {\r\n            shell: \"cmd.exe\".to_string(),\r\n            working_dir: PathBuf::from(\"C:\\\\\"),\r\n            rows: 24,\r\n            cols: 80,\r\n            environment: Default::default(),\r\n        };\r\n\r\n        let mut backend = ConPtyBackend::create(config)\r\n            .await\r\n            .expect(\"Failed to create ConPTY\");\r\n\r\n        // Resize should not fail\r\n        backend.resize(30, 100).expect(\"Failed to resize\");\r\n        backend.resize(50, 120).expect(\"Failed to resize again\");\r\n\r\n        // Clean up\r\n        backend.terminate().await.ok();\r\n    }\r\n\r\n    #[tokio::test]\r\n    async fn test_terminate() {\r\n        let config = PtyConfig {\r\n            shell: \"cmd.exe\".to_string(),\r\n            working_dir: PathBuf::from(\"C:\\\\\"),\r\n            rows: 24,\r\n            cols: 80,\r\n            environment: Default::default(),\r\n        };\r\n\r\n        let backend = ConPtyBackend::create(config)\r\n            .await\r\n            .expect(\"Failed to create ConPTY\");\r\n\r\n        let pid = backend.shell_pid();\r\n        assert!(pid \u003e 0);\r\n\r\n        // Terminate should succeed\r\n        backend.terminate().await.expect(\"Failed to terminate\");\r\n    }\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","pty","error.rs"],"content":"// PTY Error Types\n// SRS Reference: §2.1.2 PTY Management [D1.2]\n\nuse std::io;\nuse thiserror::Error;\n\n/// Errors that can occur during PTY operations\n#[derive(Error, Debug)]\npub enum PtyError {\n    /// Failed to create the pseudo-console\n    #[error(\"Failed to create pseudo-console: {0}\")]\n    CreateFailed(String),\n\n    /// Failed to spawn the child process\n    #[error(\"Failed to spawn child process: {0}\")]\n    SpawnFailed(String),\n\n    /// Failed to resize the PTY\n    #[error(\"Failed to resize PTY: {0}\")]\n    ResizeFailed(String),\n\n    /// I/O error during read/write operations\n    #[error(\"PTY I/O error: {0}\")]\n    Io(#[from] io::Error),\n\n    /// The child process has already exited\n    #[error(\"Child process has exited\")]\n    ProcessExited,\n\n    /// The PTY session is already closed\n    #[error(\"PTY session is already closed\")]\n    AlreadyClosed,\n\n    /// Invalid configuration\n    #[error(\"Invalid PTY configuration: {0}\")]\n    InvalidConfig(String),\n\n    /// Platform-specific error\n    #[cfg(windows)]\n    #[error(\"Windows API error: {0}\")]\n    WindowsApi(#[from] windows::core::Error),\n\n    /// Timeout waiting for process operation\n    #[error(\"Timeout waiting for process: {0}\")]\n    Timeout(String),\n\n    /// PTY disconnected (channel closed)\n    #[error(\"PTY disconnected\")]\n    Disconnected,\n}\n\n/// Result type for PTY operations\npub type PtyResult\u003cT\u003e = Result\u003cT, PtyError\u003e;\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","pty","mod.rs"],"content":"// PTY (Pseudo-Terminal) Management\n// Platform-specific implementations for terminal session management\n//\n// SRS Reference: §2.1.2 PTY Management [D1.2]\n// Architecture: Trait-based design for cross-platform support (finalized per rust-backend-lead)\n//\n// Phase 1: Windows ConPTY (§2.1.2.3 [D1.2.3])\n// Phase 3: Linux posix_openpt (§2.1.2.1 [D1.2.1])\n// Phase 3: macOS openpty BSD (§2.1.2.2 [D1.2.2])\n\npub mod error;\n\n#[cfg(windows)]\npub mod conpty;\n\n#[cfg(windows)]\npub use conpty::ConPtyBackend;\n\n// Export PtyResult for test access (per rust-backend-lead guidance)\npub use error::PtyResult;\n\n#[cfg(test)]\nmod tests;\n\nuse async_trait::async_trait;\nuse std::collections::HashMap;\nuse std::io;\nuse std::path::PathBuf;\n\n/// PTY configuration for creating new sessions\n#[derive(Debug, Clone)]\npub struct PtyConfig {\n    /// Terminal rows\n    pub rows: u16,\n    /// Terminal columns\n    pub cols: u16,\n    /// Shell executable path (e.g., \"powershell.exe\", \"bash\")\n    pub shell: String,\n    /// Working directory for the shell process\n    pub working_dir: PathBuf,\n    /// Environment variables for the shell process\n    pub environment: HashMap\u003cString, String\u003e,\n}\n\nimpl Default for PtyConfig {\n    fn default() -\u003e Self {\n        Self {\n            rows: 24,\n            cols: 80,\n            shell: Self::default_shell(),\n            working_dir: std::env::current_dir().unwrap_or_else(|_| PathBuf::from(\".\")),\n            environment: HashMap::new(),\n        }\n    }\n}\n\nimpl PtyConfig {\n    /// Get the default shell for the current platform\n    #[cfg(windows)]\n    fn default_shell() -\u003e String {\n        \"powershell.exe\".to_string()\n    }\n\n    #[cfg(not(windows))]\n    fn default_shell() -\u003e String {\n        \"/bin/bash\".to_string()\n    }\n}\n\n/// Platform-agnostic PTY backend trait\n///\n/// Session Manager uses this trait via `Box\u003cdyn PtyBackend\u003e` for dynamic dispatch.\n/// Phase 1: ConPtyBackend (Windows)\n/// Phase 3: UnixPtyBackend (Linux/macOS)\n#[async_trait]\npub trait PtyBackend: Send + Sync {\n    /// Create a new PTY session with the given configuration\n    async fn create(config: PtyConfig) -\u003e PtyResult\u003cSelf\u003e\n    where\n        Self: Sized;\n\n    /// Read output from the PTY (non-blocking)\n    ///\n    /// Returns the number of bytes read into the buffer.\n    /// Returns Ok(0) when EOF (process terminated).\n    async fn read(\u0026mut self, buf: \u0026mut [u8]) -\u003e io::Result\u003cusize\u003e;\n\n    /// Write input to the PTY\n    ///\n    /// Flushes immediately for low-latency input.\n    async fn write(\u0026mut self, data: \u0026[u8]) -\u003e io::Result\u003c()\u003e;\n\n    /// Resize the PTY to new dimensions\n    fn resize(\u0026mut self, rows: u16, cols: u16) -\u003e PtyResult\u003c()\u003e;\n\n    /// Get the shell process ID\n    fn shell_pid(\u0026self) -\u003e u32;\n\n    /// Terminate the PTY session (kill process and cleanup)\n    /// Takes Box\u003cSelf\u003e to support dynamic dispatch with trait objects\n    async fn terminate(self: Box\u003cSelf\u003e) -\u003e PtyResult\u003c()\u003e;\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","pty","tests.rs"],"content":"// Property-based tests for PTY state transitions and edge cases\n// Uses proptest for comprehensive testing per SRS requirements\n\n#[cfg(test)]\nmod property_tests {\n    use super::super::*;\n    use proptest::prelude::*;\n    use std::path::PathBuf;\n    use std::time::Duration;\n\n    /// Generate valid terminal dimensions\n    fn terminal_dimensions() -\u003e impl Strategy\u003cValue = (u16, u16)\u003e {\n        (10u16..=200, 20u16..=300)\n    }\n\n    /// Generate valid working directories\n    fn working_dir() -\u003e impl Strategy\u003cValue = PathBuf\u003e {\n        prop::collection::vec(\"[a-zA-Z0-9_-]{1,10}\", 0..3)\n            .prop_map(|parts| {\n                if parts.is_empty() {\n                    PathBuf::from(\"C:\\\\\")\n                } else {\n                    PathBuf::from(\"C:\\\\\").join(parts.join(\"\\\\\"))\n                }\n            })\n    }\n\n    proptest! {\n        #![proptest_config(ProptestConfig {\n            cases: 10,  // Reduce from default 256 to 10 cases\n            max_shrink_iters: 100,\n            timeout: 5000,  // 5 second timeout per test case\n            ..ProptestConfig::default()\n        })]\n\n        #[test]\n        #[ignore = \"Blanket exclusion of tests.rs module due to AsyncPipeReader/Writer blocking I/O. Phase 2: migrate to windows.rs PtyHandle\"]\n        fn test_create_with_any_valid_dimensions(\n            (rows, cols) in terminal_dimensions()\n        ) {\n            let rt = tokio::runtime::Runtime::new().unwrap();\n            let result = rt.block_on(async {\n                let config = PtyConfig {\n                    shell: \"cmd.exe\".to_string(),\n                    working_dir: PathBuf::from(\"C:\\\\\"),\n                    rows,\n                    cols,\n                    environment: Default::default(),\n                };\n\n                // Add timeout to prevent hangs\n                let create_result = tokio::time::timeout(\n                    Duration::from_secs(3),\n                    ConPtyBackend::create(config)\n                ).await;\n\n                match create_result {\n                    Ok(Ok(pty)) =\u003e {\n                        prop_assert!(pty.shell_pid() \u003e 0);\n                        pty.terminate().await.ok();\n                        Ok(())\n                    }\n                    Ok(Err(e)) =\u003e {\n                        prop_assert!(false, \"Failed to create PTY with {}x{}: {:?}\", rows, cols, e);\n                        Ok(())\n                    }\n                    Err(_) =\u003e {\n                        prop_assert!(false, \"PTY creation timed out for {}x{}\", rows, cols);\n                        Ok(())\n                    }\n                }\n            });\n            result?\n        }\n\n        #[test]\n        #[ignore = \"AsyncPipeReader/Writer use blocking I/O in poll functions, violates tokio async contract. Phase 2: migrate to windows.rs PtyHandle\"]\n        fn test_resize_maintains_pty_validity(\n            initial in terminal_dimensions(),\n            new_size in terminal_dimensions()\n        ) {\n            let rt = tokio::runtime::Runtime::new().unwrap();\n            let result = rt.block_on(async {\n                let config = PtyConfig {\n                    shell: \"cmd.exe\".to_string(),\n                    working_dir: PathBuf::from(\"C:\\\\\"),\n                    rows: initial.0,\n                    cols: initial.1,\n                    environment: Default::default(),\n                };\n\n                // Add timeout to PTY creation\n                let pty_result = tokio::time::timeout(\n                    Duration::from_secs(3),\n                    ConPtyBackend::create(config)\n                ).await;\n\n                let mut pty = match pty_result {\n                    Ok(Ok(p)) =\u003e p,\n                    Ok(Err(e)) =\u003e {\n                        prop_assert!(false, \"Failed to create PTY: {:?}\", e);\n                        return Ok(());\n                    }\n                    Err(_) =\u003e {\n                        prop_assert!(false, \"PTY creation timed out\");\n                        return Ok(());\n                    }\n                };\n\n                // Resize should succeed\n                let resize_result = pty.resize(new_size.0, new_size.1);\n                prop_assert!(resize_result.is_ok(), \"Resize failed: {:?}\", resize_result);\n\n                // PTY should still be usable after resize (don't read, just verify resize works)\n                pty.write(b\"echo test\\r\\n\").await.ok();\n\n                pty.terminate().await.ok();\n                Ok(())\n            });\n            result?\n        }\n    }\n\n    #[tokio::test]\n    #[ignore = \"Known issue: AsyncPipeReader uses blocking ReadFile in poll_read, viol
