\u0026self.window {\n            window.request_redraw();\n        }\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","monomind-bridge","src","dashboard.rs"],"content":"// Week 4 Implementation: Embedded Dashboard (§2.4.2)\n//\n// Core functionality:\n// - get_org_status: Query org runtime state\n// - get_agent_status: Query active agents\n// - get_run_history: Query recent org runs\n// - get_memory_stats: Query knowledge graph and memory stats\n//\n// Design principle: Fail loud, not silent (prevent monoes/monomind#135, #136)\n// All dashboard data is fetched via authenticated WebSocket using the same JWT\n// as the terminal session - no separate ports or credentials.\n\nuse anyhow::{Context, Result};\nuse serde::{Deserialize, Serialize};\nuse std::path::Path;\nuse std::process::Command;\nuse std::time::SystemTime;\n\n/// Dashboard data aggregating all monomind status\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]\npub struct DashboardData {\n    /// Org runtime status\n    pub org_status: OrgStatus,\n    /// Active agents list\n    pub agents: Vec\u003cAgentInfo\u003e,\n    /// Recent run history\n    pub runs: Vec\u003cRunInfo\u003e,\n    /// Memory and knowledge graph statistics\n    pub memory_stats: MemoryStats,\n    /// Timestamp of data fetch\n    pub timestamp: SystemTime,\n}\n\nimpl DashboardData {\n    /// Create an empty dashboard (no monomind detected)\n    pub fn empty() -\u003e Self {\n        Self {\n            org_status: OrgStatus::not_configured(),\n            agents: vec![],\n            runs: vec![],\n            memory_stats: MemoryStats::empty(),\n            timestamp: SystemTime::now(),\n        }\n    }\n}\n\n/// Org runtime status from `monomind org status`\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]\npub struct OrgStatus {\n    /// Whether an org is currently running\n    pub running: bool,\n    /// Org name (if running)\n    pub name: Option\u003cString\u003e,\n    /// Current run ID (if running)\n    pub run_id: Option\u003cString\u003e,\n    /// Number of active agents in the org\n    pub active_agents: u32,\n    /// Number of pending tasks\n    pub pending_tasks: u32,\n    /// Current status message\n    pub status_message: String,\n}\n\nimpl OrgStatus {\n    /// Create status indicating no org is configured\n    pub fn not_configured() -\u003e Self {\n        Self {\n            running: false,\n            name: None,\n            run_id: None,\n            active_agents: 0,\n            pending_tasks: 0,\n            status_message: \"No org configured\".to_string(),\n        }\n    }\n\n    /// Create status indicating org is running\n    pub fn running(name: String, run_id: String, agents: u32, tasks: u32) -\u003e Self {\n        Self {\n            running: true,\n            name: Some(name),\n            run_id: Some(run_id),\n            active_agents: agents,\n            pending_tasks: tasks,\n            status_message: \"Org running\".to_string(),\n        }\n    }\n}\n\n/// Individual agent information from `monomind agent list`\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]\npub struct AgentInfo {\n    /// Agent ID\n    pub id: String,\n    /// Agent type/role\n    pub agent_type: String,\n    /// Current status (running, idle, stopped)\n    pub status: String,\n    /// Number of tasks completed\n    pub tasks_completed: u32,\n    /// Uptime in seconds\n    pub uptime_secs: u64,\n}\n\n/// Run history entry from `monomind org report`\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]\npub struct RunInfo {\n    /// Run ID\n    pub id: String,\n    /// Org name\n    pub org_name: String,\n    /// Start timestamp\n    pub started_at: String,\n    /// End timestamp (if completed)\n    pub ended_at: Option\u003cString\u003e,\n    /// Outcome (success, failure, cancelled)\n    pub outcome: String,\n    /// Total tokens consumed\n    pub tokens: u64,\n}\n\n/// Memory and knowledge graph statistics\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]\npub struct MemoryStats {\n    /// Total number of memory entries\n    pub total_entries: u64,\n    /// Number of knowledge graph nodes\n    pub kg_nodes: u64,\n    /// Number of knowledge graph edges\n    pub kg_edges: u64,\n    /// Size of memory database in bytes\n    pub db_size_bytes: u64,\n}\n\nimpl MemoryStats {\n    /// Create empty stats (no data)\n    pub fn empty() -\u003e Self {\n        Self {\n            total_entries: 0,\n            kg_nodes: 0,\n            kg_edges: 0,\n            db_size_bytes: 0,\n        }\n    }\n}\n\n/// Get comprehensive dashboard data\n///\n/// Executes multiple monomind CLI commands to gather org status, agent list,\n/// run history, and memory stats. Returns aggregated dashboard data.\n///\n/// # Design: Fail Loud, Not Silent\n///\n/// Each command failure is logged but does not fail the entire operation.\n/// Missing data is represented as empty/default values, but the dashboard\n/// always returns a result.\n///\n/// # Arguments\n///\n/// * `project_dir` - Project root directory containing .monomind/\n///\n/// # Returns\n///\n/// * `Ok(DashboardData)` - Aggregated dashboard data (may be partial on errors)\n/// * `Err(_)` - Only on catastrophic failures (permission denied, etc.)\n///\n/// # Examples\n///\n/// ```no_run\n/// use monoterminal_monomind_bridge::get_dashboard_data;\n/// use std::path::Path;\n///\n/// # tokio_test::block_on(async {\n/// let data = get_dashboard_data(Path::new(\"/project\")).await?;\n/// println!(\"Org running: {}\", data.org_status.running);\n/// println!(\"Active agents: {}\", data.agents.len());\n/// # Ok::\u003c(), anyhow::Error\u003e(())\n/// # })\n/// ```\npub async fn get_dashboard_data(project_dir: \u0026Path) -\u003e Result\u003cDashboardData\u003e {\n    tracing::debug!(\n        path = %project_dir.display(),\n        \"Fetching monomind dashboard data\"\n    );\n\n    // Fetch all data sources concurrently\n    let (org_status, agents, runs, memory_stats) = tokio::join!(\n        get_org_status(project_dir),\n        get_agent_list(project_dir),\n        get_run_history(project_dir),\n        get_memory_stats(project_dir),\n    );\n\n    Ok(DashboardData {\n        org_status: org_status.unwrap_or_else(|e| {\n            tracing::warn!(\"Failed to get org status: {}\", e);\n            OrgStatus::not_configured()\n        }),\n        agents: agents.unwrap_or_else(|e| {\n            tracing::warn!(\"Failed to get agent list: {}\", e);\n            vec![]\n        }),\n        runs: runs.unwrap_or_else(|e| {\n            tracing::warn!(\"Failed to get run history: {}\", e);\n            vec![]\n        }),\n        memory_stats: memory_stats.unwrap_or_else(|e| {\n            tracing::warn!(\"Failed to get memory stats: {}\", e);\n            MemoryStats::empty()\n        }),\n        timestamp: SystemTime::now(),\n    })\n}\n\n/// Get org runtime status\n///\n/// Executes `npx monomind@latest org status --json`\nasync fn get_org_status(project_dir: \u0026Path) -\u003e Result\u003cOrgStatus\u003e {\n    let output = tokio::task::spawn_blocking({\n        let project_dir = project_dir.to_path_buf();\n        move || {\n            Command::new(\"npx\")\n                .arg(\"monomind@latest\")\n                .arg(\"org\")\n                .arg(\"status\")\n                .arg(\"--json\")\n                .current_dir(\u0026project_dir)\n                .output()\n        }\n    })\n    .await\n    .context(\"Task join failed\")?\n    .context(\"Failed to execute org status command\")?;\n\n    if !output.status.success() {\n        return Ok(OrgStatus::not_configured());\n    }\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n\n    // Parse JSON output\n    // For now, return a basic parse - this will be refined based on actual CLI output\n    #[derive(Deserialize)]\n    struct OrgStatusJson {\n        running: Option\u003cbool\u003e,\n        name: Option\u003cString\u003e,\n        run_id: Option\u003cString\u003e,\n        active_agents: Option\u003cu32\u003e,\n        pending_tasks: Option\u003cu32\u003e,\n    }\n\n    match serde_json::from_str::\u003cOrgStatusJson\u003e(\u0026stdout) {\n        Ok(status) =\u003e Ok(OrgStatus {\n            running: status.running.unwrap_or(false),\n            name: status.name,\n            run_id: status.run_id,\n            active_agents: status.active_agents.unwrap_or(0),\n            pending_tasks: status.pending_tasks.unwrap_or(0),\n            status_message: if status.running.unwrap_or(false) {\n                \"Org running\".to_string()\n            } else {\n                \"No org running\".to_string()\n            },\n        }),\n        Err(e) =\u003e {\n            tracing::debug!(\"Failed to parse org status JSON: {}. Raw output: {}\", e, stdout);\n            Ok(OrgStatus::not_configured())\n        }\n    }\n}\n\n/// Get active agent list\n///\n/// Executes `npx monomind@latest agent list --json`\nasync fn get_agent_list(project_dir: \u0026Path) -\u003e Result\u003cVec\u003cAgentInfo\u003e\u003e {\n    let output = tokio::task::spawn_blocking({\n        let project_dir = project_dir.to_path_buf();\n        move || {\n            Command::new(\"npx\")\n                .arg(\"monomind@latest\")\n                .arg(\"agent\")\n                .arg(\"list\")\n                .arg(\"--json\")\n                .current_dir(\u0026project_dir)\n                .output()\n        }\n    })\n    .await\n    .context(\"Task join failed\")?\n    .context(\"Failed to execute agent list command\")?;\n\n    if !output.status.success() {\n        return Ok(vec![]);\n    }\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n\n    // Parse JSON array of agents\n    #[derive(Deserialize)]\n    struct AgentJson {\n        id: String,\n        #[serde(rename = \"type\")]\n        agent_type: Option\u003cString\u003e,\n        status: Option\u003cString\u003e,\n        tasks_completed: Option\u003cu32\u003e,\n        uptime_secs: Option\u003cu64\u003e,\n    }\n\n    match serde_json::from_str::\u003cVec\u003cAgentJson\u003e\u003e(\u0026stdout) {\n        Ok(agents) =\u003e Ok(agents\n            .into_iter()\n            .map(|a| AgentInfo {\n                id: a.id,\n                agent_type: a.agent_type.unwrap_or_else(|| \"unknown\".to_string()),\n                status: a.status.unwrap_or_else(|| \"unknown\".to_string()),\n                tasks_completed: a.tasks_completed.unwrap_or(0),\n                uptime_secs: a.uptime_secs.unwrap_or(0),\n            })\n            .collect()),\n        Err(e) =\u003e {\n            tracing::debug!(\"Failed to parse agent list JSON: {}. Raw output: {}\", e, stdout);\n            Ok(vec![])\n        }\n    }\n}\n\n/// Get run history\n///\n/// Executes `npx monomind@latest org report --json` for recent runs\nasync fn get_run_history(project_dir: \u0026Path) -\u003e Result\u003cVec\u003cRunInfo\u003e\u003e {\n    let output = tokio::task::spawn_blocking({\n        let project_dir = project_dir.to_path_buf();\n        move || {\n            Command::new(\"npx\")\n                .arg(\"monomind@latest\")\n                .arg(\"org\")\n                .arg(\"report\")\n                .arg(\"--json\")\n                .arg(\"--limit\")\n                .arg(\"10\") // Last 10 runs\n                .current_dir(\u0026project_dir)\n                .output()\n        }\n    })\n    .await\n    .context(\"Task join failed\")?\n    .context(\"Failed to execute org report command\")?;\n\n    if !output.status.success() {\n        return Ok(vec![]);\n    }\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n\n    // Parse JSON array of runs\n    #[derive(Deserialize)]\n    struct RunJson {\n        id: String,\n        org_name: Option\u003cString\u003e,\n        started_at: String,\n        ended_at: Option\u003cString\u003e,\n        outcome: Option\u003cString\u003e,\n        tokens: Option\u003cu64\u003e,\n    }\n\n    match serde_json::from_str::\u003cVec\u003cRunJson\u003e\u003e(\u0026stdout) {\n        Ok(runs) =\u003e Ok(runs\n            .into_iter()\n            .map(|r| RunInfo {\n                id: r.id,\n                org_name: r.org_name.unwrap_or_else(|| \"unknown\".to_string()),\n                started_at: r.started_at,\n                ended_at: r.ended_at,\n                outcome: r.outcome.unwrap_or_else(|| \"unknown\".to_string()),\n                tokens: r.tokens.unwrap_or(0),\n            })\n            .collect()),\n        Err(e) =\u003e {\n            tracing::debug!(\"Failed to parse run history JSON: {}. Raw output: {}\", e, stdout);\n            Ok(vec![])\n        }\n    }\n}\n\n/// Get memory and knowledge graph statistics\n///\n/// Executes `npx monomind@latest status memory --json`\nasync fn get_memory_stats(project_dir: \u0026Path) -\u003e Result\u003cMemoryStats\u003e {\n    let output = tokio::task::spawn_blocking({\n        let project_dir = project_dir.to_path_buf();\n        move || {\n            Command::new(\"npx\")\n                .arg(\"monomind@latest\")\n                .arg(\"status\")\n                .arg(\"memory\")\n                .arg(\"--json\")\n                .current_dir(\u0026project_dir)\n                .output()\n        }\n    })\n    .await\n    .context(\"Task join failed\")?\n    .context(\"Failed to execute status memory command\")?;\n\n    if !output.status.success() {\n        return Ok(MemoryStats::empty());\n    }\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n\n    // Parse JSON stats\n    #[derive(Deserialize)]\n    struct MemoryStatsJson {\n        total_entries: Option\u003cu64\u003e,\n        kg_nodes: Option\u003cu64\u003e,\n        kg_edges: Option\u003cu64\u003e,\n        db_size_bytes: Option\u003cu64\u003e,\n    }\n\n    match serde_json::from_str::\u003cMemoryStatsJson\u003e(\u0026stdout) {\n        Ok(stats) =\u003e Ok(MemoryStats {\n            total_entries: stats.total_entries.unwrap_or(0),\n            kg_nodes: stats.kg_nodes.unwrap_or(0),\n            kg_edges: stats.kg_edges.unwrap_or(0),\n            db_size_bytes: stats.db_size_bytes.unwrap_or(0),\n        }),\n        Err(e) =\u003e {\n            tracing::debug!(\"Failed to parse memory stats JSON: {}. Raw output: {}\", e, stdout);\n            Ok(MemoryStats::empty())\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_org_status_not_configured() {\n        let status = OrgStatus::not_configured();\n        assert!(!status.running);\n        assert_eq!(status.name, None);\n        assert_eq!(status.active_agents, 0);\n    }\n\n    #[test]\n    fn test_org_status_running() {\n        let status = OrgStatus::running(\n            \"test-org\".to_string(),\n            \"run-123\".to_string(),\n            5,\n            10,\n        );\n        assert!(status.running);\n        assert_eq!(status.name, Some(\"test-org\".to_string()));\n        assert_eq!(status.run_id, Some(\"run-123\".to_string()));\n        assert_eq!(status.active_agents, 5);\n        assert_eq!(status.pending_tasks, 10);\n    }\n\n    #[test]\n    fn test_memory_stats_empty() {\n        let stats = MemoryStats::empty();\n        assert_eq!(stats.total_entries, 0);\n        assert_eq!(stats.kg_nodes, 0);\n        assert_eq!(stats.kg_edges, 0);\n        assert_eq!(stats.db_size_bytes, 0);\n    }\n\n    #[test]\n    fn test_dashboard_data_empty() {\n        let data = DashboardData::empty();\n        assert!(!data.org_status.running);\n        assert_eq!(data.agents.len(), 0);\n        assert_eq!(data.runs.len(), 0);\n        assert_eq!(data.memory_stats.total_entries, 0);\n    }\n\n    #[test]\n    fn test_agent_info_serialization() {\n        let agent = AgentInfo {\n            id: \"agent-001\".to_string(),\n            agent_type: \"coder\".to_string(),\n            status: \"running\".to_string(),\n            tasks_completed: 42,\n            uptime_secs: 3600,\n        };\n\n        let json = serde_json::to_string(\u0026agent).unwrap();\n        let deserialized: AgentInfo = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(agent, deserialized);\n    }\n\n    #[test]\n    fn test_run_info_serialization() {\n        let run = RunInfo {\n            id: \"run-123\".to_string(),\n            org_name: \"test-org\".to_string(),\n            started_at: \"2026-08-15T10:00:00Z\".to_string(),\n            ended_at: Some(\"2026-08-15T11:00:00Z\".to_string()),\n            outcome: \"success\".to_string(),\n            tokens: 100000,\n        };\n\n        let json = serde_json::to_string(\u0026run).unwrap();\n        let deserialized: RunInfo = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(run, deserialized);\n    }\n}\n","traces":[{"line":36,"address":[],"length":0,"stats":{"Line":288230376151711744}},{"line":38,"address":[],"length":0,"stats":{"Line":576460752303423488}},{"line":39,"address":[],"length":0,"stats":{"Line":576460752303423488}},{"line":40,"address":[],"length":0,"stats":{"Line":576460752303423488}},{"line":41,"address":[],"length":0,"stats":{"Line":288230376151711744}},{"line":42,"address":[],"length":0,"stats":{"Line":288230376151711744}},{"line":66,"address":[],"length":0,"stats":{"Line":2017612633061982208}},{"line":73,"address":[],"length":0,"stats":{"Line":2017612633061982208}},{"line":78,"address":[],"length":0,"stats":{"Line":720575940379279360}},{"line":81,"address":[],"length":0,"stats":{"Line":1441151880758558720}},{"line":82,"address":[],"length":0,"stats":{"Line":1441151880758558720}},{"line":85,"address":[],"length":0,"stats":{"Line":720575940379279360}},{"line":137,"address":[],"length":0,"stats":{"Line":2017612633061982208}},{"line":180,"address":[],"length":0,"stats":{"Line":1152921504606846976}},{"line":181,"address":[],"length":0,"stats":{"Line":0}},{"line":182,"address":[]," xt, Result};\nuse std::path::{Path, PathBuf};\n\n/// Walk upward from a starting directory to find .monomind/\n///\n/// Searches from the given path upward through parent directories until:\n/// - A .monomind/ directory is found → returns Some(project_root)\n/// - A .monomind-suggest-dismissed file is found → returns None\n/// - The filesystem root is reached → returns None\n///\n/// # Arguments\n///\n/// * `start` - Starting directory path (typically PTY cwd)\n///\n/// # Returns\n///\n/// * `Ok(Some(path))` - Found .monomind/ at path\n/// * `Ok(None)` - Not found or dismissed\n/// * `Err(_)` - Filesystem error (permission denied, etc.)\n///\n/// # Examples\n///\n/// ```no_run\n/// use monoterminal_monomind_bridge::walk_to_monomind;\n/// use std::path::Path;\n///\n/// let result = walk_to_monomind(Path::new(\"/project/src/deep\"))?;\n/// match result {\n///     Some(root) =\u003e println!(\"Found .monomind at: {}\", root.display()),\n///     None =\u003e println!(\"No .monomind found\"),\n/// }\n/// # Ok::\u003c(), anyhow::Error\u003e(())\n/// ```\npub fn walk_to_monomind(start: \u0026Path) -\u003e Result\u003cOption\u003cPathBuf\u003e\u003e {\n    let mut current = start\n        .canonicalize()\n        .context(\"Failed to canonicalize starting path\")?;\n\n    loop {\n        // Check for .monomind/ directory\n        let monomind_dir = current.join(\".monomind\");\n        if monomind_dir.exists() \u0026\u0026 monomind_dir.is_dir() {\n            tracing::debug!(\n                path = %current.display(),\n                \"Found .monomind directory\"\n            );\n            return Ok(Some(current));\n        }\n\n        // Check for dismiss marker - if present, stop searching\n        let dismiss_marker = current.join(\".monomind-suggest-dismissed\");\n        if dismiss_marker.exists() {\n            tracing::debug!(\n                path = %current.display(),\n                \"Found .monomind-suggest-dismissed marker\"\n            );\n            return Ok(None);\n        }\n\n        // Walk up to parent directory\n        match current.parent() {\n            Some(parent) =\u003e current = parent.to_path_buf(),\n            None =\u003e {\n                // Reached filesystem root without finding .monomind\n                tracing::trace!(\"Reached filesystem root, no .monomind found\");\n                return Ok(None);\n            }\n        }\n    }\n}\n\n/// Check if install suggestion should be shown\n///\n/// Returns true if:\n/// - No .monomind/ directory exists in the tree\n/// - No .monomind-suggest-dismissed marker exists\n///\n/// This is a simpler check than walk_to_monomind - it only looks at the\n/// immediate directory, not the entire tree. Use this when you've already\n/// walked the tree and want to check the current level.\n///\n/// # Arguments\n///\n/// * `path` - Directory to check (typically project root or cwd)\n///\n/// # Returns\n///\n/// * `true` - Should suggest installation\n/// * `false` - Should not suggest (already installed or dismissed)\npub fn should_suggest_install(path: \u0026Path) -\u003e bool {\n    let monomind_dir = path.join(\".monomind\");\n    let dismiss_file = path.join(\".monomind-suggest-dismissed\");\n\n    !monomind_dir.exists() \u0026\u0026 !dismiss_file.exists()\n}\n\n/// Dismiss the install suggestion for a project\n///\n/// Creates a .monomind-suggest-dismissed marker file in the given directory.\n/// This prevents the install suggestion from appearing again for this project.\n///\n/// The marker is a simple empty file that signals \"user has seen and dismissed\n/// the suggestion for this specific project.\"\n///\n/// # Arguments\n///\n/// * `project_root` - Project root directory\n///\n/// # Returns\n///\n/// * `Ok(())` - Marker created successfully\n/// * `Err(_)` - Failed to create marker (permission denied, etc.)\n///\n/// # Examples\n///\n/// ```no_run\n/// use monoterminal_monomind_bridge::dismiss_suggestion;\n/// use std::path::Path;\n///\n/// dismiss_suggestion(Path::new(\"/project\"))?;\n/// # Ok::\u003c(), anyhow::Error\u003e(())\n/// ```\npub fn dismiss_suggestion(project_root: \u0026Path) -\u003e Result\u003c()\u003e {\n    let dismiss_file = project_root.join(\".monomind-suggest-dismissed\");\n\n    std::fs::write(\u0026dismiss_file, \"\")\n        .context(\"Failed to create .monomind-suggest-dismissed marker\")?;\n\n    tracing::info!(\n        path = %project_root.display(),\n        \"Created .monomind-suggest-dismissed marker\"\n    );\n\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use tempfile::TempDir;\n\n    /// Normalize paths for comparison on Windows\n    /// Strips UNC prefix (\\\\?\\) that canonicalize() adds on Windows\n    #[cfg(windows)]\n    fn normalize_path(path: \u0026Path) -\u003e PathBuf {\n        let path_str = path.to_string_lossy();\n        if let Some(stripped) = path_str.strip_prefix(r\"\\\\?\\\") {\n            PathBuf::from(stripped)\n        } else {\n            path.to_path_buf()\n        }\n    }\n\n    #[cfg(not(windows))]\n    fn normalize_path(path: \u0026Path) -\u003e PathBuf {\n        path.to_path_buf()\n    }\n\n    #[test]\n    fn test_walk_to_monomind_found_at_root() {\n        let temp = TempDir::new().unwrap();\n        let project = temp.path().join(\"project\");\n        fs::create_dir_all(\u0026project).unwrap();\n        fs::create_dir(project.join(\".monomind\")).unwrap();\n\n        let result = walk_to_monomind(\u0026project).unwrap();\n\n        assert_eq!(\n            result.as_ref().map(|p| normalize_path(p)),\n            Some(normalize_path(\u0026project))\n        );\n    }\n\n    #[test]\n    fn test_walk_to_monomind_found_in_parent() {\n        let temp = TempDir::new().unwrap();\n        let project = temp.path().join(\"project\");\n        let nested = project.join(\"src\").join(\"deep\").join(\"nested\");\n        fs::create_dir_all(\u0026nested).unwrap();\n        fs::create_dir(project.join(\".monomind\")).unwrap();\n\n        let result = walk_to_monomind(\u0026nested).unwrap();\n\n        assert_eq!(\n            result.as_ref().map(|p| normalize_path(p)),\n            Some(normalize_path(\u0026project))\n        );\n    }\n\n    #[test]\n    fn test_walk_to_monomind_not_found() {\n        let temp = TempDir::new().unwrap();\n        // Create dismiss marker at temp root to prevent finding parent .monomind\n        fs::write(temp.path().join(\".monomind-suggest-dismissed\"), \"\").unwrap();\n        let project = temp.path().join(\"project\");\n        fs::create_dir_all(\u0026project).unwrap();\n\n        let result = walk_to_monomind(\u0026project).unwrap();\n\n        assert_eq!(result, None);\n    }\n\n    #[test]\n    fn test_walk_to_monomind_dismissed() {\n        let temp = TempDir::new().unwrap();\n        let project = temp.path().join(\"project\");\n        let nested = project.join(\"src\");\n        fs::create_dir_all(\u0026nested).unwrap();\n        fs::write(project.join(\".monomind-suggest-dismissed\"), \"\").unwrap();\n\n        let result = walk_to_monomind(\u0026nested).unwrap();\n\n        // Should return None when dismiss marker is found\n        assert_eq!(result, None);\n    }\n\n    #[test]\n    fn test_walk_to_monomind_dismissed_stops_at_marker() {\n        let temp = TempDir::new().unwrap();\n        let outer = temp.path().join(\"outer\");\n        let inner = outer.join(\"inner\");\n        fs::create_dir_all(\u0026inner).unwrap();\n\n        // Create .monomind in outer\n        fs::create_dir(outer.join(\".monomind\")).unwrap();\n        // Create dismiss marker in inner\n        fs::write(inner.join(\".monomind-suggest-dismissed\"), \"\").unwrap();\n\n        let result = walk_to_monomind(\u0026inner).unwrap();\n\n        // Should stop at dismiss marker, not find outer .monomind\n        assert_eq!(result, None);\n    }\n\n    #[test]\n    fn test_should_suggest_install_yes() {\n        let temp = TempDir::new().unwrap();\n        let project = temp.path().join(\"project\");\n        fs::create_dir_all(\u0026project).unwrap();\n\n        assert!(should_suggest_install(\u0026project));\n    }\n\n    #[test]\n    fn test_should_suggest_install_no_already_installed() {\n        let temp = TempDir::new().unwrap();\n        let project = temp.path().join(\"project\");\n        fs::create_dir_all(\u0026project).unwrap();\n        fs::create_dir(project.join(\".monomind\")).unwrap();\n\n        assert!(!should_suggest_install(\u0026project));\n    }\n\n    #[test]\n    fn test_should_suggest_install_no_dismissed() {\n        let temp = TempDir::new().unwrap();\n        let project = temp.path().join(\"project\");\n        fs::create_dir_all(\u0026project).unwrap();\n        fs::write(project.join(\".monomind-suggest-dismissed\"), \"\").unwrap();\n\n        assert!(!should_suggest_install(\u0026project));\n    }\n\n    #[test]\n    fn test_dismiss_suggestion_creates_marker() {\n        let temp = TempDir::new().unwrap();\n        let project = temp.path().join(\"project\");\n        fs::create_dir_all(\u0026project).unwrap();\n\n        dismiss_suggestion(\u0026project).unwrap();\n\n        let marker = project.join(\".monomind-suggest-dismissed\");\n        assert!(marker.exists());\n        assert!(marker.is_file());\n    }\n\n    #[test]\n    fn test_dismiss_suggestion_idempotent() {\n        let temp = TempDir::new().unwrap();\n        let project = temp.path().join(\"project\");\n        fs::create_dir_all(\u0026project).unwrap();\n\n        // Call twice - should not error\n        dismiss_suggestion(\u0026project).unwrap();\n        dismiss_suggestion(\u0026project).unwrap();\n\n        let marker = project.join(\".monomind-suggest-dismissed\");\n        assert!(marker.exists());\n    }\n\n    #[test]\n    fn test_integration_detect_and_dismiss() {\n        let temp = TempDir::new().unwrap();\n        // Create dismiss marker at temp root to prevent finding parent .monomind\n        fs::write(temp.path().join(\".monomind-suggest-dismissed\"), \"\").unwrap();\n        let project = temp.path().join(\"project\");\n        let nested = project.join(\"src\");\n        fs::create_dir_all(\u0026nested).unwrap();\n\n        // Initially should suggest\n        assert!(should_suggest_install(\u0026project));\n        let result = walk_to_monomind(\u0026nested).unwrap();\n        assert_eq!(result, None);\n\n        // Dismiss\n        dismiss_suggestion(\u0026project).unwrap();\n\n        // Should no longer suggest\n        assert!(!should_suggest_install(\u0026project));\n        let result = walk_to_monomind(\u0026nested).unwrap();\n        assert_eq!(result, None);\n    }\n\n    #[test]\n    fn test_walk_stops_at_filesystem_boundary() {\n        // This test walks from a deep temp directory up to root\n        // Should return None without panicking\n        let temp = TempDir::new().unwrap();\n        // Create dismiss marker at temp root to prevent finding parent .monomind\n        fs::write(temp.path().join(\".monomind-suggest-dismissed\"), \"\").unwrap();\n        let deep = temp.path().join(\"a\").join(\"b\").join(\"c\");\n        fs::create_dir_all(\u0026deep).unwrap();\n\n        let result = walk_to_monomind(\u0026deep).unwrap();\n\n        assert_eq!(result, None);\n    }\n\n    #[test]\n    fn test_walk_handles_symlinks() {\n        let temp = TempDir::new().unwrap();\n        let real_dir = temp.path().join(\"real\");\n        fs::create_dir_all(\u0026real_dir).unwrap();\n        fs::create_dir(real_dir.join(\".monomind\")).unwrap();\n\n        // Note: Symlink tests may fail on Windows without admin privileges\n        #[cfg(unix)]\n        {\n            let link = temp.path().join(\"link\");\n            std::os::unix::fs::symlink(\u0026real_dir, \u0026link).unwrap();\n\n            let result = walk_to_monomind(\u0026link).unwrap();\n\n            // Should resolve symlink and find .monomind\n            assert!(result.is_some());\n        }\n    }\n}\n","traces":[{"line":41,"address":[],"length":0,"stats":{"Line":4107282860161892352}},{"line":42,"address":[],"length":0,"stats":{"Line":8214565720323784704}},{"line":48,"address":[],"length":0,"stats":{"Line":14987979559889010688}},{"line":49,"address":[],"length":0,"stats":{"Line":9871890383196127232}},{"line":50,"address":[],"length":0,"stats":{"Line":2377900603251621888}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":2377900603251621888}},{"line":58,"address":[],"length":0,"stats":{"Line":10232178353385766912}},{"line":59,"address":[],"length":0,"stats":{"Line":5116089176692883456}},{"line":60,"address":[],"length":0,"stats":{"Line":1729382256910270464}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":64,"address":[],"length":0,"stats":{"Line":1729382256910270464}},{"line":68,"address":[],"length":0,"stats":{"Line":3386706919782612992}},{"line":69,"address":[],"length":0,"stats":{"Line":10160120759347838976}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":73,"address":[],"length":0,"stats":{"Line":0}},{"line":97,"address":[],"length":0,"stats":{"Line":1585267068834414592}},{"line":98,"address":[],"length":0,"stats":{"Line":4755801206503243776}},{"line":99,"address":[],"length":0,"stats":{"Line":4755801206503243776}},{"line":101,"address":[],"length":0,"stats":{"Line":3026418949592973312}},{"line":130,"address":[],"length":0,"stats":{"Line":792633534417207296}},{"line":131,"address":[],"length":0,"stats":{"Line":2377900603251621888}},{"line":133,"address":[],"length":0,"stats":{"Line":1585267068834414592}},{"line":136,"address":[],"length":0,"stats":{"Line":792633534417207296}},{"line":137,"address":[],"length":0,"stats":{"Line":0}},{"line":141,"address":[],"length":0,"stats":{"Line":792633534417207296}}],"covered":21,"coverable":26},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","monomind-bridge","src","health.rs"],"content":"// Week 2 Implementation: Health Check \u0026 Upgrade (§2.4.3)\n//\n// Core functionality:\n// - run_doctor_check: Execute `npx monomind@latest doctor --json`\n// - upgrade_monomind: Execute `npx monomind@latest upgrade`\n// - HealthScheduler: Daily background health check scheduler\n//\n// Design principle: Fail loud, not silent (prevent monoes/monomind#135, #136)\n\nuse anyhow::{Context, Result};\nuse serde::{Deserialize, Serialize};\nuse std::path::Path;\nuse std::process::Command;\nuse std::time::SystemTime;\nuse tokio::time::{interval, Duration};\n\n/// Health check status from monomind doctor\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct HealthStatus {\n    /// Whether monomind CLI is installed and accessible\n    pub installed: bool,\n    /// Installed CLI version (if available)\n    pub version: Option\u003cString\u003e,\n    /// Whether control server is reachable\n    pub control_server_reachable: bool,\n    /// Whether broker is registered\n    pub broker_registered: bool,\n    /// Timestamp of last health check\n    pub last_check: SystemTime,\n    /// List of health issues found\n    pub issues: Vec\u003cHealthIssue\u003e,\n}\n\nimpl HealthStatus {\n    /// Create a healthy status (all checks pass)\n    pub fn healthy(version: String) -\u003e Self {\n        Self {\n            installed: true,\n            version: Some(version),\n            control_server_reachable: true,\n            broker_registered: true,\n            last_check: SystemTime::now(),\n            issues: vec![],\n        }\n    }\n\n    /// Create a status indicating monomind is not installed\n    pub fn not_installed() -\u003e Self {\n        Self {\n            installed: false,\n            version: None,\n            control_server_reachable: false,\n            broker_registered: false,\n            last_check: SystemTime::now(),\n            issues: vec![HealthIssue {\n                severity: Severity::Error,\n                message: \"monomind is not installed\".to_string(),\n                resolution: Some(\"Run: npx monomind@latest init\".to_string()),\n            }],\n        }\n    }\n\n    /// Check if overall health is good (no errors)\n    pub fn is_healthy(\u0026self) -\u003e bool {\n        self.installed\n            \u0026\u0026 self.control_server_reachable\n            \u0026\u0026 self.broker_registered\n            \u0026\u0026 !self.issues.iter().any(|i| i.severity == Severity::Error)\n    }\n}\n\n/// Individual health issue\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct HealthIssue {\n    pub severity: Severity,\n    pub message: String,\n    pub resolution: Option\u003cString\u003e,\n}\n\n/// Issue severity levels\n#[derive(Debug, Clone, Copy, Serialize, Deserialize, PartialEq, Eq)]\n#[serde(rename_all = \"lowercase\")]\npub enum Severity {\n    Info,\n    Warning,\n    Error,\n}\n\n/// Result of upgrade operation\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq, Eq)]\npub struct UpgradeResult {\n    /// Whether upgrade succeeded\n    pub success: bool,\n    /// Previous version (before upgrade)\n    pub old_version: Option\u003cString\u003e,\n    /// New version (after upgrade)\n    pub new_version: Option\u003cString\u003e,\n    /// Full command output\n    pub output: String,\n}\n\n/// Run monomind doctor health check\n///\n/// Executes `npx monomind@latest doctor --json` in the given project directory\n/// and parses the JSON output to determine health status.\n///\n/// # Design: Fail Loud, Not Silent\n///\n/// This function is designed to prevent the failure modes experienced in\n/// monoes/monomind#135 (dropped auth credentials) and #136 (dead foreign-server\n/// pairing). All failures are surfaced explicitly in the HealthStatus.\n///\n/// # Arguments\n///\n/// * `project_dir` - Project root directory containing .monomind/\n///\n/// # Returns\n///\n/// * `Ok(HealthStatus)` - Health check results (may contain errors)\n/// * `Err(_)` - Command execution failed (permission denied, etc.)\n///\n/// # Examples\n///\n/// ```no_run\n/// use monoterminal_monomind_bridge::run_doctor_check;\n/// use std::path::Path;\n///\n/// # tokio_test::block_on(async {\n/// let health = run_doctor_check(Path::new(\"/project\")).await?;\n/// if !health.is_healthy() {\n///     for issue in \u0026health.issues {\n///         println!(\"{:?}: {}\", issue.severity, issue.message);\n///     }\n/// }\n/// # Ok::\u003c(), anyhow::Error\u003e(())\n/// # })\n/// ```\npub async fn run_doctor_check(project_dir: \u0026Path) -\u003e Result\u003cHealthStatus\u003e {\n    tracing::debug!(\n        path = %project_dir.display(),\n        \"Running monomind doctor health check\"\n    );\n\n    // Execute npx monomind@latest doctor --json\n    let output = tokio::task::spawn_blocking({\n        let project_dir = project_dir.to_path_buf();\n        move || {\n            Command::new(\"npx\")\n                .arg(\"monomind@latest\")\n                .arg(\"doctor\")\n                .arg(\"--json\")\n                .current_dir(\u0026project_dir)\n                .output()\n        }\n    })\n    .await\n    .context(\"Failed to spawn health check task\")?\n    .context(\"Failed to execute monomind doctor\")?;\n\n    // Check if command succeeded\n    if !output.status.success() {\n        let stderr = String::from_utf8_lossy(\u0026output.stderr);\n        tracing::warn!(\n            exit_code = output.status.code(),\n            stderr = %stderr,\n            \"monomind doctor command failed\"\n        );\n\n        // If npx itself failed, monomind is likely not installed\n        if stderr.contains(\"command not found\") || stderr.contains(\"not recognized\") {\n            return Ok(HealthStatus::not_installed());\n        }\n\n        // Other failure - return error status\n        return Ok(HealthStatus {\n            installed: false,\n            version: None,\n            control_server_reachable: false,\n            broker_registered: false,\n            last_check: SystemTime::now(),\n            issues: vec![HealthIssue {\n                severity: Severity::Error,\n                message: format!(\"monomind doctor failed: {}\", stderr),\n                resolution: Some(\"Run: npx monomind@latest doctor --fix\".to_string()),\n            }],\n        });\n    }\n\n    // Parse JSON output\n    let json: serde_json::Value = serde_json::from_slice(\u0026output.stdout)\n        .context(\"Failed to parse monomind doctor JSON output\")?;\n\n    parse_doctor_output(json)\n}\n\n/// Parse monomind doctor JSON output into HealthStatus\n///\n/// Expected JSON schema (from monomind CLI):\n/// ```json\n/// {\n///   \"version\": \"1.2.3\",\n///   \"controlServer\": {\n///     \"reachable\": true,\n///     \"port\": 3000\n///   },\n///   \"broker\": {\n///     \"registered\": true,\n///     \"path\": \"/path/to/broker.json\"\n///   },\n///   \"issues\": [\n///     {\n///       \"severity\": \"warning\",\n///       \"message\": \"Old CLI version detected\",\n///       \"resolution\": \"Run: npx monomind@latest upgrade\"\n///     }\n///   ]\n/// }\n/// ```\nfn parse_doctor_output(json: serde_json::Value) -\u003e Result\u003cHealthStatus\u003e {\n    let version = json\n        .get(\"version\")\n        .and_then(|v| v.as_str())\n        .map(String::from);\n\n    let control_server_reachable = json\n        .get(\"controlServer\")\n        .and_then(|v| v.get(\"reachable\"))\n        .and_then(|v| v.as_bool())\n        .unwrap_or(false);\n\n    let broker_registered = json\n        .get(\"broker\")\n        .and_then(|v| v.get(\"registered\"))\n        .and_then(|v| v.as_bool())\n        .unwrap_or(false);\n\n    let issues: Vec\u003cHealthIssue\u003e = json\n        .get(\"issues\")\n        .and_then(|v| v.as_array())\n        .map(|arr| {\n            arr.iter()\n                .filter_map(|issue| {\n                    let severity_str = issue.get(\"severity\")?.as_str()?;\n                    let severity = match severity_str {\n                        \"error\" =\u003e Severity::Error,\n                        \"warning\" =\u003e Severity::Warning,\n                        \"info\" =\u003e Severity::Info,\n                        _ =\u003e return None,\n                    };\n\n                    let message = issue.get(\"message\")?.as_str()?.to_string();\n                    let resolution = issue\n                        .get(\"resolution\")\n                        .and_then(|v| v.as_str())\n                        .map(String::from);\n\n                    Some(HealthIssue {\n                        severity,\n                        message,\n                        resolution,\n                    })\n                })\n                .collect()\n        })\n        .unwrap_or_default();\n\n    tracing::info!(\n        version = ?version,\n        control_server = control_server_reachable,\n        broker = broker_registered,\n        issues = issues.len(),\n        \"Health check complete\"\n    );\n\n    Ok(HealthStatus {\n        installed: version.is_some(),\n        version,\n        control_server_reachable,\n        broker_registered,\n        last_check: SystemTime::now(),\n        issues,\n    })\n}\n\n/// Trigger one-click upgrade to latest monomind version\n///\n/// Executes `npx monomind@latest upgrade` in the given project directory.\n/// This is a potentially destructive operation and should be gated by user\n/// confirmation in the UI.\n///\n/// # Arguments\n///\n/// * `project_dir` - Project root directory containing .monomind/\n///\n/// # Returns\n///\n/// * `Ok(UpgradeResult)` - Upgrade results (success or failure)\n/// * `Err(_)` - Command execution failed\n///\n/// # Examples\n///\n/// ```no_run\n/// use monoterminal_monomind_bridge::upgrade_monomind;\n/// use std::path::Path;\n///\n/// # tokio_test::block_on(async {\n/// let result = upgrade_monomind(Path::new(\"/project\")).await?;\n/// if result.success {\n///     println!(\"Upgraded {} -\u003e {}\",\n///         result.old_version.unwrap_or_default(),\n///         result.new_version.unwrap_or_default()\n///     );\n/// }\n/// # Ok::\u003c(), anyhow::Error\u003e(())\n/// # })\n/// ```\npub async fn upgrade_monomind(project_dir: \u0026Path) -\u003e Result\u003cUpgradeResult\u003e {\n    tracing::info!(\n        path = %project_dir.display(),\n        \"Triggering monomind upgrade\"\n    );\n\n    // Get current version before upgrade\n    let old_version = get_current_version(project_dir).await.ok();\n\n    // Execute npx monomind@latest upgrade\n    let output = tokio::task::spawn_blocking({\n        let project_dir = project_dir.to_path_buf();\n        move || {\n            Command::new(\"npx\")\n                .arg(\"monomind@latest\")\n                .arg(\"upgrade\")\n                .current_dir(\u0026project_dir)\n                .output()\n        }\n    })\n    .await\n    .context(\"Failed to spawn upgrade task\")?\n    .context(\"Failed to execute monomind upgrade\")?;\n\n    let success = output.status.success();\n    let output_text = String::from_utf8_lossy(\u0026output.stdout).to_string();\n\n    // Get new version after upgrade\n    let new_version = if success {\n        get_current_version(project_dir).await.ok()\n    } else {\n        None\n    };\n\n    tracing::info!(\n        success = success,\n        old_version = ?old_version,\n        new_version = ?new_version,\n        \"Upgrade complete\"\n    );\n\n    Ok(UpgradeResult {\n        success,\n        old_version,\n        new_version,\n        output: output_text,\n    })\n}\n\n/// Get current monomind CLI version\nasync fn get_current_version(project_dir: \u0026Path) -\u003e Result\u003cString\u003e {\n    let output = tokio::task::spawn_blocking({\n        let project_dir = project_dir.to_path_buf();\n        move || {\n            Command::new(\"npx\")\n                .arg(\"monomind@latest\")\n                .arg(\"--version\")\n                .current_dir(\u0026project_dir)\n                .output()\n        }\n    })\n    .await\n    .context(\"Failed to spawn version check task\")?\n    .context(\"Failed to get monomind version\")?;\n\n    if output.status.success() {\n        let version = String::from_utf8_lossy(\u0026output.stdout)\n            .trim()\n            .to_string();\n        Ok(version)\n    } else {\n        anyhow::bail!(\"Failed to get version\")\n    }\n}\n\n/// Daily health check scheduler\n///\n/// Runs health checks on a configurable interval (default 24 hours).\n/// Designed to run in the background and emit health status via callback.\npub struct HealthScheduler {\n    interval: Duration,\n}\n\nimpl HealthScheduler {\n    /// Create new scheduler with default 24-hour interval\n    pub fn new() -\u003e Self {\n        Self::with_interval(Duration::from_secs(86400))\n    }\n\n    /// Create new scheduler with custom interval\n    pub fn with_interval(interval: Duration) -\u003e Self {\n        Self { interval }\n    }\n\n    /// Start the scheduler loop\n    ///\n    /// Calls the provided callback with health status on each check.\n    /// Runs indefinitely until the task is cancelled.\n    ///\n    /// # Arguments\n    ///\n    /// * `project_dir` - Project root to check\n    /// * `callback` - Async callback to receive health status\n    ///\n    /// # Examples\n    ///\n    /// ```no_run\n    /// use monoterminal_monomind_bridge::HealthScheduler;\n    /// use std::path::Path;\n    ///\n    /// # tokio_test::block_on(async {\n    /// let scheduler = HealthScheduler::new();\n    /// scheduler.start(\n    ///     Path::new(\"/project\"),\n    ///     |health| async move {\n    ///         println!(\"Health: {:?}\", health);\n    ///     }\n    /// ).await?;\n    /// # Ok::\u003c(), anyhow::Error\u003e(())\n    /// # })\n    /// ```\n    pub async fn start\u003cF, Fut\u003e(self, project_dir: \u0026Path, callback: F) -\u003e Result\u003c()\u003e\n    where\n        F: Fn(HealthStatus) -\u003e Fut,\n        Fut: std::future::Future\u003cOutput = ()\u003e,\n    {\n        let mut ticker = interval(self.interval);\n        let project_dir = project_dir.to_path_buf();\n\n        tracing::info!(\n            interval_secs = self.interval.as_secs(),\n            \"Health check scheduler started\"\n        );\n\n        // Skip first immediate tick - we don't want to run health check on startup\n        // The first tick() fires immediately, subsequent ticks wait for the interval\n        ticker.tick().await;\n\n        loop {\n            ticker.tick().await;\n\n            tracing::debug!(\"Running scheduled health check\");\n\n            match run_doctor_check(\u0026project_dir).await {\n                Ok(health) =\u003e {\n                    callback(health).await;\n                }\n                Err(e) =\u003e {\n                    tracing::error!(\n                        error = %e,\n                        \"Scheduled health check failed\"\n                    );\n\n                    // Call callback with error status\n                    callback(HealthStatus {\n                        installed: false,\n                        version: None,\n                        control_server_reachable: false,\n                        broker_registered: false,\n                        last_check: SystemTime::now(),\n                        issues: vec![HealthIssue {\n                            severity: Severity::Error,\n                            message: format!(\"Health check error: {}\", e),\n                            resolution: None,\n                        }],\n                    })\n                    .await;\n                }\n            }\n        }\n    }\n}\n\nimpl Default for HealthScheduler {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use serde_json::json;\n\n    #[test]\n    fn test_health_status_healthy() {\n        let status = HealthStatus::healthy(\"1.2.3\".to_string());\n\n        assert!(status.installed);\n        assert_eq!(status.version, Some(\"1.2.3\".to_string()));\n        assert!(status.control_server_reachable);\n        assert!(status.broker_registered);\n        assert!(status.is_healthy());\n        assert!(status.issues.is_empty());\n    }\n\n    #[test]\n    fn test_health_status_not_installed() {\n        let status = HealthStatus::not_installed();\n\n        assert!(!status.installed);\n        assert_eq!(status.version, None);\n        assert!(!status.control_server_reachable);\n        assert!(!status.broker_registered);\n        assert!(!status.is_healthy());\n        assert_eq!(status.issues.len(), 1);\n        assert_eq!(status.issues[0].severity, Severity::Error);\n    }\n\n    #[test]\n    fn test_health_status_is_healthy_with_warnings() {\n        let mut status = HealthStatus::healthy(\"1.2.3\".to_string());\n        status.issues.push(HealthIssue {\n            severity: Severity::Warning,\n            message: \"Old version\".to_string(),\n            resolution: Some(\"Upgrade\".to_string()),\n        });\n\n        // Should still be healthy (warnings don't block)\n        assert!(status.is_healthy());\n    }\n\n    #[test]\n    fn test_health_status_is_unhealthy_with_errors() {\n        let mut status = HealthStatus::healthy(\"1.2.3\".to_string());\n        status.issues.push(HealthIssue {\n            severity: Severity::Error,\n            message: \"Control server down\".to_string(),\n            resolution: None,\n        });\n\n        assert!(!status.is_healthy());\n    }\n\n    #[test]\n    fn test_parse_doctor_output_healthy() {\n        let json = json!({\n            \"version\": \"1.2.3\",\n            \"controlServer\": {\n                \"reachable\": true,\n                \"port\": 3000\n            },\n            \"broker\": {\n                \"registered\": true,\n                \"path\": \"/path/to/broker.json\"\n            },\n            \"issues\": []\n        });\n\n        let status = parse_doctor_output(json).unwrap();\n\n        assert!(status.installed);\n        assert_eq!(status.version, Some(\"1.2.3\".to_string()));\n        assert!(status.control_server_reachable);\n        assert!(status.broker_registered);\n        assert!(status.issues.is_empty());\n    }\n\n    #[test]\n    fn test_parse_doctor_output_with_issues() {\n        let json = json!({\n            \"version\": \"1.0.0\",\n            \"controlServer\": {\n                \"reachable\": false\n            },\n            \"broker\": {\n                \"registered\": true\n            },\n            \"issues\": [\n                {\n                    \"severity\": \"error\",\n                    \"message\": \"Control server unreachable\",\n                    \"resolution\": \"Check if server is running\"\n                },\n                {\n                    \"severity\": \"warning\",\n                    \"message\": \"Old version detected\",\n                    \"resolution\": \"Run: npx monomind@latest upgrade\"\n                }\n            ]\n        });\n\n        let status = parse_doctor_output(json).unwrap();\n\n        assert!(status.installed);\n        assert!(!status.control_server_reachable);\n        assert!(status.broker_registered);\n        assert_eq!(status.issues.len(), 2);\n        assert_eq!(status.issues[0].severity, Severity::Error);\n        assert_eq!(status.issues[1].severity, Severity::Warning);\n    }\n\n    #[test]\n    fn test_parse_doctor_output_missing_fields() {\n        let json = json!({\n            \"version\": \"1.2.3\"\n        });\n\n        let status = parse_doctor_output(json).unwrap();\n\n        assert!(status.installed);\n        assert_eq!(status.version, Some(\"1.2.3\".to_string()));\n        // Missing fields should default to false\n        assert!(!status.control_server_reachable);\n        assert!(!status.broker_registered);\n    }\n\n    #[test]\n    fn test_upgrade_result_success() {\n        let result = UpgradeResult {\n            success: true,\n            old_version: Some(\"1.0.0\".to_string()),\n            new_version: Some(\"1.2.3\".to_string()),\n            output: \"Upgrade successful\".to_string(),\n        };\n\n        assert!(result.success);\n        assert_eq!(result.old_version, Some(\"1.0.0\".to_string()));\n        assert_eq!(result.new_version, Some(\"1.2.3\".to_string()));\n    }\n\n    #[test]\n    fn test_health_scheduler_default_interval() {\n        let scheduler = HealthScheduler::new();\n        assert_eq!(scheduler.interval, Duration::from_secs(86400));\n    }\n\n    #[test]\n    fn test_health_scheduler_custom_interval() {\n        let scheduler = HealthScheduler::with_interval(Duration::from_secs(3600));\n        assert_eq!(scheduler.interval, Duration::from_secs(3600));\n    }\n\n    #[test]\n    fn test_severity_serialization() {\n        let info = serde_json::to_string(\u0026Severity::Info).unwrap();\n        let warning = serde_json::to_string(\u0026Severity::Warning).unwrap();\n        let error = serde_json::to_string(\u0026Severity::Error).unwrap();\n\n        assert_eq!(info, r#\"\"info\"\"#);\n        assert_eq!(warning, r#\"\"warning\"\"#);\n        assert_eq!(error, r#\"\"error\"\"#);\n    }\n\n    #[test]\n    fn test_health_issue_with_resolution() {\n        let issue = HealthIssue {\n            severity: Severity::Warning,\n            message: \"Test message\".to_string(),\n            resolution: Some(\"Test resolution\".to_string()),\n        };\n\n        assert_eq!(issue.severity, Severity::Warning);\n        assert!(issue.resolution.is_some());\n    }\n\n    #[test]\n    fn test_health_issue_without_resolution() {\n        let issue = HealthIssue {\n            severity: Severity::Info,\n            message: \"Test message\".to_string(),\n            resolution: None,\n        };\n\n        assert_eq!(issue.severity, Severity::Info);\n        assert!(issue.resolution.i checks into the master daemon\n// This is NOT part of the build - it's a documented example for task-8 implementers\n//\n// Copy relevant patterns from this file when implementing:\n// - crates/master/src/health_handler.rs\n// - crates/master/src/main.rs (scheduler startup)\n// - WebSocket message handlers\n\n#![allow(dead_code, unused_imports, unused_variables)]\n\nuse crate::{run_doctor_check, upgrade_monomind, HealthScheduler, HealthStatus, Severity};\nuse std::path::{Path, PathBuf};\nuse std::time::SystemTime;\nuse tokio::sync::broadcast;\n\n/// Example: Protocol message types (these will come from generated proto code)\nmod proto_example {\n    pub struct HealthCheckResponse {\n        pub installed: bool,\n        pub version: String,\n        pub control_server_reachable: bool,\n        pub broker_registered: bool,\n        pub last_check_timestamp: i64,\n        pub issues: Vec\u003cHealthIssue\u003e,\n    }\n\n    pub struct HealthIssue {\n        pub severity: IssueSeverity,\n        pub message: String,\n        pub resolution: String,\n    }\n\n    pub enum IssueSeverity {\n        INFO = 0,\n        WARNING = 1,\n        ERROR = 2,\n    }\n\n    pub struct UpgradeRequest {\n        pub project_dir: String,\n        pub confirmed: bool,\n    }\n\n    pub struct UpgradeResponse {\n        pub success: bool,\n        pub old_version: String,\n        pub new_version: String,\n        pub output: String,\n    }\n}\n\nuse proto_example::*;\n\n/// Example: Health check handler for WebSocket messages\n///\n/// This should be called when a HealthCheckRequest arrives via WebSocket.\n/// Returns a HealthCheckResponse that can be sent back to the client.\npub async fn handle_health_check_request(project_dir: \u0026Path) -\u003e HealthCheckResponse {\n    match run_doctor_check(project_dir).await {\n        Ok(status) =\u003e convert_health_status_to_proto(status),\n        Err(e) =\u003e {\n            tracing::error!(\n                error = %e,\n                path = %project_dir.display(),\n                \"Health check failed\"\n            );\n\n            // Return error status\n            HealthCheckResponse {\n                installed: false,\n                version: String::new(),\n                control_server_reachable: false,\n                broker_registered: false,\n                last_check_timestamp: unix_timestamp_now(),\n                issues: vec![HealthIssue {\n                    severity: IssueSeverity::ERROR,\n                    message: format!(\"Health check error: {}\", e),\n                    resolution: \"Check monomind installation: npx monomind@latest doctor --fix\"\n                        .to_string(),\n                }],\n            }\n        }\n    }\n}\n\n/// Example: Upgrade handler for WebSocket messages\n///\n/// IMPORTANT: This must verify that confirmed=true before proceeding.\n/// Per SRS §2.4.3, upgrade is a potentially destructive operation.\npub async fn handle_upgrade_request(request: UpgradeRequest) -\u003e UpgradeResponse {\n    // SECURITY: Require explicit user confirmation\n    if !request.confirmed {\n        tracing::warn!(\"Upgrade request rejected - confirmation required\");\n        return UpgradeResponse {\n            success: false,\n            old_version: String::new(),\n            new_version: String::new(),\n            output: \"User confirmation required for upgrade\".to_string(),\n        };\n    }\n\n    let project_dir = if request.project_dir.is_empty() {\n        std::env::current_dir().unwrap_or_else(|_| PathBuf::from(\".\"))\n    } else {\n        PathBuf::from(request.project_dir)\n    };\n\n    tracing::info!(\n        path = %project_dir.display(),\n        \"Processing confirmed upgrade request\"\n    );\n\n    match upgrade_monomind(\u0026project_dir).await {\n        Ok(result) =\u003e UpgradeResponse {\n            success: result.success,\n            old_version: result.old_version.unwrap_or_default(),\n            new_version: result.new_version.unwrap_or_default(),\n            output: result.output,\n        },\n        Err(e) =\u003e {\n            tracing::error!(error = %e, \"Upgrade failed\");\n            UpgradeResponse {\n                success: false,\n                old_version: String::new(),\n                new_version: String::new(),\n                output: format!(\"Upgrade error: {}\", e),\n            }\n        }\n    }\n}\n\n/// Example: Start daily health check scheduler\n///\n/// This should be spawned as a background task in main().\n/// It will run health checks every 24 hours and broadcast results.\npub async fn start_daily_health_scheduler(\n    project_dir: PathBuf,\n    health_tx: broadcast::Sender\u003cHealthStatus\u003e,\n) {\n    tokio::spawn(async move {\n        let scheduler = HealthScheduler::new(); // Default 24-hour interval\n\n        tracing::info!(\n            path = %project_dir.display(),\n            \"Starting daily health check scheduler\"\n        );\n\n        // Start scheduler loop\n        let result = scheduler\n            .start(\u0026project_dir, move |health| {\n                let tx = health_tx.clone();\n                async move {\n                    tracing::info!(\n                        healthy = health.is_healthy(),\n                        issues = health.issues.len(),\n                        version = ?health.version,\n                        \"Scheduled health check complete\"\n                    );\n\n                    // Broadcast to all listeners (WebSocket clients)\n                    if let Err(e) = tx.send(health.clone()) {\n                        tracing::debug!(\"No health status subscribers: {}\", e);\n                    }\n                }\n            })\n            .await;\n\n        if let Err(e) = result {\n            tracing::error!(error = %e, \"Health scheduler terminated with error\");\n        }\n    });\n}\n\n/// Example: Session manager integration\n///\n/// Call this when a session's working directory changes.\n/// Per SRS §2.4.1, we should check for .monomind/ and health on cwd change.\npub async fn on_session_cwd_changed(\n    new_cwd: PathBuf,\n    health_tx: broadcast::Sender\u003cHealthStatus\u003e,\n) {\n    tracing::debug!(\n        path = %new_cwd.display(),\n        \"Session working directory changed - triggering health check\"\n    );\n\n    // Spawn background task so we don't block the session\n    tokio::spawn(async move {\n        match run_doctor_check(\u0026new_cwd).await {\n            Ok(health) =\u003e {\n                if !health.is_healthy() {\n                    tracing::warn!(\n                        path = %new_cwd.display(),\n                        issues = health.issues.len(),\n                        \"Health issues detected in new working directory\"\n                    );\n\n                    // Broadcast unhealthy status\n                    let _ = health_tx.send(health);\n                }\n            }\n            Err(e) =\u003e {\n                tracing::error!(\n                    error = %e,\n                    path = %new_cwd.display(),\n                    \"Failed to check health on cwd change\"\n                );\n            }\n        }\n    });\n}\n\n/// Convert HealthStatus (from monomind-bridge) to proto HealthCheckResponse\nfn convert_health_status_to_proto(status: HealthStatus) -\u003e HealthCheckResponse {\n    HealthCheckResponse {\n        installed: status.installed,\n        version: status.version.unwrap_or_default(),\n        control_server_reachable: status.control_server_reachable,\n        broker_registered: status.broker_registered,\n        last_check_timestamp: status\n            .last_check\n            .duration_since(SystemTime::UNIX_EPOCH)\n            .unwrap_or_default()\n            .as_secs() as i64,\n        issues: status\n            .issues\n            .into_iter()\n            .map(|issue| HealthIssue {\n                severity: match issue.severity {\n                    Severity::Info =\u003e IssueSeverity::INFO,\n                    Severity::Warning =\u003e IssueSeverity::WARNING,\n                    Severity::Error =\u003e IssueSeverity::ERROR,\n                },\n                message: issue.message,\n                resolution: issue.resolution.unwrap_or_default(),\n            })\n            .collect(),\n    }\n}\n\n/// Helper: Get current Unix timestamp\nfn unix_timestamp_now() -\u003e i64 {\n    SystemTime::now()\n        .duration_since(SystemTime::UNIX_EPOCH)\n        .unwrap_or_default()\n        .as_secs() as i64\n}\n\n// ============================================================================\n// Example: Main function integration pattern\n// ============================================================================\n\n#[allow(unreachable_code)]\nasync fn example_main_integration() -\u003e anyhow::Result\u003c()\u003e {\n    // 1. Create broadcast channel for health status updates\n    let (health_tx, _health_rx) = broadcast::channel::\u003cHealthStatus\u003e(16);\n\n    // 2. Get project directory (or use current dir)\n    let project_dir = std::env::current_dir()?;\n\n    // 3. Start daily health check scheduler\n    start_daily_health_scheduler(project_dir.clone(), health_tx.clone()).await;\n\n    // 4. In your WebSocket message handler, subscribe to health updates\n    let mut health_rx = health_tx.subscribe();\n    tokio::spawn(async move {\n        while let Ok(health) = health_rx.recv().await {\n            // Broadcast health status to all connected WebSocket clients\n            // send_health_status_to_clients(health).await;\n        }\n    });\n\n    // 5. Handle WebSocket messages\n    // (This would be in your actual WebSocket message loop)\n    loop {\n        // Example: Handle health check request\n        let response = handle_health_check_request(\u0026project_dir).await;\n        // send_response(response).await?;\n\n        // Example: Handle upgrade request\n        let upgrade_req = UpgradeRequest {\n            project_dir: project_dir.to_string_lossy().to_string(),\n            confirmed: true,\n        };\n        let upgrade_resp = handle_upgrade_request(upgrade_req).await;\n        // send_response(upgrade_resp).await?;\n\n        break; // Remove this in real implementation\n    }\n\n    Ok(())\n}\n\n// ============================================================================\n// Example: Testing patterns\n// ============================================================================\n\n#[cfg(test)]\nmod integration_tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[tokio::test]\n    async fn test_health_check_handler() {\n        let temp = TempDir::new().unwrap();\n        let response = handle_health_check_request(temp.path()).await;\n\n        // Should return a response even if monomind is not installed\n        assert!(!response.version.is_empty() || !response.installed);\n    }\n\n    #[tokio::test]\n    async fn test_upgrade_requires_confirmation() {\n        let request = UpgradeRequest {\n            project_dir: String::new(),\n            confirmed: false, // NOT confirmed\n        };\n\n        let response = handle_upgrade_request(request).await;\n\n        // Should reject without confirmation\n        assert!(!response.success);\n        assert!(response.output.contains(\"confirmation\"));\n    }\n\n    #[tokio::test]\n    async fn test_health_broadcast_channel() {\n        let (tx, mut rx) = broadcast::channel::\u003cHealthStatus\u003e(16);\n        let temp = TempDir::new().unwrap();\n\n        // Simulate scheduled health check\n        tokio::spawn({\n            let temp_path = temp.path().to_path_buf();\n            async move {\n                if let Ok(health) = run_doctor_check(\u0026temp_path).await {\n                    let _ = tx.send(health);\n                }\n            }\n        });\n\n        // Should receive health status\n        let result = tokio::time::timeout(\n _root: Option\u003cPathBuf\u003e,\r\n    /// Whether to suggest installation to the user\r\n    pub suggest_install: bool,\r\n    /// Whether the dismiss marker exists\r\n    pub dismiss_file_exists: bool,\r\n}\r\n\r\nimpl DetectionResult {\r\n    /// Create a new detection result indicating monomind was found\r\n    pub fn found(root: PathBuf) -\u003e Self {\r\n        Self {\r\n            found: true,\r\n            monomind_root: Some(root),\r\n            suggest_install: false,\r\n            dismiss_file_exists: false,\r\n        }\r\n    }\r\n\r\n    /// Create a new detection result indicating monomind was not found\r\n    pub fn not_found(suggest: bool, dismissed: bool) -\u003e Self {\r\n        Self {\r\n            found: false,\r\n            monomind_root: None,\r\n            suggest_install: suggest,\r\n            dismiss_file_exists: dismissed,\r\n        }\r\n    }\r\n}\r\n\r\n/// Install suggestion banner text (MOTD-style)\r\npub const INSTALL_SUGGESTION_BANNER: \u0026str = r#\"\r\n╭─────────────────────────────────────────────────────────────╮\r\n│ This project doesn't have monomind installed               │\r\n│                                                             │\r\n│ Install to unlock org/agent/swarm features:                │\r\n│   npx monomind@latest init                                 │\r\n│                                                             │\r\n│ Dismiss: touch .monomind-suggest-dismissed                 │\r\n╰─────────────────────────────────────────────────────────────╯\r\n\"#;\r\n\r\n/// Detect monomind in a directory tree (Week 1 implementation)\r\n///\r\n/// Walks upward from the given path to find .monomind/ directory.\r\n/// Returns detection result with installation suggestion if appropriate.\r\n///\r\n/// # Examples\r\n///\r\n/// ```no_run\r\n/// use monoterminal_monomind_bridge::detect_monomind;\r\n/// use std::path::Path;\r\n///\r\n/// let result = detect_monomind(Path::new(\"/project/src/deep\"));\r\n/// if result.suggest_install {\r\n///     println!(\"Suggest installing monomind\");\r\n/// }\r\n/// ```\r\npub fn detect_monomind(path: \u0026Path) -\u003e DetectionResult {\r\n    match walk_to_monomind(path) {\r\n        Ok(Some(root)) =\u003e DetectionResult::found(root),\r\n        Ok(None) =\u003e {\r\n            let suggest = should_suggest_install(path);\r\n            let dismissed = path.join(\".monomind-suggest-dismissed\").exists();\r\n            DetectionResult::not_found(suggest, dismissed)\r\n        }\r\n        Err(_) =\u003e {\r\n            // On error (e.g., permission denied), don't suggest installation\r\n            DetectionResult::not_found(false, false)\r\n        }\r\n    }\r\n}\r\n\r\n#[cfg(test)]\r\nmod tests {\r\n    use super::*;\r\n    use std::fs;\r\n    use tempfile::TempDir;\r\n\r\n    /// Normalize paths for comparison on Windows\r\n    /// Strips UNC prefix (\\\\?\\) that canonicalize() adds on Windows\r\n    #[cfg(windows)]\r\n    fn normalize_path(path: \u0026Path) -\u003e PathBuf {\r\n        let path_str = path.to_string_lossy();\r\n        if let Some(stripped) = path_str.strip_prefix(r\"\\\\?\\\") {\r\n            PathBuf::from(stripped)\r\n        } else {\r\n            path.to_path_buf()\r\n        }\r\n    }\r\n\r\n    #[cfg(not(windows))]\r\n    fn normalize_path(path: \u0026Path) -\u003e PathBuf {\r\n        path.to_path_buf()\r\n    }\r\n\r\n    #[test]\r\n    fn test_detection_result_found() {\r\n        let root = PathBuf::from(\"/project\");\r\n        let result = DetectionResult::found(root.clone());\r\n\r\n        assert!(result.found);\r\n        assert_eq!(result.monomind_root, Some(root));\r\n        assert!(!result.suggest_install);\r\n        assert!(!result.dismiss_file_exists);\r\n    }\r\n\r\n    #[test]\r\n    fn test_detection_result_not_found() {\r\n        let result = DetectionResult::not_found(true, false);\r\n\r\n        assert!(!result.found);\r\n        assert_eq!(result.monomind_root, None);\r\n        assert!(result.suggest_install);\r\n        assert!(!result.dismiss_file_exists);\r\n    }\r\n\r\n    #[test]\r\n    fn test_detect_monomind_found() {\r\n        let temp = TempDir::new().unwrap();\r\n        let project = temp.path().join(\"project\");\r\n        let nested = project.join(\"src\").join(\"deep\");\r\n        fs::create_dir_all(\u0026nested).unwrap();\r\n        fs::create_dir(project.join(\".monomind\")).unwrap();\r\n\r\n        let result = detect_monomind(\u0026nested);\r\n\r\n        assert!(result.found);\r\n        assert_eq!(\r\n            result.monomind_root.as_ref().map(|p| normalize_path(p)),\r\n            Some(normalize_path(\u0026project))\r\n        );\r\n        assert!(!result.suggest_install);\r\n    }\r\n\r\n    #[test]\r\n    fn test_detect_monomind_not_found() {\r\n        let temp = TempDir::new().unwrap();\r\n        // Create dismiss marker at temp root to prevent finding parent .monomind\r\n        fs::write(temp.path().join(\".monomind-suggest-dismissed\"), \"\").unwrap();\r\n        let project = temp.path().join(\"project\");\r\n        fs::create_dir_all(\u0026project).unwrap();\r\n\r\n        let result = detect_monomind(\u0026project);\r\n\r\n        assert!(!result.found);\r\n        assert_eq!(result.monomind_root, None);\r\n        assert!(result.suggest_install);\r\n        assert!(!result.dismiss_file_exists);\r\n    }\r\n\r\n    #[test]\r\n    fn test_detect_monomind_dismissed() {\r\n        let temp = TempDir::new().unwrap();\r\n        let project = temp.path().join(\"project\");\r\n        fs::create_dir_all(\u0026project).unwrap();\r\n        fs::write(project.join(\".monomind-suggest-dismissed\"), \"\").unwrap();\r\n\r\n        let result = detect_monomind(\u0026project);\r\n\r\n        assert!(!result.found);\r\n        assert!(!result.suggest_install);\r\n        assert!(result.dismiss_file_exists);\r\n    }\r\n}\r\n","traces":[{"line":55,"address":[],"length":0,"stats":{"Line":2089670227099910144}
