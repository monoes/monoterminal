<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

    <script>
        var data = {"files":[{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","benches","fps_rendering.rs"],"content":"//! FPS Rendering Benchmarks\n//!\n//! Validates SRS §7.1 Phase 1 acceptance criterion #1:\n//! - 60 FPS master rendering on Windows 10 1809+\n//! - Frame budget: 16.67ms (60 Hz)\n//! - Breakdown: PTY read (2ms) + dirty tracking (0.5ms) + glyph lookup (1ms) + GPU render (8ms) + VSync (5ms)\n//!\n//! This benchmark measures the components that contribute to the rendering pipeline\n//! to ensure we stay within the 16.67ms frame budget.\n\nuse criterion::{black_box, criterion_group, criterion_main, Criterion, BenchmarkId, Throughput};\nuse std::time::Duration;\n\n/// Simulates dirty cell tracking after PTY output\n/// Target: \u003c 0.5ms for 80x24 terminal (SRS §2.1.1)\nfn bench_dirty_cell_tracking(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"dirty_tracking\");\n\n    // Test various terminal sizes\n    let sizes = vec![\n        (80, 24),   // Standard\n        (120, 40),  // Larger\n        (200, 60),  // Extra large\n    ];\n\n    for (cols, rows) in sizes {\n        let total_cells = cols * rows;\n\n        // Simulate a dirty bitmap (bit per cell)\n        let mut dirty_bits = vec![false; total_cells];\n\n        group.throughput(Throughput::Elements(total_cells as u64));\n        group.bench_with_input(\n            BenchmarkId::new(\"mark_dirty_region\", format!(\"{}x{}\", cols, rows)),\n            \u0026(cols, rows),\n            |b, \u0026(cols, rows)| {\n                b.iter(|| {\n                    // Simulate marking a rectangular region as dirty\n                    // (typical for scrolling or large output burst)\n                    let start_row = 5;\n                    let end_row = rows - 5;\n                    let start_col = 0;\n                    let end_col = cols;\n\n                    for row in start_row..end_row {\n                        for col in start_col..end_col {\n                            let idx = row * cols + col;\n                            dirty_bits[idx] = black_box(true);\n                        }\n                    }\n\n                    black_box(\u0026dirty_bits);\n                })\n            }\n        );\n    }\n\n    group.finish();\n}\n\n/// Simulates glyph cache lookup\n/// Target: \u003c 1ms (SRS §2.1.1 frame budget)\nfn bench_glyph_cache_lookup(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"glyph_cache\");\n\n    // Simulate a simple glyph cache (char -\u003e atlas coordinates)\n    use std::collections::HashMap;\n\n    let mut cache: HashMap\u003cchar, (u32, u32)\u003e = HashMap::new();\n\n    // Pre-populate with ASCII + common Unicode\n    for i in 32u8..127u8 {\n        cache.insert(i as char, (i as u32, 0));\n    }\n\n    // Add some common Unicode chars\n    let common_unicode = vec!['→', '←', '↑', '↓', '✓', '✗', '…', '•'];\n    for (idx, ch) in common_unicode.iter().enumerate() {\n        cache.insert(*ch, (128 + idx as u32, 0));\n    }\n\n    group.bench_function(\"lookup_ascii\", |b| {\n        b.iter(|| {\n            // Simulate looking up every character in a typical line\n            let line = \"cargo build --release --target x86_64-pc-windows-msvc\";\n            for ch in line.chars() {\n                let coords = cache.get(\u0026ch).unwrap_or(\u0026(0, 0));\n                black_box(coords);\n            }\n        })\n    });\n\n    group.bench_function(\"lookup_mixed_unicode\", |b| {\n        b.iter(|| {\n            let line = \"✓ Build succeeded → 128ms • Size: 5.2MB\";\n            for ch in line.chars() {\n                let coords = cache.get(\u0026ch).unwrap_or(\u0026(0, 0));\n                black_box(coords);\n            }\n        })\n    });\n\n    group.finish();\n}\n\n/// Simulates GPU command buffer submission overhead\n/// Target: \u003c 8ms for full-screen update (SRS §2.1.1)\nfn bench_gpu_command_submission(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"gpu_commands\");\n\n    // Simulate building vertex buffers for text rendering\n    #[derive(Clone, Copy)]\n    struct Vertex {\n        pos: [f32; 2],\n        uv: [f32; 2],\n        color: [f32; 4],\n    }\n\n    let sizes = vec![\n        (80, 24),   // Standard terminal\n        (120, 40),  // Larger\n        (200, 60),  // Extra large\n    ];\n\n    for (cols, rows) in sizes {\n        let total_cells = cols * rows;\n\n        group.throughput(Throughput::Elements(total_cells as u64));\n        group.bench_with_input(\n            BenchmarkId::new(\"build_vertex_buffer\", format!(\"{}x{}\", cols, rows)),\n            \u0026(cols, rows),\n            |b, \u0026(cols, rows)| {\n                b.iter(|| {\n                    let mut vertices = Vec::with_capacity(total_cells * 6);\n\n                    for row in 0..rows {\n                        for col in 0..cols {\n                            // Each cell = 2 triangles = 6 vertices\n                            let x = col as f32 * 10.0;\n                            let y = row as f32 * 20.0;\n\n                            let v = Vertex {\n                                pos: [x, y],\n                                uv: [0.0, 0.0],\n                                color: [1.0, 1.0, 1.0, 1.0],\n                            };\n\n                            for _ in 0..6 {\n                                vertices.push(black_box(v));\n                            }\n                        }\n                    }\n\n                    black_box(vertices);\n                })\n            }\n        );\n    }\n\n    group.finish();\n}\n\n/// Simulates full frame render cycle\n/// Target: \u003c 16.67ms total (60 FPS)\nfn bench_full_frame_cycle(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"full_frame\");\n\n    // Set the target time to 16.67ms (60 FPS)\n    group.measurement_time(Duration::from_secs(10));\n\n    let terminal_size = (80, 24);\n    let (cols, rows) = terminal_size;\n    let total_cells = cols * rows;\n\n    // Simulate all frame components\n    let mut dirty_bits = vec![false; total_cells];\n    let mut screen_buffer = vec![' '; total_cells];\n\n    use std::collections::HashMap;\n    let mut glyph_cache: HashMap\u003cchar, (u32, u32)\u003e = HashMap::new();\n    for i in 32u8..127u8 {\n        glyph_cache.insert(i as char, (i as u32, 0));\n    }\n\n    #[derive(Clone, Copy)]\n    struct Vertex {\n        pos: [f32; 2],\n        uv: [f32; 2],\n        color: [f32; 4],\n    }\n\n    group.throughput(Throughput::Elements(total_cells as u64));\n    group.bench_function(\"simulate_60fps_frame\", |b| {\n        b.iter(|| {\n            // 1. Dirty tracking (0.5ms budget)\n            for row in 0..rows {\n                for col in 0..cols {\n                    let idx = row * cols + col;\n                    dirty_bits[idx] = black_box(true);\n                }\n            }\n\n            // 2. Glyph lookups (1ms budget)\n            for ch in screen_buffer.iter() {\n                let coords = glyph_cache.get(ch).unwrap_or(\u0026(0, 0));\n                black_box(coords);\n            }\n\n            // 3. Build vertex buffer (part of 8ms GPU budget)\n            let mut vertices = Vec::with_capacity(total_cells * 6);\n            for row in 0..rows {\n                for col in 0..cols {\n                    let x = col as f32 * 10.0;\n                    let y = row as f32 * 20.0;\n\n                    let v = Vertex {\n                        pos: [x, y],\n                        uv: [0.0, 0.0],\n                        color: [1.0, 1.0, 1.0, 1.0],\n                    };\n\n                    for _ in 0..6 {\n                        vertices.push(v);\n                    }\n                }\n            }\n\n            black_box(vertices);\n        })\n    });\n\n    group.finish();\n}\n\n/// Benchmark incremental rendering (only dirty regions)\n/// This is the hot path - only redraw changed cells\nfn bench_incremental_rendering(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"incremental_render\");\n\n    let (cols, rows) = (80, 24);\n    let total_cells = cols * rows;\n\n    // Test different dirty region sizes (% of screen)\n    let dirty_percentages = vec![1, 5, 10, 25, 50, 100];\n\n    #[derive(Clone, Copy)]\n    struct Vertex {\n        pos: [f32; 2],\n        uv: [f32; 2],\n        color: [f32; 4],\n    }\n\n    for dirty_pct in dirty_percentages {\n        let dirty_count = (total_cells * dirty_pct) / 100;\n\n        group.throughput(Throughput::Elements(dirty_count as u64));\n        group.bench_with_input(\n            BenchmarkId::new(\"dirty_region\", format!(\"{}%\", dirty_pct)),\n            \u0026dirty_count,\n            |b, \u0026dirty_count| {\n                b.iter(|| {\n                    // Only render dirty cells\n                    let mut vertices = Vec::with_capacity(dirty_count * 6);\n\n                    for i in 0..dirty_count {\n                        let row = i / cols;\n                        let col = i % cols;\n\n                        let x = col as f32 * 10.0;\n                        let y = row as f32 * 20.0;\n\n                        let v = Vertex {\n                            pos: [x, y],\n                            uv: [0.0, 0.0],\n                            color: [1.0, 1.0, 1.0, 1.0],\n                        };\n\n                        for _ in 0..6 {\n                            vertices.push(v);\n                        }\n                    }\n\n                    black_box(vertices);\n                })\n            }\n        );\n    }\n\n    group.finish();\n}\n\ncriterion_group!(\n    name = fps_benches;\n    config = Criterion::default()\n        .sample_size(100)\n        .warm_up_time(Duration::from_secs(3))\n        .measurement_time(Duration::from_secs(10));\n    targets =\n        bench_dirty_cell_tracking,\n        bench_glyph_cache_lookup,\n        bench_gpu_command_submission,\n        bench_full_frame_cycle,\n        bench_incremental_rendering,\n);\n\ncriterion_main!(fps_benches);\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","benches","latency_e2e_lan.rs"],"content":"﻿//! End-to-End LAN Latency Benchmark\r\n//!\r\n//! Phase 1 Acceptance Criterion #5 Verification\r\n//! SRS Ãƒâ€šÃ‚Â§7.1: p95 \u003c 10ms (Phase 1 gate), SRS Ãƒâ€šÃ‚Â§5.1.2: LAN p95 \u003c 30ms\r\n//!\r\n//! This benchmark measures ACTUAL round-trip latency with:\r\n//! - Real WebSocket server (bound to network interface, not just loopback)\r\n//! - Real WebSocket client connection\r\n//! - Real protobuf encode/decode\r\n//! - Real PTY echo (when ConPTY backend is available)\r\n//!\r\n//! Unlike websocket_latency.rs (component simulation), this measures\r\n//! end-to-end network RTT to validate the acceptance criterion.\r\n//!\r\n//! Usage:\r\n//!   cargo bench --bench latency_e2e_lan\r\n//!\r\n//! Evidence Output:\r\n//!   - target/criterion/latency_e2e_lan/report/index.html\r\n//!   - target/criterion/latency_e2e_lan/base/estimates.json\r\n//!\r\n//! For Wireshark capture (manual):\r\n//!   1. Start: Wireshark, filter tcp.port == 8080\r\n//!   2. Run: cargo bench --bench latency_e2e_lan\r\n//!   3. Stop: Save as tests/evidence/phase1/criterion-5-latency/lan_traffic.pcapng\r\n//!   4. Statistics ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ Conversations ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ TCP ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ verify p95 \u003c 10ms\r\n\r\nuse criterion::{black_box, criterion_group, criterion_main, Criterion, BenchmarkId};\r\nuse std::time::{Duration, Instant};\r\nuse tokio::runtime::Runtime;\r\nuse std::net::SocketAddr;\r\nuse std::sync::Arc;\r\n\r\n// Server and auth components\r\nuse monoterminal_master::{server::TlsConfig,\r\n    auth::{AuthService, Ed25519AuthService, RateLimiter, UserId},\r\n    server::{Server, ServerConfig},\r\n    session::manager::SessionManager,\r\n};\r\nuse tokio::sync::{broadcast, oneshot};\r\nuse tracing::{info, debug, error, warn};\r\n\r\n// Protocol\r\nuse monoterminal_protocol::Envelope;\r\nuse prost::Message as ProstMessage;\r\n\r\n// Test utilities (WebSocket client)\r\n#[path = \"../tests/common/ws_client.rs\"]\r\nmod ws_client;\r\nuse ws_client::TestWsClient;\r\n\r\n/// Benchmark configuration\r\nconst SAMPLE_SIZE: usize = 10_000; // Per verification plan Ãƒâ€šÃ‚Â§3.5\r\nconst WARMUP_TIME_SECS: u64 = 3;\r\nconst MEASUREMENT_TIME_SECS: u64 = 30;  // 5 minutes / 10 = 30s per iteration\r\n\r\n// Short test configuration (for diagnostic runs)\r\n// Set LATENCY_SHORT_TEST=1 environment variable to use 100 samples instead of 10,000\r\nfn get_sample_size() -\u003e usize {\r\n    match std::env::var(\"LATENCY_SHORT_TEST\") {\r\n        Ok(val) if val == \"1\" =\u003e {\r\n            eprintln!(\"⚠️  SHORT TEST MODE: Using 100 samples (set by LATENCY_SHORT_TEST=1)\");\r\n            100\r\n        }\r\n        _ =\u003e SAMPLE_SIZE\r\n    }\r\n}\r\n\r\n// Progress logging interval (log every N iterations)\r\nconst PROGRESS_INTERVAL: u64 = 100;\r\n\r\n/// End-to-end RTT measurement with real WebSocket connection\r\n///\r\n/// Measures: Client ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ Encode ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ WebSocket Send ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ Server Receive ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ Decode ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢\r\n///           PTY Echo ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ Encode ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ WebSocket Send ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ Client Receive ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ Decode\r\n///\r\n/// This is the ACTUAL acceptance criterion: full stack, real network\r\nfn bench_e2e_websocket_rtt(c: \u0026mut Criterion) {\r\n    // Initialize tracing for debug logs\r\n    let _ = tracing_subscriber::fmt()\r\n        .with_max_level(tracing::Level::DEBUG)\r\n        .with_test_writer()\r\n        .try_init();\r\n\r\n    let rt = Runtime::new().unwrap();\r\n\r\n    let mut group = c.benchmark_group(\"e2e_lan_latency\");\r\n    let sample_size = get_sample_size();\r\n    group.sample_size(sample_size);\r\n    group.warm_up_time(Duration::from_secs(WARMUP_TIME_SECS));\r\n    group.measurement_time(Duration::from_secs(MEASUREMENT_TIME_SECS));\r\n\r\n    info!(\"📊 Benchmark configuration: {} samples, {}s warmup, {}s measurement\",\r\n          sample_size, WARMUP_TIME_SECS, MEASUREMENT_TIME_SECS);\r\n\r\n    // Bind to actual network interface (not just 127.0.0.1)\r\n    // For true LAN testing, use 0.0.0.0 and connect from another machine\r\n    let server_addr: SocketAddr = \"127.0.0.1:18080\".parse().unwrap();\r\n\r\n    // Real server benchmark with WebSocket + Ed25519/JWT + Session Manager\r\n    // Measures actual end-to-end latency with full protocol stack\r\n    //\r\n    // IMPORTANT: Server is set up ONCE outside iter_custom to avoid port binding conflicts\r\n    // across warmup iterations\r\n\r\n    // === SERVER SETUP (ONCE) ===\r\n    let (session_manager, auth_service, server_handle, bound_addr) = rt.block_on(async {\r\n        debug!(\"=== BENCHMARK SETUP: Starting server (once) ===\");\r\n\r\n        // 1. Generate test Ed25519 keypair (deterministic for testing)\r\n        let keypair = monoterminal_master::auth::Ed25519KeyPair::from_bytes(\u0026[0x42; 32]);\r\n\r\n        // 2. Create auth service\r\n        let auth_service = Arc::new(\r\n            Ed25519AuthService::new(\u0026keypair)\r\n                .expect(\"Failed to create auth service\")\r\n        );\r\n\r\n        // 3. Create rate limiter\r\n        let rate_limiter = Arc::new(RateLimiter::new());\r\n\r\n        // 4. Create session manager (with cmd.exe as default shell)\r\n        let session_manager = Arc::new(SessionManager::new(Some(\"cmd.exe\".to_string())));\r\n\r\n        // 5. Create health channel\r\n        let (health_tx, _health_rx) = broadcast::channel(16);\r\n\r\n        // 6. Create startup notification channel\r\n        let (startup_tx, startup_rx) = oneshot::channel();\r\n\r\n        // 7. Configure server\r\n        // Use workspace root-relative path (robust across different cargo working directories)\r\n        let workspace_root = std::path::PathBuf::from(env!(\"CARGO_MANIFEST_DIR\"))\r\n            .join(\"../..\")\r\n            .canonicalize()\r\n            .expect(\"Failed to resolve workspace root\");\r\n        let cert_dir = workspace_root.join(\"certs\");\r\n        let tls_config = monoterminal_master::server::TlsConfig {\r\n            cert_path: cert_dir.join(\"server.crt\"),\r\n            key_path: cert_dir.join(\"server.key\"),\r\n        };\r\n        let server_config = ServerConfig {\r\n            bind_addr: server_addr,\r\n            tls: tls_config,\r\n            ..Default::default()\r\n        };\r\n\r\n        // 8. Create server instance with startup notification\r\n        let server = Server::with_startup_notification(\r\n            server_config,\r\n            session_manager.clone(),\r\n            rate_limiter,\r\n            auth_service.clone(),\r\n            health_tx,\r\n            startup_tx,\r\n        ).expect(\"Failed to create server\");\r\n\r\n        // 9. Spawn server in background\r\n        let server_handle = tokio::spawn(async move {\r\n            server.run().await\r\n        });\r\n\r\n        // 10. Wait for server to successfully bind (with timeout)\r\n        let bound_addr = match tokio::time::timeout(Duration::from_secs(5), startup_rx).await {\r\n            Ok(Ok(addr)) =\u003e {\r\n                info!(\"✓ Server successfully bound to {}\", addr);\r\n                addr\r\n            }\r\n            Ok(Err(_)) =\u003e {\r\n                error!(\"✗ Server startup notification channel closed without sending address\");\r\n                panic!(\"Server startup failed: channel closed\");\r\n            }\r\n            Err(_) =\u003e {\r\n                error!(\"✗ Server startup timeout (5s) - server failed to bind\");\r\n                server_handle.abort();\r\n                panic!(\"Server startup timeout - check logs for bind errors\");\r\n            }\r\n        };\r\n\r\n        info!(\"✅ Server ready for benchmark\");\r\n\r\n        (session_manager, auth_service, server_handle, bound_addr)\r\n    });\r\n\r\n    group.bench_function(\"real_master_rtt_loopback\", |b| {\r\n        b.iter_custom(|iters| {\r\n            rt.block_on(async {\r\n                // === CLIENT SETUP (PER ITERATION) ===\r\n\r\n                debug!(\"=== CLIENT SETUP: Preparing WebSocket connection ===\");\r\n\r\n                // Generate JWT for authentication\r\n                let user_id = monoterminal_master::auth::UserId::from(\"benchmark-user\");\r\n                let tokens = auth_service\r\n                    .issue_tokens(\u0026user_id)\r\n                    .expect(\"Failed to issue tokens\");\r\n                let jwt_bearer = tokens.access;\r\n\r\n                // Create and connect WebSocket client (accept self-signed certs for testing)\r\n                let ws_url = format!(\"wss://{}\", bound_addr);\r\n                let mut client = TestWsClient::new_accept_invalid_certs(\u0026ws_url);\r\n                match client.connect().await {\r\n                    Ok(_) =\u003e debug!(\"✓ WebSocket client connected successfully\"),\r\n                    Err(e) =\u003e {\r\n                        error!(\"✗ WebSocket client connection failed: {}\", e);\r\n                        panic!(\"WebSocket connection failed: {}\", e);\r\n                    }\r\n                }\r\n\r\n                // Create session via SessionManager (server-side)\r\n                let session_id = match session_manager\r\n                    .create_session(\r\n                        None,  // Use default working directory\r\n                        24,    // rows\r\n                        80,    // cols\r\n                    )\r\n                    .await {\r\n                        Ok(id) =\u003e {\r\n                            debug!(\"✓ PTY session created: {}\", id);\r\n                            id\r\n                        }\r\n                        Err(e) =\u003e {\r\n                            error!(\"✗ Failed to create PTY session: {}\", e);\r\n                            panic!(\"PTY session creation failed: {}\", e);\r\n                        }\r\n                    };\r\n\r\n                // Give PTY time to initialize\r\n                tokio::time::sleep(Duration::from_millis(100)).await;\r\n\r\n                // Attach to session via WebSocket (proper E2E flow)\r\n                let _attach_response = match client\r\n                    .attach(\u0026session_id.to_string(), \u0026jwt_bearer, 24, 80)\r\n                    .await {\r\n                        Ok(resp) =\u003e {\r\n                            debug!(\"✓ Session attached successfully\");\r\n                            resp\r\n                        }\r\n                        Err(e) =\u003e {\r\n                            error!(\"✗ Failed to attach to session: {}\", e);\r\n                            let _ = session_manager.kill_session(session_id).await;\r\n                            panic!(\"Session attach failed: {}\", e);\r\n                        }\r\n                    };\r\n\r\n                // === MEASUREMENT LOOP ===\r\n                // Measure RTT: send InputData via WebSocket -\u003e receive OutputData via WebSocket\r\n\r\n                debug!(\"=== Starting measurement loop ({} iterations) ===\", iters);\r\n                let start = Instant::now();\r\n                let mut successful_iterations = 0u64;\r\n                let mut failed_iterations = 0u64;\r\n\r\n                for i in 0..iters {\r\n                    // Progress logging every PROGRESS_INTERVAL iterations\r\n                    if i \u003e 0 \u0026\u0026 i % PROGRESS_INTERVAL == 0 {\r\n                        debug!(\"📈 Progress: {}/{} iterations ({:.1}%), {} successful, {} failed\",\r\n                              i, iters, (i as f64 / iters as f64) * 100.0,\r\n                              successful_iterations, failed_iterations);\r\n                    }\r\n\r\n                    let rtt_start = Instant::now();\r\n\r\n                    // Send single character via WebSocket\r\n                    if let Err(e) = client.send_input(b\"x\", \u0026jwt_bearer).await {\r\n                        error!(\"Failed to send input at iteration {}: {}\", i, e);\r\n                        failed_iterations += 1;\r\n                        continue;\r\n                    }\r\n\r\n                    // Receive OutputData via WebSocket (with timeout)\r\n                    let timeout_duration = Duration::from_millis(100);\r\n                    match tokio::time::timeout(timeout_duration, client.recv()).await {\r\n                        Ok(Ok(msg)) =\u003e {\r\n                            // Decode protobuf Envelope\r\n                            if let tokio_tungstenite::tungstenite::Message::Binary(data) = msg {\r\n                                use prost::Message as ProstMessage;\r\n                                match Envelope::decode(\u0026data[..]) {\r\n                                    Ok(_envelope) =\u003e {\r\n                                        // Successfully received OutputData\r\n                                        successful_iterations += 1;\r\n                                    }\r\n                                    Err(e) =\u003e {\r\n                                        warn!(\"Failed to decode envelope at iteration {}: {}\", i, e);\r\n                                        failed_iterations += 1;\r\n                                    }\r\n                                }\r\n                            }\r\n                        }\r\n                        Ok(Err(e)) =\u003e {\r\n                            warn!(\"Recv error at iteration {}: {}\", i, e);\r\n                            failed_iterations += 1;\r\n                        }\r\n                        Err(_) =\u003e {\r\n                            warn!(\"Recv timeout at iteration {} (\u003e100ms)\", i);\r\n                            failed_iterations += 1;\r\n                        }\r\n                    }\r\n\r\n                    let rtt = rtt_start.elapsed();\r\n                    black_box(rtt);\r\n                }\r\n\r\n                debug!(\"✅ Measurement loop complete: {}/{} successful ({:.1}% success rate)\",\r\n                      successful_iterations, iters,\r\n                      (successful_iterations as f64 / iters as f64) * 100.0);\r\n\r\n                // === CLEANUP (PER ITERATION) ===\r\n                let _ = client.detach(\u0026session_id.to_string()).await;\r\n                let _ = client.close().await;\r\n                let _ = session_manager.kill_session(session_id).await;\r\n\r\n                start.elapsed()\r\n            })\r\n        });\r\n    });\r\n\r\n    // === SERVER CLEANUP (AFTER ALL BENCHMARKS) ===\r\n    server_handle.abort();\r\n\r\n    // TODO: Real master server benchmark (requires ConPTY + auth working)\r\n    // group.bench_function(\"real_master_rtt_lan\", |b| {\r\n    //     b.iter_custom(|iters| {\r\n    //         rt.block_on(async {\r\n    //             // 1. Start actual monoterminal-master\r\n    //             // 2. Authenticate\r\n    //             // 3. Attach to session\r\n    //             // 4. Measure InputData ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ OutputData RTT\r\n    //         })\r\n    //     });\r\n    // });\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Latency under concurrent load\r\n/// Validates p95 stays \u003c10ms even with multiple active sessions\r\nfn bench_e2e_concurrent_sessions(c: \u0026mut Criterion) {\r\n    let rt = Runtime::new().unwrap();\r\n    let mut group = c.benchmark_group(\"e2e_concurrent\");\r\n\r\n    for n_sessions in [1, 5, 10, 20].iter() {\r\n        group.bench_with_input(\r\n            BenchmarkId::from_parameter(n_sessions),\r\n            n_sessions,\r\n            |b, \u0026n| {\r\n                b.iter_custom(|iters| {\r\n                    rt.block_on(async {\r\n                        // TODO: Spawn N concurrent sessions\r\n                        // Measure RTT for each, verify p95 \u003c 10ms holds\r\n                        let start = Instant::now();\r\n\r\n                        for _i in 0..iters {\r\n                            // Simulate concurrent session processing\r\n                            black_box(n);\r\n                        }\r\n\r\n                        start.elapsed()\r\n                    })\r\n                });\r\n            }\r\n        );\r\n    }\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Network packet overhead measurement\r\n/// Validates protobuf wire format meets latency budget\r\nfn bench_network_packet_overhead(c: \u0026mut Criterion) {\r\n    use monoterminal_protocol::{Envelope, InputData, OutputData};\r\n    use prost::Message;\r\n\r\n    let mut group = c.benchmark_group(\"network_overhead\");\r\n\r\n    // Measure InputData encode + decode (client ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ server path)\r\n    group.bench_function(\"input_data_round_trip\", |b| {\r\n        let input = InputData {\r\n            data: b\"x\".to_vec(),\r\n            auth_token: String::new(),\r\n        };\r\n\r\n        let envelope = Envelope {\r\n            sequence_number: 1,\r\n            message: Some(monoterminal_protocol::envelope::Message::InputData(input)),\r\n        };\r\n\r\n        b.iter(|| {\r\n            // Encode\r\n            let mut buf = Vec::new();\r\n            envelope.encode(\u0026mut buf).unwrap();\r\n\r\n            // Decode (simulates network transmission)\r\n            let decoded = Envelope::decode(\u0026buf[..]).unwrap();\r\n\r\n            black_box(decoded);\r\n        })\r\n    });\r\n\r\n    // Measure OutputData encode + decode (server ÃƒÂ¢Ã¢â‚¬Â Ã¢â‚¬â„¢ client path)\r\n    group.bench_function(\"output_data_round_trip\", |b| {\r\n        let output = OutputData {\r\n            data: vec![b'x', b'\\r', b'\\n'],\r\n            sequence: 100,\r\n            compression: 0,\r\n        };\r\n\r\n        let envelope = Envelope {\r\n            sequence_number: 2,\r\n            message: Some(monoterminal_protocol::envelope::Message::OutputData(output)),\r\n        };\r\n\r\n        b.iter(|| {\r\n            let mut buf = Vec::new();\r\n            envelope.encode(\u0026mut buf).unwrap();\r\n\r\n            let decoded = Envelope::decode(\u0026buf[..]).unwrap();\r\n            black_box(decoded);\r\n        })\r\n    });\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Component latency budget breakdown\r\n/// Validates each stage contributes \u003c 2ms to total \u003c10ms budget\r\nfn bench_latency_budget_breakdown(c: \u0026mut Criterion) {\r\n    use monoterminal_protocol::{Envelope, InputData, OutputData};\r\n    use prost::Message;\r\n\r\n    let mut group = c.benchmark_group(\"latency_budget\");\r\n\r\n    // Stage 1: Client encode (budget: \u003c0.5ms)\r\n    group.bench_function(\"stage1_client_encode\", |b| {\r\n        let input = InputData {\r\n            data: b\"x\".to_vec(),\r\n            auth_token: String::new(),\r\n        };\r\n\r\n        let envelope = Envelope {\r\n            sequence_number: 1,\r\n            message: Some(monoterminal_protocol::envelope::Message::InputData(input)),\r\n        };\r\n\r\n        b.iter(|| {\r\n            let mut buf = Vec::new();\r\n            envelope.encode(\u0026mut buf).unwrap();\r\n            black_box(buf);\r\n        })\r\n    });\r\n\r\n    // Stage 2: Network transmission (budget: \u003c3ms for LAN, measured separately)\r\n    // Not measured here - use Wireshark for actual wire time\r\n\r\n    // Stage 3: Server decode (budget: \u003c0.5ms)\r\n    group.bench_function(\"stage3_server_decode\", |b| {\r\n        let input = InputData {\r\n            data: b\"x\".to_vec(),\r\n            auth_token: String::new(),\r\n        };\r\n\r\n        let envelope = Envelope {\r\n            sequence_number: 1,\r\n            message: Some(monoterminal_protocol::envelope::Message::InputData(input)),\r\n        };\r\n\r\n        let mut buf = Vec::new();\r\n        envelope.encode(\u0026mut buf).unwrap();\r\n\r\n        b.iter(|| {\r\n            let decoded = Envelope::decode(\u0026buf[..]).unwrap();\r\n            black_box(decoded);\r\n        })\r\n    });\r\n\r\n    // Stage 4: PTY write + read echo (budget: \u003c2ms)\r\n    group.bench_function(\"stage4_pty_echo\", |b| {\r\n        b.iter(|| {\r\n            // Simulate PTY echo (actual measurement requires ConPTY)\r\n            let input = b\"x\\n\";\r\n            let output = vec![b'x', b'\\r', b'\\n'];\r\n            black_box((input, output));\r\n        })\r\n    });\r\n\r\n    // Stage 5: Server encode (budget: \u003c0.5ms)\r\n    group.bench_function(\"stage5_server_encode\", |b| {\r\n        let output = OutputData {\r\n            data: vec![b'x', b'\\r', b'\\n'],\r\n            sequence: 100,\r\n            compression: 0,\r\n        };\r\n\r\n        let envelope = Envelope {\r\n            sequence_number: 2,\r\n            message: Some(monoterminal_protocol::envelope::Message::OutputData(output)),\r\n        };\r\n\r\n        b.iter(|| {\r\n            let mut buf = Vec::new();\r\n            envelope.encode(\u0026mut buf).unwrap();\r\n            black_box(buf);\r\n        })\r\n    });\r\n\r\n    // Stage 6: Network transmission back (budget: \u003c3ms)\r\n    // See stage 2\r\n\r\n    // Stage 7: Client decode + render trigger (budget: \u003c0.5ms)\r\n    group.bench_function(\"stage7_client_decode\", |b| {\r\n        let output = OutputData {\r\n            data: vec![b'x', b'\\r', b'\\n'],\r\n            sequence: 100,\r\n            compression: 0,\r\n        };\r\n\r\n        let envelope = Envelope {\r\n            sequence_number: 2,\r\n            message: Some(monoterminal_protocol::envelope::Message::OutputData(output)),\r\n        };\r\n\r\n        let mut buf = Vec::new();\r\n        envelope.encode(\u0026mut buf).unwrap();\r\n\r\n        b.iter(|| {\r\n            let decoded = Envelope::decode(\u0026buf[..]).unwrap();\r\n            black_box(decoded);\r\n        })\r\n    });\r\n\r\n    group.finish();\r\n}\r\n\r\n// ============================================================================\r\n// Mock Infrastructure (to be replaced with real server once stable)\r\n// ============================================================================\r\n\r\n/// Mock WebSocket echo server for baseline latency measurement\r\nasync fn mock_websocket_echo_server(addr: SocketAddr) {\r\n    use tokio::net::TcpListener;\r\n    use tokio_tungstenite::accept_async;\r\n    use futures_util::{StreamExt, SinkExt};\r\n\r\n    let listener = TcpListener::bind(addr).await.unwrap();\r\n\r\n    while let Ok((stream, _)) = listener.accept().await {\r\n        tokio::spawn(async move {\r\n            let mut ws = accept_async(stream).await.unwrap();\r\n\r\n            while let Some(msg) = ws.next().await {\r\n                if let Ok(msg) = msg {\r\n                    // Echo back immediately\r\n                    ws.send(msg).await.ok();\r\n                }\r\n            }\r\n        });\r\n    }\r\n}\r\n\r\n/// Mock WebSocket client for RTT measurement\r\nstruct MockWebSocketClient {\r\n    // TODO: Implement actual client using tokio-tungstenite\r\n}\r\n\r\nimpl MockWebSocketClient {\r\n    async fn connect(_url: \u0026str) -\u003e Result\u003cSelf, Box\u003cdyn std::error::Error\u003e\u003e {\r\n        // TODO: Implement real connection\r\n        Ok(Self {})\r\n    }\r\n\r\n    async fn measure_rtt_with_echo(\u0026self, _data: Vec\u003cu8\u003e) -\u003e Result\u003cDuration, Box\u003cdyn std::error::Error\u003e\u003e {\r\n        // TODO: Implement real RTT measurement\r\n        // For now, return simulated latency\r\n        Ok(Duration::from_micros(500)) // Simulated 0.5ms\r\n    }\r\n}\r\n\r\ncriterion_group!(\r\n    name = e2e_latency_benches;\r\n    config = Criterion::default()\r\n        .sample_size(SAMPLE_SIZE)\r\n        .warm_up_time(Duration::from_secs(WARMUP_TIME_SECS))\r\n        .measurement_time(Duration::from_secs(MEASUREMENT_TIME_SECS));\r\n    targets =\r\n        bench_e2e_websocket_rtt,\r\n        bench_e2e_concurrent_sessions,\r\n        bench_network_packet_overhead,\r\n        bench_latency_budget_breakdown,\r\n);\r\n\r\ncriterion_main!(e2e_latency_benches);\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","benches","pty_throughput.rs"],"content":"//! PTY throughput benchmarks\n//!\n//! Validates SRS §6.1 PTY read performance:\n//! - Raw read throughput (MB/s)\n//! - UTF-8 validation overhead\n//! - Ring buffer append performance\n\nuse criterion::{black_box, criterion_group, criterion_main, Criterion, Throughput, BenchmarkId};\nuse std::collections::VecDeque;\n\n/// Simulates ring buffer operations for scrollback\nfn bench_ring_buffer_append(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"ring_buffer\");\n\n    const CAPACITY: usize = 10_000;\n    let mut buffer: VecDeque\u003cString\u003e = VecDeque::with_capacity(CAPACITY);\n\n    group.bench_function(\"append_with_eviction\", |b| {\n        b.iter(|| {\n            let line = \"This is a typical terminal line with some ANSI codes \\x1b[32mgreen\\x1b[0m\";\n\n            if buffer.len() \u003e= CAPACITY {\n                buffer.pop_front();\n            }\n            buffer.push_back(black_box(line.to_string()));\n        })\n    });\n\n    group.finish();\n}\n\n/// Simulates UTF-8 validation of PTY output\nfn bench_utf8_validation(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"utf8_validation\");\n\n    // Various sizes of UTF-8 data\n    for size in [256, 1024, 4096, 16384].iter() {\n        let data = \"Hello, 世界! 🚀 Terminal output\\n\".repeat(*size / 32);\n        let bytes = data.as_bytes();\n\n        group.throughput(Throughput::Bytes(bytes.len() as u64));\n        group.bench_with_input(BenchmarkId::from_parameter(size), \u0026bytes, |b, bytes| {\n            b.iter(|| {\n                let validated = std::str::from_utf8(black_box(bytes)).unwrap();\n                black_box(validated);\n            })\n        });\n    }\n\n    group.finish();\n}\n\n/// Simulates VT sequence parsing (simplified)\nfn bench_ansi_parsing(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"ansi_parsing\");\n\n    let input = \"\\x1b[32mGreen text\\x1b[0m Normal \\x1b[1;31mBold Red\\x1b[0m\\n\".repeat(100);\n\n    group.throughput(Throughput::Bytes(input.len() as u64));\n    group.bench_function(\"strip_ansi\", |b| {\n        b.iter(|| {\n            // Simplified ANSI stripping - just count escapes\n            let count = input.matches('\\x1b').count();\n            black_box(count);\n        })\n    });\n\n    group.finish();\n}\n\n/// Simulates scrollback retrieval (lines/sec)\nfn bench_scrollback_retrieval(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"scrollback_retrieval\");\n\n    // Prepare scrollback buffer\n    const LINES: usize = 10_000;\n    let scrollback: Vec\u003cString\u003e = (0..LINES)\n        .map(|i| format!(\"Line {:05} - typical terminal output with some content here\", i))\n        .collect();\n\n    // Benchmark retrieving chunks\n    for chunk_size in [100, 500, 1000, 5000].iter() {\n        group.throughput(Throughput::Elements(*chunk_size as u64));\n        group.bench_with_input(\n            BenchmarkId::new(\"retrieve_lines\", chunk_size),\n            chunk_size,\n            |b, \u0026size| {\n                b.iter(|| {\n                    let start = 0;\n                    let end = size.min(scrollback.len());\n                    let chunk = \u0026scrollback[start..end];\n                    black_box(chunk);\n                })\n            }\n        );\n    }\n\n    group.finish();\n}\n\n/// Simulates compression of scrollback lines (zstd level 3)\nfn bench_scrollback_compression(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"scrollback_compression\");\n\n    // 1000 lines to compress (batch)\n    let lines: Vec\u003cString\u003e = (0..1000)\n        .map(|i| format!(\"Line {:05} - terminal output content here\\n\", i))\n        .collect();\n    let joined = lines.join(\"\");\n    let bytes = joined.as_bytes();\n\n    group.throughput(Throughput::Bytes(bytes.len() as u64));\n    group.bench_function(\"compress_1000_lines\", |b| {\n        b.iter(|| {\n            let compressed = zstd::bulk::compress(black_box(bytes), 3).unwrap();\n            black_box(compressed);\n        })\n    });\n\n    group.finish();\n}\n\ncriterion_group!(\n    benches,\n    bench_ring_buffer_append,\n    bench_utf8_validation,\n    bench_ansi_parsing,\n    bench_scrollback_retrieval,\n    bench_scrollback_compression,\n);\n\ncriterion_main!(benches);\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","benches","websocket_latency.rs"],"content":"//! WebSocket Round-Trip Latency Benchmarks\r\n//!\r\n//! Validates SRS §7.1 Phase 1 acceptance criterion #5:\r\n//! - p50 \u003c 5ms\r\n//! - p95 \u003c 10ms (Phase 1 acceptance gate)\r\n//! - p99 \u003c 15ms\r\n//!\r\n//! Measures full round-trip time:\r\n//! 1. Client sends InputData (keypress)\r\n//! 2. Master receives, processes, echoes back\r\n//! 3. Client receives OutputData\r\n//! 4. Total latency = step 4 timestamp - step 1 timestamp\r\n//!\r\n//! This validates SRS §5.1.2 latency targets for LAN scenarios.\r\n\r\nuse criterion::{black_box, criterion_group, criterion_main, Criterion, BenchmarkId, Throughput};\r\nuse std::time::{Duration, Instant};\r\n\r\n/// Simulates WebSocket message serialization overhead\r\n/// This is part of the total RTT budget\r\nfn bench_message_serialization(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"websocket_serialization\");\r\n\r\n    use monoterminal_protocol::{Envelope, InputData, OutputData};\r\n    use prost::Message;\r\n\r\n    // Benchmark encoding InputData (client -\u003e server)\r\n    group.bench_function(\"encode_input_data\", |b| {\r\n        let input = InputData {\r\n            data: b\"x\".to_vec(),  // Single keypress\r\n            auth_token: String::new(),\r\n        };\r\n\r\n        let envelope = Envelope {\r\n            sequence_number: 1,\r\n            message: Some(monoterminal_protocol::envelope::Message::InputData(input)),\r\n        };\r\n\r\n        b.iter(|| {\r\n            let mut buf = Vec::new();\r\n            envelope.encode(\u0026mut buf).unwrap();\r\n            black_box(buf);\r\n        })\r\n    });\r\n\r\n    // Benchmark decoding InputData (server side)\r\n    group.bench_function(\"decode_input_data\", |b| {\r\n        let input = InputData {\r\n            data: b\"x\".to_vec(),\r\n            auth_token: String::new(),\r\n        };\r\n\r\n        let envelope = Envelope {\r\n            sequence_number: 1,\r\n            message: Some(monoterminal_protocol::envelope::Message::InputData(input)),\r\n        };\r\n\r\n        let mut buf = Vec::new();\r\n        envelope.encode(\u0026mut buf).unwrap();\r\n\r\n        b.iter(|| {\r\n            let decoded = Envelope::decode(black_box(\u0026buf[..])).unwrap();\r\n            black_box(decoded);\r\n        })\r\n    });\r\n\r\n    // Benchmark encoding OutputData (server -\u003e client)\r\n    for size in [1, 64, 256, 1024].iter() {\r\n        let output = OutputData {\r\n            data: vec![b'x'; *size],\r\n            sequence: 100,\r\n            compression: 0,  // No compression for latency-sensitive small messages\r\n        };\r\n\r\n        let envelope = Envelope {\r\n            sequence_number: 1,\r\n            message: Some(monoterminal_protocol::envelope::Message::OutputData(output)),\r\n        };\r\n\r\n        group.throughput(Throughput::Bytes(*size as u64));\r\n        group.bench_with_input(\r\n            BenchmarkId::new(\"encode_output_data\", size),\r\n            size,\r\n            |b, _| {\r\n                b.iter(|| {\r\n                    let mut buf = Vec::new();\r\n                    envelope.encode(\u0026mut buf).unwrap();\r\n                    black_box(buf);\r\n                })\r\n            }\r\n        );\r\n    }\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Simulates PTY echo latency (time from input to output)\r\n/// Target: \u003c 2ms (part of total \u003c10ms RTT budget)\r\nfn bench_pty_echo_latency(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"pty_echo\");\r\n\r\n    // Simulate writing to PTY and reading back the echo\r\n    group.bench_function(\"write_read_echo\", |b| {\r\n        b.iter(|| {\r\n            // Simulate PTY write (system call overhead)\r\n            let input = b\"x\\n\";\r\n            black_box(input);\r\n\r\n            // Simulate PTY read (poll + read system call)\r\n            let output = vec![b'x', b'\\r', b'\\n'];\r\n            black_box(output);\r\n        })\r\n    });\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Simulates session fan-out broadcast overhead\r\n/// Measures time to broadcast output to N concurrent clients\r\nfn bench_session_fanout(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"session_fanout\");\r\n\r\n    use monoterminal_protocol::{Envelope, OutputData};\r\n    use prost::Message;\r\n    use std::sync::Arc;\r\n\r\n    let output_data = OutputData {\r\n        data: vec![b'x'; 256],  // Typical output chunk\r\n        sequence: 100,\r\n        compression: 0,\r\n    };\r\n\r\n    let envelope = Envelope {\r\n        sequence_number: 1,\r\n        message: Some(monoterminal_protocol::envelope::Message::OutputData(output_data)),\r\n    };\r\n\r\n    let mut buf = Vec::new();\r\n    envelope.encode(\u0026mut buf).unwrap();\r\n    let arc_bytes = Arc::new(buf);\r\n\r\n    // Test broadcasting to N clients\r\n    for n_clients in [1, 2, 5, 10, 20].iter() {\r\n        group.throughput(Throughput::Elements(*n_clients as u64));\r\n        group.bench_with_input(\r\n            BenchmarkId::new(\"broadcast_to_clients\", n_clients),\r\n            n_clients,\r\n            |b, \u0026n| {\r\n                b.iter(|| {\r\n                    // Simulate cloning Arc for each client (zero-copy)\r\n                    for _ in 0..n {\r\n                        let client_copy = arc_bytes.clone();\r\n                        black_box(client_copy);\r\n                    }\r\n                })\r\n            }\r\n        );\r\n    }\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Simulates full end-to-end latency components\r\n/// This adds up all the pieces to validate the \u003c10ms target\r\nfn bench_simulated_rtt_components(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"simulated_rtt\");\r\n\r\n    use monoterminal_protocol::{Envelope, InputData, OutputData};\r\n    use prost::Message;\r\n\r\n    group.bench_function(\"full_rtt_simulation\", |b| {\r\n        b.iter_custom(|iters| {\r\n            let start = Instant::now();\r\n\r\n            for _i in 0..iters {\r\n                // 1. Client: Encode InputData\r\n                let input = InputData {\r\n                    data: b\"x\".to_vec(),\r\n                    auth_token: String::new(),\r\n                };\r\n\r\n                let input_envelope = Envelope {\r\n                    sequence_number: 1,\r\n                    message: Some(monoterminal_protocol::envelope::Message::InputData(input)),\r\n                };\r\n\r\n                let mut input_buf = Vec::new();\r\n                input_envelope.encode(\u0026mut input_buf).unwrap();\r\n                black_box(\u0026input_buf);\r\n\r\n                // 2. Server: Decode InputData\r\n                let decoded_input = Envelope::decode(\u0026input_buf[..]).unwrap();\r\n                black_box(decoded_input);\r\n\r\n                // 3. Server: Simulate PTY write + read (echo)\r\n                black_box(b\"x\\r\\n\");\r\n\r\n                // 4. Server: Encode OutputData\r\n                let output = OutputData {\r\n                    data: vec![b'x', b'\\r', b'\\n'],\r\n                    sequence: 100,\r\n                    compression: 0,\r\n                };\r\n\r\n                let output_envelope = Envelope {\r\n                    sequence_number: 2,\r\n                    message: Some(monoterminal_protocol::envelope::Message::OutputData(output)),\r\n                };\r\n\r\n                let mut output_buf = Vec::new();\r\n                output_envelope.encode(\u0026mut output_buf).unwrap();\r\n                black_box(\u0026output_buf);\r\n\r\n                // 5. Client: Decode OutputData\r\n                let decoded_output = Envelope::decode(\u0026output_buf[..]).unwrap();\r\n                black_box(decoded_output);\r\n            }\r\n\r\n            start.elapsed()\r\n        })\r\n    });\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Benchmark queue backpressure handling\r\n/// Ensures latency stays low even under high load\r\nfn bench_queue_backpressure(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"queue_backpressure\");\r\n\r\n    use std::collections::VecDeque;\r\n\r\n    const MAX_QUEUE_SIZE: usize = 1024;  // 1MB buffer (1KB per message)\r\n\r\n    let mut queue: VecDeque\u003cVec\u003cu8\u003e\u003e = VecDeque::with_capacity(MAX_QUEUE_SIZE);\r\n\r\n    // Pre-fill queue to 80% capacity (simulate moderate load)\r\n    for _ in 0..(MAX_QUEUE_SIZE * 80 / 100) {\r\n        queue.push_back(vec![0u8; 1024]);\r\n    }\r\n\r\n    group.bench_function(\"enqueue_with_eviction\", |b| {\r\n        b.iter(|| {\r\n            if queue.len() \u003e= MAX_QUEUE_SIZE {\r\n                queue.pop_front();  // Drop oldest (FIFO eviction)\r\n            }\r\n\r\n            queue.push_back(black_box(vec![0u8; 1024]));\r\n        })\r\n    });\r\n\r\n    group.finish();\r\n}\r\n\r\n/// Benchmark latency under concurrent load\r\n/// Validates that p95 stays \u003c10ms even with multiple active sessions\r\nfn bench_concurrent_sessions_latency(c: \u0026mut Criterion) {\r\n    let mut group = c.benchmark_group(\"concurrent_latency\");\r\n\r\n    use monoterminal_protocol::{Envelope, OutputData};\r\n    use prost::Message;\r\n    use std::sync::Arc;\r\n\r\n    // Simulate output from multiple sessions being processed concurrently\r\n    for n_sessions in [1, 5, 10, 20].iter() {\r\n        let mut session_outputs: Vec\u003cVec\u003cu8\u003e\u003e = Vec::new();\r\n\r\n        for _i in 0..*n_sessions {\r\n            let output = OutputData {\r\n                data: vec![b'x'; 256],\r\n                sequence: 100,\r\n                compression: 0,\r\n            };\r\n\r\n            let envelope = Envelope {\r\n                sequence_number: 1,\r\n                message: Some(monoterminal_protocol::envelope::Message::OutputData(output)),\r\n            };\r\n\r\n            let mut buf = Vec::new();\r\n            envelope.encode(\u0026mut buf).unwrap();\r\n            session_outputs.push(buf);\r\n        }\r\n\r\n        group.throughput(Throughput::Elements(*n_sessions as u64));\r\n        group.bench_with_input(\r\n            BenchmarkId::new(\"process_sessions\", n_sessions),\r\n            \u0026session_outputs,\r\n            |b, outputs| {\r\n                b.iter(|| {\r\n                    // Simulate processing output from all sessions\r\n                    for output in outputs {\r\n                        let decoded = Envelope::decode(\u0026output[..]).unwrap();\r\n                        black_box(decoded);\r\n                    }\r\n                })\r\n            }\r\n        );\r\n    }\r\n\r\n    group.finish();\r\n}\r\n\r\ncriterion_group!(\r\n    name = latency_benches;\r\n    config = Criterion::default()\r\n        .sample_size(10_000)  // Large sample for accurate p95/p99 measurement\r\n        .warm_up_time(Duration::from_secs(5))\r\n        .measurement_time(Duration::from_secs(20));\r\n    targets =\r\n        bench_message_serialization,\r\n        bench_pty_echo_latency,\r\n        bench_session_fanout,\r\n        bench_simulated_rtt_components,\r\n        bench_queue_backpressure,\r\n        bench_concurrent_sessions_latency,\r\n);\r\n\r\ncriterion_main!(latency_benches);\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","examples","fps_test.rs"],"content":"//! FPS Verification Test - Criterion #1 (60 FPS Master Rendering)\n//!\n//! Standalone test program that:\n//! 1. Creates Window + wgpu Renderer\n//! 2. Simulates PTY output stream\n//! 3. Measures frame times over 60 seconds\n//! 4. Reports FPS statistics and pass/fail vs 60 FPS target\n//! 5. Saves evidence to tests/evidence/phase1/criterion-1-fps/\n//!\n//! Usage: cargo run --example fps_test --release\n//!\n//! Per SRS §7.1 Phase 1 Acceptance Criterion #1:\n//! - Target: ≥60 FPS (16.67ms frame budget)\n//! - Platform: Windows 10 1809+\n//! - Backend: DirectX 12 (wgpu)\n\nuse monoterminal_master::ui::{Renderer, performance::PerformanceMonitor};\nuse anyhow::Result;\nuse std::sync::Arc;\nuse std::time::{Duration, Instant};\nuse tokio::sync::mpsc;\nuse bytes::Bytes;\nuse winit::{\n    application::ApplicationHandler,\n    event::WindowEvent,\n    event_loop::{ActiveEventLoop, EventLoop},\n    window::{Window as WinitWindow, WindowAttributes},\n};\n\n/// Test duration: 60 seconds\nconst TEST_DURATION_SECS: u64 = 60;\n\n/// FPS measurement interval: 1 second\nconst MEASUREMENT_INTERVAL_MS: u128 = 1000;\n\n/// Frame time samples to collect\nconst SAMPLE_SIZE: usize = (TEST_DURATION_SECS * 1000 / 16) as usize; // ~3600 samples at 60 FPS\n\n/// FPS test application\nstruct FpsTestApp {\n    window_attributes: WindowAttributes,\n    window: Option\u003cArc\u003cWinitWindow\u003e\u003e,\n    renderer: Renderer,\n    perf_monitor: PerformanceMonitor,\n\n    // Test state\n    test_start: Option\u003cInstant\u003e,\n    frame_times: Vec\u003cf32\u003e,\n    fps_samples: Vec\u003cf32\u003e,\n    last_fps_report: Instant,\n    frames_this_second: u32,\n\n    // Mock PTY data generator\n    pty_tx: mpsc::Sender\u003cBytes\u003e,\n}\n\nimpl FpsTestApp {\n    fn new(window_attributes: WindowAttributes, renderer: Renderer, pty_tx: mpsc::Sender\u003cBytes\u003e) -\u003e Self {\n        Self {\n            window_attributes,\n            window: None,\n            renderer,\n            perf_monitor: PerformanceMonitor::new(),\n            test_start: None,\n            frame_times: Vec::with_capacity(SAMPLE_SIZE),\n            fps_samples: Vec::new(),\n            last_fps_report: Instant::now(),\n            frames_this_second: 0,\n            pty_tx,\n        }\n    }\n\n    /// Calculate FPS from frame times\n    fn calculate_fps(\u0026self, frame_time_ms: f32) -\u003e f32 {\n        if frame_time_ms \u003e 0.0 {\n            1000.0 / frame_time_ms\n        } else {\n            0.0\n        }\n    }\n\n    /// Generate test report\n    fn generate_report(\u0026self) {\n        println!(\"\\n========== FPS VERIFICATION REPORT ==========\\n\");\n\n        if self.frame_times.is_empty() {\n            println!(\"❌ NO DATA COLLECTED\");\n            return;\n        }\n\n        // Calculate statistics\n        let count = self.frame_times.len();\n        let sum: f32 = self.frame_times.iter().sum();\n        let mean = sum / count as f32;\n\n        let mut sorted = self.frame_times.clone();\n        sorted.sort_by(|a, b| a.partial_cmp(b).unwrap());\n\n        let min = sorted[0];\n        let max = sorted[count - 1];\n        let median = sorted[count / 2];\n        let p95 = sorted[(count * 95) / 100];\n        let p99 = sorted[(count * 99) / 100];\n\n        let mean_fps = self.calculate_fps(mean);\n        let median_fps = self.calculate_fps(median);\n        let p95_fps = self.calculate_fps(p95);\n\n        println!(\"Test Duration: {} seconds\", TEST_DURATION_SECS);\n        println!(\"Frames Rendered: {}\", count);\n        println!();\n\n        println!(\"Frame Time Statistics (ms):\");\n        println!(\"  Mean:    {:.2} ms ({:.2} FPS)\", mean, mean_fps);\n        println!(\"  Median:  {:.2} ms ({:.2} FPS)\", median, median_fps);\n        println!(\"  P95:     {:.2} ms ({:.2} FPS)\", p95, p95_fps);\n        println!(\"  P99:     {:.2} ms\", p99);\n        println!(\"  Min:     {:.2} ms\", min);\n        println!(\"  Max:     {:.2} ms\", max);\n        println!();\n\n        // Pass/Fail verdict\n        println!(\"SRS §7.1 Criterion #1 Requirement: ≥60 FPS\");\n        println!(\"  Target Frame Time: ≤16.67 ms\");\n        println!();\n\n        let passed_mean = mean_fps \u003e= 60.0;\n        let passed_median = median_fps \u003e= 60.0;\n        let passed_p95 = p95 \u003c= 16.67;\n        let passed_overall = passed_mean \u0026\u0026 passed_median \u0026\u0026 passed_p95;\n\n        println!(\"Verdict:\");\n        println!(\"  Mean FPS ≥60:     {} ({:.2} FPS)\", if passed_mean { \"✅ PASS\" } else { \"❌ FAIL\" }, mean_fps);\n        println!(\"  Median FPS ≥60:   {} ({:.2} FPS)\", if passed_median { \"✅ PASS\" } else { \"❌ FAIL\" }, median_fps);\n        println!(\"  P95 Frame ≤16.67: {} ({:.2} ms)\", if passed_p95 { \"✅ PASS\" } else { \"❌ FAIL\" }, p95);\n        println!();\n\n        if passed_overall {\n            println!(\"🎉 CRITERION #1: PASS ✅\");\n            println!(\"   60 FPS rendering target achieved on Windows DirectX 12\");\n        } else {\n            println!(\"❌ CRITERION #1: FAIL\");\n            println!(\"   60 FPS target not met - performance optimization required\");\n        }\n\n        println!(\"\\n============================================\\n\");\n\n        // Save report to file\n        if let Err(e) = self.save_report_to_file(passed_overall, mean_fps, median_fps, p95, \u0026sorted) {\n            eprintln!(\"⚠️  Failed to save report to file: {}\", e);\n        }\n    }\n\n    /// Save report to tests/evidence/phase1/criterion-1-fps/VERIFICATION.md\n    fn save_report_to_file(\u0026self, passed: bool, mean_fps: f32, median_fps: f32, p95_ms: f32, sorted_times: \u0026[f32]) -\u003e Result\u003c()\u003e {\n        use std::fs;\n        use std::io::Write;\n\n        let evidence_dir = \"tests/evidence/phase1/criterion-1-fps\";\n        fs::create_dir_all(evidence_dir)?;\n\n        let timestamp = chrono::Local::now().format(\"%Y%m%d_%H%M%S\");\n        let report_path = format!(\"{}/VERIFICATION_{}.md\", evidence_dir, timestamp);\n\n        let mut file = fs::File::create(\u0026report_path)?;\n\n        writeln!(file, \"# Criterion #1: 60 FPS Rendering - Verification Report\")?;\n        writeln!(file)?;\n        writeln!(file, \"**Date:** {}\", chrono::Local::now().format(\"%Y-%m-%d %H:%M:%S\"))?;\n        writeln!(file, \"**Platform:** Windows 10 (DirectX 12)\")?;\n        writeln!(file, \"**Test Duration:** {} seconds\", TEST_DURATION_SECS)?;\n        writeln!(file, \"**Frames Rendered:** {}\", self.frame_times.len())?;\n        writeln!(file)?;\n        writeln!(file, \"## Summary\")?;\n        writeln!(file)?;\n        writeln!(file, \"**Verdict:** {}\", if passed { \"✅ PASS\" } else { \"❌ FAIL\" })?;\n        writeln!(file)?;\n        writeln!(file, \"| Metric | Value | Target | Status |\")?;\n        writeln!(file, \"|--------|-------|--------|--------|\")?;\n        writeln!(file, \"| Mean FPS | {:.2} | ≥60 | {} |\", mean_fps, if mean_fps \u003e= 60.0 { \"✅\" } else { \"❌\" })?;\n        writeln!(file, \"| Median FPS | {:.2} | ≥60 | {} |\", median_fps, if median_fps \u003e= 60.0 { \"✅\" } else { \"❌\" })?;\n        writeln!(file, \"| P95 Frame Time | {:.2} ms | ≤16.67 ms | {} |\", p95_ms, if p95_ms \u003c= 16.67 { \"✅\" } else { \"❌\" })?;\n        writeln!(file)?;\n        writeln!(file, \"## Frame Time Distribution\")?;\n        writeln!(file)?;\n        writeln!(file, \"| Percentile | Frame Time (ms) | FPS Equivalent |\")?;\n        writeln!(file, \"|------------|-----------------|----------------|\")?;\n\n        let percentiles = [0, 25, 50, 75, 90, 95, 99, 100];\n        for \u0026p in \u0026percentiles {\n            let idx = if p == 100 { sorted_times.len() - 1 } else { (sorted_times.len() * p) / 100 };\n            let time = sorted_times[idx];\n            let fps = self.calculate_fps(time);\n            writeln!(file, \"| P{} | {:.2} ms | {:.2} FPS |\", p, time, fps)?;\n        }\n\n        writeln!(file)?;\n        writeln!(file, \"## Test Configuration\")?;\n        writeln!(file)?;\n        writeln!(file, \"- **Renderer:** wgpu + DirectX 12\")?;\n        writeln!(file, \"- **Window Size:** 1280x720\")?;\n        writeln!(file, \"- **Terminal Grid:** 80x24\")?;\n        writeln!(file, \"- **PTY Load:** Mock continuous output\")?;\n        writeln!(file, \"- **VSync:** Enabled (Fifo present mode)\")?;\n        writeln!(file)?;\n        writeln!(file, \"## SRS §7.1 Compliance\")?;\n        writeln!(file)?;\n        writeln!(file, \"**Criterion #1:** Master daemon renders local terminal at 60 FPS on Windows 10 1809+\")?;\n        writeln!(file)?;\n        writeln!(file, \"**Result:** {}\", if passed { \"✅ PASS - Requirement satisfied\" } else { \"❌ FAIL - Performance below target\" })?;\n        writeln!(file)?;\n        writeln!(file, \"---\")?;\n        writeln!(file, \"*Generated by fps_test.rs*\")?;\n\n        println!(\"📄 Report saved: {}\", report_path);\n\n        Ok(())\n    }\n}\n\nimpl ApplicationHandler for FpsTestApp {\n    fn resumed(\u0026mut self, event_loop: \u0026ActiveEventLoop) {\n        if self.window.is_none() {\n            let window = Arc::new(\n                event_loop\n                    .create_window(self.window_attributes.clone())\n                    .expect(\"Failed to create window\")\n            );\n\n            // Initialize renderer surface\n            if let Err(e) = pollster::block_on(self.renderer.init_surface(window.clone())) {\n                eprintln!(\"❌ Failed to initialize renderer surface: {}\", e);\n                event_loop.exit();\n                return;\n            }\n\n            // Initialize text rendering pipeline\n            if let Err(e) = self.renderer.init_text_pipeline() {\n                eprintln!(\"❌ Failed to initialize text rendering pipeline: {}\", e);\n                event_loop.exit();\n                return;\n            }\n\n            self.window = Some(window.clone());\n            self.test_start = Some(Instant::now());\n            self.last_fps_report = Instant::now();\n\n            println!(\"✅ Window created and renderer initialized\");\n            println!(\"🚀 Starting {} second FPS measurement test...\\n\", TEST_DURATION_SECS);\n\n            // Request first redraw to start render loop\n            window.request_redraw();\n        }\n    }\n\n    fn window_event(\n        \u0026mut self,\n        event_loop: \u0026ActiveEventLoop,\n        _window_id: winit::window::WindowId,\n        event: WindowEvent,\n    ) {\n        match event {\n            WindowEvent::CloseRequested =\u003e {\n                self.generate_report();\n                event_loop.exit();\n            }\n\n            WindowEvent::RedrawRequested =\u003e {\n                // Check if test duration exceeded\n                if let Some(start) = self.test_start {\n                    let elapsed = start.elapsed();\n                    if elapsed.as_secs() \u003e= TEST_DURATION_SECS {\n                        self.generate_report();\n                        event_loop.exit();\n                        return;\n                    }\n                }\n\n                // Start frame timing\n                self.perf_monitor.start_frame();\n\n                // Render frame\n                if let Some(window) = \u0026self.window {\n                    match self.renderer.render(window, \u0026mut self.perf_monitor) {\n                        Ok(_) =\u003e {\n                            // End frame timing\n                            let frame_time = self.perf_monitor.end_frame();\n\n                            // Record frame time\n                            self.frame_times.push(frame_time);\n                            self.frames_this_second += 1;\n\n                            // Report FPS every second\n                            if self.last_fps_report.elapsed().as_millis() \u003e= MEASUREMENT_INTERVAL_MS {\n                                let fps = self.frames_this_second as f32 / (self.last_fps_report.elapsed().as_secs_f32());\n                                self.fps_samples.push(fps);\n\n                                let elapsed = self.test_start.unwrap().elapsed().as_secs();\n                                println!(\"[{:3}s] FPS: {:.2} | Frame time: {:.2} ms\", elapsed, fps, frame_time);\n\n                                self.frames_this_second = 0;\n                                self.last_fps_report = Instant::now();\n                            }\n\n                            // Request next frame\n                            window.request_redraw();\n                        }\n                        Err(e) =\u003e {\n                            eprintln!(\"❌ Render error: {}\", e);\n                            self.generate_report();\n                            event_loop.exit();\n                        }\n                    }\n                }\n            }\n\n            _ =\u003e {}\n        }\n    }\n}\n\nfn main() -\u003e Result\u003c()\u003e {\n    // Initialize logging\n    tracing_subscriber::fmt()\n        .with_target(false)\n        .compact()\n        .init();\n\n    println!(\"========================================\");\n    println!(\"MONOTERMINAL Criterion #1 FPS Test\");\n    println!(\"Target: ≥60 FPS (≤16.67ms frame time)\");\n    println!(\"Platform: Windows 10+ (DirectX 12)\");\n    println!(\"========================================\\n\");\n\n    // Create event loop\n    let event_loop = EventLoop::new()?;\n\n    // Create window attributes\n    let window_attributes = WinitWindow::default_attributes()\n        .with_title(\"MONOTERMINAL FPS Test\")\n        .with_inner_size(winit::dpi::LogicalSize::new(1280.0, 720.0));\n\n    // Create renderer\n    let renderer = pollster::block_on(Renderer::new(\u0026event_loop))?;\n\n    // Create mock PTY channel (unused for pure GPU test, but needed for API)\n    let (pty_tx, _pty_rx) = mpsc::channel(256);\n\n    // Note: This is a pure GPU rendering test - no PTY data needed\n    // We're measuring raw rendering performance without I/O overhead\n    // RendererBridge integration is complete but not used here to isolate GPU performance\n\n    // Create and run FPS test app\n    let mut app = FpsTestApp::new(window_attributes, renderer, pty_tx);\n    event_loop.run_app(\u0026mut app)?;\n\n    Ok(())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","examples","ui_test.rs"],"content":"//! UI Test Example\n//!\n//! Tests the wgpu + egui rendering system independently\n//! Run with: cargo run --example ui_test\n\nuse anyhow::Result;\nuse tracing_subscriber;\n\n// We need to re-export from the library\n// For now, we'll just test the modules compile\n\nfn main() -\u003e Result\u003c()\u003e {\n    // Initialize logging\n    tracing_subscriber::fmt()\n        .with_target(false)\n        .compact()\n        .init();\n\n    tracing::info!(\"MONOTERMINAL UI Test\");\n    tracing::info!(\"Testing wgpu + egui rendering (60 FPS target)\");\n\n    println!(\"UI Test - Press Escape to exit\");\n\n    // TODO: Initialize UI once library exports are set up\n    // let terminal_ui = pollster::block_on(monoterminal_master::ui::TerminalUI::new())?;\n    // terminal_ui.run()?;\n\n    println!(\"UI module compiled successfully!\");\n    println!(\"Full UI test will be available after library exports are configured.\");\n\n    Ok(())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","auth","challenge.rs"],"content":"// Ed25519 challenge-response authentication\n// SRS §3.2.2: Challenge-response flow with 256-bit nonce\n\nuse super::{PublicKey, Signature, UserId};\nuse anyhow::{anyhow, Result};\nuse ed25519_dalek::{Verifier, VerifyingKey};\nuse rand::RngCore;\nuse std::time::{Duration, Instant};\n\n/// Authentication challenge containing a random nonce\n#[derive(Debug, Clone)]\npub struct Challenge {\n    pub nonce: [u8; 32],\n    pub expires_at: Instant,\n}\n\nimpl Challenge {\n    /// Check if challenge has expired\n    pub fn is_expired(\u0026self) -\u003e bool {\n        Instant::now() \u003e self.expires_at\n    }\n\n    /// Get remaining time until expiration\n    pub fn time_remaining(\u0026self) -\u003e Option\u003cDuration\u003e {\n        self.expires_at.checked_duration_since(Instant::now())\n    }\n}\n\n/// Challenge handler for Ed25519 authentication\npub struct Ed25519ChallengeHandler {\n    challenge_ttl: Duration,\n}\n\nimpl Ed25519ChallengeHandler {\n    /// Create new challenge handler with default TTL (30 seconds)\n    pub fn new() -\u003e Self {\n        Self {\n            challenge_ttl: Duration::from_secs(30),\n        }\n    }\n\n    /// Create new challenge handler with custom TTL\n    pub fn with_ttl(ttl: Duration) -\u003e Self {\n        Self { challenge_ttl: ttl }\n    }\n\n    /// Generate a new challenge with random nonce\n    pub fn create_challenge(\u0026self) -\u003e Challenge {\n        let mut nonce = [0u8; 32];\n        rand::thread_rng().fill_bytes(\u0026mut nonce);\n\n        Challenge {\n            nonce,\n            expires_at: Instant::now() + self.challenge_ttl,\n        }\n    }\n\n    /// Verify a signed challenge response\n    ///\n    /// # Arguments\n    /// * `challenge` - The original challenge that was sent to the client\n    /// * `signature` - The Ed25519 signature from the client\n    /// * `public_key` - The client's Ed25519 public key (32 bytes)\n    ///\n    /// # Returns\n    /// * `Ok(UserId)` - The authenticated user ID (derived from public key fingerprint)\n    /// * `Err(_)` - If verification fails (expired, invalid signature, etc.)\n    pub fn verify_challenge_response(\n        \u0026self,\n        challenge: \u0026Challenge,\n        signature: \u0026Signature,\n        public_key: \u0026PublicKey,\n    ) -\u003e Result\u003cUserId\u003e {\n        // Check challenge hasn't expired\n        if challenge.is_expired() {\n            return Err(anyhow!(\"Challenge expired\"));\n        }\n\n        // Parse Ed25519 public key\n        let verifying_key = VerifyingKey::from_bytes(public_key)\n            .map_err(|e| anyhow!(\"Invalid public key: {}\", e))?;\n\n        // Parse signature\n        let sig = ed25519_dalek::Signature::from_bytes(signature);\n\n        // Verify signature against challenge nonce\n        verifying_key\n            .verify(\u0026challenge.nonce, \u0026sig)\n            .map_err(|e| anyhow!(\"Signature verification failed: {}\", e))?;\n\n        // Derive user ID from public key fingerprint (SHA-256 hash)\n        // This ensures one public key = one user identity\n        let user_id = derive_user_id_from_pubkey(public_key);\n\n        Ok(user_id)\n    }\n}\n\nimpl Default for Ed25519ChallengeHandler {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n/// Derive a stable user ID from Ed25519 public key\n///\n/// Uses SHA-256 hash of the public key to create a deterministic,\n/// unique identifier. Same public key always produces same user ID.\nfn derive_user_id_from_pubkey(public_key: \u0026PublicKey) -\u003e UserId {\n    use sha2::{Digest, Sha256};\n\n    let mut hasher = Sha256::new();\n    hasher.update(public_key);\n    let hash = hasher.finalize();\n\n    // Use first 16 bytes of hash as hex string (32 hex chars)\n    let hex_str = hex::encode(\u0026hash[..16]);\n    UserId(format!(\"ed25519:{}\", hex_str))\n}\n\n// ===== Tests =====\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use ed25519_dalek::{Signer, SigningKey};\n\n    #[test]\n    fn test_challenge_creation() {\n        let handler = Ed25519ChallengeHandler::new();\n        let challenge = handler.create_challenge();\n\n        // Nonce should be random (not all zeros)\n        assert_ne!(challenge.nonce, [0u8; 32]);\n\n        // Challenge should not be expired immediately\n        assert!(!challenge.is_expired());\n\n        // Should have time remaining\n        assert!(challenge.time_remaining().is_some());\n    }\n\n    #[test]\n    fn test_challenge_expiration() {\n        let handler = Ed25519ChallengeHandler::with_ttl(Duration::from_millis(10));\n        let challenge = handler.create_challenge();\n\n        assert!(!challenge.is_expired());\n\n        // Wait for expiration\n        std::thread::sleep(Duration::from_millis(15));\n\n        assert!(challenge.is_expired());\n        assert!(challenge.time_remaining().is_none());\n    }\n\n    #[test]\n    fn test_valid_signature_verification() {\n        let handler = Ed25519ChallengeHandler::new();\n        let challenge = handler.create_challenge();\n\n        // Generate keypair\n        use rand::Rng;\n        let secret_bytes: [u8; 32] = rand::thread_rng().gen();\n        let signing_key = SigningKey::from_bytes(\u0026secret_bytes);\n        let verifying_key = signing_key.verifying_key();\n\n        // Sign challenge\n        let signature = signing_key.sign(\u0026challenge.nonce);\n\n        // Verify\n        let result = handler.verify_challenge_response(\n            \u0026challenge,\n            \u0026signature.to_bytes(),\n            verifying_key.as_bytes(),\n        );\n\n        assert!(result.is_ok());\n        let user_id = result.unwrap();\n        assert!(user_id.0.starts_with(\"ed25519:\"));\n    }\n\n    #[test]\n    fn test_invalid_signature_fails() {\n        let handler = Ed25519ChallengeHandler::new();\n        let challenge = handler.create_challenge();\n\n        // Generate keypair\n        use rand::Rng;\n        let secret_bytes: [u8; 32] = rand::thread_rng().gen();\n        let signing_key = SigningKey::from_bytes(\u0026secret_bytes);\n        let verifying_key = signing_key.verifying_key();\n\n        // Create invalid signature (all zeros)\n        let invalid_signature = [0u8; 64];\n\n        // Verification should fail\n        let result = handler.verify_challenge_response(\n            \u0026challenge,\n            \u0026invalid_signature,\n            verifying_key.as_bytes(),\n        );\n\n        assert!(result.is_err());\n        assert!(result.unwrap_err().to_string().contains(\"verification failed\"));\n    }\n\n    #[test]\n    fn test_wrong_keypair_fails() {\n        let handler = Ed25519ChallengeHandler::new();\n        let challenge = handler.create_challenge();\n\n        // Generate two different keypairs\n        use rand::Rng;\n        let secret_bytes1: [u8; 32] = rand::thread_rng().gen();\n        let signing_key1 = SigningKey::from_bytes(\u0026secret_bytes1);\n        let secret_bytes2: [u8; 32] = rand::thread_rng().gen();\n        let signing_key2 = SigningKey::from_bytes(\u0026secret_bytes2);\n\n        // Sign with key1\n        let signature = signing_key1.sign(\u0026challenge.nonce);\n\n        // Try to verify with key2's public key\n        let result = handler.verify_challenge_response(\n            \u0026challenge,\n            \u0026signature.to_bytes(),\n            signing_key2.verifying_key().as_bytes(),\n        );\n\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_expired_challenge_fails() {\n        let handler = Ed25519ChallengeHandler::with_ttl(Duration::from_millis(10));\n        let challenge = handler.create_challenge();\n\n        // Generate keypair and sign\n        use rand::Rng;\n        let secret_bytes: [u8; 32] = rand::thread_rng().gen();\n        let signing_key = SigningKey::from_bytes(\u0026secret_bytes);\n        let signature = signing_key.sign(\u0026challenge.nonce);\n\n        // Wait for expiration\n        std::thread::sleep(Duration::from_millis(15));\n\n        // Verification should fail due to expiration\n        let result = handler.verify_challenge_response(\n            \u0026challenge,\n            \u0026signature.to_bytes(),\n            signing_key.verifying_key().as_bytes(),\n        );\n\n        assert!(result.is_err());\n        assert!(result.unwrap_err().to_string().contains(\"expired\"));\n    }\n\n    #[test]\n    fn test_tampered_challenge_fails() {\n        let handler = Ed25519ChallengeHandler::new();\n        let mut challenge = handler.create_challenge();\n\n        // Generate keypair and sign original challenge\n        use rand::Rng;\n        let secret_bytes: [u8; 32] = rand::thread_rng().gen();\n        let signing_key = SigningKey::from_bytes(\u0026secret_bytes);\n        let signature = signing_key.sign(\u0026challenge.nonce);\n\n        // Tamper with challenge nonce\n        challenge.nonce[0] ^= 0xFF;\n\n        // Verification should fail\n        let result = handler.verify_challenge_response(\n            \u0026challenge,\n            \u0026signature.to_bytes(),\n            signing_key.verifying_key().as_bytes(),\n        );\n\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_user_id_derivation_deterministic() {\n        // Same public key should always produce same user ID\n        let pubkey = [0x42u8; 32];\n\n        let user_id1 = derive_user_id_from_pubkey(\u0026pubkey);\n        let user_id2 = derive_user_id_from_pubkey(\u0026pubkey);\n\n        assert_eq!(user_id1, user_id2);\n        assert!(user_id1.0.starts_with(\"ed25519:\"));\n    }\n\n    #[test]\n    fn test_different_pubkeys_different_user_ids() {\n        let pubkey1 = [0x42u8; 32];\n
