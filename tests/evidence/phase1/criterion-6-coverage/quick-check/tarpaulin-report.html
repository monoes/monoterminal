\n    }\n\n    /// Calculate sidebar area\n    pub fn sidebar_area(\u0026self, window_height: f32) -\u003e Rect {\n        Rect {\n            x: 0.0,\n            y: self.menu_height,\n            width: self.sidebar_width,\n            height: window_height - self.menu_height - self.status_height,\n        }\n    }\n\n    /// Calculate menu bar area\n    pub fn menu_area(\u0026self, window_width: f32) -\u003e Rect {\n        Rect {\n            x: 0.0,\n            y: 0.0,\n            width: window_width,\n            height: self.menu_height,\n        }\n    }\n\n    /// Calculate status bar area\n    pub fn status_area(\u0026self, window_width: f32, window_height: f32) -\u003e Rect {\n        Rect {\n            x: 0.0,\n            y: window_height - self.status_height,\n            width: window_width,\n            height: self.status_height,\n        }\n    }\n}\n\nimpl Default for Layout {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n/// Rectangle area\n#[derive(Debug, Clone, Copy)]\npub struct Rect {\n    pub x: f32,\n    pub y: f32,\n    pub width: f32,\n    pub height: f32,\n}\n\n/// Session list for sidebar\npub struct SessionList {\n    sessions: Vec\u003cSessionItem\u003e,\n    selected: Option\u003cusize\u003e,\n}\n\nimpl SessionList {\n    pub fn new() -\u003e Self {\n        Self {\n            sessions: Vec::new(),\n            selected: None,\n        }\n    }\n\n    /// Add session to list\n    pub fn add_session(\u0026mut self, name: String) {\n        self.sessions.push(SessionItem { name });\n    }\n\n    /// Get sessions\n    pub fn sessions(\u0026self) -\u003e \u0026[SessionItem] {\n        \u0026self.sessions\n    }\n\n    /// Get selected session index\n    pub fn selected(\u0026self) -\u003e Option\u003cusize\u003e {\n        self.selected\n    }\n\n    /// Set selected session\n    pub fn set_selected(\u0026mut self, index: Option\u003cusize\u003e) {\n        self.selected = index;\n    }\n}\n\nimpl Default for SessionList {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n/// Session item in the list\n#[derive(Debug, Clone)]\npub struct SessionItem {\n    pub name: String,\n}\n\n/// Status bar data\npub struct StatusBar {\n    fps: f32,\n    latency: f32,\n}\n\nimpl StatusBar {\n    pub fn new() -\u003e Self {\n        Self {\n            fps: 0.0,\n            latency: 0.0,\n        }\n    }\n\n    /// Update from performance monitor\n    pub fn update_from_perf(\u0026mut self, perf: \u0026PerformanceMonitor) {\n        self.fps = perf.fps();\n        self.latency = perf.avg_frame_time();\n    }\n\n    /// Get formatted FPS string\n    pub fn fps_string(\u0026self) -\u003e String {\n        format!(\"FPS: {:.1}\", self.fps)\n    }\n\n    /// Get formatted latency string\n    pub fn latency_string(\u0026self) -\u003e String {\n        format!(\"Frame: {:.2}ms\", self.latency)\n    }\n}\n\nimpl Default for StatusBar {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","mod.rs"],"content":"//! MONOTERMINAL Master Local UI\n//!\n//! wgpu + egui rendering system targeting 60 FPS (16.67ms frame budget)\n//! Per SRS §2.1.1, §4.2.1\n//!\n//! Frame Budget Breakdown:\n//! - PTY read: 2ms (handled by backend)\n//! - Dirty tracking: 0.5ms\n//! - Glyph lookup: 1ms\n//! - GPU render: 8ms\n//! - VSync: 5ms\n//! Total: 16.5ms ✅\n\npub mod fonts;\npub mod glyph_cache;\npub mod layout;\npub mod performance;\npub mod renderer;\npub mod renderer_bridge;\npub mod terminal_grid;\npub mod vt_parser;\npub mod window;\n\npub use renderer::Renderer;\npub use renderer_bridge::RendererBridge;\npub use window::Window;\n\n#[cfg(test)]\nmod tests;\n\nuse anyhow::Result;\nuse std::sync::Arc;\n\n/// Main UI entry point\n/// Initializes window, wgpu, and egui\npub struct TerminalUI {\n    window: Window,\n    renderer: Renderer,\n}\n\nimpl TerminalUI {\n    /// Create new Terminal UI\n    /// Sets up DirectX 12 backend on Windows\n    pub async fn new() -\u003e Result\u003cSelf\u003e {\n        tracing::info!(\"Initializing Terminal UI (wgpu + egui)\");\n\n        let window = Window::new()?;\n        let renderer = Renderer::new(window.inner()).await?;\n\n        Ok(Self { window, renderer })\n    }\n\n    /// Run the event loop\n    /// Target: 60 FPS (16.67ms frame budget)\n    pub fn run(self) -\u003e Result\u003c()\u003e {\n        self.window.run(self.renderer)\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","performance.rs"],"content":"//! Performance monitoring and frame timing\n//!\n//! Tracks frame budgets per SRS §2.1.1:\n//! - PTY read: 2ms\n//! - Dirty tracking: 0.5ms\n//! - Glyph lookup: 1ms\n//! - GPU render: 8ms\n//! - VSync: 5ms\n//! Target: 16.67ms (60 FPS)\n\nuse std::collections::VecDeque;\nuse std::time::{Duration, Instant};\n\nconst FPS_HISTORY_SIZE: usize = 60;\n\n/// Performance monitor tracking frame timing\npub struct PerformanceMonitor {\n    frame_start: Option\u003cInstant\u003e,\n    last_mark: Option\u003cInstant\u003e,\n    frame_times: VecDeque\u003cf32\u003e,\n    fps: f32,\n}\n\nimpl PerformanceMonitor {\n    pub fn new() -\u003e Self {\n        Self {\n            frame_start: None,\n            last_mark: None,\n            frame_times: VecDeque::with_capacity(FPS_HISTORY_SIZE),\n            fps: 0.0,\n        }\n    }\n\n    /// Start timing a new frame\n    pub fn start_frame(\u0026mut self) {\n        let now = Instant::now();\n        self.frame_start = Some(now);\n        self.last_mark = Some(now);\n    }\n\n    /// Mark a timing point within the frame\n    pub fn mark(\u0026mut self, label: \u0026str) {\n        if let Some(last) = self.last_mark {\n            let elapsed = last.elapsed();\n            let ms = elapsed.as_secs_f32() * 1000.0;\n\n            // Log if phase exceeds expected budget\n            let budget = match label {\n                \"dirty_tracking\" =\u003e Some(0.5),\n                \"glyph_lookup\" =\u003e Some(1.0),\n                \"render_pass\" =\u003e Some(8.0),\n                _ =\u003e None,\n            };\n\n            if let Some(budget) = budget {\n                if ms \u003e budget {\n                    tracing::debug!(\n                        \"Phase '{}' exceeded budget: {:.2}ms (target: {:.2}ms)\",\n                        label,\n                        ms,\n                        budget\n                    );\n                }\n            }\n\n            self.last_mark = Some(Instant::now());\n        }\n    }\n\n    /// End frame timing and return frame time in ms\n    pub fn end_frame(\u0026mut self) -\u003e f32 {\n        if let Some(start) = self.frame_start {\n            let frame_time = start.elapsed().as_secs_f32() * 1000.0;\n\n            // Update frame time history\n            self.frame_times.push_back(frame_time);\n            if self.frame_times.len() \u003e FPS_HISTORY_SIZE {\n                self.frame_times.pop_front();\n            }\n\n            // Calculate FPS (average over history)\n            if !self.frame_times.is_empty() {\n                let avg_frame_time: f32 = self.frame_times.iter().sum::\u003cf32\u003e() / self.frame_times.len() as f32;\n                self.fps = 1000.0 / avg_frame_time;\n            }\n\n            frame_time\n        } else {\n            0.0\n        }\n    }\n\n    /// Get current FPS\n    pub fn fps(\u0026self) -\u003e f32 {\n        self.fps\n    }\n\n    /// Get average frame time in ms\n    pub fn avg_frame_time(\u0026self) -\u003e f32 {\n        if self.frame_times.is_empty() {\n            0.0\n        } else {\n            self.frame_times.iter().sum::\u003cf32\u003e() / self.frame_times.len() as f32\n        }\n    }\n\n    /// Check if currently meeting 60 FPS target\n    pub fn meeting_target(\u0026self) -\u003e bool {\n        self.avg_frame_time() \u003c= 16.67\n    }\n}\n\nimpl Default for PerformanceMonitor {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","renderer.rs"],"content":"//! wgpu Renderer - DirectX 12 Backend\r\n//!\r\n//! Manages GPU resources and rendering pipeline\r\n//! Target: 8ms GPU render time (per SRS Â§2.1.1)\r\n\r\nuse anyhow::{Context, Result};\r\nuse std::sync::Arc;\r\nuse bytes::Bytes;\r\nuse wgpu;\r\nuse winit::window::Window;\r\n\r\nuse super::performance::PerformanceMonitor;\r\nuse super::terminal_grid::TerminalGrid;\r\nuse super::vt_parser::VtParser;\r\nuse super::glyph_cache::{GlyphCache, GlyphKey};\r\n\r\n/// Vertex data for a single glyph quad corner\r\n/// Layout matches WGSL VertexInput in shaders/text.wgsl\r\n#[repr(C)]\r\n#[derive(Copy, Clone, Debug, bytemuck::Pod, bytemuck::Zeroable)]\r\nstruct GlyphVertex {\r\n    /// NDC position (-1.0 to 1.0)\r\n    position: [f32; 2],\r\n    /// Atlas texture coordinates (0.0 to 1.0)\r\n    tex_coords: [f32; 2],\r\n    /// Foreground color (RGBA, 0.0 to 1.0)\r\n    fg_color: [f32; 4],\r\n    /// Background color (RGBA, 0.0 to 1.0)\r\n    bg_color: [f32; 4],\r\n}\r\n\r\nimpl GlyphVertex {\r\n    const ATTRIBS: [wgpu::VertexAttribute; 4] = wgpu::vertex_attr_array![\r\n        0 =\u003e Float32x2,  // position\r\n        1 =\u003e Float32x2,  // tex_coords\r\n        2 =\u003e Float32x4,  // fg_color\r\n        3 =\u003e Float32x4,  // bg_color\r\n    ];\r\n\r\n    fn desc() -\u003e wgpu::VertexBufferLayout\u003c'static\u003e {\r\n        wgpu::VertexBufferLayout {\r\n            array_stride: std::mem::size_of::\u003cGlyphVertex\u003e() as wgpu::BufferAddress,\r\n            step_mode: wgpu::VertexStepMode::Vertex,\r\n            attributes: \u0026Self::ATTRIBS,\r\n        }\r\n    }\r\n}\r\n\r\n/// Main renderer managing wgpu resources\r\npub struct Renderer {\r\n    instance: wgpu::Instance,\r\n    adapter: Option\u003cwgpu::Adapter\u003e,\r\n    device: Option\u003cwgpu::Device\u003e,\r\n    queue: Option\u003cwgpu::Queue\u003e,\r\n    surface: Option\u003cwgpu::Surface\u003c'static\u003e\u003e,\r\n    surface_config: Option\u003cwgpu::SurfaceConfiguration\u003e,\r\n\r\n    // Text rendering pipeline (Option A: single-pass with bg_color)\r\n    text_pipeline: Option\u003cwgpu::RenderPipeline\u003e,\r\n    atlas_texture: Option\u003cwgpu::Texture\u003e,\r\n    atlas_texture_view: Option\u003cwgpu::TextureView\u003e,\r\n    atlas_sampler: Option\u003cwgpu::Sampler\u003e,\r\n    bind_group: Option\u003cwgpu::BindGroup\u003e,\r\n    vertex_buffer: Option\u003cwgpu::Buffer\u003e,\r\n\r\n    // egui integration (TODO: Add egui_wgpu_renderer on Day 2)\r\n    // For now, we prepare the terminal rendering pipeline\r\n\r\n    // Terminal rendering state\r\n    terminal_grid: TerminalGrid,\r\n    vt_parser: VtParser,\r\n    glyph_cache: GlyphCache,\r\n    font_manager: super::fonts::FontManager,\r\n\r\n    // Cell dimensions (pixels)\r\n    cell_width: u32,\r\n    cell_height: u32,\r\n\r\n    // RendererBridge - connects SessionManager PTY output to GPU rendering\r\n    renderer_bridge: Option\u003csuper::renderer_bridge::RendererBridge\u003e,\r\n}\r\n\r\nimpl Renderer {\r\n    /// Create new renderer\r\n    /// Initializes wgpu instance with DirectX 12 backend preference\r\n    pub async fn new(_event_loop: \u0026winit::event_loop::EventLoop\u003c()\u003e) -\u003e Result\u003cSelf\u003e {\r\n        tracing::info!(\"Creating wgpu renderer (DirectX 12)\");\r\n\r\n        // Create wgpu instance with DirectX 12 backend on Windows\r\n        let instance = wgpu::Instance::new(wgpu::InstanceDescriptor {\r\n            backends: wgpu::Backends::DX12, // DirectX 12 for Windows (Phase 1)\r\n            ..Default::default()\r\n        });\r\n\r\n        tracing::info!(\"wgpu instance created with DirectX 12 backend\");\r\n\r\n        // Initialize font manager (16px Consolas for Windows Phase 1)\r\n        let font_manager = super::fonts::FontManager::new(16.0)\r\n            .context(\"Failed to create FontManager\")?;\r\n        let (cell_width, cell_height) = font_manager.cell_dimensions();\r\n\r\n        tracing::info!(\"Font loaded: cell size {}x{} pixels\", cell_width, cell_height);\r\n\r\n        Ok(Self {\r\n            instance,\r\n            adapter: None,\r\n            device: None,\r\n            queue: None,\r\n            surface: None,\r\n            surface_config: None,\r\n\r\n            // Text rendering pipeline (initialized in init_text_pipeline())\r\n            text_pipeline: None,\r\n            atlas_texture: None,\r\n            atlas_texture_view: None,\r\n            atlas_sampler: None,\r\n            bind_group: None,\r\n            vertex_buffer: None,\r\n\r\n            // Terminal rendering state (80x24 default)\r\n            terminal_grid: TerminalGrid::new(24, 80),\r\n            vt_parser: VtParser::new(),\r\n            glyph_cache: GlyphCache::new(),\r\n            font_manager,\r\n            cell_width,\r\n            cell_height,\r\n\r\n            // RendererBridge (attached after session creation)\r\n            renderer_bridge: None,\r\n        })\r\n    }\r\n\r\n    /// Attach RendererBridge for PTY output streaming\r\n    /// Connects SessionManager PTY output to GPU rendering pipeline\r\n    ///\r\n    /// # Arguments\r\n    /// - `bridge`: RendererBridge instance (from SessionManager attachment)\r\n    ///\r\n    /// # Integration Point\r\n    /// Called after SessionManager.attach_client() establishes PTY stream\r\n    pub fn attach_renderer_bridge(\u0026mut self, bridge: super::renderer_bridge::RendererBridge) {\r\n        tracing::info!(\"Attaching RendererBridge to GPU rendering pipeline\");\r\n        self.renderer_bridge = Some(bridge);\r\n    }\r\n\r\n    /// Initialize surface and request adapter/device\r\n    /// Called after window is created\r\n    pub async fn init_surface(\u0026mut self, window: Arc\u003cWindow\u003e) -\u003e Result\u003c()\u003e {\r\n        tracing::info!(\"Initializing wgpu surface\");\r\n\r\n        // Create surface\r\n        // SAFETY: window must outlive surface\r\n        let surface = self.instance.create_surface(window.clone())?;\r\n\r\n        // Request adapter\r\n        let adapter = self\r\n            .instance\r\n            .request_adapter(\u0026wgpu::RequestAdapterOptions {\r\n                power_preference: wgpu::PowerPreference::HighPerformance,\r\n                compatible_surface: Some(\u0026surface),\r\n                force_fallback_adapter: false,\r\n            })\r\n            .await\r\n            .context(\"Failed to find suitable GPU adapter\")?;\r\n\r\n        tracing::info!(\"Adapter: {:?}\", adapter.get_info());\r\n\r\n        // Request device and queue\r\n        let (device, queue) = adapter\r\n            .request_device(\r\n                \u0026wgpu::DeviceDescriptor {\r\n                    label: Some(\"MONOTERMINAL Device\"),\r\n                    required_features: wgpu::Features::empty(),\r\n                    required_limits: wgpu::Limits::default(),\r\n                },\r\n                None,\r\n            )\r\n            .await\r\n            .context(\"Failed to create device\")?;\r\n\r\n        tracing::info!(\"Device and queue created\");\r\n\r\n        // Configure surface\r\n        let size = window.inner_size();\r\n        let surface_caps = surface.get_capabilities(\u0026adapter);\r\n        let surface_format = surface_caps\r\n            .formats\r\n            .iter()\r\n            .copied()\r\n            .find(|f| f.is_srgb())\r\n            .unwrap_or(surface_caps.formats[0]);\r\n\r\n        let config = wgpu::SurfaceConfiguration {\r\n            usage: wgpu::TextureUsages::RENDER_ATTACHMENT,\r\n            format: surface_format,\r\n            width: size.width,\r\n            height: size.height,\r\n            present_mode: wgpu::PresentMode::Fifo, // VSync enabled (5ms budget)\r\n            alpha_mode: surface_caps.alpha_modes[0],\r\n            view_formats: vec![],\r\n            desired_maximum_frame_latency: 2,\r\n        };\r\n\r\n        surface.configure(\u0026device, \u0026config);\r\n\r\n        tracing::info!(\r\n            \"Surface configured: {}x{}, format: {:?}\",\r\n            config.width,\r\n            config.height,\r\n            config.format\r\n        );\r\n\r\n        self.adapter = Some(adapter);\r\n        self.device = Some(device);\r\n        self.queue = Some(queue);\r\n        self.surface = Some(surface);\r\n        self.surface_config = Some(config);\r\n\r\n        Ok(())\r\n    }\r\n\r\n    /// Resize surface\r\n    pub fn resize(\u0026mut self, width: u32, height: u32) -\u003e Result\u003c()\u003e {\r\n        if width == 0 || height == 0 {\r\n            return Ok(());\r\n        }\r\n\r\n        if let (Some(surface), Some(device), Some(config)) = (\r\n            \u0026self.surface,\r\n            \u0026self.device,\r\n            \u0026mut self.surface_config,\r\n        ) {\r\n            config.width = width;\r\n            config.height = height;\r\n            surface.configure(device, config);\r\n\r\n            tracing::debug!(\"Surface resized to {}x{}\", width, height);\r\n        }\r\n\r\n        Ok(())\r\n    }\r\n\r\n    /// Initialize text rendering pipeline\r\n    /// Creates shaders, atlas texture, sampler, and render pipeline\r\n    /// Called after surface initialization (window.rs:91-97)\r\n    pub fn init_text_pipeline(\u0026mut self) -\u003e Result\u003c()\u003e {\r\n        tracing::info!(\"Initializing text rendering pipeline (Option A: single-pass with bg_color)\");\r\n\r\n        let device = self.device.as_ref().context(\"Device not initialized\")?;\r\n        let config = self.surface_config.as_ref().context(\"Surface config not initialized\")?;\r\n\r\n        // 1. Create glyph atlas texture (4096Ã—4096 R8Unorm, per SRS Â§2.1.1)\r\n        let (atlas_width, atlas_height) = self.glyph_cache.atlas_size();\r\n        let atlas_texture = device.create_texture(\u0026wgpu::TextureDescriptor {\r\n            label: Some(\"Glyph Atlas Texture\"),\r\n            size: wgpu::Extent3d {\r\n                width: atlas_width,\r\n                height: atlas_height,\r\n                depth_or_array_layers: 1,\r\n            },\r\n            mip_level_count: 1,\r\n            sample_count: 1,\r\n            dimension: wgpu::TextureDimension::D2,\r\n            format: wgpu::TextureFormat::R8Unorm, // Grayscale (8-bit)\r\n            usage: wgpu::TextureUsages::TEXTURE_BINDING | wgpu::TextureUsages::COPY_DST,\r\n            view_formats: \u0026[],\r\n        });\r\n\r\n        let atlas_texture_view = atlas_texture.create_view(\u0026wgpu::TextureViewDescriptor::default());\r\n\r\n        tracing::info!(\"Glyph atlas created: {}x{} R8Unorm\", atlas_width, atlas_height);\r\n\r\n        // 2. Create sampler (LINEAR filter for antialiasing, per gpu-rendering-engineer recommendation)\r\n        let atlas_sampler = device.create_sampler(\u0026wgpu::SamplerDescriptor {\r\n            label: Some(\"Glyph Atlas Sampler\"),\r\n            address_mode_u: wgpu::AddressMode::ClampToEdge,\r\n            address_mode_v: wgpu::AddressMode::ClampToEdge,\r\n            mag_filter: wgpu::FilterMode::Linear,  // â† Linear for antialiasing\r\n            min_filter: wgpu::FilterMode::Linear,  // â† Linear for antialiasing\r\n            mipmap_filter: wgpu::FilterMode::Nearest,\r\n            ..Default::default()\r\n        });\r\n\r\n        tracing::info!(\"Atlas sampler created with linear filtering\");\r\n\r\n        // 3. Load shader from shaders/text.wgsl\r\n        let shader = device.create_shader_module(wgpu::ShaderModuleDescriptor {\r\n            label: Some(\"Text Shader\"),\r\n            source: wgpu::ShaderSource::Wgsl(include_str!(\"shaders/text.wgsl\").into()),\r\n        });\r\n\r\n        tracing::info!(\"Shader module loaded (vertex + fragment)\");\r\n\r\n        // 4. Create bind group layout\r\n        let bind_group_layout = device.create_bind_group_layout(\u0026wgpu::BindGroupLayoutDescriptor {\r\n            label: Some(\"Text Bind Group Layout\"),\r\n            entries: \u0026[\r\n                // @group(0) @binding(0) - atlas texture\r\n                wgpu::BindGroupLayoutEntry {\r\n                    binding: 0,\r\n                    visibility: wgpu::ShaderStages::FRAGMENT,\r\n                    ty: wgpu::BindingType::Texture {\r\n                        sample_type: wgpu::TextureSampleType::Float { filterable: true },\r\n                        view_dimension: wgpu::TextureViewDimension::D2,\r\n                        multisampled: false,\r\n                    },\r\n                    count: None,\r\n                },\r\n                // @group(0) @binding(1) - atlas sampler\r\n                wgpu::BindGroupLayoutEntry {\r\n                    binding: 1,\r\n                    visibility: wgpu::ShaderStages::FRAGMENT,\r\n                    ty: wgpu::BindingType::Sampler(wgpu::SamplerBindingType::Filtering),\r\n                    count: None,\r\n                },\r\n            ],\r\n        });\r\n\r\n        // 5. Create pipeline layout\r\n        let pipeline_layout = device.create_pipeline_layout(\u0026wgpu::PipelineLayoutDescriptor {\r\n            label: Some(\"Text Pipeline Layout\"),\r\n            bind_group_layouts: \u0026[\u0026bind_group_layout],\r\n            push_constant_ranges: \u0026[],\r\n        });\r\n\r\n        // 6. Create render pipeline\r\n        let text_pipeline = device.create_render_pipeline(\u0026wgpu::RenderPipelineDescriptor {\r\n            label: Some(\"Text Render Pipeline\"),\r\n            layout: Some(\u0026pipeline_layout),\r\n            vertex: wgpu::VertexState {\r\n                compilation_options: wgpu::PipelineCompilationOptions::default(),module: \u0026shader,\r\n                entry_point: \"vs_main\",\r\n                buffers: \u0026[GlyphVertex::desc()],\r\n            },\r\n            fragment: Some(wgpu::FragmentState {\r\n                compilation_options: wgpu::PipelineCompilationOptions::default(),module: \u0026shader,\r\n                entry_point: \"fs_main\",\r\n                targets: \u0026[Some(wgpu::ColorTargetState {\r\n                    format: config.format,\r\n                    blend: Some(wgpu::BlendState::ALPHA_BLENDING),\r\n                    write_mask: wgpu::ColorWrites::ALL,\r\n                })],\r\n            }),\r\n            primitive: wgpu::PrimitiveState {\r\n                topology: wgpu::PrimitiveTopology::TriangleList,\r\n                strip_index_format: None,\r\n                front_face: wgpu::FrontFace::Ccw,\r\n                cull_mode: None,  // No culling for 2D quads\r\n                unclipped_depth: false,\r\n                polygon_mode: wgpu::PolygonMode::Fill,\r\n                conservative: false,\r\n            },\r\n            depth_stencil: None,  // No depth testing for 2D\r\n            multisample: wgpu::MultisampleState::default(),\r\n            multiview: None,\r\n        });\r\n\r\n        tracing::info!(\"Render pipeline created\");\r\n\r\n        // 7. Create bind group\r\n        let bind_group = device.create_bind_group(\u0026wgpu::BindGroupDescriptor {\r\n            label: Some(\"Text Bind Group\"),\r\n            layout: \u0026bind_group_layout,\r\n            entries: \u0026[\r\n                wgpu::BindGroupEntry {\r\n                    binding: 0,\r\n                    resource: wgpu::BindingResource::TextureView(\u0026atlas_texture_view),\r\n                },\r\n                wgpu::BindGroupEntry {\r\n                    binding: 1,\r\n                    resource: wgpu::BindingResource::Sampler(\u0026atlas_sampler),\r\n                },\r\n            ],\r\n        });\r\n\r\n        // 8. Create vertex buffer (sized for full-screen update: 80Ã—24 = 1920 cells Ã— 6 vertices)\r\n        let max_vertices = 1920 * 6; // 80Ã—24 grid, 6 vertices per cell (2 triangles)\r\n        let vertex_buffer_size = (max_vertices * std::mem::size_of::\u003cGlyphVertex\u003e()) as u64;\r\n        let vertex_buffer = device.create_buffer(\u0026wgpu::BufferDescriptor {\r\n            label: Some(\"Glyph Vertex Buffer\"),\r\n            size: vertex_buffer_size,\r\n            usage: wgpu::BufferUsages::VERTEX | wgpu::BufferUsages::COPY_DST,\r\n            mapped_at_creation: false,\r\n        });\r\n\r\n        tracing::info!(\r\n            \"Vertex buffer created: {} vertices ({}KB)\",\r\n            max_vertices,\r\n            vertex_buffer_size / 1024\r\n        );\r\n\r\n        // Store pipeline resources\r\n        self.text_pipeline = Some(text_pipeline);\r\n        self.atlas_texture = Some(atlas_texture);\r\n        self.atlas_texture_view = Some(atlas_texture_view);\r\n        self.atlas_sampler = Some(atlas_sampler);\r\n        self.bind_group = Some(bind_group);\r\n        self.vertex_buffer = Some(vertex_buffer);\r\n\r\n        tracing::info!(\"âœ… Text rendering pipeline initialized successfully\");\r\n\r\n        Ok(())\r\n    }\r\n\r\n    /// Render a frame\r\n    /// Target: 8ms GPU render + 5ms VSync = 13ms total\r\n    pub fn render(\u0026mut self, _window: \u0026Window, perf: \u0026mut PerformanceMonitor) -\u003e Result\u003c()\u003e {\r\n        // Process PTY output FIRST (mutable borrow)\r\n        self.process_pty_output(perf)?;\r\n\r\n        // Build vertex data from dirty cells SECOND (mutable borrow for glyph cache)\r\n        // Target: \u003c1ms glyph lookup + 0.5ms dirty tracking\r\n        perf.mark(\"dirty_tracking_start\");\r\n        let vertices = self.build_vertices(perf)?;\r\n        perf.mark(\"glyph_lookup\");\r\n\r\n        // NOW borrow resources immutably (all mutable work done)\r\n        let surface = self.surface.as_ref().context(\"Surface not initialized\")?;\r\n        let device = self.device.as_ref().context(\"Device not initialized\")?;\r\n        let queue = self.queue.as_ref().context(\"Queue not initialized\")?;\r\n\r\n        // Get current surface texture\r\n        let output = surface.get_current_texture()?;\r\n        let view = output.texture.create_view(\u0026wgpu::TextureViewDescriptor::default());\r\n\r\n        perf.mark(\"acquire_texture\");\r\n\r\n        // Create command encoder\r\n        let mut encoder = device.create_command_encoder(\u0026wgpu::CommandEncoderDescriptor {\r\n            label: Some(\"Render Encoder\"),\r\n        });\r\n\r\n        // Upload vertices to GPU\r\n        if !vertices.is_empty() {\r\n            queue.write_buffer(\r\n                self.vertex_buffer.as_ref().context(\"Vertex buffer not initialized\")?,\r\n                0,\r\n                bytemuck::cast_slice(\u0026vertices),\r\n            );\r\n        }\r\n        perf.mark(\"upload_vertices\");\r\n\r\n        {\r\n            // Begin render pass with clear color (terminal background)\r\n            let mut render_pass = encoder.begin_render_pass(\u0026wgpu::RenderPassDescriptor {\r\n                label: Some(\"Render Pass\"),\r\n                color_attachments: \u0026[Some(wgpu::RenderPassColorAttachment {\r\n                    view: \u0026view,\r\n                    resolve_target: None,\r\n                    ops: wgpu::Operations {\r\n                        load: wgpu::LoadOp::Clear(wgpu::Color {\r\n                            r: 0.1,\r\n                            g: 0.1,\r\n                            b: 0.1,\r\n                            a: 1.0,\r\n                        }),\r\n                        store: wgpu::StoreOp::Store,\r\n                    },\r\n                })],\r\n                depth_stencil_attachment: None,\r\n                timestamp_writes: None,\r\n                occlusion_query_set: None,\r\n            });\r\n\r\n            perf.mark(\"render_pass_begin\");\r\n\r\n            // Draw glyphs if we have vertices\r\n            if !vertices.is_empty() {\r\n                render_pass.set_pipeline(self.text_pipeline.as_ref().context(\"Pipeline not initialized\")?);\r\n                render_pass.set_bind_group(0, self.bind_group.as_ref().context(\"Bind group not initialized\")?, \u0026[]);\r\n                render_pass.set_vertex_buffer(0, self.vertex_buffer.as_ref().context(\"Vertex buffer not initialized\")?.slice(..));\r\n                render_pass.draw(0..vertices.len() as u32, 0..1);\r\n            }\r\n\r\n            perf.mark(\"render_pass\");\r\n        }\r\n\r\n        // Submit commands\r\n        queue.submit(std::iter::once(encoder.finish()));\r\n        perf.mark(\"submit_queue\");\r\n\r\n        // Present frame\r\n        output.present();\r\n        perf.mark(\"present\");\r\n\r\n        Ok(())\r\n    }\r\n\r\n    /// Process PTY output and update terminal grid\r\n    /// Target: \u003c2ms parse time per SRS Â§2.1.1\r\n    fn process_pty_output(\u0026mut self, perf: \u0026mut PerformanceMonitor) -\u003e Result\u003c()\u003e {\r\n        // Try to receive PTY data (non-blocking) via RendererBridge\r\n        if let Some(bridge) = \u0026mut self.renderer_bridge {\r\n            while let Some(data) = bridge.try_recv() {\r\n                // Parse VT sequences\r\n                self.vt_parser.feed(\u0026data);\r\n\r\n                // Apply changes to terminal grid\r\n                let changes = self.vt_parser.drain_changes();\r\n                self.terminal_grid.apply_changes(changes);\r\n\r\n                perf.mark(\"pty_parse\");\r\n            }\r\n        }\r\n\r\n        Ok(())\r\n    }\r\n\r\n    /// Build vertex data from dirty terminal cells\r\n    /// Target: \u003c0.5ms dirty tracking + \u003c1ms glyph lookup = \u003c1.5ms total\r\n    /// Returns vertex array ready for GPU upload\r\n    fn build_vertices(\u0026mut self, perf: \u0026mut PerformanceMonitor) -\u003e Result\u003cVec\u003cGlyphVertex\u003e\u003e {\r\n        let mut vertices = Vec::new();\r\n\r\n        let surface_config = self.surface_config.as_ref().context(\"Surface not configured\")?;\r\n        let (rows, cols) = self.terminal_grid.dimensions();\r\n\r\n        // Calculate NDC (Normalized Device Coordinates) scale\r\n        // NDC: -1.0 (left/bottom) to +1.0 (right/top)\r\n        let viewport_width = surface_config.width as f32;\r\n        let viewport_height = surface_config.height as f32;\r\n        let cell_width_ndc = (self.cell_width as f32 / viewport_width) * 2.0;\r\n        let cell_height_ndc = (self.cell_height as f32 / viewport_height) * 2.0;\r\n\r\n        perf.mark(\"dirty_tracking\");\r\n\r\n        // Collect dirty cells into Vec to release immutable borrow before calling ensure_glyph_cached\r\n        // (ensure_glyph_cached needs mutable borrow of self)\r\n        let dirty_cells: Vec\u003c_\u003e = self.terminal_grid\r\n            .dirty_region()\r\n            .iter_dirty()\r\n            .filter_map(|(row, col)| {\r\n                self.terminal_grid.get_cell(row, col).map(|cell| (row, col, *cell))\r\n            })\r\n            .collect();\r\n\r\n        // Now process dirty cells (mutable borrow allowed)\r\n        for (row, col, cell) in dirty_cells {\r\n            // Ensure glyph is in cache (rasterize + upload if needed)\r\n            let glyph_key = GlyphKey::new(cell.ch, \u0026cell.style);\r\n            let glyph_info = self.ensure_glyph_cached(glyph_key)?;\r\n\r\n            // Calculate NDC position for this cell\r\n            // Origin is top-left, NDC origin is center\r\n            let x_ndc = -1.0 + (col as f32 * cell_width_ndc);\r\n            let y_ndc = 1.0 - (row as f32 * cell_height_ndc);\r\n\r\n            // Convert colors from terminal style to RGBA floats\r\n            let fg_color = color_to_rgba(\u0026cell.style.fg);\r\n            let bg_color = color_to_rgba(\u0026cell.style.bg);\r\n\r\n            // Build 6 vertices for quad (2 triangles)\r\n            // Triangle 1: top-left, top-right, bottom-left\r\n            // Triangle 2: top-right, bottom-right, bottom-left\r\n            let (tex_x, tex_y, tex_w, tex_h) = (\r\n                glyph_info.tex_x,\r\n                glyph_info.tex_y,\r\n                glyph_info.tex_width,\r\n                glyph_info.tex_height,\r\n            );\r\n\r\n            // Top-left\r\n            vertices.push(GlyphVertex {\r\n                position: [x_ndc, y_ndc],\r\n                tex_coords: [tex_x, tex_y],\r\n                fg_color,\r\n                bg_color,\r\n            });\r\n\r\n            // Top-right\r\n            vertices.push(GlyphVertex {\r\n                position: [x_ndc + cell_width_ndc, y_ndc],\r\n                tex_coords: [tex_x + tex_w, tex_y],\r\n                fg_color,\r\n                bg_color,\r\n            });\r\n\r\n            // Bottom-left\r\n            vertices.push(GlyphVertex {\r\n                position: [x_ndc, y_ndc - cell_height_ndc],\r\n                tex_coords: [tex_x, tex_y + tex_h],\r\n                fg_color,\r\n                bg_color,\r\n            });\r\n\r\n            // Triangle 2\r\n            // Top-right (duplicate)\r\n            vertices.push(GlyphVertex {\r\n                position: [x_ndc + cell_width_ndc, y_ndc],\r\n                tex_coords: [tex_x + tex_w, tex_y],\r\n                fg_color,\r\n                bg_color,\r\n            });\r\n\r\n            // Bottom-right\r\n            vertices.push(GlyphVertex {\r\n                position: [x_ndc + cell_width_ndc, y_ndc - cell_height_ndc],\r\n                tex_coords: [tex_x + tex_w, tex_y + tex_h],\r\n                fg_color,\r\n                bg_color,\r\n            });\r\n\r\n            // Bottom-left (duplicate)\r\n            vertices.push(GlyphVertex {\r\n                position: [x_ndc, y_ndc - cell_height_ndc],\r\n                tex_coords: [tex_x, tex_y + tex_h],\r\n                fg_color,\r\n                bg_color,\r\n            });\r\n        }\r\n\r\n        // Clear dirty region after rendering\r\n        self.terminal_grid.clear_dirty();\r\n\r\n        Ok(vertices)\r\n    }\r\n\r\n    /// Ensure glyph is cached and uploaded to GPU atlas\r\n    /// Target: \u003c1ms glyph lookup per SRS §2.1.1\r\n    /// Returns GlyphInfo for rendering\r\n    fn ensure_glyph_cached(\u0026mut self, key: GlyphKey) -\u003e Result\u003csuper::glyph_cache::GlyphInfo\u003e {\r\n        // Fast path: glyph already in cache\r\n        if let Some(info) = self.glyph_cache.lookup(key) {\r\n            return Ok(info);\r\n        }\r\n\r\n        // Slow path: rasterize glyph and upload to GPU\r\n        let rasterized = self.font_manager.rasterize_glyph(key.ch, key.bold, key.italic)?;\r\n\r\n        // Allocate space in atlas\r\n        let glyph_info = self.glyph_cache\r\n            .insert(key, rasterized.width as u32, rasterized.height as u32)\r\n            .context(\"Failed to allocate space in glyph atlas\")?;\r\n\r\n        // Upload glyph bitmap to GPU texture atlas\r\n        let queue = self.queue.as_ref().context(\"Queue not initialized\")?;\r\n        let atlas_texture = self.atlas_texture.as_ref().context(\"Atlas texture not initialized\")?;\r\n\r\n        // Calculate atlas pixel coordinates from normalized UV\r\n        let (atlas_width, atlas_height) = self.glyph_cache.atlas_size();\r\n        let atlas_x = (glyph_info.tex_x * atlas_width as f32) as u32;\r\n        let atlas_y = (glyph_info.tex_y * atlas_height as f32) as u32;\r\n\r\n        queue.write_texture(\r\n            wgpu::ImageCopyTexture {\r\n                texture: atlas_texture,\r\n                mip_level: 0,\r\n                origin: wgpu::Origin3d {\r\n                    x: atlas_x,\r\n                    y: atlas_y,\r\n                    z: 0,\r\n                },\r\n                aspect: wgpu::TextureAspect::All,\r\n            },\r\n            \u0026rasterized.bitmap,\r\n            wgpu::ImageDataLayout {\r\n                offset: 0,\r\n                bytes_per_row: Some(rasterized.width as u32),\r\n                rows_per_image: Some(rasterized.height as u32),\r\n            },\r\n            wgpu::Extent3d {\r\n                width: rasterized.width as u32,\r\n                height: rasterized.height as u32,\r\n                depth_or_array_layers: 1,\r\n            },\r\n        );\r\n\r\n        Ok(glyph_info)\r\n    }\r\n}\r\n\r\n/// Convert terminal Color (24-bit RGB) to RGBA float array (0.0-1.0)\r\n/// Supports true-color per SRS §2.1.1\r\nfn color_to_rgba(color: \u0026super::vt_parser::Color) -\u003e [f32; 4] {\r\n    [\r\n        color.r as f32 / 255.0,\r\n        color.g as f32 / 255.0,\r\n        color.b as f32 / 255.0,\r\n        1.0,\r\n    ]\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","renderer_bridge.rs"],"content":"//! RendererBridge - Connects SessionManager PTY output to wgpu Renderer\n//!\n//! Replaces mock PTY channel with real SessionManager integration.\n//! Zero-copy Arc\u003cBytes\u003e delivery from ConPTY → SessionManager → Renderer.\n//!\n//! Integration Point: Day 2 of Criterion #1 (60 FPS rendering)\n//! Delivered by rust-backend-lead per Monday 18:00 commitment\n\nuse tokio::sync::mpsc;\nuse bytes::Bytes;\nuse std::sync::Arc;\nuse uuid::Uuid;\nuse anyhow::Result;\n\nuse crate::session::{SessionManager, SessionId};\n\n/// Client ID for local UI rendering attachment\npub type ClientId = Uuid;\n\n/// RendererBridge - Zero-copy PTY output stream for GPU rendering\n///\n/// # Architecture\n/// ```text\n/// ConPTY → SessionManager → mpsc::channel(256) → RendererBridge → VtParser → TerminalGrid → GPU\n/// ```\n///\n/// # Backpressure\n/// - Channel buffer: 256 messages (configurable)\n/// - If GPU falls behind PTY, SessionManager blocks on send()\n/// - ConPTY kernel buffer provides additional buffering (~4KB per PTY spec)\n/// - Monitor: Log warning if channel \u003e80% full\npub struct RendererBridge {\n    /// PTY output receiver (from SessionManager)\n    pty_rx: mpsc::Receiver\u003cVec\u003cu8\u003e\u003e,\n\n    /// Channel capacity for backpressure monitoring\n    channel_capacity: usize,\n\n    /// Session ID for debugging/logging\n    session_id: SessionId,\n}\n\nimpl RendererBridge {\n    /// Attach to a session's PTY output stream\n    ///\n    /// # Arguments\n    /// - `session_manager`: Arc to SessionManager instance\n    /// - `session_id`: Target session UUID\n    /// - `client_id`: Unique UI client ID (for multi-attach support in Phase 2)\n    ///\n    /// # Returns\n    /// RendererBridge that receives Vec\u003cu8\u003e chunks from SessionManager\n    ///\n    /// # Example\n    /// ```rust,no_run\n    /// let bridge = RendererBridge::attach(\n    ///     session_manager.clone(),\n    ///     session_id,\n    ///     Uuid::new_v4(),\n    /// ).await?;\n    /// ```\n    pub async fn attach(\n        session_manager: Arc\u003cSessionManager\u003e,\n        session_id: SessionId,\n        client_id: ClientId,\n    ) -\u003e Result\u003cSelf\u003e {\n        let channel_capacity = 256; // 256 messages × ~4KB avg = ~1MB buffer\n        let (output_tx, pty_rx) = mpsc::channel(channel_capacity);\n\n        tracing::info!(\n            \"RendererBridge attaching to session {} (client: {}, buffer: {} msgs)\",\n            session_id, client_id, channel_capacity\n        );\n\n        // Attach as local UI client to SessionManager\n        // SessionManager will broadcast PTY output to this channel\n        session_manager\n            .attach_client(session_id, client_id, output_tx)\n            .await?;\n\n        Ok(Self {\n            pty_rx,\n            channel_capacity,\n            session_id,\n        })\n    }\n\n    /// Receive next PTY output chunk (async, blocking)\n    ///\n    /// Returns None if SessionManager closed the channel (session terminated)\n    ///\n    /// # Use Case\n    /// Tokio task dedicated to PTY processing (not render loop - use try_recv there)\n    pub async fn recv(\u0026mut self) -\u003e Option\u003cBytes\u003e {\n        self.pty_rx.recv().await.map(Bytes::from)\n    }\n\n    /// Try receive PTY output without blocking (non-blocking poll)\n    ///\n    /// Returns None if:\n    /// - No data currently available (channel empty)\n    /// - Channel closed (session terminated)\n    ///\n    /// # Use Case\n    /// **Primary integration point for Renderer::process_pty_output()**\n    ///\n    /// ```rust,no_run\n    /// // In render loop (60 FPS):\n    /// if let Some(bridge) = \u0026mut self.renderer_bridge {\n    ///     while let Some(bytes) = bridge.try_recv() {\n    ///         self.vt_parser.parse(\u0026bytes, \u0026mut self.terminal_grid);\n    ///     }\n    /// }\n    /// ```\n    pub fn try_recv(\u0026mut self) -\u003e Option\u003cBytes\u003e {\n        match self.pty_rx.try_recv() {\n            Ok(data) =\u003e {\n                // Backpressure monitoring (warn if channel \u003e80% full)\n                let pending = self.pty_rx.len();\n                if pending \u003e (self.channel_capacity * 80 / 100) {\n                    tracing::warn!(\n                        \"RendererBridge backpressure: {}/{} messages queued (\u003e80%), GPU may be falling behind PTY\",\n                        pending, self.channel_capacity\n                    );\n                }\n\n                Some(Bytes::from(data))\n            }\n            Err(mpsc::error::TryRecvError::Empty) =\u003e None,\n            Err(mpsc::error::TryRecvError::Disconnected) =\u003e {\n                tracing::info!(\"RendererBridge: Session {} PTY channel closed\", self.session_id);\n                None\n            }\n        }\n    }\n\n    /// Check if channel is still connected\n    ///\n    /// Returns false if SessionManager closed the PTY output stream\n    pub fn is_connected(\u0026self) -\u003e bool {\n        !self.pty_rx.is_closed()\n    }\n\n    /// Get current channel queue depth (for monitoring/debugging)\n    ///\n    /// # Performance Note\n    /// O(1) operation, safe to call frequently\n    pub fn queue_depth(\u0026self) -\u003e usize {\n        self.pty_rx.len()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::session::SessionManager;\n\n    #[tokio::test]\n    async fn test_renderer_bridge_attach() {\n        let manager = Arc::new(SessionManager::new(None));\n        let session_id = manager.create_session(None, 24, 80)\n            .await\n            .expect(\"Failed to create session\");\n\n        let client_id = Uuid::new_v4();\n        let bridge = RendererBridge::attach(manager.clone(), session_id, client_id)\n            .await\n            .expect(\"Failed to attach RendererBridge\");\n\n        assert!(bridge.is_connected());\n        assert_eq!(bridge.queue_depth(), 0);\n    }\n\n    #[tokio::test]\n    async fn test_renderer_bridge_try_recv_empty() {\n        let manager = Arc::new(SessionManager::new(None));\n        let session_id = manager.create_session(None, 24, 80)\n            .await\n            .expect(\"Failed to create session\");\n\n        let client_id = Uuid::new_v4();\n        let mut bridge = RendererBridge::attach(manager.clone(), session_id, client_id)\n            .await\n            .expect(\"Failed to attach RendererBridge\");\n\n        // Channel should be empty initially\n        assert!(bridge.try_recv().is_none());\n    }\n\n    #[tokio::test]\n    async fn test_renderer_bridge_recv_data() {\n        let manager = Arc::new(SessionManager::new(None));\n        let session_id = manager.create_session(None, 24, 80)\n            .await\n            .expect(\"Failed to create session\");\n\n        let client_id = Uuid::new_v4();\n        let mut bridge = RendererBridge::attach(manager.clone(), session_id, client_id)\n            .await\n            .expect(\"Failed to attach RendererBridge\");\n\n        // Send input to trigger PTY output\n        manager.send_input(session_id, b\"echo test\\r\\n\")\n            .await\n            .expect(\"Failed to send input\");\n\n        // Give PTY time to process (Windows ConPTY)\n        tokio::time::sleep(tokio::time::Duration::from_millis(100)).await;\n\n        // Should receive PTY output\n        let output = tokio::time::timeout(\n            tokio::time::Duration::from_secs(2),\n            bridge.recv()\n        ).await;\n\n        assert!(output.is_ok(), \"Timeout waiting for PTY output\");\n        assert!(output.unwrap().is_some(), \"Expected PTY output, got None\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","terminal_grid.rs"],"content":"//! Terminal Grid - Cell-based storage for terminal state\n//!\n//! Manages terminal cells with attributes, cursor position, and dirty tracking\n//! Target: \u003c0.5ms dirty tracking per SRS §2.1.1\n\nuse super::vt_parser::{CellStyle, Color, GridChange};\n\n/// Terminal grid managing cells and cursor\npub struct TerminalGrid {\n    /// Rows\n    rows: u16,\n    /// Columns\n    cols: u16,\n    /// Cell grid (row-major order)\n    cells: Vec\u003cCell\u003e,\n    /// Current cursor position\n    cursor_row: u16,\n    cursor_col: u16,\n    /// Current style\n    current_style: CellStyle,\n    /// Dirty region tracking\n    dirty: DirtyRegion,\n}\n\nimpl TerminalGrid {\n    /// Create new terminal grid\n    pub fn new(rows: u16, cols: u16) -\u003e Self {\n        let cell_count = (rows as usize) * (cols as usize);\n        let cells = vec![Cell::default(); cell_count];\n\n        Self {\n            rows,\n            cols,\n            cells,\n            cursor_row: 0,\n            cursor_col: 0,\n            current_style: CellStyle::default(),\n            dirty: DirtyRegion::new(rows, cols),\n        }\n    }\n\n    /// Apply changes from VT parser\n    /// Target: \u003c0.5ms dirty tracking\n    pub fn apply_changes(\u0026mut self, changes: Vec\u003cGridChange\u003e) {\n        for change in changes {\n            match change {\n                GridChange::PrintChar(ch) =\u003e {\n                    self.print_char(ch);\n                }\n                GridChange::Newline =\u003e {\n                    self.newline();\n                }\n                GridChange::CarriageReturn =\u003e {\n                    self.cursor_col = 0;\n                    self.dirty.mark_row(self.cursor_row);\n                }\n                GridChange::Tab =\u003e {\n                    // Tab to next 8-column boundary\n                    let next_col = ((self.cursor_col / 8) + 1) * 8;\n                    self.cursor_col = next_col.min(self.cols - 1);\n                    self.dirty.mark_row(self.cursor_row);\n                }\n                GridChange::Backspace =\u003e {\n                    if self.cursor_col \u003e 0 {\n                        self.cursor_col -= 1;\n                        self.dirty.mark_cell(self.cursor_row, self.cursor_col);\n                    }\n                }\n                GridChange::ClearScreen =\u003e {\n                    self.clear();\n                }\n                GridChange::CursorMove { row, col } =\u003e {\n                    self.cursor_row = row.min(self.rows - 1);\n                    self.cursor_col = col.min(self.cols - 1);\n                }\n                GridChange::StyleChange(style) =\u003e {\n                    self.current_style = style;\n                }\n                GridChange::ScrollUp =\u003e {\n                    self.scroll_up();\n                }\n                GridChange::ScrollDown =\u003e {\n                    self.scroll_down();\n                }\n            }\n        }\n    }\n\n    /// Print character at cursor position\n    fn print_char(\u0026mut self, ch: char) {\n        if self.cursor_row \u003e= self.rows || self.cursor_col \u003e= self.cols {\n            return;\n        }\n\n        let idx = (self.cursor_row as usize * self.cols as usize) + self.cursor_col as usize;\n        self.cells[idx] = Cell {\n            ch,\n            style: self.current_style,\n        };\n\n        self.dirty.mark_cell(self.cursor_row, self.cursor_col);\n\n        // Advance cursor\n        self.cursor_col += 1;\n        if self.cursor_col \u003e= self.cols {\n            self.newline();\n        }\n    }\n\n    /// Newline (move to next row, keep column or reset to 0)\n    fn newline(\u0026mut self) {\n        self.cursor_row += 1;\n        self.cursor_col = 0; // Most terminals do CR+LF\n\n        if self.cursor_row \u003e= self.rows {\n            // Scroll up\n            self.scroll_up();\n            self.cursor_row = self.rows - 1;\n        }\n\n        self.dirty.mark_row(self.cursor_row);\n    }\n\n    /// Scroll up one line\n    fn scroll_up(\u0026mut self) {\n        // Move all rows up by one\n        self.cells.copy_within(self.cols as usize.., 0);\n\n        // Clear bottom row\n        let bottom_row_start = (self.rows - 1) as usize * self.cols as usize;\n        for i in bottom_row_start..(bottom_row_start + self.cols as usize) {\n            self.cells[i] = Cell::default();\n        }\n\n        self.dirty.mark_all();\n    }\n\n    /// Scroll down one line\n    fn scroll_down(\u0026mut self) {\n        // Move all rows down by one\n        let total_cells = (self.rows as usize) * (self.cols as usize);\n        self.cells.copy_within(0..(total_cells - self.cols as usize), self.cols as usize);\n\n        // Clear top row\n        for i in 0..self.cols as usize {\n            self.cells[i] = Cell::default();\n        }\n\n        self.dirty.mark_all();\n    }\n\n    /// Clear entire screen\n    pub fn clear(\u0026mut self) {\n        for cell in \u0026mut self.cells {\n            *cell = Cell::default();\n        }\n        self.cursor_row = 0;\n        self.cursor_col = 0;\n        self.dirty.mark_all();\n    }\n\n    /// Get cell at position\n    pub fn get_cell(\u0026self, row: u16, col: u16) -\u003e Option\u003c\u0026Cell\u003e {\n        if row \u003e= self.rows || col \u003e= self.cols {\n            return None;\n        }\n        let idx = (row as usize * self.cols as usize) + col as usize;\n        self.cells.get(idx)\n    }\n\n    /// Get dirty region\n    pub fn dirty_region(\u0026self) -\u003e \u0026DirtyRegion {\n        \u0026self.dirty\n    }\n\n    /// Clear dirty region\n    pub fn clear_dirty(\u0026mut self) {\n        self.dirty.clear();\n    }\n\n    /// Get dimensions\n    pub fn dimensions(\u0026self) -\u003e (u16, u16) {\n        (self.rows, self.cols)\n    }\n\n    /// Get cursor position\n    pub fn cursor_position(\u0026self) -\u003e (u16, u16) {\n        (self.cursor_row, self.cursor_col)\n    }\n\n    /// Resize grid\n    pub fn resize(\u0026mut self, rows: u16, cols: u16) {\n        let new_cell_count = (rows as usize) * (cols as usize);\n        let mut new_cells = vec![Cell::default(); new_cell_count];\n\n        // Copy old cells to new grid (up to min dimensions)\n        let copy_rows = self.rows.min(rows);\n        let copy_cols = self.cols.min(cols);\n\n        for r in 0..copy_rows {\n            for c in 0..copy_cols {\n                let old_idx = (r as usize * self.cols as usize) + c as usize;\n                let new_idx = (r as usize * cols as usize) + c as usize;\n                new_cells[new_idx] = self.cells[old_idx];\n            }\n        }\n\n        self.rows = rows;\n        self.cols = cols;\n        self.cells = new_cells;\n        self.dirty = DirtyRegion::new(rows, cols);\n        self.dirty.mark_all();\n    }\n}\n\n/// Terminal cell with character and style\n#[derive(Debug, Clone, Copy, PartialEq)]\npub struct Cell {\n    pub ch: char,\n    pub style: CellStyle,\n}\n\nimpl Default for Cell {\n    fn default() -\u003e Self {\n        Self {\n            ch: ' ',\n            style: CellStyle::default(),\n        }\n    }\n}\n\n/// Dirty region tracking for efficient rendering\n/// Target: \u003c0.5ms per frame\npub struct DirtyRegion {\n    rows: u16,\n    cols: u16,\n    /// Dirty cells bitmap (1 bit per cell)\n    dirty_cells: Vec\u003cbool\u003e,\n    /// Is entire grid dirty?\n    all_dirty: bool,\n}\n\nimpl DirtyRegion {\n    pub fn new(rows: u16, cols: u16) -\u003e Self {\n        let cell_count = (rows as usize) * (cols as usize);\n        Self {\n            rows,\n            cols,\n            dirty_cells: vec![false; cell_count],\n            all_dirty: true, // Start dirty for initial render\n        }\n    }\n\n    /// Mark cell as dirty\n    pub fn mark_cell(\u0026mut self, row: u16, col: u16) {\n        if row \u003e= self.rows || col \u003e= self.cols {\n            return;\n        }\n        let idx = (row as usize * self.cols as usize) + col as usize;\n        self.dirty_cells[idx] = true;\n    }\n\n    /// Mark entire row as dirty\n    pub fn mark_row(\u0026mut self, row: u16) {\n        if row \u003e= self.rows {\n            return;\n        }\n        let start = row as usize * self.cols as usize;\n        let end = start + self.cols as usize;\n        for i in start..end {\n            self.dirty_cells[i] = true;\n        }\n    }\n\n    /// Mark all cells as dirty\n    pub fn mark_all(\u0026mut self) {\n        self.all_dirty = true;\n    }\n\n    /// Check if cell is dirty\n    pub fn is_dirty(\u0026self, row: u16, col: u16) -\u003e bool {\n        if self.all_dirty {\n            return true;\n        }\n        if row \u003e= self.rows || col \u003e= self.cols {\n            return false;\n        }\n        let idx = (row as usize * self.cols as usize) + col as usize;\n        self.dirty_cells[idx]\n    }\n\n    /// Clear dirty region\n    pub fn clear(\u0026mut self) {\n        self.all_dirty = false;\n        for dirty in \u0026mut self.dirty_cells {\n            *dirty = false;\n        }\n    }\n\n    /// Iterate over dirty cells (row, col)\n    pub fn iter_dirty(\u0026self) -\u003e impl Iterator\u003cItem = (u16, u16)\u003e + '_ {\n        (0..self.rows).flat_map(move |row| {\n            (0..self.cols).filter_map(move |col| {\n                if self.is_dirty(row, col) {\n                    Some((row, col))\n                } else {\n                    None\n                }\n            })\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_grid_print() {\n        let mut grid = TerminalGrid::new(24, 80);\n        grid.apply_changes(vec![\n            GridChange::PrintChar('H'),\n            GridChange::PrintChar('i'),\n        ]);\n\n        assert_eq!(grid.get_cell(0, 0).unwrap().ch, 'H');\n        assert_eq!(grid.get_cell(0, 1).unwrap().ch, 'i');\n        assert_eq!(grid.cursor_position(), (0, 2));\n    }\n\n    #[test]\n    fn test_grid_newline() {\n        let mut grid = TerminalGrid::new(24, 80);\n        grid.apply_changes(vec![GridChange::PrintChar('A'), GridChange::Newline]);\n\n        assert_eq!(grid.cursor_position(), (1, 0));\n    }\n\n    #[test]\n    fn test_dirty_tracking() {\n        let mut grid = TerminalGrid::new(24, 80);\n        grid.clear_dirty();\n\n        grid.apply_changes(vec![GridChange::PrintChar('X')]);\n\n        assert!(grid.dirty_region().is_dirty(0, 0));\n        assert!(!grid.dirty_region().is_dirty(0, 1));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","tests.rs"],"content":"//! UI Integration Tests\n//!\n//! Day 1: Mock integration tests for VT parser → terminal grid → renderer pipeline\n\n#[cfg(test)]\nmod tests {\n    use super::super::*;\n    use bytes::Bytes;\n    use tokio::sync::mpsc;\n    use vt_parser::{VtParser, GridChange, CellStyle};\n    use terminal_grid::TerminalGrid;\n    use glyph_cache::{GlyphCache, GlyphKey};\n\n    #[test]\n    fn test_vt_parser_to_grid_pipeline() {\n        // Test VT parser → terminal grid pipeline\n        let mut parser = VtParser::new();\n        let mut grid = TerminalGrid::new(24, 80);\n\n        // Feed test data\n        parser.feed(b\"Hello, World!\\n\");\n\n        // Apply changes to grid\n        let changes = parser.drain_changes();\n        grid.apply_changes(changes);\n\n        // Verify grid state\n        assert_eq!(grid.get_cell(0, 0).unwrap().ch, 'H');\n        assert_eq!(grid.get_cell(0, 6).unwrap().ch, ' ');\n        assert_eq!(grid.get_cell(0, 7).unwrap().ch, 'W');\n\n        // Cursor should be at row 1 after newline\n        assert_eq!(grid.cursor_position(), (1, 0));\n    }\n\n    #[test]\n    fn test_glyph_cache_pipeline() {\n        let mut cache = GlyphCache::new();\n\n        // Insert glyphs\n        let key_a = GlyphKey { ch: 'A', bold: false, italic: false };\n        let key_b = GlyphKey { ch: 'B', bold: true, italic: false };\n\n        cache.insert(key_a, 16, 16);\n        cache.insert(key_b, 16, 16);\n\n        // Lookup should succeed\n        assert!(cache.lookup(key_a).is_some());\n        assert!(cache.lookup(key_b).is_some());\n\n        // Different styles should be different keys\n        let key_a_bold = GlyphKey { ch: 'A', bold: true, italic: false };\n        assert!(cache.lookup(key_a_bold).is_none());\n    }\n\n    #[test]\n    fn test_dirty_tracking_performance() {\n        let mut grid = TerminalGrid::new(24, 80);\n\n        // Clear initial dirty state\n        grid.clear_dirty();\n\n        // Print single character\n        let start = std::time::Instant::now();\n        grid.apply_changes(vec![GridChange::PrintChar('X')]);\n        let elapsed = start.elapsed();\n\n        // Should be \u003c 0.5ms (dirty tracking budget)\n        assert!(elapsed.as_micros() \u003c 500, \"Dirty tracking took {:?}\", elapsed);\n\n        // Only (0, 0) should be dirty\n        assert!(grid.dirty_region().is_dirty(0, 0));\n        assert!(!grid.dirty_region().is_dirty(0, 1));\n    }\n\n    #[tokio::test]\n    async fn test_mock_pty_channel() {\n        // Test mock PTY channel (Day 1 pattern)\n        let (tx, mut rx) = mpsc::channel::\u003cBytes\u003e(100);\n\n        // Send mock PTY data\n        tx.send(Bytes::from(\"test\\n\")).await.unwrap();\n\n        // Receive and parse\n        let data = rx.try_recv().unwrap();\n        let mut parser = VtParser::new();\n        parser.feed(\u0026data);\n\n        let changes = parser.drain_changes();\n        assert_eq!(changes.len(), 5); // t, e, s, t, \\n\n    }\n\n    #[test]\n    fn test_60fps_frame_budget() {\n        // Validate frame budget targets per SRS §2.1.1\n        const FRAME_BUDGET_MS: f32 = 16.67;\n        const PTY_PARSE_BUDGET_MS: f32 = 2.0;\n        const DIRTY_TRACK_BUDGET_MS: f32 = 0.5;\n        const GLYPH_LOOKUP_BUDGET_MS: f32 = 1.0;\n        const GPU_RENDER_BUDGET_MS: f32 = 8.0;\n        const VSYNC_BUDGET_MS: f32 = 5.0;\n\n        // Total should be ≤ frame budget\n        let total = PTY_PARSE_BUDGET_MS\n            + DIRTY_TRACK_BUDGET_MS\n            + GLYPH_LOOKUP_BUDGET_MS\n            + GPU_RENDER_BUDGET_MS\n            + VSYNC_BUDGET_MS;\n\n        assert!(\n            total \u003c= FRAME_BUDGET_MS,\n            \"Budget total {:.2}ms exceeds {:.2}ms frame budget\",\n            total,\n            FRAME_BUDGET_MS\n        );\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","vt_parser.rs"],"content":"//! VT100/ANSI Escape Sequence Parser\n//!\n//! Parses PTY output and converts to terminal grid operations\n//! Supports: SGR (colors, bold, italic), cursor movement, screen clear, true-color (24-bit RGB)\n//! Per SRS §2.1.1 - Target: \u003c2ms parse time per frame\n\nuse bytes::Bytes;\n\n/// VT100/ANSI sequence parser\npub struct VtParser {\n    /// Pending parse state\n    state: ParserState,\n    /// Changes to apply to terminal grid\n    changes: Vec\u003cGridChange\u003e,\n    /// CSI parameter buffer\n    params: Vec\u003cu16\u003e,\n    /// Current parameter being accumulated\n    current_param: Option\u003cu16\u003e,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq)]\nenum ParserState {\n    Ground,\n    Escape,\n    CsiEntry,\n    CsiParam,\n}\n\nimpl VtParser {\n    pub fn new() -\u003e Self {\n        Self {\n            state: ParserState::Ground,\n            changes: Vec::new(),\n            params: Vec::new(),\n            current_param: None,\n        }\n    }\n\n    /// Feed PTY output bytes to parser\n    /// Target: \u003c2ms for typical terminal output\n    pub fn feed(\u0026mut self, data: \u0026[u8]) {\n        for \u0026byte in data {\n            match (self.state, byte) {\n                // ESC sequence start\n                (ParserState::Ground, 0x1B) =\u003e {\n                    self.state = ParserState::Escape;\n                }\n\n                // CSI sequence start (ESC [)\n                (ParserState::Escape, b'[') =\u003e {\n                    self.state = ParserState::CsiEntry;\n                    self.params.clear();\n                    self.current_param = None;\n                }\n\n                // OSC sequence (ESC ]) - hyperlinks OSC 8\n                (ParserState::Escape, b']') =\u003e {\n                    // TODO: Parse OSC 8 hyperlinks (Phase 1.5)\n                    self.state = ParserState::Ground;\n                }\n\n                // CSI Entry - first character after ESC [\n                (ParserState::CsiEntry, b'0'..=b'9') =\u003e {\n                    self.state = ParserState::CsiParam;\n                    let digit = (byte - b'0') as u16;\n                    self.current_param = Some(digit);\n                }\n\n                (ParserState::CsiEntry, b';') =\u003e {\n                    self.state = ParserState::CsiParam;\n                    self.params.push(0); // Empty parameter = 0\n                    self.current_param = None;\n                }\n\n                // CSI parameters (accumulate numbers, split on semicolons)\n                (ParserState::CsiParam, b'0'..=b'9') =\u003e {\n                    let digit = (byte - b'0') as u16;\n                    let param = self.current_param.unwrap_or(0);\n                    self.current_param = Some(param * 10 + digit);\n                }\n\n                (ParserState::CsiParam, b';') =\u003e {\n                    // Finish current parameter\n                    self.params.push(self.current_param.unwrap_or(0));\n                    self.current_param = None;\n                }\n\n                // CSI final byte - execute command\n                (ParserState::CsiParam | ParserState::CsiEntry, b'm') =\u003e {\n                    // SGR - Select Graphic Rendition (colors, bold, italic)\n                    if let Some(param) = self.current_param {\n                        self.params.push(param);\n                    }\n                    self.parse_sgr();\n                    self.state = ParserState::Ground;\n                }\n\n                (ParserState::CsiParam | ParserState::CsiEntry, b'H') =\u003e {\n                    // CUP - Cursor Position\n                    if let Some(param) = self.current_param {\n                        self.params.push(param);\n                    }\n                    let row = self.params.get(0).copied().unwrap_or(1).saturating_sub(1);\n                    let col = self.params.get(1).copied().unwrap_or(1).saturating_sub(1);\n                    self.changes.push(GridChange::CursorMove { row, col });\n                    self.state = ParserState::Ground;\n                }\n\n                (ParserState::CsiParam | ParserState::CsiEntry, b'J') =\u003e {\n                    // ED - Erase in Display\n                    self.changes.push(GridChange::ClearScreen);\n                    self.state = ParserState::Ground;\n                }\n\n                (ParserState::CsiParam | ParserState::CsiEntry, b'A') =\u003e {\n                    // CUU - Cursor Up\n                    if let Some(param) = self.current_param {\n                        self.params.push(param);\n                    }\n                    let n = self.params.get(0).copied().unwrap_or(1);\n                    // TODO: Emit cursor up change\n                    self.state = ParserState::Ground;\n                }\n\n                (ParserState::CsiParam | ParserState::CsiEntry, b'B') =\u003e {\n                    // CUD - Cursor Down\n                    if let Some(param) = self.current_param {\n                        self.params.push(param);\n                    }\n                    let n = self.params.get(0).copied().unwrap_or(1);\n                    // TODO: Emit cursor down change\n                    self.state = ParserState::Ground;\n                }\n\n                // Printable character\n                (ParserState::Ground, 0x20..=0x7E) =\u003e {\n                    let ch = byte as char;\n                    self.changes.push(GridChange::PrintChar(ch));\n                }\n\n                // Newline\n                (ParserState::Ground, b'\\n') =\u003e {\n                    self.changes.push(GridChange::Newline);\n                }\n\n                // Carriage return\n                (ParserState::Ground, b'\\r') =\u003e {\n                    self.changes.push(GridChange::CarriageReturn);\n                }\n\n                // Tab\n                (ParserState::Ground, b'\\t') =\u003e {\n                    self.changes.push(GridChange::Tab);\n                }\n\n                // Backspace\n                (ParserState::Ground, 0x08) =\u003e {\n                    self.changes.push(GridChange::Backspace);\n                }\n\n                // UTF-8 continuation bytes (0x80-0xBF)\n                // TODO: Full UTF-8 parsing (Phase 1.5)\n                (ParserState::Ground, 0x80..=0xBF) =\u003e {\n                    // For now, replace with '?' - full UTF-8 in Phase 1.5\n                    self.changes.push(GridChange::PrintChar('?'));\n                }\n\n                // Unknown or unimplemented\n                _ =\u003e {\n                    // Reset to ground state on unknown sequences\n                    self.state = ParserState::Ground;\n                }\n            }\n        }\n    }\n\n    /// Parse SGR (Select Graphic Rendition) parameters\n    /// Handles ANSI colors (30-37, 40-47, 90-97, 100-107) and true-color (38;2;r;g;b)\n    fn parse_sgr(\u0026mut self) {\n        // Start with current style (we'll modify it)\n        let mut style = CellStyle::default(); // TODO: Track current style in parser state\n\n        let mut i = 0;\n        while i \u003c self.params.len() {\n            let param = self.params[i];\n\n            match param {\n                0 =\u003e {\n                    // Reset all attributes\n                    style = CellStyle::default();\n                }\n                1 =\u003e {\n                    // Bold\n                    style.bold = true;\n                }\n                3 =\u003e {\n                    // Italic\n                    style.italic = true;\n                }\n                4 =\u003e {\n                    // Underline\n                    style.underline = true;\n                }\n                22 =\u003e {\n                    // Not bold\n                    style.bold = false;\n                }\n                23 =\u003e {\n                    // Not italic\n                    style.italic = false;\n                }\n                24 =\u003e {\n                    // Not underline\n                    style.underline = false;\n                }\n\n                // Foreground colors (ANSI 30-37)\n                30 =\u003e style.fg = Color::rgb(0, 0, 0),       // Black\n                31 =\u003e style.fg = Color::rgb(205, 0, 0),     // Red\n                32 =\u003e style.fg = Color::rgb(0, 205, 0),     // Green\n                33 =\u003e style.fg = Color::rgb(205, 205, 0),   // Yellow\n                34 =\u003e style.fg = Color::rgb(0, 0, 205),     // Blue\n                35 =\u003e style.fg = Color::rgb(205, 0, 205),   // Magenta\n                36 =\u003e style.fg = Color::rgb(0, 205, 205),   // Cyan\n                37 =\u003e style.fg = Color::rgb(229, 229, 229), // White\n\n                // Foreground 24-bit true-color (38;2;r;g;b)\n                38 =\u003e {\n                    if i + 4 \u003c self.params.len() \u0026\u0026 self.params[i + 1] == 2 {\n                        let r = self.params[i + 2].min(255) as u8;\n                        let g = self.params[i + 3].min(255) as u8;\n                        let b = self.params[i + 4].min(255) as u8;\n                        style.fg = Color::rgb(r, g, b);\n                        i += 4; // Skip r,g,b params\n                    }\n                }\n\n                // Default foreground\n                39 =\u003e style.fg = CellStyle::default().fg,\n\n                // Background colors (ANSI 40-47)\n                40 =\u003e style.bg = Color::rgb(0, 0, 0),\n                41 =\u003e style.bg = Color::rgb(205, 0, 0),\n                42 =\u003e style.bg = Color::rgb(0, 205, 0),\n                43 =\u003e style.bg = Color::rgb(205, 205, 0),\n                44 =\u003e style.bg = Color::rgb(0, 0, 205),\n                45 =\u003e style.bg = Color::rgb(205, 0, 205),\n                46 =\u003e style.bg = Color::rgb(0, 205, 205),\n                47 =\u003e style.bg = Color::rgb(229, 229, 229),\n\n                // Background 24-bit true-color (48;2;r;g;b)\n                48 =\u003e {\n                    if i + 4 \u003c self.params.len() \u0026\u0026 self.params[i + 1] == 2 {\n                        let r = self.params[i + 2].min(255) as u8;\n                        let g = self.params[i + 3].min(255) as u8;\n                        let b = self.params[i + 4].min(255) as u8;\n                        style.bg = Color::rgb(r, g, b);\n                        i += 4;\n                    }\n                }\n\n                // Default background\n                49 =\u003e style.bg = CellStyle::default().bg,\n\n                // Bright foreground colors (ANSI 90-97)\n                90 =\u003e style.fg = Color::rgb(127, 127, 127), // Bright black (gray)\n                91 =\u003e style.fg = Color::rgb(255, 0, 0),\n                92 =\u003e style.fg = Color::rgb(0, 255, 0),\n                93 =\u003e style.fg = Color::rgb(255, 255, 0),\n                94 =\u003e style.fg = Color::rgb(0, 0, 255),\n                95 =\u003e style.fg = Color::rgb(255, 0, 255),\n                96 =\u003e style.fg = Color::rgb(0, 255, 255),\n                97 =\u003e style.fg = Color::rgb(255, 255, 255),\n\n                // Bright background colors (ANSI 100-107)\n                100 =\u003e style.bg = Color::rgb(127, 127, 127),\n                101 =\u003e style.bg = Color::rgb(255, 0, 0),\n                102 =\u003e style.bg = Color::rgb(0, 255, 0),\n                103 =\u003e style.bg = Color::rgb(255, 255, 0),\n                104 =\u003e style.bg = Color::rgb(0, 0, 255),\n                105 =\u003e style.bg = Color::rgb(255, 0, 255),\n                106 =\u003e style.bg = Color::rgb(0, 255, 255),\n                107 =\u003e style.bg = Color::rgb(255, 255, 255),\n\n                _ =\u003e {\n                    // Unknown parameter, ignore\n                }\n            }\n\n            i += 1;\n        }\n\n        // Emit style change\n        self.changes.push(GridChange::StyleChange(style));\n    }\n\n    /// Drain parsed changes for terminal grid\n    pub fn drain_changes(\u0026mut self) -\u003e Vec\u003cGridChange\u003e {\n        std::mem::take(\u0026mut self.changes)\n    }\n\n    /// Reset parser state\n    pub fn reset(\u0026mut self) {\n        self.state = ParserState::Ground;\n        self.changes.clear();\n        self.params.clear();\n        self.current_param = None;\n    }\n}\n\nimpl Default for VtParser {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n/// Changes to apply to terminal grid\n#[derive(Debug, Clone, PartialEq)]\npub enum GridChange {\n    PrintChar(char),\n    Newline,\n    CarriageReturn,\n    Tab,\n    Backspace,\n    ClearScreen,\n    CursorMove { row: u16, col: u16 },\n    StyleChange(CellStyle),\n    ScrollUp,\n    ScrollDown,\n}\n\n/// Cell style attributes\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct CellStyle {\n    /// Foreground color (24-bit true-color)\n    pub fg: Color,\n    /// Background color (24-bit true-color)\n    pub bg: Color,\n    /// Bold attribute\n    pub bold: bool,\n    /// Italic attribute\n    pub italic: bool,\n    /// Underline attribute\n    pub underline: bool,\n}\n\nimpl Default for CellStyle {\n    fn default() -\u003e Self {\n        Self {\n            fg: Color::rgb(192, 192, 192), // Light gray\n            bg: Color::rgb(0, 0, 0),       // Black\n            bold: false,\n            italic: false,\n            underline: false,\n        }\n    }\n}\n\n/// True-color (24-bit RGB) per SRS §2.1.1\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct Color {\n    pub r: u8,\n    pub g: u8,\n    pub b: u8,\n}\n\nimpl Color {\n    pub const fn rgb(r: u8, g: u8, b: u8) -\u003e Self {\n        Self { r, g, b }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_parser_basic() {\n        let mut parser = VtParser::new();\n        parser.feed(b\"Hello\\n\");\n\n        let changes = parser.drain_changes();\n        assert_eq!(changes.len(), 6); // H, e, l, l, o, \\n\n        assert_eq!(changes[0], GridChange::PrintChar('H'));\n        assert_eq!(changes[5], GridChange::Newline);\n    }\n\n    #[test]\n    fn test_parser_escape() {\n        let mut parser = VtParser::new();\n        parser.feed(b\"\\x1B[2J\"); // Clear screen\n\n        let changes = parser.drain_changes();\n        assert!(changes.contains(\u0026GridChange::ClearScreen));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","window.rs"],"content":"//! Window management and event loop\n//!\n//! Handles the main window creation and event processing\n//! Per SRS §4.2.1 - Desktop App Architecture\n\nuse anyhow::Result;\nuse winit::{\n    application::ApplicationHandler,\n    event::{ElementState, KeyEvent, WindowEvent},\n    event_loop::{ActiveEventLoop, ControlFlow, EventLoop},\n    keyboard::{KeyCode, PhysicalKey},\n    window::{Window as WinitWindow, WindowAttributes},\n};\nuse std::sync::Arc;\n\nuse super::{Renderer, performance::PerformanceMonitor};\n\n/// Window wrapper managing the native window\npub struct Window {\n    event_loop: EventLoop\u003c()\u003e,\n    window_attributes: WindowAttributes,\n}\n\nimpl Window {\n    /// Create new window with default size\n    pub fn new() -\u003e Result\u003cSelf\u003e {\n        let event_loop = EventLoop::new()?;\n\n        // Default window size: 1280x720 (720p)\n        let window_attributes = WinitWindow::default_attributes()\n            .with_title(\"MONOTERMINAL\")\n            .with_inner_size(winit::dpi::LogicalSize::new(1280.0, 720.0))\n            .with_min_inner_size(winit::dpi::LogicalSize::new(800.0, 600.0));\n\n        Ok(Self {\n            event_loop,\n            window_attributes,\n        })\n    }\n\n    /// Get reference to inner window for renderer initialization\n    pub fn inner(\u0026self) -\u003e \u0026EventLoop\u003c()\u003e {\n        \u0026self.event_loop\n    }\n\n    /// Run the event loop with the renderer\n    pub fn run(self, renderer: Renderer) -\u003e Result\u003c()\u003e {\n        let mut app = App::new(self.window_attributes, renderer);\n\n        self.event_loop.run_app(\u0026mut app)?;\n\n        Ok(())\n    }\n}\n\n/// Application handler for event loop\nstruct App {\n    window_attributes: WindowAttributes,\n    window: Option\u003cArc\u003cWinitWindow\u003e\u003e,\n    renderer: Renderer,\n    perf_monitor: PerformanceMonitor,\n}\n\nimpl App {\n    fn new(window_attributes: WindowAttributes, renderer: Renderer) -\u003e Self {\n        Self {\n            window_attributes,\n            window: None,\n            renderer,\n            perf_monitor: PerformanceMonitor::new(),\n        }\n    }\n}\n\nimpl ApplicationHandler for App {\n    fn resumed(\u0026mut self, event_loop: \u0026ActiveEventLoop) {\n        if self.window.is_none() {\n            let window = Arc::new(\n                event_loop\n                    .create_window(self.window_attributes.clone())\n                    .expect(\"Failed to create window\")\n            );\n\n            // Initialize renderer surface\n            if let Err(e) = pollster::block_on(self.renderer.init_surface(window.clone())) {\n                tracing::error!(\"Failed to initialize renderer surface: {}\", e);\n                event_loop.exit();\n                return;\n            }\n\n            // Initialize text rendering pipeline (shaders, atlas, sampler)\n            if let Err(e) = self.renderer.init_text_pipeline() {\n                tracing::error!(\"Failed to initialize text rendering pipeline: {}\", e);\n                event_loop.exit();\n                return;\n            }\n\n            self.window = Some(window);\n            tracing::info!(\"Window created and renderer initialized with text pipeline\");\n        }\n    }\n\n    fn window_event(\n        \u0026mut self,\n        event_loop: \u0026ActiveEventLoop,\n        _window_id: winit::window::WindowId,\n        event: WindowEvent,\n    ) {\n        match event {\n            WindowEvent::CloseRequested =\u003e {\n                tracing::info!(\"Close requested\");\n                event_loop.exit();\n            }\n\n            WindowEvent::KeyboardInput {\n                event: KeyEvent {\n                    physical_key: PhysicalKey::Code(KeyCode::Escape),\n                    state: ElementState::Pressed,\n                    ..\n                },\n                ..\n            } =\u003e {\n                tracing::info!(\"Escape pressed, exiting\");\n                event_loop.exit();\n            }\n\n            WindowEvent::Resized(new_size) =\u003e {\n                if let Err(e) = self.renderer.resize(new_size.width, new_size.height) {\n                    tracing::error!(\"Failed to resize: {}\", e);\n                }\n            }\n\n            WindowEvent::RedrawRequested =\u003e {\n                // Start frame timing\n                self.perf_monitor.start_frame();\n\n                // Render frame\n                if let Some(window) = \u0026self.window {\n                    match self.renderer.render(window, \u0026mut self.perf_monitor) {\n                        Ok(_) =\u003e {\n                            // End frame timing and check budget\n                            let frame_time = self.perf_monitor.end_frame();\n\n                            // Log if we exceed 16.67ms budget\n                            if frame_time \u003e 16.67 {\n                                tracing::warn!(\n                                    \"Frame time exceeded budget: {:.2}ms (target: 16.67ms)\",\n                                    frame_time\n                                );\n                            }\n                        }\n                        Err(e) =\u003e {\n                            tracing::error!(\"Render error: {}\", e);\n                        }\n                    }\n                }\n\n                // Request next frame\n                if let Some(window) = \u0026self.window {\n                    window.request_redraw();\n                }\n            }\n\n            _ =\u003e {}\n        }\n    }\n\n    fn about_to_wait(\u0026mut self, _event_loop: \u0026ActiveEventLoop) {\n        if let Some(window) =
