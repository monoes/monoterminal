 TLS configuration for WebSocket server\n#[derive(Debug, Clone)]\npub struct TlsConfig {\n    /// Path to TLS certificate (PEM format)\n    pub cert_path: PathBuf,\n\n    /// Path to TLS private key (PEM format)\n    pub key_path: PathBuf,\n}\n\nimpl Default for TlsConfig {\n    fn default() -\u003e Self {\n        Self {\n            cert_path: PathBuf::from(\"certs/server.crt\"),\n            key_path: PathBuf::from(\"certs/server.key\"),\n        }\n    }\n}\n\nimpl TlsConfig {\n    /// Create TLS configuration with custom paths\n    pub fn new(cert_path: impl Into\u003cPathBuf\u003e, key_path: impl Into\u003cPathBuf\u003e) -\u003e Self {\n        Self {\n            cert_path: cert_path.into(),\n            key_path: key_path.into(),\n        }\n    }\n\n    /// Build TLS acceptor with TLS 1.3 only\n    pub fn build_acceptor(\u0026self) -\u003e Result\u003cTlsAcceptor\u003e {\n        // Load certificates\n        let certs = load_certs(\u0026self.cert_path)?;\n        let key = load_private_key(\u0026self.key_path)?;\n\n        // Build rustls ServerConfig - TLS 1.3 only\n        let config = ServerConfig::builder()\n            .with_safe_default_cipher_suites()\n            .with_safe_default_kx_groups()\n            .with_protocol_versions(\u0026[\u0026TLS13])\n            .map_err(|e| ServerError::Internal(format!(\"Failed to set TLS 1.3 only: {}\", e)))?\n            .with_no_client_auth()\n            .with_single_cert(certs, key)\n            .map_err(|e| ServerError::Internal(format!(\"Failed to configure TLS: {}\", e)))?;\n\n        Ok(TlsAcceptor::from(Arc::new(config)))\n    }\n\n    /// Build TLS acceptor for dev/test mode with in-memory self-signed certificate\n    /// WARNING: For testing only - uses hardcoded test certificate\n    pub fn build_dev_acceptor() -\u003e Result\u003cTlsAcceptor\u003e {\n        // Generate in-memory self-signed certificate for tests\n        let cert_pem = include_bytes!(\"../../../../certs/server.crt\");\n        let key_pem = include_bytes!(\"../../../../certs/server.key\");\n\n        let certs: Vec\u003cCertificate\u003e = rustls_pemfile::certs(\u0026mut \u0026cert_pem[..])\n            .map_err(|e| ServerError::Internal(format!(\"Failed to parse test certificate: {}\", e)))?\n            .into_iter()\n            .map(Certificate)\n            .collect();\n\n        let keys = rustls_pemfile::pkcs8_private_keys(\u0026mut \u0026key_pem[..])\n            .map_err(|e| ServerError::Internal(format!(\"Failed to parse test key: {}\", e)))?;\n\n        if keys.is_empty() {\n            return Err(ServerError::Internal(\"No private key found in test key\".to_string()));\n        }\n\n        let key = PrivateKey(keys[0].clone());\n\n        // Build rustls ServerConfig - TLS 1.3 only\n        let config = ServerConfig::builder()\n            .with_safe_default_cipher_suites()\n            .with_safe_default_kx_groups()\n            .with_protocol_versions(\u0026[\u0026TLS13])\n            .map_err(|e| ServerError::Internal(format!(\"Failed to set TLS 1.3 only: {}\", e)))?\n            .with_no_client_auth()\n            .with_single_cert(certs, key)\n            .map_err(|e| ServerError::Internal(format!(\"Failed to configure TLS: {}\", e)))?;\n\n        Ok(TlsAcceptor::from(Arc::new(config)))\n    }\n}\n\n/// Load certificates from PEM file\nfn load_certs(path: \u0026Path) -\u003e Result\u003cVec\u003cCertificate\u003e\u003e {\n    let file = File::open(path)\n        .map_err(|e| ServerError::Internal(format!(\"Failed to open cert file {}: {}\", path.display(), e)))?;\n    let mut reader = BufReader::new(file);\n\n    let certs: Vec\u003cCertificate\u003e = rustls_pemfile::certs(\u0026mut reader)\n        .map_err(|e| ServerError::Internal(format!(\"Failed to parse certificates: {}\", e)))?\n        .into_iter()\n        .map(Certificate)\n        .collect();\n\n    if certs.is_empty() {\n        Err(ServerError::Internal(\"No certificates found in file\".to_string()))\n    } else {\n        Ok(certs)\n    }\n}\n\n/// Load private key from PEM file\nfn load_private_key(path: \u0026Path) -\u003e Result\u003cPrivateKey\u003e {\n    let file = File::open(path)\n        .map_err(|e| ServerError::Internal(format!(\"Failed to open key file {}: {}\", path.display(), e)))?;\n    let mut reader = BufReader::new(file);\n\n    // Try PKCS8 first, then RSA\n    let keys = rustls_pemfile::pkcs8_private_keys(\u0026mut reader)\n        .map_err(|e| ServerError::Internal(format!(\"Failed to parse private key: {}\", e)))?;\n\n    if !keys.is_empty() {\n        return Ok(PrivateKey(keys[0].clone()));\n    }\n\n    // Try RSA format\n    let file = File::open(path)\n        .map_err(|e| ServerError::Internal(format!(\"Failed to open key file {}: {}\", path.display(), e)))?;\n    let mut reader = BufReader::new(file);\n\n    let keys = rustls_pemfile::rsa_private_keys(\u0026mut reader)\n        .map_err(|e| ServerError::Internal(format!(\"Failed to parse RSA private key: {}\", e)))?;\n\n    if !keys.is_empty() {\n        return Ok(PrivateKey(keys[0].clone()));\n    }\n\n    Err(ServerError::Internal(\"No private key found in file\".to_string()))\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_tls_config_default() {\n        let config = TlsConfig::default();\n        assert_eq!(config.cert_path, PathBuf::from(\"certs/server.crt\"));\n        assert_eq!(config.key_path, PathBuf::from(\"certs/server.key\"));\n    }\n\n    #[test]\n    fn test_tls_config_custom() {\n        let config = TlsConfig::new(\"/path/to/cert.pem\", \"/path/to/key.pem\");\n        assert_eq!(config.cert_path, PathBuf::from(\"/path/to/cert.pem\"));\n        assert_eq!(config.key_path, PathBuf::from(\"/path/to/key.pem\"));\n    }\n}\n","traces":[{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":3},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","session","abort_on_drop_tests.rs"],"content":"// Tests for AbortOnDrop pattern (ADR-009)\n// Validates task cleanup when Session drops\n\n#[cfg(test)]\nmod tests {\n    use std::sync::Arc;\n    use std::sync::atomic::{AtomicBool, Ordering};\n    use std::time::Duration;\n    use tokio::sync::RwLock;\n    use tokio_util::task::AbortOnDrop;\n    use crate::session::{Session, SessionId};\n    use crate::session::mock_pty::MockPtyBackend;\n    use std::path::PathBuf;\n\n    /// Test that AbortOnDrop cancels tasks when Session drops\n    #[tokio::test]\n    async fn test_abort_on_drop_cancels_tasks() {\n        // Create flags to track if tasks are running\n        let output_task_running = Arc::new(AtomicBool::new(false));\n        let monomind_task_running = Arc::new(AtomicBool::new(false));\n\n        let output_flag = output_task_running.clone();\n        let monomind_flag = monomind_task_running.clone();\n\n        // Spawn long-running tasks\n        let output_handle = tokio::spawn(async move {\n            output_flag.store(true, Ordering::SeqCst);\n            // Simulate long-running task\n            tokio::time::sleep(Duration::from_secs(3600)).await;\n            // This should never be reached due to abort\n            output_flag.store(false, Ordering::SeqCst);\n        });\n        let output_task = AbortOnDrop::new(output_handle.abort_handle());\n\n        let monomind_handle = tokio::spawn(async move {\n            monomind_flag.store(true, Ordering::SeqCst);\n            // Simulate long-running task\n            tokio::time::sleep(Duration::from_secs(3600)).await;\n            // This should never be reached due to abort\n            monomind_flag.store(false, Ordering::SeqCst);\n        });\n        let monomind_task = AbortOnDrop::new(monomind_handle.abort_handle());\n\n        // Give tasks time to start\n        tokio::time::sleep(Duration::from_millis(50)).await;\n\n        // Verify tasks are running\n        assert!(output_task_running.load(Ordering::SeqCst));\n        assert!(monomind_task_running.load(Ordering::SeqCst));\n\n        // Create mock PTY\n        let mock_pty = MockPtyBackend::new(12345);\n\n        // Create session with AbortOnDrop tasks\n        let session_id = SessionId::new_v4();\n        let _session = Session::new(\n            session_id,\n            Box::new(mock_pty),\n            \"test.exe\".to_string(),\n            PathBuf::from(\"C:\\\\test\"),\n            24,\n            80,\n            output_task,\n            monomind_task,\n        );\n\n        // Session drops here when it goes out of scope\n        drop(_session);\n\n        // Give abort time to propagate\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Tasks should still show as \"running\" in our flags because abort\n        // doesn't change the flag - it just stops the task from completing\n        // The important test is that the tasks don't reach the code that sets false\n        assert!(output_task_running.load(Ordering::SeqCst));\n        assert!(monomind_task_running.load(Ordering::SeqCst));\n    }\n\n    /// Test that Session drop triggers AbortOnDrop cleanup\n    #[tokio::test]\n    async fn test_session_drop_aborts_background_tasks() {\n        let task_aborted = Arc::new(AtomicBool::new(false));\n        let aborted_flag = task_aborted.clone();\n\n        // Spawn a task that can detect cancellation\n        let output_handle = tokio::spawn(async move {\n            tokio::select! {\n                _ = tokio::time::sleep(Duration::from_secs(3600)) =\u003e {\n                    // Should not reach here\n                }\n                _ = tokio::signal::ctrl_c() =\u003e {\n                    // Also should not reach here in test\n                }\n            }\n            // If we get here without cancellation, something is wrong\n            aborted_flag.store(false, Ordering::SeqCst);\n        });\n        let output_task = AbortOnDrop::new(output_handle.abort_handle());\n\n        let monomind_handle = tokio::spawn(async move {\n            tokio::time::sleep(Duration::from_secs(3600)).await;\n        });\n        let monomind_task = AbortOnDrop::new(monomind_handle.abort_handle());\n\n        // Create mock PTY\n        let mock_pty = MockPtyBackend::new(12345);\n\n        let session_id = SessionId::new_v4();\n        {\n            let _session = Session::new(\n                session_id,\n                Box::new(mock_pty),\n                \"test.exe\".to_string(),\n                PathBuf::from(\"C:\\\\test\"),\n                24,\n                80,\n                output_task,\n                monomind_task,\n            );\n            // Session drops at end of this scope\n        }\n\n        // Give time for abort to propagate\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Task should have been aborted, so the flag should not be set to false\n        assert!(!task_aborted.load(Ordering::SeqCst));\n    }\n\n    /// Test that multiple Session drops don't cause issues\n    #[tokio::test]\n    async fn test_multiple_sessions_cleanup() {\n        for i in 0..10 {\n            let output_handle = tokio::spawn(async move {\n                tokio::time::sleep(Duration::from_secs(3600)).await;\n            });\n            let output_task = AbortOnDrop::new(output_handle.abort_handle());\n\n            let monomind_handle = tokio::spawn(async move {\n                tokio::time::sleep(Duration::from_secs(3600)).await;\n            });\n            let monomind_task = AbortOnDrop::new(monomind_handle.abort_handle());\n\n            let mock_pty = MockPtyBackend::new(10000 + i);\n\n            let session_id = SessionId::new_v4();\n            let _session = Session::new(\n                session_id,\n                Box::new(mock_pty),\n                \"test.exe\".to_string(),\n                PathBuf::from(\"C:\\\\test\"),\n                24,\n                80,\n                output_task,\n                monomind_task,\n            );\n\n            // Session drops immediately\n            drop(_session);\n        }\n\n        // All sessions should clean up without panics or leaks\n        tokio::time::sleep(Duration::from_millis(200)).await;\n    }\n\n    /// Test that tasks are properly cleaned up when Session is in an Arc\n    #[tokio::test]\n    async fn test_arc_session_cleanup() {\n        let task_completed = Arc::new(AtomicBool::new(false));\n        let completed_flag = task_completed.clone();\n\n        let output_handle = tokio::spawn(async move {\n            // This should be cancelled before completing\n            tokio::time::sleep(Duration::from_secs(3600)).await;\n            completed_flag.store(true, Ordering::SeqCst);\n        });\n        let output_task = AbortOnDrop::new(output_handle.abort_handle());\n\n        let monomind_handle = tokio::spawn(async move {\n            tokio::time::sleep(Duration::from_secs(3600)).await;\n        });\n        let monomind_task = AbortOnDrop::new(monomind_handle.abort_handle());\n\n        let mock_pty = MockPtyBackend::new(12345);\n\n        let session_id = SessionId::new_v4();\n        let session = Session::new(\n            session_id,\n            Box::new(mock_pty),\n            \"test.exe\".to_string(),\n            PathBuf::from(\"C:\\\\test\"),\n            24,\n            80,\n            output_task,\n            monomind_task,\n        );\n\n        // Wrap in Arc\u003cRwLock\u003c\u003e\u003e like SessionManager does\n        let session_arc = Arc::new(RwLock::new(session));\n\n        // Clone the Arc (simulating multiple references)\n        let _clone1 = session_arc.clone();\n        let _clone2 = session_arc.clone();\n\n        // Drop all references\n        drop(_clone1);\n        drop(_clone2);\n        drop(session_arc);\n\n        // Give time for cleanup\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Task should have been aborted, not completed\n        assert!(!task_completed.load(Ordering::SeqCst));\n    }\n\n    /// Property test: Session lifecycle with AbortOnDrop never leaks tasks\n    #[tokio::test]\n    async fn test_session_lifecycle_no_task_leaks() {\n        use std::sync::atomic::AtomicUsize;\n\n        let tasks_spawned = Arc::new(AtomicUsize::new(0));\n        let tasks_completed = Arc::new(AtomicUsize::new(0));\n\n        for _ in 0..20 {\n            let spawned = tasks_spawned.clone();\n            let completed = tasks_completed.clone();\n\n            let output_handle = tokio::spawn(async move {\n                spawned.fetch_add(1, Ordering::SeqCst);\n                tokio::time::sleep(Duration::from_secs(3600)).await;\n                completed.fetch_add(1, Ordering::SeqCst);\n            });\n            let output_task = AbortOnDrop::new(output_handle.abort_handle());\n\n            let spawned2 = tasks_spawned.clone();\n            let completed2 = tasks_completed.clone();\n\n            let monomind_handle = tokio::spawn(async move {\n                spawned2.fetch_add(1, Ordering::SeqCst);\n                tokio::time::sleep(Duration::from_secs(3600)).await;\n                completed2.fetch_add(1, Ordering::SeqCst);\n            });\n            let monomind_task = AbortOnDrop::new(monomind_handle.abort_handle());\n\n            let mock_pty = MockPtyBackend::new(12345);\n\n            let session_id = SessionId::new_v4();\n            let session = Session::new(\n                session_id,\n                Box::new(mock_pty),\n                \"test.exe\".to_string(),\n                PathBuf::from(\"C:\\\\test\"),\n                24,\n                80,\n                output_task,\n                monomind_task,\n            );\n\n            // Give tasks time to start and set the spawned flag\n            tokio::time::sleep(Duration::from_millis(10)).await;\n\n            // Session drops here\n            drop(session);\n        }\n\n        // Give time for all aborts to propagate\n        tokio::time::sleep(Duration::from_millis(200)).await;\n\n        // All tasks should have been spawned\n        assert_eq!(tasks_spawned.load(Ordering::SeqCst), 40); // 20 iterations * 2 tasks\n\n        // No tasks should have completed (all aborted)\n        assert_eq!(tasks_completed.load(Ordering::SeqCst), 0);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","session","manager.rs"],"content":"// Session Manager - central coordinator for all terminal sessions\n// Phase 1: Single-session support (multi-session in Phase 2)\n// SRS §2.1.3, Architecture §2\n\nuse std::collections::HashMap;\nuse std::path::PathBuf;\nuse std::sync::Arc;\nuse tokio::sync::{RwLock, mpsc};\nuse tokio_util::task::AbortOnDrop;\nuse uuid::Uuid;\nuse bytes::Bytes;\nuse prost::Message;\n\nuse super::{Session, SessionId, SessionState, SessionSnapshot, SessionError, Result};\nuse super::scrollback::RingBuffer;\nuse crate::pty::{PtyBackend, PtyConfig};\n\n/// Central session manager\n/// Phase 1: Single active session (simplified from SRS multi-session design)\npub struct SessionManager {\n    /// Active sessions (Phase 1: expect only 1, Phase 2: N sessions)\n    sessions: Arc\u003cRwLock\u003cHashMap\u003cSessionId, Arc\u003cRwLock\u003cSession\u003e\u003e\u003e\u003e\u003e,\n\n    /// Default shell (pwsh.exe if available, else cmd.exe per architecture)\n    default_shell: String,\n}\n\nimpl SessionManager {\n    /// Create new session manager\n    pub fn new(default_shell: Option\u003cString\u003e) -\u003e Self {\n        let default_shell = default_shell.unwrap_or_else(|| {\n            // Per architecture: pwsh.exe (PowerShell 7+) if available, else cmd.exe\n            if which::which(\"pwsh.exe\").is_ok() {\n                \"pwsh.exe\".to_string()\n            } else {\n                \"cmd.exe\".to_string()\n            }\n        });\n\n        tracing::info!(\"SessionManager initialized with default shell: {}\", default_shell);\n\n        Self {\n            sessions: Arc::new(RwLock::new(HashMap::new())),\n            default_shell,\n        }\n    }\n\n    /// Create new terminal session\n    ///\n    /// Phase 1: Spawns ConPTY backend\n    /// Phase 2+: Will support OpenPTY for Linux/macOS\n    pub async fn create_session(\n        \u0026self,\n        working_dir: Option\u003cPathBuf\u003e,\n        rows: u16,\n        cols: u16,\n    ) -\u003e Result\u003cSessionId\u003e {\n        // Validate dimensions\n        if rows == 0 || cols == 0 || rows \u003e 500 || cols \u003e 500 {\n            return Err(SessionError::InvalidDimensions(rows, cols));\n        }\n\n        let id = Uuid::new_v4();\n        let working_dir = working_dir.unwrap_or_else(|| {\n            std::env::current_dir().unwrap_or_else(|_| PathBuf::from(\"C:\\\\\"))\n        });\n\n        tracing::info!(\n            \"Creating session {} ({}x{}, cwd: {:?}, shell: {})\",\n            id, rows, cols, working_dir, self.default_shell\n        );\n\n        // Create PTY config\n        let config = PtyConfig {\n            rows,\n            cols,\n            shell: self.default_shell.clone(),\n            working_dir: working_dir.clone(),\n            environment: std::env::vars().collect(),\n        };\n\n        // Spawn PTY backend (ConPtyBackend for Phase 1 Windows)\n        let pty = crate::pty::ConPtyBackend::create(config).await\n            .map_err(|e| SessionError::PtyCreateFailed(e.to_string()))?;\n\n        // Create placeholder Arc for task spawning (will be replaced with actual session)\n        // Use dummy abort handles initially\n        let dummy_handle1 = tokio::spawn(async {}).abort_handle();\n        let dummy_handle2 = tokio::spawn(async {}).abort_handle();\n\n        let session_placeholder = Arc::new(RwLock::new(\n            Session::new(\n                id,\n                Box::new(pty),\n                self.default_shell.clone(),\n                working_dir.clone(),\n                rows,\n                cols,\n                // Temporary dummy tasks - will be replaced immediately\n                AbortOnDrop::new(dummy_handle1),\n                AbortOnDrop::new(dummy_handle2),\n            )\n        ));\n\n        // Spawn output fan-out task with session Arc\n        let output_handle = tokio::spawn(Self::pty_output_loop(session_placeholder.clone()));\n        let output_task = AbortOnDrop::new(output_handle.abort_handle());\n\n        // Spawn monomind detection task (SRS §2.4.1)\n        let monomind_handle = tokio::spawn({\n            let session_arc = session_placeholder.clone();\n            async move {\n                use monoterminal_monomind_bridge::detect_monomind;\n\n                let working_dir = {\n                    let s = session_arc.read().await;\n                    s.working_dir.clone()\n                };\n\n                let detection = detect_monomind(\u0026working_dir);\n                if detection.found {\n                    let mut s = session_arc.write().await;\n                    s.monomind_detected = true;\n                    tracing::info!(\n                        \"Monomind detected in session {}: project={}\",\n                        s.id,\n                        detection.monomind_root.as_ref().map(|p| p.display().to_string()).unwrap_or_else(|| \"unknown\".to_string())\n                    );\n                } else {\n                    let s = session_arc.read().await;\n                    tracing::debug!(\"No monomind detected in session {}\", s.id);\n                }\n            }\n        });\n        let monomind_task = AbortOnDrop::new(monomind_handle.abort_handle());\n\n        // Replace the placeholder session with one containing the real tasks\n        // This is a necessary pattern because tasks need the Arc, but Session needs the tasks\n        {\n            let mut session_guard = session_placeholder.write().await;\n            *session_guard = Session {\n                id: session_guard.id,\n                state: session_guard.state,\n                pty: session_guard.pty.take(),\n                shell_pid: session_guard.shell_pid,\n                shell_type: session_guard.shell_type.clone(),\n                dimensions: session_guard.dimensions,\n                working_dir: session_guard.working_dir.clone(),\n                scrollback: std::mem::replace(\u0026mut session_guard.scrollback, RingBuffer::new(10_000)),\n                clients: Vec::new(),\n                created_at: session_guard.created_at,\n                last_activity: session_guard.last_activity,\n                monomind_detected: session_guard.monomind_detected,\n                _output_task: output_task,\n                _monomind_task: monomind_task,\n            };\n        }\n\n        // Store session in manager\n        self.sessions.write().await.insert(id, session_placeholder);\n\n        tracing::info!(\"Session {} created successfully\", id);\n\n        Ok(id)\n    }\n\n    /// Attach client to existing session\n    /// Returns session snapshot with scrollback for late-joiner sync\n    pub async fn attach_client(\n        \u0026self,\n        session_id: SessionId,\n        client_id: super::session::ClientId,\n        output_tx: mpsc::Sender\u003cVec\u003cu8\u003e\u003e,\n    ) -\u003e Result\u003cSessionSnapshot\u003e {\n        let sessions = self.sessions.read().await;\n        let session = sessions\n            .get(\u0026session_id)\n            .ok_or(SessionError::NotFound(session_id))?;\n\n        let mut session = session.write().await;\n\n        // Add client to session with output channel\n        session.attach_client(client_id, output_tx);\n\n        tracing::info!(\"Client {} attached to session {}\", client_id, session_id);\n\n        // Return snapshot with scrollback\n        Ok(session.snapshot())\n    }\n\n    /// Detach client from session\n    pub async fn detach_client(\n        \u0026self,\n        session_id: SessionId,\n        client_id: super::session::ClientId,\n    ) -\u003e Result\u003c()\u003e {\n        let sessions = self.sessions.read().await;\n        let session = sessions\n            .get(\u0026session_id)\n            .ok_or(SessionError::NotFound(session_id))?;\n\n        let mut session = session.write().await;\n        session.detach_client(client_id);\n\n        tracing::info!(\"Client {} detached from session {}\", client_id, session_id);\n\n        Ok(())\n    }\n\n    /// Send input to session PTY\n    pub async fn send_input(\n        \u0026self,\n        session_id: SessionId,\n        data: \u0026[u8],\n    ) -\u003e Result\u003c()\u003e {\n        let sessions = self.sessions.read().await;\n        let session = sessions\n            .get(\u0026session_id)\n            .ok_or(SessionError::NotFound(session_id))?;\n\n        let mut session = session.write().await;\n\n        // Write to PTY (error if PTY already terminated)\n        let pty = session.pty.as_mut().ok_or_else(|| {\n            SessionError::IoError(std::io::Error::new(\n                std::io::ErrorKind::BrokenPipe,\n                \"PTY already terminated\"\n            ))\n        })?;\n\n        pty.write(data).await?;\n        session.touch();\n\n        Ok(())\n    }\n\n    /// Resize session terminal\n    pub async fn resize_session(\n        \u0026self,\n        session_id: SessionId,\n        rows: u16,\n        cols: u16,\n    ) -\u003e Result\u003c()\u003e {\n        if rows == 0 || cols == 0 || rows \u003e 500 || cols \u003e 500 {\n            return Err(SessionError::InvalidDimensions(rows, cols));\n        }\n\n        let sessions = self.sessions.read().await;\n        let session = sessions\n            .get(\u0026session_id)\n            .ok_or(SessionError::NotFound(session_id))?;\n\n        let mut session = session.write().await;\n\n        // Resize PTY (error if PTY already terminated)\n        let pty = session.pty.as_mut().ok_or_else(|| {\n            SessionError::IoError(std::io::Error::new(\n                std::io::ErrorKind::BrokenPipe,\n                \"PTY already terminated\"\n            ))\n        })?;\n\n        pty.resize(rows, cols)?;\n        session.dimensions.rows = rows;\n        session.dimensions.cols = cols;\n        session.touch();\n\n        tracing::info!(\"Session {} resized to {}x{}\", session_id, rows, cols);\n\n        Ok(())\n    }\n\n    /// Kill session and underlying PTY\n    pub async fn kill_session(\u0026self, session_id: SessionId) -\u003e Result\u003c()\u003e {\n        let mut sessions = self.sessions.write().await;\n        let session_arc = sessions\n            .remove(\u0026session_id)\n            .ok_or(SessionError::NotFound(session_id))?;\n\n        tracing::info!(\"Session {} terminating\", session_id);\n\n        // Terminate the PTY via the Session's terminate_pty method\n        {\n            let mut session = session_arc.write().await;\n            session.terminate_pty().await\n                .map_err(|e| SessionError::IoError(e))?;\n        }\n\n        // Give the output loop time to detect termination and clean up\n        tokio::time::sleep(tokio::time::Duration::from_millis(100)).await;\n\n        tracing::info!(\"Session {} terminated successfully\", session_id);\n\n        Ok(())\n    }\n\n    /// PTY output fan-out loop with flush triggers\n    /// Per SRS §3.1.4: Read from PTY with 100ms timeout, newline detection, 4KB buffer trigger\n    async fn pty_output_loop(session: Arc\u003cRwLock\u003cSession\u003e\u003e) {\n        let mut buffer = vec![0u8; 4096]; // 4KB buffer per SRS §5.1.1\n        let mut pending_data = Vec::new();\n        let mut last_flush = tokio::time::Instant::now();\n        let mut sequence_number: u64 = 0;\n\n        loop {\n            // Check if session is terminated\n            {\n                let s = session.read().await;\n                if s.state == SessionState::Terminated {\n                    tracing::debug!(\"Session terminated, exiting output loop\");\n                    break;\n                }\n            }\n\n            // Read from PTY with timeout\n            let read_result = tokio::time::timeout(\n                tokio::time::Duration::from_millis(100),\n                async {\n                    let mut s = session.write().await;\n                    // Check if PTY still exists (not consumed by terminate_pty)\n                    match s.pty.as_mut() {\n                        Some(pty) =\u003e pty.read(\u0026mut buffer).await,\n                        None =\u003e {\n                            // PTY was consumed by terminate_pty - exit loop\n                            tracing::debug!(\"PTY None in output loop, session terminated\");\n                            Ok(0) // EOF\n                        }\n                    }\n                }\n            ).await;\n\n            match read_result {\n                Ok(Ok(0)) =\u003e {\n                    // EOF - PTY terminated\n                    tracing::info!(\"PTY EOF detected, session terminating\");\n\n                    // Flush any pending data\n                    if !pending_data.is_empty() {\n                        let mut s = session.write().await;\n                        s.scrollback.push_line(pending_data.clone());\n                        Self::broadcast_output(\u0026mut s, \u0026pending_data, sequence_number).await;\n                        pending_data.clear();\n                    }\n                    break;\n                }\n                Ok(Ok(n)) =\u003e {\n                    // Data received (n \u003e= 1)\n                    pending_data.extend_from_slice(\u0026buffer[..n]);\n\n                    // Flush triggers (SRS §3.1.4):\n                    // 1. Buffer \u003e= 4KB\n                    // 2. Newline detected\n                    // 3. 100ms timeout (handled by timeout above)\n                    let should_flush = pending_data.len() \u003e= 4096\n                        || pending_data.contains(\u0026b'\\n')\n                        || last_flush.elapsed() \u003e= tokio::time::Duration::from_millis(100);\n\n                    if should_flush {\n                        // Add to scrollback\n                        let mut s = session.write().await;\n                        s.scrollback.push_line(pending_data.clone());\n                        s.touch();\n\n                        // Fan-out to clients via Arc\u003cBytes\u003e (SRS §3.1.4 zero-copy pattern)\n                        Self::broadcast_output(\u0026mut s, \u0026pending_data, sequence_number).await;\n                        sequence_number += 1;\n\n                        pending_data.clear();\n                        last_flush = tokio::time::Instant::now();\n                    }\n                }\n                Ok(Err(e)) =\u003e {\n                    tracing::error!(\"PTY read error: {}\", e);\n                    break;\n                }\n                Err(_) =\u003e {\n                    // Timeout - flush pending data if any\n                    if !pending_data.is_empty() {\n                        let mut s = session.write().await;\n                        s.scrollback.push_line(pending_data.clone());\n                        Self::broadcast_output(\u0026mut s, \u0026pending_data, sequence_number).await;\n                        sequence_number += 1;\n                        pending_data.clear();\n                    }\n                    last_flush = tokio::time::Instant::now();\n                }\n            }\n        }\n\n        // Mark session as terminated\n        let mut s = session.write().await;\n        s.state = SessionState::Terminated;\n        tracing::info!(\"Session {} output loop terminated\", s.id);\n    }\n\n    /// Broadcast output data to all attached clients\n    /// Uses Arc\u003cBytes\u003e for zero-copy fan-out (SRS §3.1.4)\n    async fn broadcast_output(session: \u0026mut Session, data: \u0026[u8], sequence_number: u64) {\n        use monoterminal_protocol::{Envelope, envelope, OutputData};\n\n        // Encode as Protocol OutputData envelope\n        let envelope = Envelope {\n            sequence_number,\n            message: Some(envelope::Message::OutputData(OutputData {\n                data: Bytes::copy_from_slice(data).to_vec(),\n                sequence: sequence_number,\n                compression: monoterminal_protocol::CompressionType::None as i32,\n            })),\n        };\n\n        let mut encoded = Vec::with_capacity(envelope.encoded_len());\n        if let Err(e) = envelope.encode(\u0026mut encoded) {\n            tracing::error!(\"Failed to encode OutputData: {}\", e);\n            return;\n        }\n\n        // Use Arc for zero-copy broadcast\n        let encoded = Arc::new(encoded);\n\n        // Broadcast to all clients, removing lagging/disconnected clients\n        let mut to_remove = Vec::new();\n\n        for (client_id, tx) in \u0026session.clients {\n            // Clone Arc (cheap pointer copy, not data copy)\n            let data_clone = (*encoded).clone();\n\n            // Non-blocking send (SRS §3.1.4: detect lagging clients)\n            match tx.try_send(data_clone) {\n                Ok(_) =\u003e {\n                    // Success\n                }\n                Err(mpsc::error::TrySendError::Full(_)) =\u003e {\n                    // Client buffer full - lagging\n                    tracing::warn!(\"Client {} buffer full (lagging), data dropped\", client_id);\n                    // TODO: Track lagging duration, disconnect if \u003e30s (Phase 1.5)\n                }\n                Err(mpsc::error::TrySendError::Closed(_)) =\u003e {\n                    // Client disconnected\n                    tracing::info!(\"Client {} disconnected, removing from session\", client_id);\n                    to_remove.push(*client_id);\n                }\n            }\n        }\n\n        // Remove disconnected clients\n        for client_id in to_remove {\n            session.detach_client(client_id);\n        }\n    }\n\n    /// List all active sessions\n    pub async fn list_sessions(\u0026self) -\u003e Vec\u003cSessionId\u003e {\n        self.sessions.read().await.keys().copied().collect()\n    }\n\n    /// Get session count\n    pub async fn session_count(\u0026self) -\u003e usize {\n        self.sessions.read().await.len()\n    }\n\n    /// Get session's current working directory\n    ///\n    /// Used by monomind integration to detect .monomind/ directory\n    /// in the session's working directory tree.\n    ///\n    /// Returns None if session not found.\n    pub fn get_session_cwd(\u0026self, session_id: SessionId) -\u003e Option\u003cPathBuf\u003e {\n        // Note: This is a synchronous method that returns immediately\n        // We can't use async here because we're called from process_message\n        // which needs to get the cwd synchronously.\n        //\n        // For Phase 1, sessions are created with a working_dir and it\n        // doesn't change (cd tracking is Phase 2+). So we can return\n        // the initial cwd without blocking.\n        //\n        // TODO Phase 2: Track cwd changes via OSC-7 sequences\n\n        // For now, return std::env::current_dir() as a fallback\n        // The actual session cwd is stored in the Session struct\n        // but requires async access. For Phase 1, using current_dir\n        // is acceptable since the daemon runs in the project root.\n        std::env::current_dir().ok()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[tokio::test]\n    async fn test_session_manager_new() {\n        let manager = SessionManager::new(Some(\"cmd.exe\".to_string()));\n        assert_eq!(manager.default_shell, \"cmd.exe\");\n    }\n\n    #[tokio::test]\n    async fn test_validate_dimensions() {\n        let manager = SessionManager::new(None);\n\n        // Invalid dimensions should error\n        let result = manager.create_session(None, 0, 80).await;\n        assert!(result.is_err());\n\n        let result = manager.create_session(None, 24, 0).await;\n        assert!(result.is_err());\n\n        let result = manager.create_session(None, 600, 80).await;\n        assert!(result.is_err());\n    }\n\n    // Note: Full integration tests require ConPtyBackend implementation\n    // These will be added in task-18 (Backend Integration)\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","session","mock_pty.rs"],"content":"// Manual mock PTY backend for testing\n// mockall::automock doesn't work well with async_trait, so we implement manually\n\nuse async_trait::async_trait;\nuse crate::pty::{PtyBackend, PtyConfig, PtyResult};\nuse std::io;\n\n/// Simple mock PTY backend for unit tests\npub struct MockPtyBackend {\n    pub shell_pid: u32,\n}\n\nimpl MockPtyBackend {\n    pub fn new(shell_pid: u32) -\u003e Self {\n        Self { shell_pid }\n    }\n}\n\n#[async_trait]\nimpl PtyBackend for MockPtyBackend {\n    async fn create(_config: PtyConfig) -\u003e PtyResult\u003cSelf\u003e\n    where\n        Self: Sized,\n    {\n        Ok(Self { shell_pid: 12345 })\n    }\n\n    async fn read(\u0026mut self, _buf: \u0026mut [u8]) -\u003e io::Result\u003cusize\u003e {\n        // Return EOF immediately (simulates terminated PTY)\n        Ok(0)\n    }\n\n    async fn write(\u0026mut self, _data: \u0026[u8]) -\u003e io::Result\u003c()\u003e {\n        Ok(())\n    }\n\n    fn resize(\u0026mut self, _rows: u16, _cols: u16) -\u003e PtyResult\u003c()\u003e {\n        Ok(())\n    }\n\n    fn shell_pid(\u0026self) -\u003e u32 {\n        self.shell_pid\n    }\n\n    async fn terminate(self: Box\u003cSelf\u003e) -\u003e PtyResult\u003c()\u003e {\n        Ok(())\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","session","mod.rs"],"content":"// Session Management Module\r\n// Phase 1: Windows + Web MVP\r\n// SRS §2.1.3, Architecture: docs/architecture/phase1-overview.md §2\r\n\r\npub mod session;\r\npub mod scrollback;\r\npub mod manager;\r\n\r\npub use session::{Session, SessionId, SessionState, SessionSnapshot, ClientId};\r\npub use manager::SessionManager;\r\n\r\n#[cfg(test)]\r\nmod tests;\r\n\r\n#[cfg(test)]\r\nmod mock_pty;\r\n\r\n#[cfg(test)]\r\nmod abort_on_drop_tests;\r\n\r\nuse thiserror::Error;\r\n\r\n/// Session management errors\r\n#[derive(Debug, Error)]\r\npub enum SessionError {\r\n    #[error(\"Session not found: {0}\")]\r\n    NotFound(SessionId),\r\n\r\n    #[error(\"PTY creation failed: {0}\")]\r\n    PtyCreateFailed(String),\r\n\r\n    #[error(\"Authentication failed: {0}\")]\r\n    AuthFailed(String),\r\n\r\n    #[error(\"Invalid dimensions: rows={0}, cols={1}\")]\r\n    InvalidDimensions(u16, u16),\r\n\r\n    #[error(\"PTY error: {0}\")]\r\n    PtyError(#[from] crate::pty::error::PtyError),\r\n\r\n    #[error(\"I/O error: {0}\")]\r\n    IoError(#[from] std::io::Error),\r\n}\r\n\r\npub type Result\u003cT\u003e = std::result::Result\u003cT, SessionError\u003e;\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","session","scrollback.rs"],"content":"// Ring Buffer for in-memory scrollback\n// SRS §2.1.3: 10k lines capacity, ~1MB in-memory (Phase 1 only, no SQLite)\n\nuse super::session::Line;\n\n/// Ring buffer for scrollback storage\n/// Capacity: 10,000 lines (per SRS §2.1.3, Phase 1 MVP)\npub struct RingBuffer\u003cT\u003e {\n    buffer: Vec\u003cOption\u003cT\u003e\u003e,\n    capacity: usize,\n    head: usize,\n    len: usize,\n    next_line_number: u64,\n}\n\nimpl\u003cT: Clone\u003e RingBuffer\u003cT\u003e {\n    /// Create new ring buffer with given capacity\n    pub fn new(capacity: usize) -\u003e Self {\n        let mut buffer = Vec::with_capacity(capacity);\n        buffer.resize_with(capacity, || None);\n\n        Self {\n            buffer,\n            capacity,\n            head: 0,\n            len: 0,\n            next_line_number: 0,\n        }\n    }\n\n    /// Push new item (overwrites oldest if full)\n    pub fn push(\u0026mut self, mut item: T) where T: AsMut\u003cLine\u003e {\n        // Set line number\n        let line = item.as_mut();\n        line.line_number = self.next_line_number;\n        self.next_line_number += 1;\n\n        let index = (self.head + self.len) % self.capacity;\n        self.buffer[index] = Some(item);\n\n        if self.len \u003c self.capacity {\n            self.len += 1;\n        } else {\n            // Buffer full, advance head (overwrite oldest)\n            self.head = (self.head + 1) % self.capacity;\n        }\n    }\n\n    /// Get number of items in buffer\n    pub fn len(\u0026self) -\u003e usize {\n        self.len\n    }\n\n    /// Check if buffer is empty\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.len == 0\n    }\n\n    /// Check if buffer is full\n    pub fn is_full(\u0026self) -\u003e bool {\n        self.len == self.capacity\n    }\n\n    /// Iterate over items in chronological order (oldest to newest)\n    pub fn iter(\u0026self) -\u003e impl Iterator\u003cItem = \u0026T\u003e {\n        let head = self.head;\n        let len = self.len;\n        let capacity = self.capacity;\n\n        (0..len).filter_map(move |i| {\n            let index = (head + i) % capacity;\n            self.buffer.get(index).and_then(|opt| opt.as_ref())\n        })\n    }\n\n    /// Clear all items\n    pub fn clear(\u0026mut self) {\n        for item in self.buffer.iter_mut() {\n            *item = None;\n        }\n        self.head = 0;\n        self.len = 0;\n    }\n}\n\nimpl RingBuffer\u003cLine\u003e {\n    /// Specialized push for Line type\n    pub fn push_line(\u0026mut self, data: Vec\u003cu8\u003e) {\n        let mut line = Line {\n            data,\n            line_number: 0, // Will be set by push()\n        };\n\n        let index = (self.head + self.len) % self.capacity;\n        line.line_number = self.next_line_number;\n        self.next_line_number += 1;\n\n        self.buffer[index] = Some(line);\n\n        if self.len \u003c self.capacity {\n            self.len += 1;\n        } else {\n            self.head = (self.head + 1) % self.capacity;\n        }\n    }\n}\n\n// Implement AsMut\u003cLine\u003e for Line\nimpl AsMut\u003cLine\u003e for Line {\n    fn as_mut(\u0026mut self) -\u003e \u0026mut Line {\n        self\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_ring_buffer_basic() {\n        let mut buf = RingBuffer::\u003ci32\u003e::new(3);\n        assert!(buf.is_empty());\n        assert_eq!(buf.len(), 0);\n    }\n\n    #[test]\n    fn test_ring_buffer_push() {\n        let mut buf = RingBuffer::new(3);\n\n        buf.push_line(b\"line1\".to_vec());\n        buf.push_line(b\"line2\".to_vec());\n        buf.push_line(b\"line3\".to_vec());\n\n        assert_eq!(buf.len(), 3);\n        assert!(buf.is_full());\n\n        let lines: Vec\u003c_\u003e = buf.iter().collect();\n        assert_eq!(lines.len(), 3);\n        assert_eq!(lines[0].data, b\"line1\");\n        assert_eq!(lines[1].data, b\"line2\");\n        assert_eq!(lines[2].data, b\"line3\");\n    }\n\n    #[test]\n    fn test_ring_buffer_overflow() {\n        let mut buf = RingBuffer::new(3);\n\n        buf.push_line(b\"line1\".to_vec());\n        buf.push_line(b\"line2\".to_vec());\n        buf.push_line(b\"line3\".to_vec());\n        buf.push_line(b\"line4\".to_vec()); // Overwrites line1\n\n        assert_eq!(buf.len(), 3);\n\n        let lines: Vec\u003c_\u003e = buf.iter().collect();\n        assert_eq!(lines[0].data, b\"line2\");\n        assert_eq!(lines[1].data, b\"line3\");\n        assert_eq!(lines[2].data, b\"line4\");\n    }\n\n    #[test]\n    fn test_ring_buffer_line_numbers() {\n        let mut buf = RingBuffer::new(3);\n\n        buf.push_line(b\"line1\".to_vec());\n        buf.push_line(b\"line2\".to_vec());\n        buf.push_line(b\"line3\".to_vec());\n        buf.push_line(b\"line4\".to_vec());\n\n        let lines: Vec\u003c_\u003e = buf.iter().collect();\n        assert_eq!(lines[0].line_number, 1); // line2\n        assert_eq!(lines[1].line_number, 2); // line3\n        assert_eq!(lines[2].line_number, 3); // line4\n    }\n\n    #[test]\n    fn test_ring_buffer_clear() {\n        let mut buf = RingBuffer::new(3);\n\n        buf.push_line(b\"line1\".to_vec());\n        buf.push_line(b\"line2\".to_vec());\n\n        assert_eq!(buf.len(), 2);\n\n        buf.clear();\n        assert!(buf.is_empty());\n        assert_eq!(buf.len(), 0);\n    }\n}\n","traces":[{"line":18,"address":[],"length":0,"stats":{"Line":0}},{"line":19,"address":[],"length":0,"stats":{"Line":0}},{"line":20,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":65,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":78,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[],"length":0,"stats":{"Line":0}},{"line":81,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":29},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","session","session.rs"],"content":"// Core Session types\n// SRS §2.1.3: Session lifecycle, state machine, in-memory scrollback\n\nuse std::path::PathBuf;\nuse std::time::Instant;\nuse uuid::Uuid;\nuse tokio::sync::mpsc;\nuse tokio_util::task::AbortOnDrop;\nuse super::scrollback::RingBuffer;\n\n/// Session identifier (UUID v4)\npub type SessionId = Uuid;\n\n/// Client identifier (UUID v4)\npub type ClientId = Uuid;\n\n/// Session state machine (Phase 1: simplified, per architecture)\n/// CREATE → RUNNING → TERMINATED\n/// (DETACHED state deferred to Phase 2)\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum SessionState {\n    /// Session created, PTY spawned, ready for clients\n    Running,\n\n    /// PTY terminated, cleanup pending\n    Terminated,\n}\n\n/// Terminal dimensions\n#[derive(Debug, Clone, Copy)]\npub struct Dimensions {\n    pub rows: u16,\n    pub cols: u16,\n}\n\n/// Terminal line (for scrollback)\n#[derive(Debug, Clone)]\npub struct Line {\n    /// Raw line data (UTF-8 with ANSI escape codes)\n    pub data: Vec\u003cu8\u003e,\n\n    /// Sequential line number\n    pub line_number: u64,\n}\n\nimpl Line {\n    pub fn from_bytes(data: \u0026[u8]) -\u003e Self {\n        Self {\n            data: data.to_vec(),\n            line_number: 0, // Will be set by scrollback\n        }\n    }\n}\n\n/// Session snapshot (returned on attach for late-joiner sync)\n#[derive(Debug, Clone)]\npub struct SessionSnapshot {\n    pub id: SessionId,\n    pub scrollback: Vec\u003cLine\u003e,\n    pub rows: u16,\n    pub cols: u16,\n    pub working_dir: PathBuf,\n    pub shell_type: String,\n}\n\n/// Terminal session\n/// Phase 1: Single-session support, in-memory scrollback only\npub struct Session {\n    /// Session UUID\n    pub id: SessionId,\n\n    /// Current state\n    pub state: SessionState,\n\n    /// PTY backend (ConPtyBackend for Phase 1 Windows)\n    /// Type-erased trait object for future Linux/macOS support\n    /// Option allows taking ownership in terminate_pty() to prevent Drop race\n    pub pty: Option\u003cBox\u003cdyn crate::pty::PtyBackend\u003e\u003e,\n\n    /// Shell process ID\n    pub shell_pid: u32,\n\n    /// Shell type (e.g., \"pwsh.exe\", \"cmd.exe\")\n    pub shell_type: String,\n\n    /// Terminal dimensions\n    pub dimensions: Dimensions,\n\n    /// Working directory\n    pub working_dir: PathBuf,\n\n    /// In-memory scrollback (10k lines, ~1MB, Phase 1)\n    /// No SQLite persistence in Phase 1\n    pub scrollback: RingBuffer\u003cLine\u003e,\n\n    /// Attached clients (for fan-out broadcast)\n    /// Each client has an output channel for sending encoded Protocol messages\n    pub clients: Vec\u003c(ClientId, mpsc::Sender\u003cVec\u003cu8\u003e\u003e)\u003e,\n\n    /// Timestamps\n    pub created_at: Instant,\n    pub last_activity: Instant,\n\n    /// Monomind detection flag (SRS §2.4.1)\n    pub monomind_detected: bool,\n\n    /// PTY output fan-out task (aborted when Session drops)\n    /// Per ADR-009: AbortOnDrop ensures task cancellation on Session drop\n    pub(crate) _output_task: AbortOnDrop,\n\n    /// Monomind detection task (aborted when Session drops)\n    /// Per ADR-009: AbortOnDrop ensures task cancellation on Session drop\n    pub(crate) _monomind_task: AbortOnDrop,\n}\n\nimpl Session {\n    /// Create new session with PTY backend and background tasks\n    /// Per ADR-009: Tasks wrapped with AbortOnDrop for automatic cleanup\n    pub fn new(\n        id: SessionId,\n        pty: Box\u003cdyn crate::pty::PtyBackend\u003e,\n        shell_type: String,\n        working_dir: PathBuf,\n        rows: u16,\n        cols: u16,\n        output_task: AbortOnDrop,\n        monomind_task: AbortOnDrop,\n    ) -\u003e Self {\n        let shell_pid = pty.shell_pid();\n\n        Self {\n            id,\n            state: SessionState::Running,\n            pty: Some(pty), // Wrap in Option\n            shell_pid,\n            shell_type,\n            dimensions: Dimensions { rows, cols },\n            working_dir,\n            scrollback: RingBuffer::new(10_000), // 10k lines capacity\n            clients: Vec::new(),\n            created_at: Instant::now(),\n            last_activity: Instant::now(),\n            monomind_detected: false,\n            _output_task: output_task,\n            _monomind_task: monomind_task,\n        }\n    }\n\n    /// Get session snapshot for late-joiner sync\n    pub fn snapshot(\u0026self) -\u003e SessionSnapshot {\n        SessionSnapshot {\n            id: self.id,\n            scrollback: self.scrollback.iter().cloned().collect(),\n            rows: self.dimensions.rows,\n            cols: self.dimensions.cols,\n            working_dir: self.working_dir.clone(),\n            shell_type: self.shell_type.clone(),\n        }\n    }\n\n    /// Attach client to session with output channel\n    pub fn attach_client(\u0026mut self, client_id: ClientId, output_tx: mpsc::Sender\u003cVec\u003cu8\u003e\u003e) {\n        // Check if already attached\n        if !self.clients.iter().any(|(id, _)| *id == client_id) {\n            self.clients.push((client_id, output_tx));\n        }\n    }\n\n    /// Detach client from session\n    pub fn detach_client(\u0026mut self, client_id: ClientId) {\n        self.clients.retain(|(id, _)| *id != client_id);\n    }\n\n    /// Get list of attached client IDs\n    pub fn client_ids(\u0026self) -\u003e Vec\u003cClientId\u003e {\n        self.clients.iter().map(|(id, _)| *id).collect()\n    }\n\n    /// Update last activity timestamp\n    pub fn touch(\u0026mut self) {\n        self.last_activity = Instant::now();\n    }\n\n    /// Terminate the PTY session gracefully\n    /// This consumes the PTY backend, preventing Drop race conditions\n    pub async fn terminate_pty(\u0026mut self) -\u003e Result\u003c(), std::io::Error\u003e {\n        // Take ownership of PTY to call terminate() and prevent Drop race\n        if let Some(pty) = self.pty.take() {\n            tracing::info!(\"Session {} terminating PTY (pid={})\", self.id, self.shell_pid);\n\n            // Mark as terminated BEFORE calling terminate() to signal output loop\n            self.state = SessionState::Terminated;\n\n            // Call actual PTY terminate() - consumes the Box\u003cdyn PtyBackend\u003e\n            // The async_trait macro transforms self-consuming methods to work with Box\n            // This prevents ConPtyBackend::Drop from running while output loop is active\n            pty.terminate().await.map_err(|e| {\n                std::io::Error::new(std::io::ErrorKind::Other, e.to_string())\n            })?;\n\n            tracing::info!(\"Session {} PTY terminated successfully\", self.id);\n        } else {\n            // PTY already terminated (or None)\n            tracing::warn!(\"Session {} terminate_pty called but PTY already None\", self.id);\n        }\n\n        Ok(())\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_session_state() {\n        assert_eq!(SessionState::Running, SessionState::Running);\n        assert_ne!(SessionState::Running, SessionState::Terminated);\n    }\n\n    #[test]\n    fn test_dimensions() {\n        let dims = Dimensions { rows: 24, cols: 80 };\n        assert_eq!(dims.rows, 24);\n        assert_eq!(dims.cols, 80);\n    }\n\n    #[test]\n    fn test_line_from_bytes() {\n        let line = Line::from_bytes(b\"hello world\");\n        assert_eq!(line.data, b\"hello world\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","session","tests.rs"],"content":"// Session lifecycle and state machine property tests\n// SRS §2.1.3: Session state machine testing\n\n#[cfg(test)]\nmod session_tests {\n    use super::super::*;\n    use crate::session::manager::SessionManager;\n    use proptest::prelude::*;\n    use std::time::Duration;\n    use tokio::sync::mpsc;\n\n    proptest! {\n        #[test]\n        fn test_session_state_transitions_are_valid(\n            initial_state in prop::sample::select(vec![SessionState::Running])\n        ) {\n            // Property: Valid state transitions per SRS state machine\n            // CREATE → RUNNING → TERMINATED\n            // (DETACHED deferred to Phase 2)\n\n            prop_assert_eq!(initial_state, SessionState::Running);\n\n            // Can transition to Terminated\n            let terminated = SessionState::Terminated;\n            prop_assert_ne!(initial_state, terminated);\n        }\n\n        #[test]\n        fn test_client_attach_detach_idempotent(\n            client_count in 1usize..=10\n        ) {\n            use uuid::Uuid;\n\n            let rt = tokio::runtime::Runtime::new().unwrap();\n            rt.block_on(async {\n                let manager = SessionManager::new(Some(\"cmd.exe\".to_string()));\n\n                // Create session\n                let session_id = manager.create_session(None, 24, 80)\n                    .await\n                    .expect(\"Failed to create session\");\n\n                // Attach multiple clients\n                let clients: Vec\u003c_\u003e = (0..client_count)\n                    .map(|_| Uuid::new_v4())\n                    .collect();\n\n                for client_id in \u0026clients {\n                    let (output_tx, _output_rx) = mpsc::channel(32);\n                    let result = manager.attach_client(session_id, *client_id, output_tx).await;\n                    prop_assert!(result.is_ok());\n                }\n\n                // Detach all clients\n                for client_id in \u0026clients {\n                    let result = manager.detach_client(session_id, *client_id).await;\n                    prop_assert!(result.is_ok());\n                }\n\n                // Double detach should be idempotent (not error)\n                for client_id in \u0026clients {\n                    let result = manager.detach_client(session_id, *client_id).await;\n                    prop_assert!(result.is_ok());\n                }\n\n                manager.kill_session(session_id).await.ok();\n                Ok(())\n            })?;\n        }\n    }\n\n    #[tokio::test]\n    async fn test_session_manager_create_and_list() {\n        let manager = SessionManager::new(None);\n\n        assert_eq!(manager.session_count().await, 0);\n\n        let session1 = manager.create_session(None, 24, 80)\n            .await\n            .expect(\"Failed to create session 1\");\n\n        assert_eq!(manager.session_count().await, 1);\n\n        let session2 = manager.create_session(None, 30, 100)\n            .await\n            .expect(\"Failed to create session 2\");\n\n        assert_eq!(manager.session_count().await, 2);\n\n        let sessions = manager.list_sessions().await;\n        assert!(sessions.contains(\u0026session1));\n        assert!(sessions.contains(\u0026session2));\n\n        // Cleanup\n        manager.kill_session(session1).await.ok();\n        manager.kill_session(session2).await.ok();\n    }\n\n    #[tokio::test]\n    async fn test_session_resize() {\n        let manager = SessionManager::new(None);\n\n        let session_id = manager.create_session(None, 24, 80)\n            .await\n            .expect(\"Failed to create session\");\n\n        // Resize to various dimensions\n        for (rows, cols) in [(30, 100), (50, 120), (24, 80), (40, 90)] {\n            let result = manager.resize_session(session_id, rows, cols).await;\n            assert!(result.is_ok(), \"Resize to {}x{} failed\", rows, cols);\n        }\n\n        // Invalid dimensions should error\n        assert!(manager.resize_session(session_id, 0, 80).await.is_err());\n        assert!(manager.resize_session(session_id, 24, 0).await.is_err());\n        assert!(manager.resize_session(session_id, 600, 80).await.is_err());\n\n        manager.kill_session(session_id).await.ok();\n    }\n\n    #[tokio::test]\n    async fn test_send_input() {\n        let manager = SessionManager::new(None);\n\n        let session_id = manager.create_session(None, 24, 80)\n            .await\n            .expect(\"Failed to create session\");\n\n        // Send various inputs\n        let inputs: \u0026[\u0026[u8]] = \u0026[\n            b\"echo hello\\r\\n\",\n            b\"dir\\r\\n\",\n            b\"cd ..\\r\\n\",\n        ];\n\n        for input in inputs {\n            let result = manager.send_input(session_id, *input).await;\n            assert!(result.is_ok(), \"Failed to send input: {:?}\", input);\n\n            tokio::time::sleep(Duration::from_millis(50)).await;\n        }\n\n        manager.kill_session(session_id).await.ok();\n    }\n\n    #[tokio::test]\n    async fn test_session_snapshot_after_output() {\n        use uuid::Uuid;\n\n        let manager = SessionManager::new(None);\n\n        let session_id = manager.create_session(None, 24, 80)\n            .await\n            .expect(\"Failed to create session\");\n\n        // Send some commands to generate output\n        manager.send_input(session_id, b\"echo test\\r\\n\")\n            .await\n            .expect(\"Failed to send input\");\n\n        // Wait for output to be processed\n        tokio::time::sleep(Duration::from_millis(200)).await;\n\n        // Attach a client and get snapshot\n        let client_id = Uuid::new_v4();\n        let (output_tx, _output_rx) = mpsc::channel(32);\n        let snapshot = manager.attach_client(session_id, client_id, output_tx)\n            .await\n            .expect(\"Failed to attach client\");\n\n        assert_eq!(snapshot.id, session_id);\n        assert_eq!(snapshot.rows, 24);\n        assert_eq!(snapshot.cols, 80);\n\n        // Scrollback should have some data (from shell prompt and/or output)\n        // Note: We can't guarantee exact content due to timing\n        assert!(snapshot.scrollback.len() \u003e= 0);\n\n        manager.kill_session(session_id).await.ok();\n    }\n\n    #[tokio::test]\n    async fn test_kill_nonexistent_session() {\n        use uuid::Uuid;\n\n        let manager = SessionManager::new(None);\n\n        let fake_id = Uuid::new_v4();\n        let result = manager.kill_session(fake_id).await;\n\n        assert!(result.is_err());\n        match result {\n            Err(SessionError::NotFound(id)) =\u003e assert_eq!(id, fake_id),\n            _ =\u003e panic!(\"Expected NotFound error\"),\n        }\n    }\n\n    #[tokio::test]\n    async fn test_concurrent_session_creation() {\n        let manager = std::sync::Arc::new(SessionManager::new(None));\n\n        // Create multiple sessions concurrently\n        let mut handles = vec![];\n\n        for _ in 0..5 {\n            let mgr = manager.clone();\n            let handle = tokio::spawn(async move {\n                mgr.create_session(None, 24, 80).await\n            });\n            handles.push(handle);\n        }\n\n        // Wait for all to complete\n        let mut session_ids = vec![];\n        for handle in handles {\n            if let Ok(Ok(id)) = handle.await {\n                session_ids.push(id);\n            }\n        }\n\n        assert_eq!(session_ids.len(), 5);\n        assert_eq!(manager.session_count().await, 5);\n\n        // All IDs should be unique\n        let unique_count = session_ids.iter().collect::\u003cstd::collections::HashSet\u003c_\u003e\u003e().len();\n        assert_eq!(unique_count, 5);\n\n        // Cleanup\n        for id in session_ids {\n            manager.kill_session(id).await.ok();\n        }\n    }\n\n    #[tokio::test]\n    async fn test_session_activity_timestamp() {\n        use uuid::Uuid;\n\n        let manager = SessionManager::new(None);\n\n        let session_id = manager.create_session(None, 24, 80)\n            .await\n            .expect(\"Failed to create session\");\n\n        // Initial activity timestamp set\n        let client_id = Uuid::new_v4();\n        let (output_tx, _output_rx) = mpsc::channel(32);\n        manager.attach_client(session_id, client_id, output_tx).await.ok();\n\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Send input should update timestamp\n        manager.send_input(session_id, b\"echo test\\r\\n\")\n            .await\n            .expect(\"Failed to send input\");\n\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Resize should update timestamp\n        manager.resize_session(session_id, 30, 100)\n            .await\n            .expect(\"Failed to resize\");\n\n        // We can't directly check timestamps from outside the session,\n        // but this test ensures the touch() calls don't panic\n\n        manager.kill_session(session_id).await.ok();\n    }\n\n    #[tokio::test]\n    async fn test_multiple_clients_same_session() {\n        use uuid::Uuid;\n\n        let manager = SessionManager::new(None);\n\n        let session_id = manager.create_session(None, 24, 80)\n            .await\n            .expect(\"Failed to create session\");\n\n        // Attach multiple clients to same session\n        let client1 = Uuid::new_v4();\n        let client2 = Uuid::new_v4();\n        let client3 = Uuid::new_v4();\n\n        let (output_tx1, _output_rx1) = mpsc::channel(32);\n        let (output_tx2, _output_rx2) = mpsc::channel(32);\n        let (output_tx3, _output_rx3) = mpsc::channel(32);\n        let snapshot1 = manager.attach_client(session_id, client1, output_tx1).await.expect(\"Failed to attach client 1\");\n        let snapshot2 = manager.attach_client(session_id, client2, output_tx2).await.expect(\"Failed to attach client 2\");\n        let snapshot3 = manager.attach_client(session_id, client3, output_tx3).await.expect(\"Failed to attach client 3\");\n\n        // All snapshots should be for the same session\n        assert_eq!(snapshot1.id, session_id);\n        assert_eq!(snapshot2.id, session_id);\n        assert_eq!(snapshot3.id, session_id);\n\n        // Detach clients\n        manager.detach_client(session_id, client1).await.ok();\n        manager.detach_client(session_id, client2).await.ok();\n        manager.detach_client(session_id, client3).await.ok();\n\n        manager.kill_session(session_id).await.ok();\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","fonts.rs"],"content":"//! Font loading and rasterization\n//!\n//! Phase 1: fontdue (pure Rust, Windows)\n//! Phase 3: HarfBuzz integration for complex shaping (Linux/macOS)\n//!\n//! Target: \u003c1ms glyph lookup (per SRS §2.1.1)\n\nuse anyhow::{Context, Result};\nuse fontdue::{Font, FontSettings};\nuse std::path::{Path, PathBuf};\n\n/// Rasterized glyph bitmap\npub struct RasterizedGlyph {\n    /// Grayscale bitmap data (row-major, top-to-bottom)\n    pub bitmap: Vec\u003cu8\u003e,\n    /// Width in pixels\n    pub width: usize,\n    /// Height in pixels\n    pub height: usize,\n    /// Metrics\n    pub metrics: GlyphMetrics,\n}\n\n/// Glyph metrics for layout\n#[derive(Debug, Clone, Copy)]\npub struct GlyphMetrics {\n    /// Advance width (pixels to next glyph)\n    pub advance_width: f32,\n    /// Left bearing (horizontal offset from origin)\n    pub bearing_x: f32,\n    /// Top bearing (vertical offset from baseline)\n    pub bearing_y: f32,\n}\n\n/// Font manager for terminal rendering\npub struct FontManager {\n    /// Loaded font (fontdue)\n    font: Font,\n    /// Font size in pixels\n    font_size: f32,\n}\n\nimpl FontManager {\n    /// Create new font manager with system font fallback\n    /// Windows: Consolas → Courier New → fallback\n    pub fn new(font_size: f32) -\u003e Result\u003cSelf\u003e {\n        let font_data = Self::load_system_font()?;\n        let font = Font::from_bytes(font_data, FontSettings::default())\n            .map_err(|e| anyhow::anyhow!(\"Failed to parse font: {}\", e))?;\n\n        tracing::info!(\"Font loaded successfully (size: {}px)\", font_size);\n\n        Ok(Self { font, font_size })\n    }\n\n    /// Load system monospace font with fallback chain\n    /// Windows: C:\\Windows\\Fonts\\consola.ttf (Consolas)\n    fn load_system_font() -\u003e Result\u003cVec\u003cu8\u003e\u003e {\n        #[cfg(target_os = \"windows\")]\n        {\n            // Try Consolas first (best Windows monospace font)\n            let consolas_path = PathBuf::from(r\"C:\\Windows\\Fonts\\consola.ttf\");\n            if consolas_path.exists() {\n                tracing::info!(\"Loading Consolas font\");\n                return std::fs::read(\u0026consolas_path)\n                    .context(\"Failed to read Consolas font\");\n            }\n\n            // Fallback: Courier New\n            let courier_path = PathBuf::from(r\"C:\\Windows\\Fonts\\cour.ttf\");\n            if courier_path.exists() {\n                tracing::warn!(\"Consolas not found, falling back to Courier New\");\n                return std::fs::read(\u0026courier_path)\n                    .context(\"Failed to read Courier New font\");\n            }\n\n            anyhow::bail!(\"No suitable monospace font found in C:\\\\Windows\\\\Fonts\");\n        }\n\n        #[cfg(not(target_os = \"windows\"))]\n        {\n            // Phase 3: Linux/macOS font loading\n            anyhow::bail!(\"Non-Windows font loading not yet implemented (Phase 3)\")\n        }\n    }\n\n    /// Rasterize a glyph to bitmap\n    /// Returns grayscale bitmap + metrics\n    /// Target: \u003c1ms per glyph\n    pub fn rasterize_glyph(\u0026self, ch: char, bold: bool, italic: bool) -\u003e Result\u003cRasterizedGlyph\u003e {\n        // Get glyph index for character\n        let glyph_index = self.font\n            .lookup_glyph_index(ch);\n\n        // Rasterize at configured font size\n        let (metrics, bitmap) = self.font.rasterize_indexed(\n            glyph_index,\n            self.font_size,\n        );\n\n        // Convert fontdue metrics to our format\n        let glyph_metrics = GlyphMetrics {\n            advance_width: metrics.advance_width,\n            bearing_x: metrics.xmin as f32,\n            bearing_y: metrics.ymin as f32,\n        };\n\n        Ok(RasterizedGlyph {\n            bitmap,\n            width: metrics.width,\n            height: metrics.height,\n            metrics: glyph_metrics,\n        })\n    }\n\n    /// Get font metrics (cell dimensions for terminal grid)\n    pub fn cell_dimensions(\u0026self) -\u003e (u32, u32) {\n        // Measure 'M' (widest monospace char) for cell width\n        let (metrics, _) = self.font.rasterize('M', self.font_size);\n        let width = metrics.advance_width.ceil() as u32;\n\n        // Use font line height for cell height\n        let height = self.font.horizontal_line_metrics(self.font_size)\n            .map(|m| (m.ascent - m.descent + m.line_gap).ceil() as u32)\n            .unwrap_or(self.font_size.ceil() as u32);\n\n        (width, height)\n    }\n}\n\nimpl Default for FontManager {\n    fn default() -\u003e Self {\n        // Default: 16px font size (good for 1280x720 window)\n        Self::new(16.0).expect(\"Failed to create FontManager\")\n    }\n}\n\n// Re-export GlyphCache from glyph_cache module\npub use super::glyph_cache::{GlyphCache, GlyphInfo, GlyphKey};\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","glyph_cache.rs"],"content":"//! Glyph Cache with Guillotine Bin-Packing\n//!\n//! Implements 4096×4096 atlas with Guillotine bin-packing and LRU eviction\n//! Target: \u003c1ms glyph lookup per SRS §2.1.1\n\nuse std::collections::{HashMap, VecDeque};\nuse super::vt_parser::{CellStyle, Color};\n\n/// Glyph cache key (character + style)\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]\npub struct GlyphKey {\n    pub ch: char,\n    pub bold: bool,\n    pub italic: bool,\n}\n\nimpl GlyphKey {\n    pub fn new(ch: char, style: \u0026CellStyle) -\u003e Self {\n        Self {\n            ch,\n            bold: style.bold,\n            italic: style.italic,\n        }\n    }\n}\n\n/// Glyph information for rendering\n#[derive(Debug, Clone, Copy)]\npub struct GlyphInfo {\n    /// Atlas texture coordinates (normalized 0.0-1.0)\n    pub tex_x: f32,\n    pub tex_y: f32,\n    pub tex_width: f32,\n    pub tex_height: f32,\n\n    /// Glyph metrics\n    pub bearing_x: i32,\n    pub bearing_y: i32,\n    pub advance: u32,\n}\n\n/// Glyph cache with Guillotine bin-packing and LRU eviction\npub struct GlyphCache {\n    /// Atlas size (4096×4096 per SRS)\n    atlas_width: u32,\n    atlas_height: u32,\n\n    /// Glyph lookup cache\n    cache: HashMap\u003cGlyphKey, GlyphInfo\u003e,\n\n    /// LRU tracking\n    lru: VecDeque\u003cGlyphKey\u003e,\n\n    /// Guillotine allocator\n    allocator: GuillotineAllocator,\n\n    /// Maximum cache size (LRU eviction threshold)\n    max_cache_size: usize,\n}\n\nimpl GlyphCache {\n    /// Create new glyph cache with 4096×4096 atlas\n    pub fn new() -\u003e Self {\n        Self {\n            atlas_width: 4096,\n            atlas_height: 4096,\n            cache: HashMap::new(),\n            lru: VecDeque::new(),\n            allocator: GuillotineAllocator::new(4096, 4096),\n            max_cache_size: 2048, // Evict after 2048 glyphs (conservative)\n        }\n    }\n\n    /// Lookup glyph in cache\n    /// Target: \u003c1ms\n    pub fn lookup(\u0026mut self, key: GlyphKey) -\u003e Option\u003cGlyphInfo\u003e {\n        if let Some(info) = self.cache.get(\u0026key) {\n            // Update LRU (move to back)\n            self.lru.retain(|k| k != \u0026key);\n            self.lru.push_back(key);\n            return Some(*info);\n        }\n        None\n    }\n\n    /// Insert glyph into cache with LRU eviction\n    pub fn insert(\u0026mut self, key: GlyphKey, width: u32, height: u32) -\u003e Option\u003cGlyphInfo\u003e {\n        // Try to allocate space in atlas\n        let rect = self.allocator.allocate(width, height)?;\n\n        // Normalize texture coordinates to 0.0-1.0\n        let info = GlyphInfo {\n            tex_x: rect.x as f32 / self.atlas_width as f32,\n            tex_y: rect.y as f32 / self.atlas_height as f32,\n            tex_width: rect.width as f32 / self.atlas_width as f32,\n            tex_height: rect.height as f32 / self.atlas_height as f32,\n            bearing_x: 0, // TODO: Get from font metrics\n            bearing_y: 0,\n            advance: width, // TODO: Get from font metrics\n        };\n\n        // Insert into cache\n        self.cache.insert(key, info);\n        self.lru.push_back(key);\n\n        // LRU eviction if cache too large\n        if self.lru.len() \u003e self.max_cache_size {\n            if let Some(evict_key) = self.lru.pop_front() {\n                self.cache.remove(\u0026evict_key);\n                // Note: We don't free atlas space on eviction (atlas is persistent)\n                // Full atlas defrag happens on reset/resize\n            }\n        }\n\n        Some(info)\n    }\n\n    /// Clear cache and reset atlas\n    pub fn clear(\u0026mut self) {\n        self.cache.clear();\n        self.lru.clear();\n        self.allocator = GuillotineAllocator::new(self.atlas_width, self.atlas_height);\n    }\n\n    /// Get atlas dimensions\n    pub fn atlas_size(\u0026self) -\u003e (u32, u32) {\n        (self.atlas_width, self.atlas_height)\n    }\n\n    /// Get cache statistics\n    pub fn stats(\u0026self) -\u003e CacheStats {\n        CacheStats {\n            total_glyphs: self.cache.len(),\n            atlas_utilization: self.allocator.utilization(),\n        }\n    }\n}\n\nimpl Default for GlyphCache {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n/// Cache statistics\npub struct CacheStats {\n    pub total_glyphs: usize,\n    pub atlas_utilization: f32,\n}\n\n/// Guillotine bin-packing allocator\n/// Implements the Guillotine algorithm for efficient rectangle packing\nstruct GuillotineAllocator {\n    width: u32,\n    height: u32,\n    /// Free rectangles\n    free_rects: Vec\u003cRect\u003e,\n}\n\nimpl GuillotineAllocator {\n    fn new(width: u32, height: u32) -\u003e Self {\n        Self {\n            width,\n            height,\n            free_rects: vec![Rect { x: 0, y: 0, width, height }],\n        }\n    }\n\n    /// Allocate rectangle using best-area-fit\n    fn allocate(\u0026mut self, width: u32, height: u32) -\u003e Option\u003cRect\u003e {\n        // Find best-fitting free rectangle\n        let mut best_idx = None;\n        let mut best_area = u32::MAX;\n\n        for (i, rect) in self.free_rects.iter().enumerate() {\n            if rect.width \u003e= width \u0026\u0026 rect.height \u003e= height {\n                let area = rect.width * rect.height;\n                if area \u003c best_area {\n                    best_area = area;\n                    best_idx = Some(i);\n                }\n            }\n        }\n\n        let best_idx = best_idx?;\n        let free_rect = self.free_rects.remove(best_idx);\n\n        // Allocated rectangle\n        let allocated = Rect {\n            x: free_rect.x,\n            y: free_rect.y,\n            width,\n            height,\n        };\n\n        // Split remaining space (Guillotine algorithm)\n        // Create two new free rectangles from the remaining space\n\n        // Right split (if width \u003c free_rect.width)\n        if free_rect.width \u003e width {\n            self.free_rects.push(Rect {\n                x: free_rect.x + width,\n                y: free_rect.y,\n                width: free_rect.width - width,\n                height,\n            });\n        }\n\n        // Bottom split (if height \u003c free_rect.height)\n        if free_rect.height \u003e height {\n            self.free_rects.push(Rect {\n                x: free_rect.x,\n                y: free_rect.y + height,\n                width: free_rect.width,\n                height: free_rect.height - height,\n            });\n        }\n\n        Some(allocated)\n    }\n\n    /// Calculate atlas utilization (0.0-1.0)\n    fn utilization(\u0026self) -\u003e f32 {\n        let total_area = (self.width * self.height) as f32;\n        let free_area: u32 = self.free_rects.iter().map(|r| r.width * r.height).sum();\n        1.0 - (free_area as f32 / total_area)\n    }\n}\n\n#[derive(Debug, Clone, Copy)]\nstruct Rect {\n    x: u32,\n    y: u32,\n    width: u32,\n    height: u32,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_guillotine_allocate() {\n        let mut allocator = GuillotineAllocator::new(256, 256);\n\n        let rect1 = allocator.allocate(64, 64).unwrap();\n        assert_eq!(rect1.x, 0);\n        assert_eq!(rect1.y, 0);\n\n        let rect2 = allocator.allocate(64, 64).unwrap();\n        // Should allocate next to first rect\n        assert!(rect2.x == 64 || rect2.y == 64);\n    }\n\n    #[test]\n    fn test_glyph_cache_insert() {\n        let mut cache = GlyphCache::new();\n        let key = GlyphKey { ch: 'A', bold: false, italic: false };\n\n        // Insert glyph\n        let info = cache.insert(key, 16, 16).unwrap();\n        assert!(info.tex_width \u003e 0.0);\n\n        // Lookup should succeed\n        assert!(cache.lookup(key).is_some());\n    }\n\n    #[test]\n    fn test_lru_eviction() {\n        let mut cache = GlyphCache::new();\n        cache.max_cache_size = 2; // Small cache for testing\n\n        let key1 = GlyphKey { ch: 'A', bold: false, italic: false };\n        let key2 = GlyphKey { ch: 'B', bold: false, italic: false };\n        let key3 = GlyphKey { ch: 'C', bold: false, italic: false };\n\n        cache.insert(key1, 16, 16);\n        cache.insert(key2, 16, 16);\n        cache.insert(key3, 16, 16); // Should evict key1\n\n        assert!(cache.lookup(key1).is_none()); // Evicted\n        assert!(cache.lookup(key2).is_some());\n        assert!(cache.lookup(key3).is_some());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","ui","layout.rs"],"content":"//! UI Layout management\n//!\n//! Implements the layout per SRS §4.2.1:\n//! ┌────────────────────────────────────┐\n//! │  Menu Bar (File, Session, Help)   │\n//! ├────────────────────────────────────┤\n//! │  Session List │ Terminal Canvas   │\n//! │  (sidebar)    │ (wgpu rendered)   │\n//! │               │                    │\n//! ├────────────────────────────────────┤\n//! │  Status Bar (FPS, latency)         │\n//! └────────────────────────────────────┘\n\nuse super::performance::PerformanceMonitor;\n\n/// UI layout manager\npub struct Layout {\n    /// Sidebar width in pixels\n    sidebar_width: f32,\n\n    /// Menu bar height in pixels\n    menu_height: f32,\n\n    /// Status bar height in pixels\n    status_height: f32,\n}\n\nimpl Layout {\n    pub fn new() -\u003e Self {\n        Self {\n            sidebar_width: 200.0,\n            menu_height: 30.0,\n            status_height: 25.0,\n        }\n    }\n\n    /// Calculate terminal canvas area\n    pub fn terminal_area(\u0026self, window_width: f32, window_height: f32) -\u003e Rect {\n        Rect {\n            x: self.sidebar_width,\n            y: self.menu_height,\n            width: window_width - self.sidebar_width,\n            height: window_height - self.menu_height - self.status_height,\n        }
