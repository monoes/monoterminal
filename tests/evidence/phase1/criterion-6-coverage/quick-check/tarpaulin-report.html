ates tokio async contract. See windows.rs PtyHandle for proper async architecture. TODO: Phase 2 - migrate to windows.rs or implement proper overlapped I/O\"]\n    async fn test_resize_during_output_burst() {\n        // Edge case: Resize while PTY is outputting large amounts of data\n        let config = PtyConfig {\n            shell: \"powershell.exe\".to_string(),\n            working_dir: PathBuf::from(\"C:\\\\\"),\n            rows: 24,\n            cols: 80,\n            environment: Default::default(),\n        };\n\n        let mut pty = ConPtyBackend::create(config)\n            .await\n            .expect(\"Failed to create PTY\");\n\n        // Start a command that produces continuous output\n        pty.write(b\"1..1000 | ForEach-Object { Write-Host $_ }\\r\\n\")\n            .await\n            .expect(\"Failed to write command\");\n\n        // Wait a bit for output to start\n        tokio::time::sleep(Duration::from_millis(50)).await;\n\n        // Resize multiple times while output is flowing\n        for size in [(30, 100), (50, 120), (24, 80), (40, 90)] {\n            let result = pty.resize(size.0, size.1);\n            assert!(result.is_ok(), \"Resize failed during output: {:?}\", result);\n            tokio::time::sleep(Duration::from_millis(10)).await;\n        }\n\n        // PTY should still be readable\n        let mut buf = vec![0u8; 4096];\n        let read_result = tokio::time::timeout(\n            Duration::from_secs(1),\n            pty.read(\u0026mut buf)\n        ).await;\n\n        assert!(read_result.is_ok(), \"Read timeout after resize burst\");\n\n        pty.terminate().await.ok();\n    }\n\n    #[tokio::test]\n    #[ignore = \"AsyncPipeReader/Writer use blocking I/O in poll functions, violates tokio async contract. Phase 2: migrate to windows.rs PtyHandle\"]\n    async fn test_process_exit_mid_write() {\n        // Edge case: Process exits while we're writing to it\n        let config = PtyConfig {\n            shell: \"cmd.exe\".to_string(),\n            working_dir: PathBuf::from(\"C:\\\\\"),\n            rows: 24,\n            cols: 80,\n            environment: Default::default(),\n        };\n\n        let mut pty = ConPtyBackend::create(config)\n            .await\n            .expect(\"Failed to create PTY\");\n\n        // Send exit command\n        pty.write(b\"exit\\r\\n\")\n            .await\n            .expect(\"Failed to write exit\");\n\n        // Try to write after process might have exited\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // This should either succeed (buffered) or fail gracefully\n        let write_result = pty.write(b\"this should not crash\\r\\n\").await;\n\n        // We don't assert on the result - just that it doesn't panic\n        // The error should be handled gracefully\n\n        pty.terminate().await.ok();\n    }\n\n    #[tokio::test]\n    #[ignore = \"AsyncPipeReader/Writer use blocking I/O in poll functions, violates tokio async contract. Phase 2: migrate to windows.rs PtyHandle\"]\n    async fn test_orphaned_child_processes() {\n        // Edge case: Spawn a child process, then kill the shell\n        let config = PtyConfig {\n            shell: \"cmd.exe\".to_string(),\n            working_dir: PathBuf::from(\"C:\\\\\"),\n            rows: 24,\n            cols: 80,\n            environment: Default::default(),\n        };\n\n        let mut pty = ConPtyBackend::create(config)\n            .await\n            .expect(\"Failed to create PTY\");\n\n        let shell_pid = pty.shell_pid();\n\n        // Start a long-running child process\n        pty.write(b\"timeout /t 60\\r\\n\")\n            .await\n            .expect(\"Failed to write command\");\n\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Terminate the PTY (should clean up child processes)\n        pty.terminate().await.expect(\"Failed to terminate\");\n\n        // Wait a bit and check if the shell process is gone\n        tokio::time::sleep(Duration::from_millis(200)).await;\n\n        // Process should be terminated (we can't easily check this without external tools)\n        // This test primarily ensures terminate() doesn't hang\n    }\n\n    #[tokio::test]\n    #[ignore = \"Blanket exclusion of tests.rs module due to AsyncPipeReader/Writer blocking I/O. Phase 2: migrate to windows.rs PtyHandle\"]\n    async fn test_rapid_create_destroy() {\n        // Stress test: Rapidly create and destroy PTY sessions\n        // NOTE: Added delay to prevent heap corruption from closing pipe handles\n        // while async ReadFile operations are still pending (STATUS_HEAP_CORRUPTION fix)\n        for i in 0..10 {\n            let config = PtyConfig {\n                shell: \"cmd.exe\".to_string(),\n                working_dir: PathBuf::from(\"C:\\\\\"),\n                rows: 24,\n                cols: 80,\n                environment: Default::default(),\n            };\n\n            let pty = ConPtyBackend::create(config)\n                .await\n                .expect(\u0026format!(\"Failed to create PTY iteration {}\", i));\n\n            assert!(pty.shell_pid() \u003e 0);\n\n            pty.terminate().await.expect(\"Failed to terminate\");\n\n            // Wait for async cleanup to complete before next iteration\n            // This prevents race condition between ReadFile and CloseHandle\n            tokio::time::sleep(Duration::from_millis(100)).await;\n        }\n    }\n\n    #[tokio::test]\n    #[ignore = \"Known issue: AsyncPipeReader uses blocking ReadFile in poll_read, violates tokio async contract. See windows.rs PtyHandle for proper async architecture. TODO: Phase 2 - migrate to windows.rs or implement proper overlapped I/O\"]\n    async fn test_concurrent_read_write() {\n        // Test concurrent reads and writes don't cause issues\n        let config = PtyConfig {\n            shell: \"powershell.exe\".to_string(),\n            working_dir: PathBuf::from(\"C:\\\\\"),\n            rows: 24,\n            cols: 80,\n            environment: Default::default(),\n        };\n\n        let mut pty = ConPtyBackend::create(config)\n            .await\n            .expect(\"Failed to create PTY\");\n\n        // Spawn concurrent write tasks\n        let write_task = {\n            tokio::spawn(async move {\n                for i in 0..10 {\n                    let cmd = format!(\"echo write_{}\\r\\n\", i);\n                    tokio::time::sleep(Duration::from_millis(10)).await;\n                }\n            })\n        };\n\n        // Read in main task\n        let mut buf = vec![0u8; 4096];\n        for _ in 0..5 {\n            tokio::time::timeout(\n                Duration::from_millis(200),\n                pty.read(\u0026mut buf)\n            ).await.ok();\n        }\n\n        write_task.await.ok();\n        pty.terminate().await.ok();\n    }\n\n    #[tokio::test]\n    #[ignore = \"AsyncPipeReader/Writer use blocking I/O in poll functions, violates tokio async contract. Phase 2: migrate to windows.rs PtyHandle\"]\n    async fn test_large_write() {\n        // Test writing large chunks (\u003e 4KB buffer)\n        let config = PtyConfig {\n            shell: \"cmd.exe\".to_string(),\n            working_dir: PathBuf::from(\"C:\\\\\"),\n            rows: 24,\n            cols: 80,\n            environment: Default::default(),\n        };\n\n        let mut pty = ConPtyBackend::create(config)\n            .await\n            .expect(\"Failed to create PTY\");\n\n        // Write 64KB of data\n        let large_data = vec![b'A'; 65536];\n        let result = pty.write(\u0026large_data).await;\n\n        // Should either succeed or fail gracefully\n        // Most importantly, should not panic or hang\n        match result {\n            Ok(_) =\u003e {\n                // Success - data buffered\n            }\n            Err(e) =\u003e {\n                // Acceptable failure modes: broken pipe, buffer full\n                assert!(\n                    e.kind() == std::io::ErrorKind::BrokenPipe\n                    || e.kind() == std::io::ErrorKind::WouldBlock,\n                    \"Unexpected error: {:?}\",\n                    e\n                );\n            }\n        }\n\n        pty.terminate().await.ok();\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","pty","windows.rs"],"content":"// Windows ConPTY Implementation with Async I/O\n// SRS Reference: §2.1.2.3 Windows ConPTY [D1.2.3]\n//\n// Implements Windows Console Pseudo-console API (Windows 10 1809+) with tokio async I/O.\n//\n// Architecture:\n// - Main thread: ConPTY setup via FFI\n// - Background task 1: Read from ConPTY output pipe → send to mpsc channel\n// - Background task 2: Receive from mpsc channel → write to ConPTY input pipe\n// - Session Manager: Calls read()/write() on channels (no direct FFI)\n//\n// Safety: All unsafe FFI calls have documented safety invariants.\n\nuse super::{PtyError, PtyResult};\nuse std::ffi::OsStr;\nuse std::os::windows::ffi::OsStrExt;\nuse std::os::windows::io::{AsRawHandle, FromRawHandle, IntoRawHandle, RawHandle};\nuse std::path::Path;\nuse std::ptr;\nuse std::sync::Arc;\nuse tokio::io::{AsyncReadExt, AsyncWriteExt};\nuse tokio::sync::mpsc;\nuse windows::core::PCWSTR;\nuse windows::Win32::Foundation::{CloseHandle, HANDLE, INVALID_HANDLE_VALUE, WAIT_OBJECT_0};\nuse windows::Win32::Storage::FileSystem::FILE_FLAG_OVERLAPPED;\nuse windows::Win32::System::Console::{\n    ClosePseudoConsole, CreatePseudoConsole, ResizePseudoConsole, COORD, HPCON,\n};\nuse windows::Win32::System::Pipes::CreatePipe;\nuse windows::Win32::System::Threading::{\n    CreateProcessW, GetProcessId, InitializeProcThreadAttributeList, TerminateProcess,\n    UpdateProcThreadAttribute, CREATE_UNICODE_ENVIRONMENT, EXTENDED_STARTUPINFO_PRESENT,\n    LPPROC_THREAD_ATTRIBUTE_LIST, PROCESS_INFORMATION, PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE,\n    STARTF_USESTDHANDLES, STARTUPINFOEXW,\n};\n\n/// 4KB buffer size per SRS §3.1.4\nconst PTY_BUFFER_SIZE: usize = 4096;\n\n/// Channel buffer size (256 chunks = ~1MB total per SRS §2.1.4)\nconst CHANNEL_BUFFER_SIZE: usize = 256;\n\n/// Handle wrapper with automatic cleanup\nstruct Handle(HANDLE);\n\nimpl Handle {\n    fn new(handle: HANDLE) -\u003e PtyResult\u003cSelf\u003e {\n        if handle == INVALID_HANDLE_VALUE || handle.0 == 0 {\n            return Err(PtyError::CreateFailed(\"Invalid handle\".to_string()));\n        }\n        Ok(Self(handle))\n    }\n\n    fn as_raw(\u0026self) -\u003e HANDLE {\n        self.0\n    }\n\n    /// Transfer ownership of the raw handle, preventing Drop from closing it\n    ///\n    /// # Safety\n    /// The caller must ensure the returned HANDLE is eventually closed,\n    /// either manually or by transferring ownership to another wrapper.\n    fn into_raw(self) -\u003e HANDLE {\n        let handle = self.0;\n        std::mem::forget(self); // Prevent Drop from closing the handle\n        handle\n    }\n}\n\nimpl Drop for Handle {\n    fn drop(\u0026mut self) {\n        // SAFETY: We only close valid handles that we own\n        unsafe {\n            let _ = CloseHandle(self.0);\n        }\n    }\n}\n\n/// ConPTY handle wrapper with automatic cleanup\nstruct HpconHandle(HPCON);\n\nimpl Drop for HpconHandle {\n    fn drop(\u0026mut self) {\n        // SAFETY: ClosePseudoConsole is safe to call on a valid HPCON\n        unsafe {\n            ClosePseudoConsole(self.0);\n        }\n    }\n}\n\n/// Wrapper for HANDLE that implements AsyncRead/AsyncWrite for tokio\n///\n/// Note: This is a simplified implementation for Phase 1.\n/// For production, consider using a dedicated crate like `tokio-pipe` or\n/// implementing proper overlapped I/O with IOCP.\nstruct AsyncHandle {\n    inner: std::fs::File,\n}\n\nimpl AsyncHandle {\n    /// Create from raw Windows HANDLE\n    ///\n    /// # Safety\n    /// The handle must be valid and owned by this wrapper.\n    /// The handle will be closed when this wrapper is dropped.\n    unsafe fn from_raw_handle(handle: HANDLE) -\u003e PtyResult\u003cSelf\u003e {\n        let file = std::fs::File::from_raw_handle(handle.0 as RawHandle);\n        Ok(Self { inner: file })\n    }\n}\n\nimpl tokio::io::AsyncRead for AsyncHandle {\n    fn poll_read(\n        mut self: std::pin::Pin\u003c\u0026mut Self\u003e,\n        cx: \u0026mut std::task::Context\u003c'_\u003e,\n        buf: \u0026mut tokio::io::ReadBuf\u003c'_\u003e,\n    ) -\u003e std::task::Poll\u003cstd::io::Result\u003c()\u003e\u003e {\n        // Use tokio's blocking in place for synchronous reads\n        // TODO: Implement proper overlapped I/O for production\n        let inner = \u0026mut self.inner;\n        std::pin::Pin::new(inner).poll_read(cx, buf)\n    }\n}\n\nimpl tokio::io::AsyncWrite for AsyncHandle {\n    fn poll_write(\n        mut self: std::pin::Pin\u003c\u0026mut Self\u003e,\n        cx: \u0026mut std::task::Context\u003c'_\u003e,\n        buf: \u0026[u8],\n    ) -\u003e std::task::Poll\u003cResult\u003cusize, std::io::Error\u003e\u003e {\n        let inner = \u0026mut self.inner;\n        std::pin::Pin::new(inner).poll_write(cx, buf)\n    }\n\n    fn poll_flush(\n        mut self: std::pin::Pin\u003c\u0026mut Self\u003e,\n        cx: \u0026mut std::task::Context\u003c'_\u003e,\n    ) -\u003e std::task::Poll\u003cResult\u003c(), std::io::Error\u003e\u003e {\n        let inner = \u0026mut self.inner;\n        std::pin::Pin::new(inner).poll_flush(cx)\n    }\n\n    fn poll_shutdown(\n        mut self: std::pin::Pin\u003c\u0026mut Self\u003e,\n        cx: \u0026mut std::task::Context\u003c'_\u003e,\n    ) -\u003e std::task::Poll\u003cResult\u003c(), std::io::Error\u003e\u003e {\n        let inner = \u0026mut self.inner;\n        std::pin::Pin::new(inner).poll_shutdown(cx)\n    }\n}\n\n/// Windows ConPTY handle with async I/O\n///\n/// Session Manager integration contract (from rust-backend-lead):\n/// - spawn() to create sessions\n/// - read() in a loop for output fan-out\n/// - write() for client input\n/// - resize() on client resize requests\n/// - kill() on session termination\npub struct PtyHandle {\n    /// Pseudo-console handle\n    hpc: Arc\u003cHpconHandle\u003e,\n    /// Child process handle\n    process: Arc\u003cHandle\u003e,\n    /// Process ID\n    pid: u32,\n    /// Output receiver (ConPTY → Session Manager)\n    output_rx: mpsc::Receiver\u003cVec\u003cu8\u003e\u003e,\n    /// Input sender (Session Manager → ConPTY)\n    input_tx: mpsc::Sender\u003cVec\u003cu8\u003e\u003e,\n}\n\nimpl PtyHandle {\n    /// Spawn a new ConPTY session\n    ///\n    /// # Arguments\n    /// * `shell` - Shell executable path (e.g., \"powershell.exe\", \"cmd.exe\")\n    /// * `working_dir` - Initial working directory\n    /// * `rows` - Terminal rows\n    /// * `cols` - Terminal columns\n    ///\n    /// # Returns\n    /// A new PtyHandle with background I/O tasks running\n    pub async fn spawn(\n        shell: \u0026str,\n        working_dir: \u0026Path,\n        rows: u16,\n        cols: u16,\n    ) -\u003e PtyResult\u003cSelf\u003e {\n        tracing::info!(\n            \"Spawning ConPTY: shell={}, cwd={:?}, size={}x{}\",\n            shell,\n            working_dir,\n            cols,\n            rows\n        );\n\n        // Create pipes for ConPTY I/O\n        let (input_read, input_write) = Self::create_pipe()?;\n        let (output_read, output_write) = Self::create_pipe()?;\n\n        // Create pseudo-console\n        let coord = COORD {\n            X: cols as i16,\n            Y: rows as i16,\n        };\n\n        let mut hpc = HPCON::default();\n\n        // SAFETY: CreatePseudoConsole is safe to call with valid handles.\n        // The handles are owned by us and will be managed appropriately.\n        unsafe {\n            CreatePseudoConsole(coord, input_read.as_raw(), output_write.as_raw(), 0, \u0026mut hpc)\n                .map_err(|e| {\n                    PtyError::CreateFailed(format!(\"CreatePseudoConsole failed: {}\", e))\n                })?;\n        }\n\n        let hpc = Arc::new(HpconHandle(hpc));\n\n        // Spawn child process attached to ConPTY\n        let (process_handle, pid) = Self::spawn_process(\u0026hpc.0, shell, working_dir)?;\n        let process = Arc::new(Handle::new(process_handle)?);\n\n        // Close ConPTY-owned pipe ends (ConPTY holds these now)\n        drop(input_read);\n        drop(output_write);\n\n        // Create async I/O channels\n        let (output_tx, output_rx) = mpsc::channel(CHANNEL_BUFFER_SIZE);\n        let (input_tx, input_rx) = mpsc::channel(CHANNEL_BUFFER_SIZE);\n\n        // Spawn output reader task (ConPTY → Session Manager)\n        // SAFETY: output_read ownership transferred to AsyncHandle via into_raw()\n        let output_read_async = unsafe { AsyncHandle::from_raw_handle(output_read.into_raw())? };\n\n        tokio::spawn(async move {\n            Self::output_reader_task(output_read_async, output_tx).await;\n        });\n\n        // Spawn input writer task (Session Manager → ConPTY)\n        // SAFETY: input_write ownership transferred to AsyncHandle via into_raw()\n        let input_write_async = unsafe { AsyncHandle::from_raw_handle(input_write.into_raw())? };\n\n        tokio::spawn(async move {\n            Self::input_writer_task(input_write_async, input_rx).await;\n        });\n\n        tracing::info!(\"ConPTY session spawned: pid={}\", pid);\n\n        Ok(Self {\n            hpc,\n            process,\n            pid,\n            output_rx,\n            input_tx,\n        })\n    }\n\n    /// Read output from the PTY (non-blocking)\n    ///\n    /// Returns None when the child process has terminated (EOF).\n    /// Session Manager calls this in a loop for output fan-out.\n    pub async fn read(\u0026mut self) -\u003e Option\u003cVec\u003cu8\u003e\u003e {\n        self.output_rx.recv().await\n    }\n\n    /// Write input to the PTY\n    ///\n    /// Session Manager forwards client input here.\n    pub async fn write(\u0026self, data: \u0026[u8]) -\u003e PtyResult\u003c()\u003e {\n        self.input_tx\n            .send(data.to_vec())\n            .await\n            .map_err(|_| PtyError::Disconnected)\n    }\n\n    /// Resize the terminal\n    ///\n    /// Session Manager calls this on client ResizeRequest messages.\n    pub fn resize(\u0026self, rows: u16, cols: u16) -\u003e PtyResult\u003c()\u003e {\n        let coord = COORD {\n            X: cols as i16,\n            Y: rows as i16,\n        };\n\n        // SAFETY: ResizePseudoConsole is safe to call on a valid HPCON\n        unsafe {\n            ResizePseudoConsole(self.hpc.0, coord).map_err(|e| {\n                PtyError::ResizeFailed(format!(\"ResizePseudoConsole failed: {}\", e).into())\n            })?;\n        }\n\n        tracing::debug!(\"Resized ConPTY to {}x{}\", cols, rows);\n        Ok(())\n    }\n\n    /// Kill the child process\n    ///\n    /// Session Manager calls this on session termination.\n    pub fn kill(\u0026self) -\u003e PtyResult\u003c()\u003e {\n        tracing::warn!(\"Force-killing ConPTY process: pid={}\", self.pid);\n\n        // SAFETY: TerminateProcess is safe to call on a valid process handle\n        unsafe {\n            TerminateProcess(self.process.as_raw(), 1).map_err(|e| {\n                PtyError::CreateFailed(format!(\"TerminateProcess failed: {}\", e))\n            })?;\n        }\n\n        Ok(())\n    }\n\n    /// Get the child process ID\n    pub fn pid(\u0026self) -\u003e u32 {\n        self.pid\n    }\n\n    // ========== Internal Helper Methods ==========\n\n    /// Create a pipe for ConPTY I/O\n    fn create_pipe() -\u003e PtyResult\u003c(Handle, Handle)\u003e {\n        let mut read_handle = HANDLE::default();\n        let mut write_handle = HANDLE::default();\n\n        // SAFETY: CreatePipe is safe to call with valid out-pointers.\n        // We pass NULL for security attributes (default) and 0 for buffer size (default).\n        unsafe {\n            CreatePipe(\u0026mut read_handle, \u0026mut write_handle, None, 0).map_err(|e| {\n                PtyError::CreateFailed(format!(\"CreatePipe failed: {}\", e))\n            })?;\n        }\n\n        Ok((Handle::new(read_handle)?, Handle::new(write_handle)?))\n    }\n\n    /// Convert Rust string to null-terminated wide string for Windows APIs\n    fn to_wide_string(s: \u0026str) -\u003e Vec\u003cu16\u003e {\n        OsStr::new(s)\n            .encode_wide()\n            .chain(std::iter::once(0))\n            .collect()\n    }\n\n    /// Spawn child process attached to ConPTY\n    ///\n    /// # Safety\n    /// Uses CreateProcessW with EXTENDED_STARTUPINFO_PRESENT and properly\n    /// initialized STARTUPINFOEX containing the ConPTY handle.\n    fn spawn_process(hpc: \u0026HPCON, shell: \u0026str, working_dir: \u0026Path) -\u003e PtyResult\u003c(HANDLE, u32)\u003e {\n        let mut command_line = Self::to_wide_string(shell);\n\n        let cwd = working_dir\n            .to_str()\n            .ok_or_else(|| PtyError::InvalidConfig(\"Invalid working directory\".to_string()))?;\n        let cwd_wide = Self::to_wide_string(cwd);\n\n        // Initialize STARTUPINFOEX\n        let mut startup_info: STARTUPINFOEXW = unsafe { std::mem::zeroed() };\n        startup_info.StartupInfo.cb = std::mem::size_of::\u003cSTARTUPINFOEXW\u003e() as u32;\n        startup_info.StartupInfo.dwFlags = STARTF_USESTDHANDLES;\n\n        // Determine required size for attribute list\n        let mut attr_size: usize = 0;\n        unsafe {\n            let _ = InitializeProcThreadAttributeList(\n                LPPROC_THREAD_ATTRIBUTE_LIST(ptr::null_mut()),\n                1,\n                0,\n                \u0026mut attr_size,\n            );\n        }\n\n        // Allocate and initialize attribute list\n        let mut attr_list_buffer: Vec\u003cu8\u003e = vec![0u8; attr_size];\n        let attr_list_ptr =\n            LPPROC_THREAD_ATTRIBUTE_LIST(attr_list_buffer.as_mut_ptr() as *mut _);\n\n        unsafe {\n            InitializeProcThreadAttributeList(attr_list_ptr, 1, 0, \u0026mut attr_size).map_err(\n                |e| PtyError::SpawnFailed(format!(\"InitializeProcThreadAttributeList failed: {}\", e)),\n            )?;\n        }\n\n        startup_info.lpAttributeList = attr_list_ptr;\n\n        // Attach ConPTY to the attribute list\n        unsafe {\n            UpdateProcThreadAttribute(\n                attr_list_ptr,\n                0,\n                PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE as usize,\n                Some(hpc as *const _ as *const _),\n                std::mem::size_of::\u003cHPCON\u003e(),\n                None,\n                None,\n            )\n            .map_err(|e| {\n                PtyError::SpawnFailed(format!(\"UpdateProcThreadAttribute failed: {}\", e))\n            })?;\n        }\n\n        // Create the process\n        let mut process_info: PROCESS_INFORMATION = unsafe { std::mem::zeroed() };\n\n        unsafe {\n            CreateProcessW(\n                None,\n                windows::core::PWSTR(command_line.as_mut_ptr()),\n                None,\n                None,\n                false,\n                EXTENDED_STARTUPINFO_PRESENT | CREATE_UNICODE_ENVIRONMENT,\n                None,\n                PCWSTR(cwd_wide.as_ptr()),\n                \u0026startup_info.StartupInfo,\n                \u0026mut process_info,\n            )\n            .map_err(|e| PtyError::SpawnFailed(format!(\"CreateProcessW failed: {}\", e)))?;\n        }\n\n        // Close thread handle (we don't need it)\n        unsafe {\n            let _ = CloseHandle(process_info.hThread);\n        }\n\n        Ok((process_info.hProcess, process_info.dwProcessId))\n    }\n\n    /// Background task: Read from ConPTY output pipe and send to channel\n    ///\n    /// Runs until EOF (process terminated) or error.\n    async fn output_reader_task(mut reader: AsyncHandle, tx: mpsc::Sender\u003cVec\u003cu8\u003e\u003e) {\n        let mut buffer = vec![0u8; PTY_BUFFER_SIZE];\n\n        loop {\n            match reader.read(\u0026mut buffer).await {\n                Ok(0) =\u003e {\n                    // EOF - process terminated\n                    tracing::debug!(\"ConPTY output EOF (process terminated)\");\n                    break;\n                }\n                Ok(n) =\u003e {\n                    let chunk = buffer[..n].to_vec();\n                    if tx.send(chunk).await.is_err() {\n                        // Receiver dropped - session closed\n                        tracing::debug!(\"ConPTY output receiver dropped\");\n                        break;\n                    }\n                }\n                Err(e) =\u003e {\n                    tracing::error!(\"ConPTY read error: {}\", e);\n                    break;\n                }\n            }\n        }\n\n        tracing::debug!(\"ConPTY output reader task exiting\");\n    }\n\n    /// Background task: Receive from channel and write to ConPTY input pipe\n    ///\n    /// Runs until channel is closed or error.\n    async fn input_writer_task(mut writer: AsyncHandle, mut rx: mpsc::Receiver\u003cVec\u003cu8\u003e\u003e) {\n        while let Some(data) = rx.recv().await {\n            if let Err(e) = writer.write_all(\u0026data).await {\n                tracing::error!(\"ConPTY write error: {}\", e);\n                break;\n            }\n\n            // Flush immediately for low-latency input\n            let _ = writer.flush().await;\n        }\n\n        tracing::debug!(\"ConPTY input writer task exiting\");\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::path::PathBuf;\n    use std::time::Duration;\n\n    #[tokio::test]\n    async fn test_spawn_conpty() {\n        let pty = PtyHandle::spawn(\"cmd.exe\", Path::new(\"C:\\\\\"), 24, 80)\n            .await\n            .expect(\"Failed to spawn ConPTY\");\n\n        assert!(pty.pid() \u003e 0);\n        assert_eq!(pty.pid, pty.pid());\n    }\n\n    #[tokio::test]\n    async fn test_spawn_powershell() {\n        let pty = PtyHandle::spawn(\"powershell.exe\", Path::new(\"C:\\\\\"), 24, 80)\n            .await\n            .expect(\"Failed to spawn PowerShell\");\n\n        assert!(pty.pid() \u003e 0);\n\n        // Clean up\n        let _ = pty.kill();\n    }\n\n    #[tokio::test]\n    async fn test_write_read_cmd() {\n        let mut pty = PtyHandle::spawn(\"cmd.exe\", Path::new(\"C:\\\\\"), 24, 80)\n            .await\n            .expect(\"Failed to spawn cmd.exe\");\n\n        // Send echo command\n        pty.write(b\"echo hello\\r\\n\")\n            .await\n            .expect(\"Failed to write\");\n\n        // Read output (should contain \"hello\" somewhere)\n        let mut found = false;\n        for _ in 0..20 {\n            tokio::time::sleep(Duration::from_millis(100)).await;\n\n            if let Some(output) = pty.read().await {\n                let text = String::from_utf8_lossy(\u0026output);\n                tracing::debug!(\"Received: {}\", text);\n\n                if text.contains(\"hello\") {\n                    found = true;\n                    break;\n                }\n            }\n        }\n\n        assert!(found, \"Expected 'hello' in output\");\n\n        // Clean up\n        let _ = pty.kill();\n    }\n\n    #[tokio::test]\n    async fn test_resize() {\n        let pty = PtyHandle::spawn(\"cmd.exe\", Path::new(\"C:\\\\\"), 24, 80)\n            .await\n            .expect(\"Failed to spawn cmd.exe\");\n\n        // Resize should not fail\n        pty.resize(30, 100).expect(\"Failed to resize\");\n        pty.resize(50, 120).expect(\"Failed to resize again\");\n\n        // Clean up\n        let _ = pty.kill();\n    }\n\n    #[tokio::test]\n    async fn test_kill() {\n        let pty = PtyHandle::spawn(\"cmd.exe\", Path::new(\"C:\\\\\"), 24, 80)\n            .await\n            .expect(\"Failed to spawn cmd.exe\");\n\n        let pid = pty.pid();\n        assert!(pid \u003e 0);\n\n        // Kill should succeed\n        pty.kill().expect(\"Failed to kill process\");\n\n        // Give it a moment to terminate\n        tokio::time::sleep(Duration::from_millis(100)).await;\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","server","connection.rs"],"content":"// WebSocket connection management\n// Implements SRS §3.1.4 (Output Buffering \u0026 Flow Control)\n\nuse std::sync::Arc;\nuse std::time::Duration;\nuse tokio::sync::mpsc;\nuse tokio::time::Instant;\nuse tracing::{debug, warn};\n\n/// Per-client connection state\npub struct Connection {\n    /// Client identifier\n    pub client_id: String,\n\n    /// Output buffer (bounded queue - SRS §3.1.4: 1 MB limit)\n    /// Each OutputData message is ~4KB typical, so 256 messages ≈ 1MB\n    pub output_tx: mpsc::Sender\u003cVec\u003cu8\u003e\u003e,\n\n    /// Connection timestamp\n    pub connected_at: Instant,\n\n    /// Compression support\n    pub supports_compression: bool,\n\n    /// Lagging detection\n    pub lagging_since: Option\u003cInstant\u003e,\n}\n\nimpl Connection {\n    /// Create a new connection\n    pub fn new(client_id: String, supports_compression: bool) -\u003e (Self, mpsc::Receiver\u003cVec\u003cu8\u003e\u003e) {\n        // SRS §3.1.4: 1 MB bounded queue\n        // Assuming 4KB per message: 256 messages ≈ 1MB\n        let (output_tx, output_rx) = mpsc::channel(256);\n\n        let conn = Self {\n            client_id,\n            output_tx,\n            connected_at: Instant::now(),\n            supports_compression,\n            lagging_since: None,\n        };\n\n        (conn, output_rx)\n    }\n\n    /// Send output data to client\n    /// Returns Ok(()) if sent, Err if buffer full (client lagging)\n    pub async fn send(\u0026mut self, data: Vec\u003cu8\u003e) -\u003e Result\u003c(), ()\u003e {\n        match self.output_tx.try_send(data) {\n            Ok(_) =\u003e {\n                // Reset lagging state\n                if self.lagging_since.is_some() {\n                    debug!(\"Client {} recovered from lagging\", self.client_id);\n                    self.lagging_since = None;\n                }\n                Ok(())\n            }\n            Err(mpsc::error::TrySendError::Full(_)) =\u003e {\n                // Buffer full - client is lagging\n                if self.lagging_since.is_none() {\n                    self.lagging_since = Some(Instant::now());\n                    warn!(\"Client {} buffer full - marked as lagging\", self.client_id);\n                }\n                Err(())\n            }\n            Err(mpsc::error::TrySendError::Closed(_)) =\u003e {\n                warn!(\"Client {} channel closed\", self.client_id);\n                Err(())\n            }\n        }\n    }\n\n    /// Check if client is lagging\n    /// SRS §3.1.4: Disconnect if lagging \u003e30s\n    pub fn is_lagging(\u0026self) -\u003e bool {\n        self.lagging_since.is_some()\n    }\n\n    /// Check if client should be disconnected due to prolonged lagging\n    pub fn should_disconnect(\u0026self) -\u003e bool {\n        if let Some(lagging_since) = self.lagging_since {\n            let lagging_duration = Instant::now() - lagging_since;\n            lagging_duration \u003e Duration::from_secs(30)\n        } else {\n            false\n        }\n    }\n\n    /// Get buffer fill percentage (0-100)\n    pub fn buffer_fill_percentage(\u0026self) -\u003e u8 {\n        let capacity = self.output_tx.capacity();\n        let available = self.output_tx.max_capacity() - capacity;\n        let used = self.output_tx.max_capacity().saturating_sub(available);\n        ((used as f32 / self.output_tx.max_capacity() as f32) * 100.0) as u8\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[tokio::test]\n    async fn test_connection_send() {\n        let (mut conn, mut rx) = Connection::new(\"test-client\".to_string(), false);\n\n        // Send data\n        let data = vec![1, 2, 3, 4];\n        assert!(conn.send(data.clone()).await.is_ok());\n\n        // Receive data\n        let received = rx.recv().await.unwrap();\n        assert_eq!(received, data);\n    }\n\n    #[tokio::test]\n    async fn test_connection_lagging() {\n        let (mut conn, _rx) = Connection::new(\"test-client\".to_string(), false);\n\n        // Fill buffer\n        for i in 0..256 {\n            let data = vec![i as u8; 4096];\n            conn.send(data).await.ok();\n        }\n\n        // Next send should fail\n        let data = vec![1, 2, 3, 4];\n        assert!(conn.send(data).await.is_err());\n        assert!(conn.is_lagging());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","server","error.rs"],"content":"// Server error types\n\nuse thiserror::Error;\n\npub type Result\u003cT\u003e = std::result::Result\u003cT, ServerError\u003e;\n\n#[derive(Debug, Error)]\npub enum ServerError {\n    #[error(\"IO error: {0}\")]\n    Io(#[from] std::io::Error),\n\n    #[error(\"TLS handshake failed: {0}\")]\n    TlsHandshake(String),\n\n    #[error(\"WebSocket upgrade failed: {0}\")]\n    WebSocketUpgrade(String),\n\n    #[error(\"WebSocket error: {0}\")]\n    WebSocket(#[from] tokio_tungstenite::tungstenite::Error),\n\n    #[error(\"Protocol decode error: {0}\")]\n    ProtocolDecode(#[from] prost::DecodeError),\n\n    #[error(\"Protocol encode error: {0}\")]\n    ProtocolEncode(#[from] prost::EncodeError),\n\n    #[error(\"Invalid message: {0}\")]\n    InvalidMessage(String),\n\n    #[error(\"Authentication failed: {0}\")]\n    AuthFailed(String),\n\n    #[error(\"Session not found: {0}\")]\n    SessionNotFound(String),\n\n    #[error(\"Permission denied\")]\n    PermissionDenied,\n\n    #[error(\"Rate limit exceeded\")]\n    RateLimitExceeded,\n\n    #[error(\"Internal error: {0}\")]\n    Internal(String),\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","server","handler.rs"],"content":"// WebSocket message handler with Protocol Buffer integration\r\n// Implements task-3: Protocol Runtime Integration\r\n// Implements task-2: Monomind bridge integration (health/upgrade/detection/dashboard)\r\n// Implements task-8: JWT authentication integration\r\n\r\nuse std::net::SocketAddr;\r\nuse std::sync::Arc;\r\nuse std::path::PathBuf;\r\nuse futures_util::{SinkExt, StreamExt};\r\nuse prost::Message;\r\nuse tokio::net::TcpStream;\r\nuse tokio::sync::mpsc;\r\nuse tokio_rustls::server::TlsStream;\r\nuse tokio_tungstenite::WebSocketStream;\r\nuse tokio_tungstenite::tungstenite::protocol::Message as WsMessage;\r\nuse tracing::{debug, info, warn, error};\r\nuse uuid::Uuid;\r\n\r\nuse monoterminal_protocol::{Envelope, envelope, ErrorCode};\r\nuse crate::auth::{AuthService, Claims};\r\nuse crate::session::manager::SessionManager;\r\nuse crate::session::{SessionId, ClientId};\r\nuse super::error::{ServerError, Result};\r\n\r\n/// Handle WebSocket connection with bidirectional streaming\r\n/// Client → Server: AttachRequest, InputData, ResizeRequest, DetachRequest\r\n/// Server → Client: AttachResponse, OutputData (continuous), ErrorResponse\r\npub async fn handle_websocket(\r\n    ws_stream: WebSocketStream\u003cTlsStream\u003cTcpStream\u003e\u003e,\r\n    peer_addr: SocketAddr,\r\n    session_manager: Arc\u003cSessionManager\u003e,\r\n    auth_service: Arc\u003cdyn AuthService\u003e,\r\n    dev_mode: bool,\r\n) -\u003e Result\u003c()\u003e {\r\n    let (mut ws_write, mut ws_read) = ws_stream.split();\r\n    let mut sequence_number: u64 = 0;\r\n    let client_id = Uuid::new_v4();\r\n\r\n    info!(\"WebSocket handler started for {} (client_id: {})\", peer_addr, client_id);\r\n\r\n    // Connection state\r\n    let mut attached_session: Option\u003cSessionId\u003e = None;\r\n    let mut output_rx: Option\u003cmpsc::Receiver\u003cVec\u003cu8\u003e\u003e\u003e = None;\r\n\r\n    // Main message loop\r\n    loop {\r\n        tokio::select! {\r\n            // Receive output from PTY (if attached)\r\n            Some(output_data) = async {\r\n                match \u0026mut output_rx {\r\n                    Some(rx) =\u003e rx.recv().await,\r\n                    None =\u003e None,\r\n                }\r\n            } =\u003e {\r\n                // Send output to client\r\n                if let Err(e) = ws_write.send(WsMessage::Binary(output_data)).await {\r\n                    error!(\"Failed to send output to {}: {}\", peer_addr, e);\r\n                    break;\r\n                }\r\n            }\r\n\r\n            // Receive message from client\r\n            Some(msg) = ws_read.next() =\u003e {\r\n                match msg {\r\n                    Ok(WsMessage::Binary(data)) =\u003e {\r\n                        debug!(\"Received binary message from {} ({} bytes)\", peer_addr, data.len());\r\n\r\n                        // Decode Protocol Buffer Envelope\r\n                        match Envelope::decode(\u0026data[..]) {\r\n                            Ok(envelope) =\u003e {\r\n                                debug!(\"Decoded envelope with sequence {}\", envelope.sequence_number);\r\n\r\n                                // Process message\r\n                                match process_message(\r\n                                    envelope,\r\n                                    \u0026session_manager,\r\n                                    auth_service.as_ref(),\r\n                                    dev_mode,\r\n                                    client_id,\r\n                                    \u0026mut attached_session,\r\n                                    \u0026mut output_rx,\r\n                                    peer_addr,\r\n                                ).await {\r\n                                    Ok(Some(response)) =\u003e {\r\n                                        // Encode and send response\r\n                                        let mut response_bytes = Vec::with_capacity(response.encoded_len());\r\n                                        if let Err(e) = response.encode(\u0026mut response_bytes) {\r\n                                            error!(\"Failed to encode response: {}\", e);\r\n                                            continue;\r\n                                        }\r\n\r\n                                        if let Err(e) = ws_write.send(WsMessage::Binary(response_bytes)).await {\r\n                                            error!(\"Failed to send response to {}: {}\", peer_addr, e);\r\n                                            break;\r\n                                        }\r\n\r\n                                        sequence_number += 1;\r\n                                    }\r\n                                    Ok(None) =\u003e {\r\n                                        // No response needed (e.g., InputData)\r\n                                        debug!(\"Message processed, no response needed\");\r\n                                    }\r\n                                    Err(e) =\u003e {\r\n                                        error!(\"Failed to process message: {}\", e);\r\n\r\n                                        // Send error response\r\n                                        let error_response = create_error_envelope(sequence_number, e);\r\n                                        let mut error_bytes = Vec::with_capacity(error_response.encoded_len());\r\n                                        if let Err(e) = error_response.encode(\u0026mut error_bytes) {\r\n                                            error!(\"Failed to encode error response: {}\", e);\r\n                                            break;\r\n                                        }\r\n\r\n                                        if let Err(e) = ws_write.send(WsMessage::Binary(error_bytes)).await {\r\n                                            error!(\"Failed to send error response to {}: {}\", peer_addr, e);\r\n                                            break;\r\n                                        }\r\n\r\n                                        sequence_number += 1;\r\n                                    }\r\n                                }\r\n                            }\r\n                            Err(e) =\u003e {\r\n                                error!(\"Failed to decode Protocol Buffer message from {}: {}\", peer_addr, e);\r\n\r\n                                // Send protocol error\r\n                                let error_response = Envelope {\r\n                                    sequence_number,\r\n                                    message: Some(envelope::Message::ErrorResponse(\r\n                                        monoterminal_protocol::ErrorResponse {\r\n                                            code: monoterminal_protocol::ErrorCode::InvalidRequest as i32,\r\n                                            message: format!(\"Protocol decode error: {}\", e),\r\n                                        }\r\n                                    )),\r\n                                };\r\n\r\n                                let mut error_bytes = Vec::with_capacity(error_response.encoded_len());\r\n                                if let Err(e) = error_response.encode(\u0026mut error_bytes) {\r\n                                    error!(\"Failed to encode error response: {}\", e);\r\n                                    break;\r\n                                }\r\n\r\n                                if let Err(e) = ws_write.send(WsMessage::Binary(error_bytes)).await {\r\n                                    error!(\"Failed to send error response to {}: {}\", peer_addr, e);\r\n                                    break;\r\n                                }\r\n\r\n                                sequence_number += 1;\r\n                            }\r\n                        }\r\n                    }\r\n                    Ok(WsMessage::Text(text)) =\u003e {\r\n                        warn!(\"Received unexpected text message from {}: {}\", peer_addr, text);\r\n                    }\r\n                    Ok(WsMessage::Ping(data)) =\u003e {\r\n                        debug!(\"Received ping from {}\", peer_addr);\r\n                        if let Err(e) = ws_write.send(WsMessage::Pong(data)).await {\r\n                            error!(\"Failed to send pong to {}: {}\", peer_addr, e);\r\n                            break;\r\n                        }\r\n                    }\r\n                    Ok(WsMessage::Pong(_)) =\u003e {\r\n                        debug!(\"Received pong from {}\", peer_addr);\r\n                    }\r\n                    Ok(WsMessage::Close(frame)) =\u003e {\r\n                        info!(\"Client {} closed connection: {:?}\", peer_addr, frame);\r\n                        break;\r\n                    }\r\n                    Ok(WsMessage::Frame(_)) =\u003e {\r\n                        warn!(\"Received raw frame from {}\", peer_addr);\r\n                    }\r\n                    Err(e) =\u003e {\r\n                        error!(\"WebSocket error from {}: {}\", peer_addr, e);\r\n                        break;\r\n                    }\r\n                }\r\n            }\r\n\r\n            else =\u003e {\r\n                // Both channels closed\r\n                debug!(\"Both WebSocket channels closed for {}\", peer_addr);\r\n                break;\r\n            }\r\n        }\r\n    }\r\n\r\n    // Cleanup: detach from session if attached\r\n    if let Some(session_id) = attached_session {\r\n        if let Err(e) = session_manager.detach_client(session_id, client_id).await {\r\n            error!(\"Failed to detach client {} from session {}: {}\", client_id, session_id, e);\r\n        } else {\r\n            info!(\"Client {} detached from session {} on disconnect\", client_id, session_id);\r\n        }\r\n    }\r\n\r\n    info!(\"WebSocket handler stopped for {}\", peer_addr);\r\n    Ok(())\r\n}\r\n\r\n/// Verify JWT authentication token\r\n///\r\n/// SRS §3.2.2: Ed25519/JWT authentication with 15-minute access tokens\r\n///\r\n/// # Arguments\r\n/// * `auth_service` - The authentication service to verify tokens\r\n/// * `token` - The JWT token string (EdDSA signed)\r\n///\r\n/// # Returns\r\n/// * `Ok(Claims)` - Valid token with user claims\r\n/// * `Err(ServerError::AuthFailed)` - Invalid, expired, or malformed token\r\nfn verify_auth_token(\r\n    auth_service: \u0026dyn AuthService,\r\n    token: \u0026str,\r\n) -\u003e Result\u003cClaims\u003e {\r\n    auth_service\r\n        .verify_access(token)\r\n        .map_err(|e| ServerError::AuthFailed(format!(\"JWT verification failed: {}\", e)))\r\n}\r\n\r\n/// Process a Protocol Buffer message\r\nasync fn process_message(\r\n    envelope: Envelope,\r\n    session_manager: \u0026SessionManager,\r\n    auth_service: \u0026dyn AuthService,\r\n    dev_mode: bool,\r\n    client_id: ClientId,\r\n    attached_session: \u0026mut Option\u003cSessionId\u003e,\r\n    output_rx: \u0026mut Option\u003cmpsc::Receiver\u003cVec\u003cu8\u003e\u003e\u003e,\r\n    peer_addr: SocketAddr,\r\n) -\u003e Result\u003cOption\u003cEnvelope\u003e\u003e {\r\n    match envelope.message {\r\n        Some(envelope::Message::AttachRequest(req)) =\u003e {\r\n            debug!(\"Processing AttachRequest from {}: session_id={}\", peer_addr, req.session_id);\r\n\r\n            // SRS §3.2.2: JWT authentication verification\r\n            if !dev_mode {\r\n                // Production mode: verify JWT token\r\n                if req.auth_token.is_empty() {\r\n                    warn!(\"AttachRequest from {} missing auth_token\", peer_addr);\r\n                    return Err(ServerError::AuthFailed(\"Missing authentication token\".to_string()));\r\n                }\r\n\r\n                let _claims = verify_auth_token(auth_service, \u0026req.auth_token)?;\r\n                debug!(\"JWT verified for AttachRequest from {}\", peer_addr);\r\n            } else {\r\n                // Dev mode: bypass auth (for E2E testing only)\r\n                warn!(\"⚠️  DEV MODE: Skipping JWT verification for AttachRequest from {}\", peer_addr);\r\n            }\r\n\r\n            // Parse or create session_id (protocol: \"UUID or empty for new session\")\r\n            let session_id = if req.session_id.is_empty() {\r\n                // Create new session with requested dimensions\r\n                info!(\"Creating new session for {} ({}x{})\", peer_addr, req.rows, req.cols);\r\n                session_manager\r\n                    .create_session(None, req.rows as u16, req.cols as u16)\r\n                    .await\r\n                    .map_err(|e| ServerError::InvalidMessage(format!(\"Failed to create session: {}\", e)))?\r\n            } else {\r\n                // Attach to existing session\r\n                Uuid::parse_str(\u0026req.session_id)\r\n                    .map_err(|e| ServerError::InvalidMessage(format!(\"Invalid session_id UUID: {}\", e)))?\r\n            };\r\n\r\n            // Create output channel for this client\r\n            let (output_tx, rx) = mpsc::channel(256); // 256 messages ≈ 1MB buffer per SRS §3.1.4\r\n\r\n            // Attach client to session\r\n            let snapshot = session_manager\r\n                .attach_client(session_id, client_id, output_tx)\r\n                .await\r\n                .map_err(|e| match e {\r\n                    crate::session::SessionError::NotFound(_) =\u003e\r\n                        ServerError::SessionNotFound(req.session_id.clone()),\r\n                    _ =\u003e ServerError::InvalidMessage(format!(\"Attach failed: {}\", e)),\r\n                })?;\r\n\r\n            // Store connection state\r\n            *attached_session = Some(session_id);\r\n            *output_rx = Some(rx);\r\n\r\n            info!(\"Client {} attached to session {}\", client_id, session_id);\r\n\r\n            // Encode scrollback for late-joiner sync with line numbers\r\n            let scrollback_lines: Vec\u003cmonoterminal_protocol::Line\u003e = snapshot\r\n                .scrollback\r\n                .iter()\r\n                .enumerate()\r\n                .map(|(i, line)| monoterminal_protocol::Line {\r\n                    data: line.data.clone(),\r\n                    line_number: i as u64,\r\n                })\r\n                .collect();\r\n\r\n            // Build metadata\r\n            let now = std::time::SystemTime::now()\r\n                .duration_since(std::time::UNIX_EPOCH)\r\n                .unwrap_or_default()\r\n                .as_secs() as i64;\r\n\r\n            let metadata = Some(monoterminal_protocol::SessionMetadata {\r\n                rows: snapshot.rows as u32,\r\n                cols: snapshot.cols as u32,\r\n                shell_type: snapshot.shell_type,\r\n                working_dir: snapshot.working_dir.to_string_lossy().to_string(),\r\n                created_at: now,  // TODO: Get actual created_at from session\r\n                last_activity: now,  // TODO: Get actual last_activity from session\r\n            });\r\n\r\n            let response = Envelope {\r\n                sequence_number: envelope.sequence_number,\r\n                message: Some(envelope::Message::AttachResponse(\r\n                    monoterminal_protocol::AttachResponse {\r\n                        session_id: req.session_id,\r\n                        metadata,\r\n                        scrollback: scrollback_lines,\r\n                    }\r\n                )),\r\n            };\r\n\r\n            Ok(Some(response))\r\n        }\r\n        Some(envelope::Message::InputData(input)) =\u003e {\r\n            debug!(\"Processing InputData from {}: {} bytes\", peer_addr, input.data.len());\r\n\r\n            // SRS §3.2.2: JWT authentication verification\r\n            if !dev_mode {\r\n                // Production mode: verify JWT token\r\n                if input.auth_token.is_empty() {\r\n                    warn!(\"InputData from {} missing auth_token\", peer_addr);\r\n                    return Err(ServerError::AuthFailed(\"Missing authentication token\".to_string()));\r\n                }\r\n\r\n                let _claims = verify_auth_token(auth_service, \u0026input.auth_token)?;\r\n                debug!(\"JWT verified for InputData from {}\", peer_addr);\r\n            }\r\n\r\n            // Ensure client is attached\r\n            let session_id = attached_session\r\n                .ok_or_else(|| ServerError::InvalidMessage(\"Not attached to session\".to_string()))?;\r\n\r\n            // Forward input to session PTY\r\n            session_manager\r\n                .send_input(session_id, \u0026input.data)\r\n                .await\r\n                .map_err(|e| ServerError::InvalidMessage(format!(\"Send input failed: {}\", e)))?;\r\n\r\n            // No response needed for input data\r\n            Ok(None)\r\n        }\r\n        Some(envelope::Message::ResizeRequest(resize)) =\u003e {\r\n            debug!(\"Processing ResizeRequest from {}: {}x{}\", peer_addr, resize.rows, resize.cols);\r\n\r\n            // SRS §3.2.2: JWT authentication verification\r\n            if !dev_mode {\r\n                // Production mode: verify JWT token\r\n                if resize.auth_token.is_empty() {\r\n                    warn!(\"ResizeRequest from {} missing auth_token\", peer_addr);\r\n                    return Err(ServerError::AuthFailed(\"Missing authentication token\".to_string()));\r\n                }\r\n\r\n                let _claims = verify_auth_token(auth_service, \u0026resize.auth_token)?;\r\n                debug!(\"JWT verified for ResizeRequest from {}\", peer_addr);\r\n            }\r\n\r\n            // Ensure client is attached\r\n            let session_id = attached_session\r\n                .ok_or_else(|| ServerError::InvalidMessage(\"Not attached to session\".to_string()))?;\r\n\r\n            // Resize session PTY\r\n            session_manager\r\n                .resize_session(session_id, resize.rows as u16, resize.cols as u16)\r\n                .await\r\n                .map_err(|e| ServerError::InvalidMessage(format!(\"Resize failed: {}\", e)))?;\r\n\r\n            // No response needed\r\n            Ok(None)\r\n        }\r\n        Some(envelope::Message::DetachRequest(_)) =\u003e {\r\n            debug!(\"Processing DetachRequest from {}\", peer_addr);\r\n\r\n            // Ensure client is attached\r\n            let session_id = attached_session\r\n                .ok_or_else(|| ServerError::InvalidMessage(\"Not attached to session\".to_string()))?;\r\n\r\n            // Detach from session\r\n            session_manager\r\n                .detach_client(session_id, client_id)\r\n                .await\r\n                .map_err(|e| ServerError::InvalidMessage(format!(\"Detach failed: {}\", e)))?;\r\n\r\n            // Clear connection state\r\n            *attached_session = None;\r\n            *output_rx = None;\r\n\r\n            info!(\"Client {} detached from session {}\", client_id, session_id);\r\n\r\n            // No response needed\r\n            Ok(None)\r\n        }\r\n        Some(envelope::Message::DashboardRequest(req)) =\u003e {\r\n            debug!(\"Processing DashboardRequest from {}: command={}\", peer_addr, req.command);\r\n\r\n            // Execute monomind CLI command and return JSON response\r\n            // Commands: \"status\", \"agents\", \"memory\", \"orgs\", etc.\r\n            let result = execute_monomind_command(\u0026req.command, \u0026req.params).await;\r\n\r\n            let response = Envelope {\r\n                sequence_number: envelope.sequence_number,\r\n                message: Some(envelope::Message::DashboardResponse(\r\n                    monoterminal_protocol::DashboardResponse {\r\n                        json_data: result.0,\r\n                        error: result.1 as i32,\r\n                    }\r\n                )),\r\n            };\r\n\r\n            Ok(Some(response))\r\n        }\r\n        Some(envelope::Message::HealthCheckRequest(req)) =\u003e {\r\n            debug!(\"Processing HealthCheckRequest from {}: project_dir={}\", peer_addr, req.project_dir);\r\n\r\n            // Get project directory - use session cwd if not specified\r\n            let project_dir = if req.project_dir.is_empty() {\r\n                attached_session\r\n                    .and_then(|sid| session_manager.get_session_cwd(sid))\r\n                    .unwrap_or_else(|| std::env::current_dir().unwrap_or_default())\r\n            } else {\r\n                std::path::PathBuf::from(\u0026req.project_dir)\r\n            };\r\n\r\n            // Run health check via monomind-bridge\r\n            let health_status = monoterminal_monomind_bridge::run_doctor_check(\u0026project_dir)\r\n                .await\r\n                .unwrap_or_else(|e| {\r\n                    warn!(\"Health check failed: {}\", e);\r\n                    monoterminal_monomind_bridge::HealthStatus::not_installed()\r\n                });\r\n\r\n            // Convert to protobuf format\r\n            let issues: Vec\u003cmonoterminal_protocol::HealthIssue\u003e = health_status.issues\r\n                .iter()\r\n                .map(|issue| monoterminal_protocol::HealthIssue {\r\n                    severity: match issue.severity {\r\n                        monoterminal_monomind_bridge::Severity::Info =\u003e monoterminal_protocol::IssueSeverity::Info as i32,\r\n                        monoterminal_monomind_bridge::Severity::Warning =\u003e monoterminal_protocol::IssueSeverity::Warning as i32,\r\n                        monoterminal_monomind_bridge::Severity::Error =\u003e monoterminal_protocol::IssueSeverity::Error as i32,\r\n                    },\r\n                    message: issue.message.clone(),\r\n                    resolution: issue.resolution.clone().unwrap_or_default(),\r\n                })\r\n                .collect();\r\n\r\n            let last_check_timestamp = health_status.last_check\r\n                .duration_since(std::time::UNIX_EPOCH)\r\n                .unwrap_or_default()\r\n                .as_secs() as i64;\r\n\r\n            let response = Envelope {\r\n                sequence_number: envelope.sequence_number,\r\n                message: Some(envelope::Message::HealthCheckResponse(\r\n                    monoterminal_protocol::HealthCheckResponse {\r\n                        installed: health_status.installed,\r\n                        version: health_status.version.unwrap_or_default(),\r\n                        control_server_reachable: health_status.control_server_reachable,\r\n                        broker_registered: health_status.broker_registered,\r\n                        last_check_timestamp,\r\n                        issues,\r\n                    }\r\n                )),\r\n            };\r\n\r\n            Ok(Some(response))\r\n        }\r\n        Some(envelope::Message::UpgradeRequest(req)) =\u003e {\r\n            debug!(\"Processing UpgradeRequest from {}: project_dir={}, confirmed={}\",\r\n                peer_addr, req.project_dir, req.confirmed);\r\n\r\n            // Require explicit confirmation per SRS §2.4.3\r\n            if !req.confirmed {\r\n                return Err(ServerError::InvalidMessage(\r\n                    \"Upgrade requires user confirmation\".to_string()\r\n                ));\r\n            }\r\n\r\n            // Get project directory\r\n            let project_dir = if req.project_dir.is_empty() {\r\n                attached_session\r\n                    .and_then(|sid| session_manager.get_session_cwd(sid))\r\n                    .unwrap_or_else(|| std::env::current_dir().unwrap_or_default())\r\n            } else {\r\n                std::path::PathBuf::from(\u0026req.project_dir)\r\n            };\r\n\r\n            // Execute upgrade via monomind-bridge\r\n            let upgrade_result = monoterminal_monomind_bridge::upgrade_monomind(\u0026project_dir)\r\n                .await\r\n                .unwrap_or_else(|e| {\r\n                    warn!(\"Upgrade failed: {}\", e);\r\n                    monoterminal_monomind_bridge::UpgradeResult {\r\n                        success: false,\r\n                        old_version: None,\r\n                        new_version: None,\r\n                        output: format!(\"Upgrade failed: {}\", e),\r\n                    }\r\n                });\r\n\r\n            let response = Envelope {\r\n                sequence_number: envelope.sequence_number,\r\n                message: Some(envelope::Message::UpgradeResponse(\r\n                    monoterminal_protocol::UpgradeResponse {\r\n                        success: upgrade_result.success,\r\n                        old_version: upgrade_result.old_version.unwrap_or_default(),\r\n                        new_version: upgrade_result.new_version.unwrap_or_default(),\r\n                        output: upgrade_result.output,\r\n                    }\r\n                )),\r\n            };\r\n\r\n            Ok(Some(response))\r\n        }\r\n        Some(envelope::Message::DetectionRequest(req)) =\u003e {\r\n            debug!(\"Processing DetectionRequest from {}: project_dir={}\", peer_addr, req.project_dir);\r\n\r\n            // Get project directory\r\n            let project_dir = if req.project_dir.is_empty() {\r\n                attached_session\r\n                    .and_then(|sid| session_manager.get_session_cwd(sid))\r\n                    .unwrap_or_else(|| std::env::current_dir().unwrap_or_default())\r\n            } else {\r\n                std::path::PathBuf::from(\u0026req.project_dir)\r\n            };\r\n\r\n            // Detect monomind via monomind-bridge\r\n            let detection_result = monoterminal_monomind_bridge::detect_monomind(\u0026project_dir);\r\n\r\n            let response = Envelope {\r\n                sequence_number: envelope.sequence_number,\r\n                message: Some(envelope::Message::DetectionResponse(\r\n                    monoterminal_protocol::DetectionResponse {\r\n                        found: detection_result.found,\r\n                        monomind_root: detection_result.monomind_root\r\n                            .map(|p| p.to_string_lossy().to_string())\r\n                            .unwrap_or_default(),\r\n                        suggest_install: detection_result.suggest_install,\r\n                        dismiss_file_exists: detection_result.dismiss_file_exists,\r\n                        banner_text: if detection_result.suggest_install {\r\n                            monoterminal_monomind_bridge::INSTALL_SUGGESTION_BANNER.to_string()\r\n                        } else {\r\n                            String::new()\r\n                        },\r\n                    }\r\n                )),\r\n            };\r\n\r\n            Ok(Some(response))\r\n        }\r\n        Some(envelope::Message::AttachResponse(_)) |\r\n        Some(envelope::Message::OutputData(_)) |\r\n        Some(envelope::Message::ErrorResponse(_)) |\r\n        Some(envelope::Message::DashboardResponse(_)) |\r\n        Some(envelope::Message::HealthCheckResponse(_)) |\r\n        Some(envelope::Message::UpgradeResponse(_)) |\r\n        Some(envelope::Message::DetectionResponse(_)) |\r\n        Some(envelope::Message::MonitoringData(_)) =\u003e {\r\n            warn!(\"Received unexpected server-\u003eclient message from {}\", peer_addr);\r\n            Err(ServerError::InvalidMessage(\"Client sent server message type\".to_string()))\r\n        }\r\n        None =\u003e {\r\n            warn!(\"Received envelope with no message from {}\", peer_addr);\r\n            Err(ServerError::InvalidMessage(\"Empty envelope\".to_string()))\r\n        }\r\n    }\r\n}\r\n\r\n/// Execute monomind CLI command and return JSON response\r\n///\r\n/// Executes commands like \"status\", \"agents\", \"memory\", \"orgs\" via monomind CLI\r\n/// and returns the JSON output for the dashboard.\r\n///\r\n/// # Arguments\r\n///\r\n/// * `command` - Command name (\"status\", \"agents\", etc.)\r\n/// * `params` - Optional parameters map\r\n///\r\n/// # Returns\r\n///\r\n/// * `(String, ErrorCode)` - (JSON response, error code)\r\nasync fn execute_monomind_command(\r\n    command: \u0026str,\r\n    params: \u0026std::collections::HashMap\u003cString, String\u003e,\r\n) -\u003e (String, ErrorCode) {\r\n    use std::process::Command;\r\n\r\n    debug!(\"Executing monomind command: {}\", command);\r\n\r\n    // Build command arguments\r\n    let mut args = vec![\"monomind@latest\".to_string(), command.to_string(), \"--json\".to_string()];\r\n\r\n    // Add params as arguments\r\n    for (key, value) in params {\r\n        args.push(format!(\"--{}\", key));\r\n        args.push(value.clone());\r\n    }\r\n\r\n    // Execute command\r\n    let result = tokio::task::spawn_blocking(move || {\r\n        Command::new(\"npx\")\r\n            .args(\u0026args)\r\n            .output()\r\n    })\r\n    .await;\r\n\r\n    match result {\r\n        Ok(Ok(output)) if output.status.success() =\u003e {\r\n            let json = String::from_utf8_lossy(\u0026output.stdout).to_string();\r\n            (json, ErrorCode::Unknown)\r\n        }\r\n        Ok(Ok(output)) =\u003e {\r\n            let error_msg = String::from_utf8_lossy(\u0026output.stderr).to_string();\r\n            warn!(\"Monomind command failed: {}\", error_msg);\r\n            (\r\n                serde_json::json!({\r\n                    \"error\": error_msg,\r\n                    \"exitCode\": output.status.code(),\r\n                }).to_string(),\r\n                ErrorCode::ServerError\r\n            )\r\n        }\r\n        Ok(Err(e)) =\u003e {\r\n            error!(\"Failed to execute monomind command: {}\", e);\r\n            (\r\n                serde_json::json!({\r\n                    \"error\": format!(\"Command execution failed: {}\", e),\r\n                }).to_string(),\r\n                ErrorCode::ServerError\r\n            )\r\n        }\r\n        Err(e) =\u003e {\r\n            error!(\"Failed to spawn monomind command: {}\", e);\r\n            (\r\n                serde_json::json!({\r\n                    \"error\": format!(\"Task join failed: {}\", e),\r\n                }).to_string(),\r\n                ErrorCode::ServerError\r\n            )\r\n        }\r\n    }\r\n}\r\n\r\n/// Create error envelope from ServerError\r\nfn create_error_envelope(sequence_number: u64, error: ServerError) -\u003e Envelope {\r\n    let (code, message) = match error {\r\n        ServerError::SessionNotFound(msg) =\u003e (\r\n            monoterminal_protocol::ErrorCode::SessionNotFound as i32,\r\n            msg,\r\n        ),\r\n        ServerError::AuthFailed(msg) =\u003e (\r\n            monoterminal_protocol::ErrorCode::AuthFailed as i32,\r\n            msg,\r\n        ),\r\n        ServerError::PermissionDenied =\u003e (\r\n            monoterminal_protocol::ErrorCode::PermissionDenied as i32,\r\n            \"Permission denied\".to_string(),\r\n        ),\r\n        ServerError::RateLimitExceeded =\u003e (\r\n            monoterminal_protocol::ErrorCode::RateLimitExceeded as i32,\r\n            \"Rate limit exceeded\".to_string(),\r\n        ),\r\n        _ =\u003e (\r\n            monoterminal_protocol::ErrorCode::Unknown as i32,\r\n            format!(\"{}\", error),\r\n        ),\r\n    };\r\n\r\n    Envelope {\r\n        sequence_number,\r\n        message: Some(envelope::Message::ErrorResponse(\r\n            monoterminal_protocol::ErrorResponse { code, message }\r\n        )),\r\n    }\r\n}\r\n\r\n#[cfg(test)]\r\nmod tests {\r\n    use super::*;\r\n\r\n    #[test]\r\n    fn test_create_error_envelope() {\r\n        let error = ServerError::SessionNotFound(\"session-123\".to_string());\r\n        let envelope = create_error_envelope(42, error);\r\n\r\n        assert_eq!(envelope.sequence_number, 42);\r\n\r\n        match envelope.message {\r\n            Some(envelope::Message::ErrorResponse(err)) =\u003e {\r\n                assert_eq!(err.code, monoterminal_protocol::ErrorCode::SessionNotFound as i32);\r\n                assert_eq!(err.message, \"session-123\");\r\n            }\r\n            _ =\u003e panic!(\"Expected ErrorResponse\"),\r\n        }\r\n    }\r\n}\r\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","server","mod.rs"],"content":"// WebSocket Server with TLS 1.3\n// Implements SRS §3.1.2 (WebSocket Framing) and §3.2.1 (Transport Security)\n// Implements SRS §3.2.4 (Rate Limiting)\n\npub mod connection;\npub mod error;\npub mod tls;\npub mod handler;\n\n#[cfg(test)]\nmod tests;\n\npub use error::{ServerError, Result};\npub use tls::TlsConfig;\n\nuse std::net::SocketAddr;\nuse std::sync::Arc;\nuse tokio::net::TcpListener;\nuse tokio::sync::{broadcast, oneshot};\nuse tokio_rustls::TlsAcceptor;\nuse tracing::{info, warn, error, debug};\n\nuse crate::auth::{AuthService, Ed25519AuthService, RateLimiter};\nuse crate::session::manager::SessionManager;\nuse monoterminal_monomind_bridge::HealthStatus;\n\n/// WebSocket server configuration\n#[derive(Debug, Clone)]\npub struct ServerConfig {\n    /// Server bind address\n    pub bind_addr: SocketAddr,\n\n    /// TLS configuration\n    pub tls: TlsConfig,\n\n    /// Maximum concurrent connections (SRS §2.3.4: 1000 global limit)\n    pub max_connections: usize,\n\n    /// Connection rate limit (SRS §2.3.4: 100/minute)\n    pub rate_limit_per_minute: u32,\n\n    /// Development mode (bypasses Ed25519 challenge-response auth)\n    /// WARNING: Auto-issues JWT tokens without signature verification.\n    /// DO NOT use in production - for E2E testing only.\n    pub dev_mode: bool,\n}\n\nimpl Default for ServerConfig {\n    fn default() -\u003e Self {\n        Self {\n            // Phase 1: local only - 127.0.0.1:5000 per eng-director\n            bind_addr: \"127.0.0.1:5000\".parse().unwrap(),\n            tls: TlsConfig::default(),\n            max_connections: 1000,\n            rate_limit_per_minute: 100,\n            dev_mode: false,\n        }\n    }\n}\n\n/// WebSocket server with TLS 1.3 support\npub struct Server {\n    config: ServerConfig,\n    session_manager: Arc\u003cSessionManager\u003e,\n    tls_acceptor: TlsAcceptor,\n    rate_limiter: Arc\u003cRateLimiter\u003e,\n    auth_service: Arc\u003cEd25519AuthService\u003e,\n    health_tx: broadcast::Sender\u003cHealthStatus\u003e,\n    dev_mode: bool,\n    /// Optional startup notification (sent once TCP listener is bound)\n    startup_tx: Option\u003coneshot::Sender\u003cSocketAddr\u003e\u003e,\n}\n\nimpl Server {\n    /// Create a new WebSocket server\n    pub fn new(\n        config: ServerConfig,\n        session_manager: Arc\u003cSessionManager\u003e,\n        rate_limiter: Arc\u003cRateLimiter\u003e,\n        auth_service: Arc\u003cEd25519AuthService\u003e,\n        health_tx: broadcast::Sender\u003cHealthStatus\u003e,\n    ) -\u003e Result\u003cSelf\u003e {\n        // Use embedded test certificates in dev_mode to avoid filesystem dependencies\n        let tls_acceptor = if config.dev_mode {\n            TlsConfig::build_dev_acceptor()?\n        } else {\n            config.tls.build_acceptor()?\n        };\n        let dev_mode = config.dev_mode;\n\n        Ok(Self {\n            config,\n            session_manager,\n            tls_acceptor,\n            rate_limiter,\n            auth_service,\n            health_tx,\n            dev_mode,\n            startup_tx: None,\n        })\n    }\n\n    /// Create a new WebSocket server with startup notification\n    ///\n    /// The provided oneshot sender will receive the bound SocketAddr once\n    /// the TCP listener is successfully created. This allows callers (e.g.,\n    /// benchmarks) to wait for server readiness instead of blind sleeps.\n    pub fn with_startup_notification(\n        config: ServerConfig,\n        session_manager: Arc\u003cSessionManager\u003e,\n        rate_limiter: Arc\u003cRateLimiter\u003e,\n        auth_service: Arc\u003cEd25519AuthService\u003e,\n        health_tx: broadcast::Sender\u003cHealthStatus\u003e,\n        startup_tx: oneshot::Sender\u003cSocketAddr\u003e,\n    ) -\u003e Result\u003cSelf\u003e {\n        // Use embedded test certificates in dev_mode to avoid filesystem dependencies\n        let tls_acceptor = if config.dev_mode {\n            TlsConfig::build_dev_acceptor()?\n        } else {\n            config.tls.build_acceptor()?\n        };\n        let dev_mode = config.dev_mode;\n\n        Ok(Self {\n            config,\n            session_manager,\n            tls_acceptor,\n            rate_limiter,\n            auth_service,\n            health_tx,\n            dev_mode,\n            startup_tx: Some(startup_tx),\n        })\n    }\n\n    /// Start the WebSocket server\n    pub async fn run(mut self) -\u003e Result\u003c()\u003e {\n        debug!(\"Attempting to bind TCP listener to {}\", self.config.bind_addr);\n\n        let listener = TcpListener::bind(self.config.bind_addr).await\n            .map_err(|e| {\n                error!(\"Failed to bind to {}: {}\", self.config.bind_addr, e);\n                e\n            })?;\n\n        let bound_addr = listener.local_addr()\n            .map_err(|e| {\n                error!(\"Failed to get local address: {}\", e);\n                e\n            })?;\n\n        info!(\"WebSocket server listening on {}\", bound_addr);\n        info!(\"TLS 1.3 only, cipher suites: TLS_AES_256_GCM_SHA384, TLS_AES_128_GCM_SHA256, TLS_CHACHA20_POLY1305_SHA256\");\n\n        // Send startup notification if channel exists\n        if let Some(tx) = self.startup_tx.take() {\n            debug!(\"Sending startup notification for {}\", bound_addr);\n            let _ = tx.send(bound_addr); // Ignore send errors (receiver may have dropped)\n        }\n\n        let server = Arc::new(self);\n        let connection_count = Arc::new(tokio::sync::Semaphore::new(server.config.max_connections));\n\n        loop {\n            // Acquire connection permit (blocks if max connections reached)\n            let permit = connection_count.clone().acquire_owned().await\n                .map_err(|e| ServerError::Internal(format!(\"Failed to acquire connection permit: {}\", e)))?;\n\n            match listener.accept().await {\n                Ok((stream, peer_addr)) =\u003e {\n                    let server = Arc::clone(\u0026server);\n\n                    // Spawn connection handler\n                    tokio::spawn(async move {\n                        info!(\"New connection from {}\", peer_addr);\n\n                        if let Err(e) = server.handle_connection(stream, peer_addr).await {\n                            error!(\"Connection error from {}: {}\", peer_addr, e);\n                        }\n\n                        drop(permit); // Release connection slot\n                    });\n                }\n                Err(e) =\u003e {\n                    error!(\"Failed to accept connection: {}\", e);\n                }\n            }\n        }\n    }\n\n    /// Handle a single connection\n    async fn handle_connection(\n        \u0026self,\n        stream: tokio::net::TcpStream,\n        peer_addr: SocketAddr,\n    ) -\u003e Result\u003c()\u003e {\n        // Check connection rate limit (SRS §3.2.4: 100 connections/min per IP)\n        self.rate_limiter\n            .check_connection(\u0026peer_addr)\n            .map_err(|e| {\n                warn!(\"Connection rate limit exceeded for {}: {}\", peer_addr, e);\n                ServerError::RateLimitExceeded\n            })?;\n\n        // TLS handshake\n        let tls_stream = self.tls_acceptor.accept(stream).await\n            .map_err(|e| ServerError::TlsHandshake(e.to_string()))?;\n\n        info!(\"TLS handshake completed with {}\", peer_addr);\n\n        // WebSocket upgrade\n        let ws_stream = tokio_tungstenite::accept_async(tls_stream).await\n            .map_err(|e| ServerError::WebSocketUpgrade(e.to_string()))?;\n\n        info!(\"WebSocket handshake completed with {}\", peer_addr);\n\n        // Handle WebSocket messages\n        handler::handle_websocket(\n            ws_stream,\n            peer_addr,\n            Arc::clone(\u0026self.session_manager),\n            Arc::clone(\u0026self.auth_service) as Arc\u003cdyn AuthService\u003e,\n            self.dev_mode,\n        ).await\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","server","tests.rs"],"content":"//! Server Module Unit Tests\n//!\n//! Comprehensive test coverage for WebSocket server components\n//! Target: ≥70% coverage per SRS §6.1\n//!\n//! Coverage areas:\n//! - Server configuration and defaults\n//! - TLS configuration\n//! - Connection state management\n//! - Error handling\n//! - Rate limiting integration\n\n#[cfg(test)]\nmod server_tests {\n    use super::super::*;\n    use std::net::{IpAddr, Ipv4Addr};\n\n    // ===== Configuration Tests =====\n\n    #[test]\n    fn test_server_config_default() {\n        let config = ServerConfig::default();\n\n        // Phase 1: local only - 127.0.0.1:5000\n        assert_eq!(config.bind_addr.ip(), IpAddr::V4(Ipv4Addr::new(127, 0, 0, 1)));\n        assert_eq!(config.bind_addr.port(), 5000);\n\n        // SRS §2.3.4: 1000 concurrent connections max\n        assert_eq!(config.max_connections, 1000);\n\n        // SRS §3.2.4: 100 connections/minute rate limit\n        assert_eq!(config.rate_limit_per_minute, 100);\n\n        // Production mode by default\n        assert!(!config.dev_mode);\n    }\n\n    #[test]\n    fn test_server_config_custom_bind_addr() {\n        let mut config = ServerConfig::default();\n        config.bind_addr = \"127.0.0.1:8080\".parse().unwrap();\n\n        assert_eq!(config.bind_addr.port(), 8080);\n    }\n\n    #[test]\n    fn test_server_config_custom_limits() {\n        let mut config = ServerConfig::default();\n        config.max_connections = 500;\n        config.rate_limit_per_minute = 50;\n\n        assert_eq!(config.max_connections, 500);\n        assert_eq!(config.rate_limit_per_minute, 50);\n    }\n\n    #[test]\n    fn test_server_config_dev_mode_flag() {\n        let mut config = ServerConfig::default();\n        config.dev_mode = true;\n\n        assert!(config.dev_mode, \"Dev mode should be enabled for E2E testing\");\n    }\n\n    // ===== TLS Configuration Tests =====\n\n    #[test]\n    fn test_tls_config_default() {\n        let tls_config = TlsConfig::default();\n\n        // Should have default cert/key paths per tls.rs Default impl\n        assert!(tls_config.cert_path.to_str().unwrap().contains(\"server.crt\"));\n        assert!(tls_config.key_path.to_str().unwrap().contains(\"server.key\"));\n    }\n\n    #[test]\n    fn test_tls_config_custom_paths() {\n        use std::path::PathBuf;\n\n        let mut tls_config = TlsConfig::default();\n        tls_config.cert_path = PathBuf::from(\"custom/cert.pem\");\n        tls_config.key_path = PathBuf::from(\"custom/key.pem\");\n\n        assert_eq!(tls_config.cert_path.to_str().unwrap(), \"custom/cert.pem\");\n        assert_eq!(tls_config.key_path.to_str().unwrap(), \"custom/key.pem\");\n    }\n\n    // ===== Server Error Tests =====\n\n    #[test]\n    fn test_server_error_display() {\n        use super::super::error::ServerError;\n\n        let err = ServerError::RateLimitExceeded;\n        assert!(err.to_string().contains(\"Rate limit exceeded\"));\n\n        let err = ServerError::TlsHandshake(\"Invalid certificate\".to_string());\n        assert!(err.to_string().contains(\"TLS handshake failed\"));\n\n        let err = ServerError::WebSocketUpgrade(\"Upgrade failed\".to_string());\n        assert!(err.to_string().contains(\"WebSocket upgrade failed\"));\n    }\n\n    #[test]\n    fn test_server_error_is_send_sync() {\n        use super::super::error::ServerError;\n\n        // Verify ServerError can be sent across threads\n        fn assert_send\u003cT: Send\u003e() {}\n        fn assert_sync\u003cT: Sync\u003e() {}\n\n        assert_send::\u003cServerError\u003e();\n        assert_sync::\u003cServerError\u003e();\n    }\n\n    // ===== Connection Limit Tests =====\n\n    #[test]\n    fn test_max_connections_boundary() {\n        let config = ServerConfig::default();\n\n        // Boundary test: max_connections should be within SRS limits\n        assert!(config.max_connections \u003e 0);\n        assert!(config.max_connections \u003c= 1000);\n    }\n\n    #[test]\n    fn test_rate_limit_boundary() {\n        let config = ServerConfig::default();\n\n        // Boundary test: rate limit should be reasonable\n        assert!(config.rate_limit_per_minute \u003e 0);\n        assert!(config.rate_limit_per_minute \u003c= 1000);\n    }\n}\n\n// ===== Connection Tests =====\n// Note: Connection tests already exist in connection.rs\n// These tests verify the Connection type's integration with server\n","traces":[],"covered":0,"coverable":0},{"path":["C:","\\","Users","nokho","Desktop","projects","monoterminal","crates","master","src","server","tls.rs"],"content":"// TLS 1.3 configuration\n// Implements SRS §3.2.1 (Transport Security)\n\nuse rustls::{ServerConfig, Certificate, PrivateKey};\nuse rustls::server::AllowAnyAuthenticatedClient;\nuse rustls::version::TLS13;\nuse std::fs::File;\nuse std::io::BufReader;\nuse std::path::{Path, PathBuf};\nuse std::sync::Arc;\nuse tokio_rustls::TlsAcceptor;\n\nuse super::error::{ServerError, Result};\n\n///
