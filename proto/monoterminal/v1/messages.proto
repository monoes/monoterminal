syntax = "proto3";
package monoterminal.v1;

// ============================================================================
// Core Envelope (from SRS §3.1.1)
// ============================================================================

message Envelope {
  uint64 sequence_number = 1;
  oneof message {
    AttachRequest attach_request = 2;
    AttachResponse attach_response = 3;
    InputData input_data = 4;
    OutputData output_data = 5;
    ResizeRequest resize_request = 6;
    DetachRequest detach_request = 7;
    ErrorResponse error_response = 8;
    DashboardRequest dashboard_request = 9;
    DashboardResponse dashboard_response = 10;
    HealthCheckRequest health_check_request = 11;
    HealthCheckResponse health_check_response = 12;
    UpgradeRequest upgrade_request = 13;
    UpgradeResponse upgrade_response = 14;
    DetectionRequest detection_request = 15;
    DetectionResponse detection_response = 16;
    MonitoringData monitoring_data = 17;

    // Phase 2 P2P WebRTC Messages (fields 18-30 reserved for Phase 2)
    // Fields 18-20 reserved for future Phase 2 messages
    SearchResponse search_response = 21;  // Phase 4: Scrollback search
    // Field 22 reserved
    SearchRequest search_request = 23;    // Phase 4: Scrollback search
    // Field 24 reserved for future Phase 2 messages
    WebRTCOffer webrtc_offer = 25;
    WebRTCAnswer webrtc_answer = 26;
    ICECandidate ice_candidate = 27;
    // Fields 28-30 reserved for P2PConnectionStatus, PeerHandshake, PeerHandshakeResponse

    // Phase 4 Week 1: Splits/Tabs (ADR-018, task-69)
    SplitPaneCommand split_pane_command = 32;
    ClosePaneCommand close_pane_command = 33;
    FocusPaneCommand focus_pane_command = 34;
    LayoutUpdate layout_update = 35;

    // Phase 4 Week 1: Bidirectional Clipboard (ADR-020)
    ClipboardGetRequest clipboard_get_request = 36;
    ClipboardGetResponse clipboard_get_response = 37;
    ClipboardSetRequest clipboard_set_request = 38;
    ClipboardOSC52 clipboard_osc52 = 39;
  }
}

// ============================================================================
// Request/Response Messages
// ============================================================================

message AttachRequest {
  string session_id = 1;         // UUID or empty for new session
  string auth_token = 2;         // JWT
  uint32 rows = 3;               // Terminal dimensions
  uint32 cols = 4;
  uint64 last_seen_sequence = 5; // For late-joiner sync (0 = full scrollback)
  string session_name = 6;       // Stable logical key (e.g. "computer/workspace/terminal")
                                  // used to find-or-create a session so multiple clients
                                  // referring to the same logical terminal converge on one
                                  // PTY session. Ignored when session_id is set.
}

message AttachResponse {
  string session_id = 1;
  SessionMetadata metadata = 2;
  repeated Line scrollback = 3;  // Last 10k lines (Phase 1: in-memory only)
}

message InputData {
  bytes data = 1;         // Raw keyboard input (UTF-8)
  string auth_token = 2;  // JWT Bearer token (EdDSA signed, 15min TTL)
  optional string pane_id = 3;  // Target pane ID (task-69, default: "pane-0" for backward compat)
}

message OutputData {
  bytes data = 1;          // PTY output chunk
  uint64 sequence = 2;     // For ordering/dedup
  CompressionType compression = 3;
  optional string pane_id = 4;  // Which pane produced this (task-69, unset for non-paned sessions)
}

message ResizeRequest {
  uint32 rows = 1;
  uint32 cols = 2;
  string auth_token = 3;  // JWT Bearer token (EdDSA signed, 15min TTL)
  optional string pane_id = 4;  // Target pane ID (task-69, default: attached session for back-compat)
}

message DetachRequest {
  string session_id = 1;  // Session to detach from
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
}

message DashboardRequest {
  string command = 1;  // "status", "agents", "memory", etc.
  map<string, string> params = 2;
}

message DashboardResponse {
  string json_data = 1;  // JSON response from monomind CLI
  ErrorCode error = 2;
}

// ============================================================================
// Supporting Types
// ============================================================================

message SessionMetadata {
  string shell_type = 1;      // "cmd.exe", "powershell.exe", etc.
  string working_dir = 2;     // Current working directory
  uint32 rows = 3;            // Current dimensions
  uint32 cols = 4;
  int64 created_at = 5;       // Unix timestamp (seconds)
  int64 last_activity = 6;    // Unix timestamp (seconds)
}

message Line {
  bytes data = 1;             // Line content (UTF-8, with ANSI codes)
  uint64 line_number = 2;     // Sequential line number
}

// ============================================================================
// Enums
// ============================================================================

enum CompressionType {
  NONE = 0;
  ZSTD = 1;
}

enum ErrorCode {
  UNKNOWN = 0;
  SESSION_NOT_FOUND = 1;
  AUTH_FAILED = 2;
  PERMISSION_DENIED = 3;
  RATE_LIMIT_EXCEEDED = 4;
  INVALID_REQUEST = 5;
  SERVER_ERROR = 6;

  // Phase 4: Search error codes
  INVALID_REGEX = 15;            // Regex pattern failed to compile
  SEARCH_QUERY_EMPTY = 16;       // Search query string is empty

  // Phase 4: Splits/Tabs error codes (ADR-018, task-69)
  CANNOT_CLOSE_LAST_PANE = 30;   // Cannot close the last remaining pane
  INVALID_PANE_ID = 31;          // Pane ID not found in layout tree
  MAX_PANES_REACHED = 32;        // Maximum 16 panes per session limit reached

  // Phase 4: Clipboard error codes (ADR-020)
  CLIPBOARD_RATE_LIMIT_EXCEEDED = 40;  // Max 3 clipboard reads per 10 seconds
  CLIPBOARD_ACCESS_DENIED = 41;        // User denied clipboard access permission
}

// ============================================================================
// Monomind Health Check & Upgrade (SRS §2.4.3)
// ============================================================================

message HealthCheckRequest {
  string project_dir = 1;  // Project root to check (defaults to session cwd)
}

message HealthCheckResponse {
  bool installed = 1;               // Whether monomind CLI is accessible
  string version = 2;               // Installed CLI version
  bool control_server_reachable = 3; // Control server status
  bool broker_registered = 4;       // Broker registration status
  int64 last_check_timestamp = 5;   // Unix timestamp (seconds)
  repeated HealthIssue issues = 6;  // List of detected issues
}

message HealthIssue {
  IssueSeverity severity = 1;
  string message = 2;
  string resolution = 3;  // Optional suggested resolution
}

enum IssueSeverity {
  INFO = 0;
  WARNING = 1;
  ERROR = 2;
}

message UpgradeRequest {
  string project_dir = 1;  // Project root (defaults to session cwd)
  bool confirmed = 2;      // User confirmation (required per SRS §2.4.3)
}

message UpgradeResponse {
  bool success = 1;
  string old_version = 2;
  string new_version = 3;
  string output = 4;  // Full command output
}

// ============================================================================
// Monomind Detection (SRS §2.4.1)
// ============================================================================

message DetectionRequest {
  string project_dir = 1;  // Directory to check (typically PTY cwd)
}

message DetectionResponse {
  bool found = 1;                      // Whether .monomind/ exists
  string monomind_root = 2;            // Root directory containing .monomind/ (if found)
  bool suggest_install = 3;            // Whether to show install suggestion
  bool dismiss_file_exists = 4;        // Whether user has dismissed the suggestion
  string banner_text = 5;              // MOTD-style banner to display (if suggest_install)
}

// ============================================================================
// Monitoring Data Stream (SRS §2.4.2)
// ============================================================================

message MonitoringData {
  // Org Status
  string org_name = 1;
  int32 active_agents = 2;
  int32 running_tasks = 3;

  // Knowledge Graph Stats
  int64 kg_nodes = 4;
  int64 kg_relationships = 5;
  int64 kg_last_updated = 6;  // Unix timestamp (seconds)

  // Run History (last 5 runs)
  repeated RunSummary recent_runs = 7;
}

message RunSummary {
  string run_id = 1;
  string goal = 2;
  int64 started_at = 3;   // Unix timestamp
  int64 completed_at = 4; // 0 if still running
  string status = 5;      // "running", "completed", "failed"
}

// ============================================================================
// Phase 2: WebRTC P2P Signaling (ADR-011 §5.2)
// From: docs/decisions/protocol-phase2-design.md §4.2
// ============================================================================

message WebRTCOffer {
  string session_id = 1;       // Session to establish P2P for
  string client_id = 2;        // From ClientInfo (for routing)
  string sdp = 3;              // SDP offer string
  string peer_id = 4;          // Ed25519 public key (hex)
  uint64 nonce = 5;            // Challenge nonce from PeerHandshakeResponse
}

message WebRTCAnswer {
  string sdp = 1;              // SDP answer string
  optional TURNCredentials turn = 2;    // TURN credentials (Week 3-4, optional for Phase 2 Week 1-2)
  uint64 offer_timestamp_ms = 3;     // Echo from offer (for latency tracking)
}

message TURNCredentials {
  repeated string urls = 1;     // TURN server URLs (e.g., "turn:coturn.example.com:3478")
  string username = 2;          // Time-limited username (format: "timestamp:peer_id")
  string credential = 3;        // HMAC-SHA256 credential (coturn REST API)
  uint64 expires_at_ms = 4;     // Credential expiry (Unix timestamp milliseconds, 15min TTL)
}

message ICECandidate {
  string session_id = 1;       // Session for routing
  string client_id = 2;        // Client sending this candidate
  string candidate = 3;        // ICE candidate string
  optional string sdp_mid = 4;       // SDP media ID
  optional uint32 sdp_mline_index = 5;  // Media line index
}

// ============================================================================
// Phase 4: Scrollback Search (Week 1, Day 2-3)
// ============================================================================

message SearchRequest {
  string session_id = 1;        // Which session to search
  string query = 2;             // Search text or regex pattern
  SearchMode mode = 3;          // TEXT (literal) or REGEX
  bool case_sensitive = 4;      // Default: false (case-insensitive)
  bool whole_word = 5;          // Match whole words only (default: false)
  int32 max_results = 6;        // Limit results (default: 100, max: 1000)
  int32 start_line = 7;         // Start from line N (default: 0 = beginning)
  int32 end_line = 8;           // End at line N (default: -1 = current line)
}

enum SearchMode {
  SEARCH_MODE_TEXT = 0;         // Literal text search (case-sensitive or insensitive)
  SEARCH_MODE_REGEX = 1;        // Regular expression search
}

message SearchResponse {
  repeated SearchMatch matches = 1;  // Match results (up to max_results)
  int32 total_matches = 2;           // Total count (may exceed matches.length if truncated)
  bool truncated = 3;                // true if total_matches > max_results
}

message SearchMatch {
  int32 line_number = 1;        // Absolute line number in scrollback (0-indexed)
  string line_text = 2;         // Full line content (for xterm.js rendering)
  int32 match_start = 3;        // Character offset where match starts (0-indexed)
  int32 match_end = 4;          // Character offset where match ends (exclusive)
}
// ============================================================================
// Phase 4 Week 1: Splits/Tabs - Pane Layout (ADR-018, task-69)
// ============================================================================

// Recursive layout tree structure
message PaneLayout {
  oneof pane {
    TerminalPane terminal = 1;
    SplitPane split = 2;
  }
}

message TerminalPane {
  string session_id = 1;  // References existing Session (PTY session ID)
  bool focused = 2;       // Which pane currently has input focus
  string pane_id = 3;     // Unique pane identifier (e.g., "pane-0", "pane-1")
}

message SplitPane {
  enum Direction {
    HORIZONTAL = 0;  // Left | Right split
    VERTICAL = 1;    // Top | Bottom split
  }
  Direction direction = 1;
  repeated PaneLayout children = 2;  // Child panes (recursive tree)
  repeated float ratios = 3;          // Split ratios [0.5, 0.5] = 50/50 split
}

// Client → Master: Split an existing pane
message SplitPaneCommand {
  string pane_id = 1;                 // Which pane to split
  SplitPane.Direction direction = 2;  // Horizontal or vertical
  string new_session_shell = 3;       // Shell for new pane (e.g., "/bin/bash", "cmd.exe")
}

// Client → Master: Close a pane
message ClosePaneCommand {
  string pane_id = 1;  // Which pane to close (kills associated PTY session)
}

// Client → Master: Focus a pane
message FocusPaneCommand {
  string pane_id = 1;  // Which pane should receive keyboard input
}

// Master → Client: Layout tree update
message LayoutUpdate {
  PaneLayout root = 1;            // Complete layout tree (replaces client state)
  string focused_pane_id = 2;     // Currently focused pane ID
}

// ============================================================================
// Phase 4 Week 1: Bidirectional Clipboard (ADR-020)
// ============================================================================

// Server → Client: Request clipboard contents
message ClipboardGetRequest {
  string request_id = 1;        // Unique request ID for correlation
  repeated string mime_types = 2; // Requested MIME types (priority order), e.g., ["text/plain"]
}

// Client → Server: Clipboard content response
message ClipboardGetResponse {
  string request_id = 1;        // Matches ClipboardGetRequest.request_id
  string content = 2;           // Clipboard text content (empty if denied/error)
  string mime_type = 3;         // Actual MIME type returned (e.g., "text/plain")
  bool authorized = 4;          // User granted clipboard read permission
  string error = 5;             // Error message if failed (empty if success)
}

// Client → Server: Client initiates clipboard write (optional, for explicit API)
message ClipboardSetRequest {
  string content = 1;           // Plain text clipboard content
  bytes binary_content = 2;     // Optional: binary clipboard (images, etc.) - Phase 5+
  string mime_type = 3;         // "text/plain", "text/html", etc.
  uint64 timestamp = 4;         // Client timestamp (for staleness detection)
}

// Server → Client: OSC 52 clipboard write (existing behavior, now explicit protocol message)
message ClipboardOSC52 {
  string content = 1;           // Base64-encoded content from OSC 52 escape sequence
  string selection = 2;         // "c" (clipboard), "p" (primary), "s" (secondary)
}
